  };

  const closeModal = () => {
    setSelectedItem(null);
    setShowRejectBox(false);
    setRejectReason('');
    setConfirmApproveStep(false);
  };

  const safeItems = Array.isArray(items) ? items : [];

  const matchesFilterTab = (itemStatus, activeFilter) => {
    if (activeFilter === 'Todos') return true;
    const s = String(itemStatus || '').toLowerCase();
    if (activeFilter === 'Pendientes' || activeFilter === 'Pendiente') return s === 'pendiente';
    if (activeFilter === 'En revisión') return s.includes('control escolar') || s.includes('revisión');
    if (activeFilter === 'Aprobadas') return s.includes('aprobada') || s.includes('kardex');
    if (activeFilter === 'Devueltas') return s === 'devuelta';
    return true;
  };

  const filteredItems = safeItems.filter((item) => {
    const matchTab = matchesFilterTab(item.estatus, filter);
    const q = search.toLowerCase();
    const target = `${item.nombre_estudiante || ''} ${item.codigo_estudiante || ''} ${item.id_solicitud || ''}`.toLowerCase();
    return matchTab && target.includes(q);
  });

  const totalPages = Math.max(1, Math.ceil(filteredItems.length / itemsPerPage));
  const indexOfLast = currentPage * itemsPerPage;
  const indexOfFirst = indexOfLast - itemsPerPage;
  const currentItems = filteredItems.slice(indexOfFirst, indexOfLast);

  // Ejecutar cambio de estado en el Backend ('Devuelta', 'En revisión en control Escolar', 'En kardex')
  const executeStatusUpdate = (newStatus, motivoText = '') => {
    if (!selectedItem) return;

    if (newStatus === 'Devuelta' && !motivoText.trim()) {
      showToast("Debes redactar el motivo por el cual devuelves la solicitud", "error");
      return;
    }

    setActionLoading(true);
    setActionLoadingMsg(
      newStatus === 'Devuelta'
        ? 'Devolviendo solicitud y enviando observaciones por correo al alumno...'
        : newStatus === 'En revisión en control Escolar'
          ? 'Turnando expediente a Control Escolar...'
          : 'Acreditando horas en el Kardex del alumno y enviando notificación oficial...'
    );

    const adminCode = user?.code || user?.codigo || 'COORD_INCO';

    if (typeof google !== 'undefined' && google.script) {
      google.script.run
        .withSuccessHandler((res) => {
          setActionLoading(false);
          if (res && res.success) {
            const targetId = selectedItem.id_solicitud;
            const updatedObj = {
              ...selectedItem,
              estatus: newStatus,
              motivo_devolucion: motivoText.trim()
            };
            setItems((prev) =>
              prev.map((it) => (it.id_solicitud === targetId ? updatedObj : it))
            );
            setSelectedItem(updatedObj);
            setShowRejectBox(false);
            setConfirmApproveStep(false);

            showToast(`Expediente #${targetId} actualizado a "${newStatus}"`);
            if (newStatus === 'Devuelta' || newStatus === 'En kardex') {
              closeModal();
            }
          } else {
            showToast(res ? res.message : "Error al actualizar la solicitud", "error");
          }
        })
        .withFailureHandler(() => {
          setActionLoading(false);
          showToast("Error de conexión con el servidor", "error");
        })
        .updateHorasIntegralesStatus(
          selectedItem.id_solicitud,
          newStatus,
          motivoText.trim(),
          adminCode
        );
    } else {
      setTimeout(() => {
        setActionLoading(false);
        const targetId = selectedItem.id_solicitud;
        const updatedObj = { ...selectedItem, estatus: newStatus, motivo_devolucion: motivoText.trim() };
        setItems((prev) => prev.map((it) => (it.id_solicitud === targetId ? updatedObj : it)));

        setConfirmApproveStep(false);
        showToast(`Simulación: Estado actualizado a ${newStatus}`);

    }
  };

  const getStatusBadge = (status) => {
    const s = String(status || '').toLowerCase();
    if (s.includes('kardex') || s.includes('aprobada')) {
      return 'bg-emerald-100 text-emerald-800 border-emerald-300';
    }
    if (s.includes('control escolar') || s.includes('revisión')) {
      return 'bg-blue-100 text-blue-800 border-blue-300';
    }
    if (s === 'devuelta') {
      return 'bg-red-100 text-red-800 border-red-300';
    }
    return 'bg-amber-100 text-amber-800 border-amber-300';
  };

  return (
    <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm space-y-5 text-xs relative">

// ============================================================================
// VISTA DEL ALUMNO: PracticasModule (Trámite y Seguimiento de Prácticas)
// ============================================================================
function PracticasModule({ user, setUser, showToast, addNotification }) {
  if (!user) return null;

  // Hidratar íconos Lucide tras cada actualización de estado
  useEffect(() => {
    if (window.lucide) {
      window.lucide.createIcons();
    }
  });

  const [isLoading, setIsLoading] = useState(true);
  const [isSubmitting, setIsSubmitting] = useState(false);
  const [isDragging, setIsDragging] = useState(false);

  // Solicitud actual del estudiante
  const [solicitud, setSolicitud] = useState(null);

  // Datos del formulario y archivos (soporta conservar archivos previos si fue 'Devuelta')
  const [empresa, setEmpresa] = useState('');
  const [horasAcreditadas, setHorasAcreditadas] = useState('300');
  // Cada elemento en filesList puede ser:
  // - Archivo previo ya en Drive: { id, name, tipoDoc, url, existing: true }
  // - Archivo nuevo local (Base64): { id, name, mimeType, base64, tipoDoc, existing: false }
  const [filesList, setFilesList] = useState([]);

  const studentCode = String(user.code || user.codigo || '');
  const studentName = String(user.name || user.nombre || '');
  const studentEmail = String(user.email || user.correo || '');

  const fetchMyPracticas = () => {
    setIsLoading(true);
    if (typeof google !== 'undefined' && google.script) {
      google.script.run
        .withSuccessHandler((res) => {
          if (res && res.found && res.solicitud) {
            const sol = res.solicitud;
            setSolicitud(sol);

            // Sincronizar KPI de Prácticas Profesionales en el Dashboard superior
            if (typeof setUser === 'function') {
              setUser((prev) => (prev ? { ...prev, practicasStatus: sol.estatus } : prev));
            }

            // Si la solicitud fue 'Devuelta', precargamos sus datos y archivos previos para edición
            if (sol.estatus === 'Devuelta') {
              setEmpresa(sol.empresa || '');
              setHorasAcreditadas(String(sol.horas_acreditadas || '300'));
              const recoveredFiles = (Array.isArray(sol.archivos) ? sol.archivos : []).map((f, idx) => ({
                id: `prev-${idx}-${Date.now()}`,
                name: f.name,
                tipoDoc: f.tipoDoc || 'Documento de Prácticas',
                url: f.url,
                existing: true
              }));
              setFilesList(recoveredFiles);
            }
          } else {
            setSolicitud(null);
          }
          setIsLoading(false);
        })
        .withFailureHandler(() => {
          if (typeof showToast === 'function') {
            showToast("Error al consultar el estado de tus Prácticas Profesionales", "error");
          }
          setIsLoading(false);
        })
        .getStudentPracticas(studentCode);
    } else {
      setTimeout(() => {
        setSolicitud(null);
        setIsLoading(false);
      }, 800);
    }
  };

  useEffect(() => {
    fetchMyPracticas();
  }, [studentCode]);

  // Procesar múltiples archivos nuevos seleccionados o soltados
  const processNewFiles = (rawFileList) => {
    const arr = Array.from(rawFileList || []);
    if (arr.length === 0) return;

    arr.forEach((file) => {
      if (file.size > 8 * 1024 * 1024) {
        if (typeof showToast === 'function') {
          showToast(`El archivo "${file.name}" supera el límite de 8 MB`, "error");
        }
        return;
      }
      const reader = new FileReader();
      reader.onloadend = () => {
        const base64Data = reader.result.split(',')[1];
        setFilesList((prev) => [
          ...prev,
          {
            id: `new-${Date.now()}-${Math.random().toString(36).substring(2, 7)}`,
            name: file.name,
            mimeType: file.type || 'application/pdf',
            base64: base64Data,
            tipoDoc: 'Constancia de Terminación / Liberación',
            existing: false
          }
        ]);
      };
      reader.readAsDataURL(file);
    });
  };

  const handleFileChange = (e) => {
    processNewFiles(e.target.files);
    e.target.value = '';
  };

  const handleDrop = (e) => {
    e.preventDefault();
    setIsDragging(false);
    if (e.dataTransfer && e.dataTransfer.files) {
      processNewFiles(e.dataTransfer.files);
    }
  };

  const handleUpdateFileTipo = (id, newTipo) => {
    setFilesList((prev) =>
      prev.map((item) => (item.id === id ? { ...item, tipoDoc: newTipo } : item))
    );
  };

  const handleRemoveFile = (id) => {
    setFilesList((prev) => prev.filter((item) => item.id !== id));
  };

  const handleSubmitPracticas = (e) => {
    e.preventDefault();

    if (!empresa.trim()) {
      showToast("Ingresa el nombre de la empresa o dependencia receptora", "error");
      return;
    }

    if (filesList.length === 0) {
      showToast("Debes adjuntar al menos un documento probatorio en tu expediente", "error");
      return;
    }

    const missingTipo = filesList.some((f) => !String(f.tipoDoc || '').trim());
    if (missingTipo) {
      showToast("Especifica el tipo de documento para cada archivo adjunto", "error");
      return;
    }

    setIsSubmitting(true);

    // Separamos archivos previos conservados (solo su referencia URL) y archivos nuevos (en Base64)
    const existingFilesPayload = filesList
      .filter((f) => f.existing)
      .map((f) => ({
        name: f.name,
        tipoDoc: f.tipoDoc.trim(),
        url: f.url
      }));

    const newFilesPayload = filesList
      .filter((f) => !f.existing)
      .map((f) => ({
        name: f.name,
        mimeType: f.mimeType,
        base64: f.base64,
        tipoDoc: f.tipoDoc.trim()
      }));

    const payload = {
      codigo: studentCode,
      nombre: studentName,
      correo: studentEmail,
      empresa: empresa.trim(),
      horas_acreditadas: Number(horasAcreditadas) || 300,
      existingFiles: existingFilesPayload,
      newFiles: newFilesPayload
    };

    if (typeof google !== 'undefined' && google.script) {
      google.script.run
        .withSuccessHandler((res) => {
          setIsSubmitting(false);
          if (res && res.success) {
            setSolicitud(res.solicitud);
            if (typeof setUser === 'function') {
              setUser((prev) => (prev ? { ...prev, practicasStatus: res.solicitud.estatus } : prev));
            }
            if (typeof showToast === 'function') {
              showToast(`Expediente de Prácticas #${res.solicitud.id_solicitud} enviado correctamente`);
            }
            if (typeof addNotification === 'function') {
              addNotification(
                "Prácticas Profesionales Enviadas",
                `Tu expediente #${res.solicitud.id_solicitud} fue recibido por la Coordinación.`,
                "info"
              );
            }
          } else {
            if (typeof showToast === 'function') {
              showToast(res ? res.message : "Error al enviar el expediente", "error");
            }
          }
        })
        .withFailureHandler(() => {
          setIsSubmitting(false);
          if (typeof showToast === 'function') {
            showToast("Error de conexión con el servidor al subir los documentos", "error");
          }
        })
        .submitPracticasProfesionales(payload);
    } else {
      setTimeout(() => {
        setIsSubmitting(false);
        const mockSol = {
          id_solicitud: 'PRC-demo01',
          codigo_estudiante: studentCode,
          nombre_estudiante: studentName,
          empresa: empresa.trim(),
          horas_acreditadas: Number(horasAcreditadas) || 300,
          estatus: 'Pendiente',
          motivo_devolucion: '',
          fecha_solicitud: new Date().toLocaleDateString('es-MX'),
          archivos: filesList.map((f) => ({ name: f.name, tipoDoc: f.tipoDoc, url: f.url || '#' }))
        };
        setSolicitud(mockSol);
        if (typeof setUser === 'function') {
          setUser((prev) => (prev ? { ...prev, practicasStatus: 'Pendiente' } : prev));
        }
        if (typeof showToast === 'function') showToast("Simulación: Expediente de prácticas enviado");
      }, 1200);
    }
  };

  // Determinar estado ('Ninguna', 'Pendiente', 'En revisión (Control Escolar)', 'Aparece en kardex', 'Devuelta')
  const currentStatus = solicitud ? String(solicitud.estatus || 'Pendiente') : 'Ninguna';
  const showForm = currentStatus === 'Ninguna' || currentStatus === 'Devuelta';

  const getStepNumber = (status) => {
    const s = status.toLowerCase();
    if (s.includes('kardex')) return 3;
    if (s.includes('control escolar') || s.includes('revisión')) return 2;
    return 1; // 'Pendiente'
  };

  return (
    <div className="space-y-6 relative text-xs">
      {/* Overlay de bloqueo durante subida de archivos a Drive */}
      {isSubmitting && (
        <div className="fixed inset-0 z-[100] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 max-w-sm w-full shadow-2xl border border-slate-200 dark:border-slate-700 text-center space-y-3">
            <span className="flex items-center justify-center animate-spin">
              <i data-lucide="loader-2" className="w-8 h-8 text-udg-blue shrink-0"></i>
            </span>
            <h4 className="font-bold text-sm text-slate-900 dark:text-white font-display">
              Resguardando Expediente de Prácticas...
            </h4>
            <p className="text-xs text-slate-500">
              Subiendo documentos con permisos privados a la carpeta de Prácticas Profesionales en Drive.
            </p>
          </div>
        </div>
      )}

      <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 sm:p-8 border border-slate-200 dark:border-slate-700 shadow-sm space-y-6">
        {/* Encabezado */}
        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-100 dark:border-slate-700 pb-4">
          <div className="flex items-center gap-3">
            <div className="w-11 h-11 rounded-2xl bg-udg-light dark:bg-slate-700 text-udg-navy dark:text-blue-300 flex items-center justify-center font-bold border border-blue-200/60 dark:border-slate-600 shrink-0">
              <i data-lucide="briefcase" className="w-6 h-6 shrink-0"></i>
            </div>
            <div>
              <h3 className="text-lg font-extrabold text-slate-900 dark:text-white font-display">
                Liberación y Acreditación de Prácticas Profesionales
              </h3>
              <p className="text-xs text-slate-500 dark:text-slate-400">
                Envía tu expediente digital (Oficio de asignación, reportes y constancia de terminación) para registro en Kardex.
              </p>
            </div>
          </div>

          <span className="self-start sm:self-center px-3 py-1 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 font-mono font-bold text-xs">
            Código: {studentCode}
          </span>
        </div>

        {/* Skeleton Screen Inicial */}
        {isLoading ? (
          <div className="space-y-4 animate-pulse">
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div className="h-14 bg-slate-100 dark:bg-slate-700/60 rounded-xl"></div>
              <div className="h-14 bg-slate-100 dark:bg-slate-700/60 rounded-xl"></div>
            </div>
            <div className="h-36 bg-slate-100 dark:bg-slate-700/40 rounded-2xl border-2 border-dashed border-slate-200 dark:border-slate-700"></div>
            <div className="h-12 bg-slate-100 dark:bg-slate-700/60 rounded-xl w-48 ml-auto"></div>
          </div>
        ) : showForm ? (
          /* =====================================================================
             ESCENARIO A: FORMULARIO DE ENVÍO O CORRECCIÓN DE SOLICITUD DEVUELTA
             ===================================================================== */
          <form onSubmit={handleSubmitPracticas} className="space-y-6">
            
            {/* Banner de Alerta si la Solicitud fue Devuelta */}
            {currentStatus === 'Devuelta' && (
              <div className="p-4 rounded-2xl bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-800 flex items-start gap-3 animate-in fade-in">
                <i data-lucide="alert-octagon" className="w-5 h-5 text-red-600 dark:text-red-400 shrink-0 mt-0.5"></i>
                <div className="space-y-1">
                  <h4 className="font-extrabold text-red-800 dark:text-red-300 text-xs uppercase tracking-wide">
                    Solicitud Devuelta por la Coordinación (Folio #{solicitud?.id_solicitud})
                  </h4>
                  <p className="text-red-700 dark:text-red-200 font-semibold leading-relaxed">
                    Motivo: {solicitud?.motivo_devolucion || 'Revisa que todos tus formatos contengan firmas y sellos correspondientes.'}
                  </p>
                  <p className="text-[11px] text-red-600/80 dark:text-red-300/80">
                    Hemos recuperado tus archivos enviados anteriormente en la lista inferior. Puedes quitar solo el documento con observaciones y subir la versión corregida.
                  </p>
                </div>
              </div>
            )}

            {/* Datos de la Empresa y Horas */}
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div className="md:col-span-2">
                <label className="block font-bold text-slate-700 dark:text-slate-300 mb-1.5">
                  Empresa o Institución Receptora *
                </label>
                <input
                  type="text"
                  required
                  placeholder="Ej: Continental Automotive Guadalajara / Intel / CINVESTAV..."
                  value={empresa}
                  onChange={(e) => setEmpresa(e.target.value)}
                  disabled={isSubmitting}
                  className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-3 rounded-xl text-xs focus:ring-2 focus:ring-udg-blue outline-none"
                />
              </div>

              <div>
                <label className="block font-bold text-slate-700 dark:text-slate-300 mb-1.5">
                  Total de Horas Cubiertas *
                </label>
                <input
                  type="number"
                  min="1"
                  required
                  value={horasAcreditadas}
                  onChange={(e) => setHorasAcreditadas(e.target.value)}
                  disabled={isSubmitting}
                  className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-3 rounded-xl font-mono font-bold text-xs focus:ring-2 focus:ring-udg-blue outline-none"
                />
              </div>
            </div>

            {/* Zona Drag & Drop para Subir Múltiples Archivos */}
            <div
              onDragOver={(e) => { e.preventDefault(); setIsDragging(true); }}
              onDragLeave={(e) => { e.preventDefault(); setIsDragging(false); }}
              onDrop={handleDrop}
              className={`border-2 border-dashed rounded-2xl p-7 text-center transition-all ${
                isDragging
                  ? 'border-udg-blue bg-blue-50/60 dark:bg-slate-700/50'
                  : 'border-slate-300 dark:border-slate-600 bg-slate-50/60 dark:bg-slate-900/40 hover:border-udg-blue'
              }`}
            >
              <div className="w-12 h-12 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm flex items-center justify-center mx-auto mb-3 text-udg-navy dark:text-blue-400">
                <i data-lucide="file-up" className="w-6 h-6 shrink-0"></i>
              </div>
              <h4 className="font-bold text-slate-800 dark:text-white text-sm font-display">
                Adjunta tus documentos de Prácticas Profesionales (PDF o Imagen)
              </h4>
              <p className="text-[11px] text-slate-500 mt-1 mb-4">
                Sube tu Carta de Asignación/Convenio, Reporte Final y Constancia de Terminación firmada y sellada.
              </p>

              <label className="cursor-pointer bg-udg-navy hover:bg-udg-blue text-white font-bold px-5 py-2.5 rounded-xl inline-flex items-center gap-2 shadow-sm transition-all">
                <i data-lucide="plus-circle" className="w-4 h-4 text-udg-gold shrink-0"></i>
                <span>Seleccionar Archivos</span>
                <input
                  type="file"
                  multiple
                  accept=".pdf,image/*"
                  onChange={handleFileChange}
                  disabled={isSubmitting}
                  className="hidden"
                />
              </label>
            </div>

            {/* Lista de Archivos Adjuntos (Nuevos + Recuperados en caso de devolución) */}
            {filesList.length > 0 && (
              <div className="space-y-3">
                <div className="flex items-center justify-between">
                  <h5 className="font-bold text-slate-800 dark:text-slate-200 uppercase text-[10px] tracking-wider">
                    Documentos en tu Expediente ({filesList.length})
                  </h5>
                  <span className="text-[11px] text-slate-400">
                    Clasifica cada documento antes de enviar
                  </span>
                </div>

                <div className="space-y-2.5">
                  {filesList.map((fileItem, idx) => (
                    <div
                      key={fileItem.id}
                      className="p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-700 flex flex-col sm:flex-row sm:items-center justify-between gap-3 shadow-sm"
                    >
                      <div className="flex items-center gap-3 min-w-0 flex-1">
                        <div className={`w-8 h-8 rounded-lg flex items-center justify-center font-mono font-bold text-[11px] shrink-0 ${
                          fileItem.existing
                            ? 'bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300'
                            : 'bg-blue-100 text-udg-navy dark:bg-slate-700 dark:text-blue-300'
                        }`}>
                          {idx + 1}
                        </div>
                        <div className="min-w-0 flex-1">
                          <div className="flex items-center gap-2">
                            <p className="font-bold text-slate-800 dark:text-slate-100 truncate" title={fileItem.name}>
                              {fileItem.name}
                            </p>
                            {fileItem.existing ? (
                              <span className="px-2 py-0.2 rounded bg-amber-100 text-amber-800 text-[9px] font-extrabold uppercase shrink-0">
                                Archivo Previo
                              </span>
                            ) : (
                              <span className="px-2 py-0.2 rounded bg-emerald-100 text-emerald-800 text-[9px] font-extrabold uppercase shrink-0">
                                Nuevo
                              </span>
                            )}
                          </div>
                          {fileItem.existing && fileItem.url && (
                            <a
                              href={fileItem.url}
                              target="_blank"
                              rel="noopener noreferrer"
                              className="text-[10px] text-udg-blue dark:text-blue-400 hover:underline inline-flex items-center gap-1 mt-0.5"
                            >
                              <i data-lucide="external-link" className="w-3 h-3 shrink-0"></i>
                              <span>Ver archivo cargado anteriormente</span>
                            </a>
                          )}
                        </div>
                      </div>

                      <div className="flex items-center gap-2">
                        <select
                          value={fileItem.tipoDoc}
                          onChange={(e) => handleUpdateFileTipo(fileItem.id, e.target.value)}
                          className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs font-semibold outline-none focus:ring-2 focus:ring-udg-blue"
                        >
                          <option value="Constancia de Terminación / Liberación">Constancia de Terminación / Liberación</option>
                          <option value="Oficio de Asignación / Convenio">Oficio de Asignación / Convenio</option>
                          <option value="Reporte Final de Actividades">Reporte Final de Actividades</option>
                          <option value="Evaluación del Receptor">Evaluación del Receptor</option>
                          <option value="Otro Documento Probatorio">Otro Documento Probatorio</option>
                        </select>

                        <button
                          type="button"
                          onClick={() => handleRemoveFile(fileItem.id)}
                          className="p-2 text-red-500 hover:bg-red-50 dark:hover:bg-red-950/40 rounded-xl transition-colors"
                          title="Eliminar documento del expediente"
                        >
                          <i data-lucide="trash-2" className="w-4 h-4 shrink-0"></i>
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            <div className="flex justify-end pt-2 border-t border-slate-100 dark:border-slate-700">
              <button
                type="submit"
                disabled={isSubmitting || filesList.length === 0}
                className="bg-udg-navy hover:bg-udg-blue text-white font-bold px-6 py-3 rounded-xl inline-flex items-center gap-2 shadow-md transition-all disabled:opacity-50"
              >
                <i data-lucide="send" className="w-4 h-4 text-udg-gold shrink-0"></i>
                <span>
                  {currentStatus === 'Devuelta' ? 'Reenviar Expediente Corregido' : 'Enviar Expediente de Prácticas'}
                </span>
              </button>
            </div>
          </form>
        ) : (
          /* =====================================================================
             ESCENARIO B: STEPPER / LÍNEA DE TIEMPO DE SEGUIMIENTO ACTIVO
             ===================================================================== */
          <div className="space-y-6 animate-in fade-in">
            <div className="p-5 rounded-2xl bg-blue-50/50 dark:bg-slate-900/60 border border-blue-200/70 dark:border-slate-700 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div className="space-y-1">
                <span className="inline-block px-2.5 py-0.5 rounded-md bg-udg-navy text-white font-mono font-bold text-[10px]">
                  FOLIO #{solicitud.id_solicitud}
                </span>
                <h4 className="text-base font-extrabold text-slate-900 dark:text-white font-display pt-1">
                  {solicitud.empresa}
                </h4>
                <p className="text-slate-500 text-[11px]">
                  Enviado el {solicitud.fecha_solicitud} • Horas acreditadas:{' '}
                  <strong className="text-udg-navy dark:text-blue-400">{solicitud.horas_acreditadas} hrs</strong>
                </p>
              </div>

              <span className={`self-start sm:self-center px-3.5 py-1.5 rounded-full text-[10px] font-extrabold uppercase border ${
                getStepNumber(currentStatus) === 3
                  ? 'bg-emerald-100 text-emerald-800 border-emerald-300'
                  : 'bg-blue-100 text-blue-800 border-blue-300'
              }`}>
                {currentStatus}
              </span>
            </div>

            {/* Stepper Visual de 3 Etapas */}
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              {[
                {
                  step: 1,
                  title: '1. En Revisión (Coordinación)',
                  desc: 'La Coordinación INCO está verificando tus oficios y constancia de liberación.',
                  icon: 'file-search'
                },
                {
                  step: 2,
                  title: '2. En Revisión (Control Escolar)',
                  desc: 'Tu expediente fue aprobado por Coordinación y se turnó a Control Escolar.',
                  icon: 'building-2'
                },
                {
                  step: 3,
                  title: '3. Aparece en Kardex',
                  desc: '¡Trámite concluido! Tus Prácticas Profesionales ya aparecen oficialmente en tu Kardex.',
                  icon: 'award'
                }
              ].map((phase) => {
                const activeStep = getStepNumber(currentStatus);
                const isCompleted = activeStep > phase.step || (activeStep === 3 && phase.step === 3);
                const isCurrent = activeStep === phase.step && phase.step !== 3;

                return (
                  <div
                    key={phase.step}
                    className={`p-5 rounded-2xl border transition-all flex flex-col justify-between ${
                      isCompleted
                        ? 'bg-emerald-50/60 dark:bg-emerald-950/20 border-emerald-300 dark:border-emerald-800'
                        : isCurrent
                          ? 'bg-blue-50/70 dark:bg-blue-950/30 border-udg-blue shadow-sm ring-2 ring-udg-blue/20'
                          : 'bg-slate-50 dark:bg-slate-900/40 border-slate-200 dark:border-slate-700 opacity-60'
                    }`}
                  >
                    <div className="space-y-3">
                      <div className="flex items-center justify-between">
                        <div className={`w-10 h-10 rounded-xl flex items-center justify-center font-bold ${
                          isCompleted
                            ? 'bg-emerald-600 text-white'
                            : isCurrent
                              ? 'bg-udg-navy text-white'
                              : 'bg-slate-200 dark:bg-slate-700 text-slate-500'
                        }`}>
                          <i data-lucide={isCompleted ? 'check' : phase.icon} className="w-5 h-5 shrink-0"></i>
                        </div>
                        <span className={`text-[10px] font-extrabold uppercase px-2.5 py-0.5 rounded-full ${
                          isCompleted
                            ? 'bg-emerald-100 text-emerald-800'
                            : isCurrent
                              ? 'bg-blue-100 text-udg-blue animate-pulse'
                              : 'bg-slate-200 text-slate-600'
                        }`}>
                          {isCompleted ? 'Completado' : isCurrent ? 'En Curso' : 'Pendiente'}
                        </span>
                      </div>

                      <h5 className="font-bold text-slate-900 dark:text-white text-sm font-display">
                        {phase.title}
                      </h5>
                      <p className="text-[11px] text-slate-500 dark:text-slate-400 leading-relaxed">
                        {phase.desc}
                      </p>
                    </div>
                  </div>
                );
              })}
            </div>

            {/* Documentos Entregados por el Alumno */}
            {Array.isArray(solicitud.archivos) && solicitud.archivos.length > 0 && (
              <div className="p-5 rounded-2xl bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 space-y-3">
                <h5 className="font-bold text-slate-800 dark:text-slate-200 text-xs uppercase tracking-wider">
                  Archivos Registrados en tu Expediente ({solicitud.archivos.length})
                </h5>
                <div className="divide-y divide-slate-200/70 dark:divide-slate-700">
                  {solicitud.archivos.map((doc, idx) => (
                    <div key={idx} className="py-2.5 flex items-center justify-between gap-4">
                      <div>
                        <p className="font-bold text-slate-800 dark:text-slate-100">{doc.tipoDoc}</p>
                        <p className="text-[11px] text-slate-400">{doc.name}</p>
                      </div>
                      {doc.url && (
                        <a
                          href={doc.url}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="px-3 py-1.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-bold text-udg-navy dark:text-blue-300 inline-flex items-center gap-1.5 hover:border-udg-blue"
                        >
                          <i data-lucide="external-link" className="w-3.5 h-3.5 shrink-0"></i>
                          <span>Ver Documento</span>
                        </a>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

// VISTA DEL COORDINADOR: AdminPracticasModule

function AdminPracticasModule({ user, showToast, addNotification }) {
  const [items, setItems] = useState([]);
  const [isLoading, setIsLoading] = useState(true);

  // Bloqueo de pantalla durante acciones del servidor
  const [actionLoading, setActionLoading] = useState(false);
  const [actionLoadingText, setActionLoadingText] = useState('');

  // Filtros: 'Pendiente', 'En revisión (Control Escolar)', 'Aparece en kardex', 'Devuelta', 'Todos'
  const [filter, setFilter] = useState('Pendiente');
  const [search, setSearch] = useState('');

  // Paginación Obligatoria
  const [currentPage, setCurrentPage] = useState(1);
  const itemsPerPage = 8;

  // Modal de Revisión
  const [selectedItem, setSelectedItem] = useState(null);
  const [showRejectInput, setShowRejectInput] = useState(false);
  const [rejectMotivo, setRejectMotivo] = useState('');

  useEffect(() => {
    if (window.lucide) {
      window.lucide.createIcons();
    }
  });

  const fetchAllPracticas = () => {
    setIsLoading(true);

// MÓDULO DE AVISOS OFICIALES (Unificado: Vista Alumno/Docente y Coordinador)
// ============================================================================
function AvisosModule({ notices, user, showToast, addNotification }) {
  // Hidratación segura de íconos Lucide en cada renderizado
  useEffect(() => {
    if (window.lucide) {
      window.lucide.createIcons();
    }
  });

  // Determinar si el usuario en sesión tiene rol administrativo de Coordinación
  const activeRole = String(user?.role || user?.rol || 'Estudiante');
  const isCoordinator = activeRole === 'Coordinacion';
  const authorCode = String(user?.code || user?.codigo || '');

  // Estados de Datos y Carga
  const [avisosList, setAvisosList] = useState([]);
  const [isLoading, setIsLoading] = useState(true);
  const [isPublishing, setIsPublishing] = useState(false);

  // Estados del Formulario de Creación (Exclusivo Coordinación)
  const [titulo, setTitulo] = useState('');
  const [descripcion, setDescripcion] = useState('');
  const [esImportante, setEsImportante] = useState(false);

  // Filtros rápidos (Todos / Importantes) y Paginación
  const [filterType, setFilterType] = useState('Todos');
  const [currentPage, setCurrentPage] = useState(1);
  const itemsPerPage = 5;

  // Cargar Avisos desde el Backend (con CacheService de 5 min en servidor)
  const fetchAvisos = (forceRefresh = false) => {
    setIsLoading(true);
    if (typeof google !== 'undefined' && google.script) {
      google.script.run
        .withSuccessHandler((data) => {
          setAvisosList(Array.isArray(data) ? data : []);
          setIsLoading(false);
        })
        .withFailureHandler(() => {
          if (typeof showToast === 'function') {
            showToast("Error al sincronizar el tablón de avisos oficiales", "error");
          }
          setAvisosList([]);
          setIsLoading(false);
        })
        .getAvisos(forceRefresh);
    } else {
      // Fallback para entorno de prueba local usando MOCK_NOTICES
      setTimeout(() => {
        const mappedMocks = (Array.isArray(notices) ? notices : []).map((n) => ({
          id_aviso: `AVI-00${n.id}`,
          titulo: n.title,
          descripcion: n.desc,
          categoria: n.urgent ? 'Importante' : 'General',
           importantes: Boolean(n.urgent),
          fecha_publicacion: n.date,
          codigo_autor: '1000293'
        }));

    fetchAvisos(false);

      descripcion: descripcion.trim(),
      importante: Boolean(esImportante),
      codigo_autor: authorCode

    if (typeof google !== 'undefined' && google.script) {

        .withSuccessHandler((res) => {
          setIsPublishing(false);

            setDescripcion('');
            setEsImportante(false);
            setCurrentPage(1);
            if (typeof showToast === 'function') {

              addNotification(

          } else {

          setIsPublishing(false);
          if (typeof showToast === 'function') {

                String(aviso.categoria || '').toLowerCase() === 'importante' ||

                      )}
                    </div>

                    {isImportant ? (
                      <span className="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[10px] font-extrabold uppercase bg-red-100 text-red-800 dark:bg-red-950 dark:text-red-300 border border-red-300 dark:border-red-800">

                      <span className="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase bg-blue-50 text-udg-navy dark:bg-slate-800 dark:text-blue-300 border border-blue-200 dark:border-slate-700">

                    {aviso.descripcion}

        </div>

        {/* Controles de Paginación Obligatorios */}
        {!isLoading && filteredAvisos.length > 0 && (
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pt-3 border-t border-slate-100 dark:border-slate-700 text-[11px] text-slate-500">
            <span>

            </span>

            <div className="flex items-center gap-2">
              <button
                type="button"
                onClick={() => setCurrentPage((prev) => Math.max(1, prev - 1))}
                disabled={currentPage === 1}
                className="px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700 font-semibold flex items-center gap-1 disabled:opacity-30 transition-colors"
              >
                <i data-lucide="chevron-left" className="w-3.5 h-3.5 shrink-0"></i>
                <span>Anterior</span>
              </button>

              <span className="font-bold text-slate-700 dark:text-slate-300 px-2">
                Página {currentPage} de {totalPages}
              </span>

              <button
                type="button"
                onClick={() => setCurrentPage((prev) => Math.min(totalPages, prev + 1))}
                disabled={currentPage === totalPages}
                className="px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700 font-semibold flex items-center gap-1 disabled:opacity-30 transition-colors"

                <span>Siguiente</span>
                <i data-lucide="chevron-right" className="w-3.5 h-3.5 shrink-0"></i>
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

                  {photoPreview ? (

                    <i data-lucide="user" className="w-8 h-8"></i>
                  )}
                </div>
                <label className="cursor-pointer bg-udg-navy hover:bg-udg-blue text-white px-3.5 py-1.5 rounded-xl text-xs font-semibold transition-all flex items-center gap-1.5">
                  <i data-lucide="camera" className="w-4 h-4 text-udg-gold"></i>
                  <span>{photoPreview ? 'Cambiar Foto' : 'Subir Foto de Perfil'}</span>
                  <input type="file" accept="image/*" onChange={handleImageChange} className="hidden" disabled={isLoading} />
                </label>
              </div>

              <div>
                <label className="block font-semibold text-slate-700 dark:text-slate-300 mb-1">Nombre Completo *</label>
                <input type="text" placeholder="Ej: Alejandro González Ramírez" value={name} onChange={(e) => setName(e.target.value)} disabled={isLoading} className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-2.5 rounded-xl text-xs focus:ring-2 focus:ring-udg-blue outline-none disabled:opacity-50" />
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label className="block font-semibold text-slate-700 dark:text-slate-300 mb-1">Código de UdG *</label>
                  <input type="text" placeholder="Ej: 219845123" value={code} onChange={(e) => setCode(e.target.value)} disabled={isLoading} className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-2.5 rounded-xl font-mono text-xs focus:ring-2 focus:ring-udg-blue outline-none disabled:opacity-50" />
                </div>
                <div>
                  <label className="block font-semibold text-slate-700 dark:text-slate-300 mb-1">Teléfono Móvil *</label>
                  <input type="tel" placeholder="Ej: 33 1425 8990" value={phone} onChange={(e) => setPhone(e.target.value)} disabled={isLoading} className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-2.5 rounded-xl font-mono text-xs focus:ring-2 focus:ring-udg-blue outline-none disabled:opacity-50" />
                </div>
              </div>

              <div>
                <label className="block font-semibold text-slate-700 dark:text-slate-300 mb-1">Correo Institucional (@alumnos.udg.mx) *</label>
                <input type="email" placeholder="ejemplo@alumnos.udg.mx" value={email} onChange={(e) => setEmail(e.target.value)} disabled={isLoading} className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-2.5 rounded-xl text-xs focus:ring-2 focus:ring-udg-blue outline-none disabled:opacity-50" />
              </div>

              <div>
                <label className="block font-semibold text-slate-700 dark:text-slate-300 mb-1">NIP del Sistema SIIAU *</label>
                <input type="password" placeholder="••••••••" value={nip} onChange={(e) => setNip(e.target.value)} disabled={isLoading} className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-2.5 rounded-xl font-mono text-xs focus:ring-2 focus:ring-udg-blue outline-none disabled:opacity-50" />
              </div>

              <button type="submit" disabled={isLoading} className="w-full bg-udg-gold hover:bg-udg-goldHover text-white font-bold py-3 rounded-xl transition-all shadow-md flex items-center justify-center gap-2 mt-2 font-display disabled:opacity-70">
                {isLoading ? (
                  <><i data-lucide="loader-2" className="w-4 h-4 animate-spin"></i><span>Validando y Enviando Código...</span></>
                ) : (
                  <><i data-lucide="mail" className="w-4 h-4"></i><span>Continuar y Verificar Correo</span></>
                )}
              </button>

              <div className="text-center pt-2">
                <button type="button" onClick={onOpenLogin} disabled={isLoading} className="text-udg-blue dark:text-blue-400 font-semibold hover:underline">
                  ¿Ya tienes cuenta? Inicia sesión aquí
                </button>
              </div>
            </form>
          ) : (
            <form onSubmit={handleStep2Submit} className="space-y-5 animate-in slide-in-from-right-4">
              <div className="text-center space-y-2 mb-2">
                <div className="w-16 h-16 bg-blue-50 dark:bg-slate-900 rounded-full flex items-center justify-center mx-auto mb-3">
                  <i data-lucide="mail-check" className="w-8 h-8 text-udg-blue dark:text-blue-400"></i>
                </div>
                <h4 className="font-bold text-slate-900 dark:text-white text-base">Revisa tu bandeja de entrada</h4>
                <p className="text-slate-500 text-xs px-4">
                  Hemos enviado un código de 6 dígitos al correo: <br/>
                  <span className="font-bold text-udg-navy dark:text-blue-300">{email}</span>
                </p>
              </div>

              <div>
                <label className="block font-semibold text-slate-700 dark:text-slate-300 mb-2 text-center">Ingresa el código de seguridad:</label>
                <input 
                  type="text" 
                  maxLength="6"
                  placeholder="000000" 
                  value={verCode} 
                  onChange={(e) => setVerCode(e.target.value.replace(/\D/g, ''))} // Solo números
                  disabled={isLoading} 
                  className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 p-4 rounded-xl font-mono text-2xl text-center tracking-[0.5em] focus:ring-2 focus:ring-udg-blue outline-none transition-all" 
                />
              </div>

              <div className="pt-2 flex flex-col gap-3">
                <button type="submit" disabled={isLoading || verCode.length !== 6} className="w-full bg-udg-navy hover:bg-udg-blue text-white font-bold py-3.5 rounded-xl transition-all shadow-md flex items-center justify-center gap-2 font-display disabled:opacity-50">
                  {isLoading ? (
                    <><i data-lucide="loader-2" className="w-4 h-4 animate-spin"></i><span>Creando Registro Institucional...</span></>
                  ) : (
                    <><i data-lucide="shield-check" className="w-4 h-4 text-udg-gold"></i><span>Verificar y Finalizar Registro</span></>
                  )}
                </button>
                <button type="button" onClick={() => setStep(1)} disabled={isLoading} className="text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 font-semibold underline text-center">
                  Corregir datos o reenviar código
                </button>
              </div>
            </form>
          )}

        </div>
      </div>
    </div>
  );
}

    function EditProfileModal({ user, onClose, onSave }) {
      const [phone, setPhone] = useState(user.phone || '');
      const [email, setEmail] = useState(user.email || '');
      const [photoPreview, setPhotoPreview] = useState(user.photo || null);

      const handleImageChange = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setPhotoPreview(reader.result);
          };
          reader.readAsDataURL(file);
        }
      };

      const handleSave = (e) => {
        e.preventDefault();
        onSave({ phone, email, photo: photoPreview });
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/75 backdrop-blur-sm animate-in fade-in">
          <div className="bg-white dark:bg-slate-800 rounded-2xl max-w-md w-full border border-slate-200 dark:border-slate-700 shadow-2xl overflow-hidden relative text-slate-800 dark:text-slate-100">
            
            <div className="bg-udg-navy p-5 text-white flex justify-between items-center">
              <div className="flex items-center gap-2.5">
                <i data-lucide="user-cog" className="w-5 h-5 text-udg-gold"></i>
                <h3 className="font-bold text-base font-display">Actualizar Datos de Perfil</h3>
              </div>
              <button onClick={onClose} className="text-slate-300 hover:text-white p-1">
                <i data-lucide="x" className="w-5 h-5"></i>
              </button>
            </div>

            <form onSubmit={handleSave} className="p-6 space-y-4 text-xs">
              
              <div className="flex flex-col items-center justify-center p-3 bg-slate-50 dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-700">
                <div className="w-20 h-20 rounded-2xl overflow-hidden bg-slate-200 dark:bg-slate-800 border-2 border-white dark:border-slate-700 shadow-md mb-2">
                  {photoPreview ? (
                    <img src={photoPreview} alt="Foto Perfil" className="w-full h-full object-cover" />

                    <div className="w-full h-full flex items-center justify-center font-bold text-xl text-slate-500">{user.name.charAt(0)}</div>

                <label className="cursor-pointer bg-slate-800 hover:bg-slate-700 text-white px-3 py-1.5 rounded-xl text-xs font-semibold transition-all flex items-center gap-1.5">
                  <i data-lucide="upload" className="w-3.5 h-3.5 text-udg-gold"></i>
                  <span>Seleccionar Nueva Foto</span>
                  <input type="file" accept="image/*" onChange={handleImageChange} className="hidden" />

              </div>

              <div>
                <label className="block font-semibold text-slate-700 dark:text-slate-300 mb-1">Nombre Registrado</label>
                <input type="text" disabled value={user.name} className="w-full bg-slate-100 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 p-2.5 rounded-xl text-slate-500 font-medium" />
              </div>

              <div>
                <label className="block font-semibold text-slate-700 dark:text-slate-300 mb-1">Teléfono Móvil de Contacto</label>
                <input
                  type="tel"
                  value={phone}
                  onChange={(e) => setPhone(e.target.value)}
                  className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-2.5 rounded-xl font-mono text-xs focus:ring-2 focus:ring-udg-blue outline-none"
                />
              </div>

              <div>
                <label className="block font-semibold text-slate-700 dark:text-slate-300 mb-1">Correo Electrónico</label>
                <input
                  type="email"

                  onChange={(e) => setEmail(e.target.value)}

                  Guardar Cambios
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function LoginModal({ onClose, onLogin, onOpenRegister, showToast }) {
  const [code, setCode] = useState('');
  const [nip, setNip] = useState('');
  const [loading, setLoading] = useState(false);
  const [errorMsg, setErrorMsg] = useState('');

  const handleAuth = (e) => {
    e.preventDefault();
    
    if (!code.trim() || !nip.trim()) {
      setErrorMsg('Ingresa tu código y contraseña.');
      return;
    }

    setLoading(true);
    setErrorMsg('');

    // Conexión real con el backend (Apps Script)
    if (typeof google !== 'undefined' && google.script) {
      google.script.run
        .withSuccessHandler((res) => {
          setLoading(false);
          if (res.success) {
            // NORMALIZACIÓN ESTRICTA: Evita que cualquier variable sea 'undefined'
            const dbUser = res.user;
            const normalizedUser = {
              code: String(dbUser.codigo || dbUser.code || ''),
              name: String(dbUser.nombre || dbUser.name || 'Usuario UDG'),
              role: String(dbUser.rol || dbUser.role || 'Estudiante'),
              career: String(dbUser.carrera || dbUser.career || 'Ingeniería en Computación'),
              phone: String(dbUser.telefono || dbUser.phone || ''),
              email: String(dbUser.correo || dbUser.email || ''),
              gpa: Number(dbUser.promedio || dbUser.gpa || 0),
              credits: Number(dbUser.creditos_avance || dbUser.credits || 0),
              totalCredits: Number(dbUser.creditos_totales || dbUser.totalCredits || 380),
              integralHours: Number(dbUser.horas_integrales || dbUser.integralHours || 0),
              requiredHours: Number(dbUser.horas_requeridas || dbUser.requiredHours || 60),
              status: String(dbUser.estatus || dbUser.status || 'Activo'),
              cycle: String(dbUser.ciclo || dbUser.cycle || '2026B'),
              photo: dbUser.foto_url || dbUser.photo || ''
            };
            onLogin(normalizedUser); 
          } else {
            setErrorMsg(res.message); 
          }
        })
        .withFailureHandler((err) => {
          setLoading(false);
          setErrorMsg("Error de conexión con el servidor.");
        })
        .loginUser(code, nip); 
    } else {
      // Mock para pruebas si lo abres fuera de Apps Script
      setTimeout(() => {
        setLoading(false);
        if (code === '219845123' && nip === '123456') {
          onLogin({ ...MOCK_USER_STUDENT, code: code });
        } else {
          setErrorMsg("Simulación: Usa código 219845123 y NIP 123456");
        }
      }, 1500);
    }
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-sm animate-in fade-in">
      <div className="bg-white dark:bg-slate-800 rounded-2xl max-w-sm w-full border border-slate-200 dark:border-slate-700 shadow-2xl overflow-hidden relative text-slate-800 dark:text-slate-100 transition-all">
        
        {/* Encabezado Institucional */}
        <div className="bg-udg-navy p-5 text-white relative">
          <button onClick={onClose} disabled={loading} className="absolute top-4 right-4 text-slate-300 hover:text-white disabled:opacity-50">
            <i data-lucide="x" className="w-5 h-5"></i>
          </button>
          <div className="flex items-center gap-3">
            <div className="w-10 h-10 rounded-xl bg-white text-udg-navy flex items-center justify-center font-black text-xs shadow-md">
              UDG
            </div>
            <div>
              <h3 className="font-bold text-base font-display">Inicio de Sesión</h3>
              <p className="text-[11px] text-slate-300">Portal INCO CUCEI</p>
            </div>
          </div>
        </div>

        <div className="p-6 space-y-4 text-xs">
          
          {errorMsg && (
            <div className="p-3 rounded-xl bg-red-50 border border-red-200 text-red-700 font-semibold flex items-center gap-2 animate-in slide-in-from-top-2">
              <i data-lucide="alert-circle" className="w-4 h-4 shrink-0"></i>
              <span>{errorMsg}</span>
            </div>
          )}

          <form onSubmit={handleAuth} className="space-y-4">
            <div>
              <label className="block font-semibold text-slate-700 dark:text-slate-300 mb-1">Código UdG</label>
              <input
                type="text"
                placeholder="Ej: 219845123"
                value={code}
                onChange={(e) => setCode(e.target.value)}
                disabled={loading}
                className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-2.5 rounded-xl font-mono text-xs focus:ring-2 focus:ring-udg-blue outline-none disabled:opacity-50"
              />
            </div>

            <div>
              <label className="block font-semibold text-slate-700 dark:text-slate-300 mb-1">NIP SIIAU</label>
              <input
                type="password"
                placeholder="••••••••"
                value={nip}
                onChange={(e) => setNip(e.target.value)}
                disabled={loading}
                className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-2.5 rounded-xl font-mono text-xs focus:ring-2 focus:ring-udg-blue outline-none disabled:opacity-50"
              />
            </div>

            <button
              type="submit"
              disabled={loading}
              className="w-full bg-udg-navy hover:bg-udg-blue text-white font-bold py-3 rounded-xl transition-all shadow-md flex items-center justify-center gap-2 font-display disabled:opacity-70 mt-2"
            >
              {loading ? (
                <>
                  <i data-lucide="loader-2" className="w-4 h-4 animate-spin"></i>
                  <span>Autenticando...</span>
                </>
              ) : (
                <>
                  <i data-lucide="log-in" className="w-4 h-4 text-udg-gold"></i>
                  <span>Acceder al Portal</span>
                </>
              )}
            </button>
          </form>

          <div className="text-center pt-3 border-t border-slate-100 dark:border-slate-700 space-y-2">
            <p className="text-slate-500">¿Nuevo alumno o profesor en la coordinación?</p>
            <button
              type="button"
              onClick={onOpenRegister}
              disabled={loading}
              className="bg-udg-gold hover:bg-udg-goldHover text-white font-bold px-4 py-2.5 rounded-xl text-xs w-full transition-all font-display disabled:opacity-50"
            >
              Crear Nuevo Registro Seguro
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
