// VISTA DEL ALUMNO: TicketsModule
// -------------------------------------------------------------
function TicketsModule({ user, showToast, addNotification }) {
  if (!user) return null;

  const [subject, setSubject] = useState('');
  const [details, setDetails] = useState('');
  const [tickets, setTickets] = useState([]);
  const [isLoading, setIsLoading] = useState(true);
  const [filter, setFilter] = useState('Todos');
  const [search, setSearch] = useState('');
  
  // Paginación
  const [currentPage, setCurrentPage] = useState(1);
  const ticketsPerPage = 5;
  
  // Carga inicial de tickets desde Google Sheets (solo los del usuario)
  useEffect(() => {
    setIsLoading(true);
    const studentId = String(user.codigo || user.code || user.id || '');
    
    if (typeof google !== 'undefined' && google.script) {
      google.script.run
        .withSuccessHandler((data) => {
          setTickets(Array.isArray(data) ? data : []);
          setIsLoading(false);
        })
        .withFailureHandler((err) => {
          showToast("Error al cargar el historial de tickets", "error");
          setIsLoading(false);
        })
        .getStudentTickets(studentId);
    } else {
      // Mock de carga para pruebas locales
      setTimeout(() => {
        setTickets([
          { id_ticket: 'INC-892', asunto: 'Duda con pre-dictamen', detalles: '...', estatus: 'Atendido', fecha_creacion: '24 Sep 2026', respuesta_coordinacion: 'Revisado.' }
        ]);
        setIsLoading(false);
      }, 1000);
    }
  }, [user]);

 const handleCreateTicket = (e) => {
    e.preventDefault();
    if (!subject.trim() || !details.trim()) {
      if (typeof showToast === 'function') showToast("Ingresa el asunto y los detalles del ticket", "error");
      return;
    }

    setIsLoading(true);
    
    // BLINDAJE: Mapeo seguro de las propiedades del usuario para evitar el fallo silencioso
    const safeCodigo = user.codigo || user.code || '';
    const safeNombre = user.nombre || user.name || 'Alumno';
    const safeEmail = user.correo || user.email || '';

    const ticketData = {
      codigo: safeCodigo,
      nombre: safeNombre,
      asunto: subject,
      detalles: details
    };

    if (typeof google !== 'undefined' && google.script) {
      google.script.run
        .withSuccessHandler((res) => {
          setIsLoading(false); // Apagamos el spinner garantizado
          
          if (res && res.success) {
            const safeTickets = Array.isArray(tickets) ? tickets : [];
            setTickets([res.ticket, ...safeTickets]);
            setSubject('');
            setDetails('');
            if (typeof showToast === 'function') showToast(`Ticket #${res.ticket.id_ticket} registrado correctamente.`);
            if (typeof addNotification === 'function') addNotification("Ticket Registrado", "Se envió confirmación a tu correo.", "ticket");
          } else {
            if (typeof showToast === 'function') showToast(res ? res.message : "Error del servidor", "error");
          }
        })
        .withFailureHandler((err) => {
          setIsLoading(false); // Apagamos el spinner si falla Google
          if (typeof showToast === 'function') showToast("Error de conexión al enviar el ticket.", "error");
          console.error("Error en GAS:", err);
        })
        .createTicket(ticketData, safeEmail); // Enviamos variables seguras
    } else {
      setTimeout(() => setIsLoading(false), 1000);
    }
  };

  // Filtrado, Búsqueda y Paginación
  const filteredTickets = (tickets || []).filter(t => {
    const matchFilter = filter === 'Todos' || t.estatus === filter;
    const matchSearch = t.asunto?.toLowerCase().includes(search.toLowerCase()) || 
                        t.detalles?.toLowerCase().includes(search.toLowerCase());
    return matchFilter && matchSearch;
  });

  const indexOfLast = currentPage * ticketsPerPage;
  const indexOfFirst = indexOfLast - ticketsPerPage;
  const currentTickets = filteredTickets.slice(indexOfFirst, indexOfLast);
  const totalPages = Math.ceil(filteredTickets.length / ticketsPerPage);

  // Componente Skeleton Interno
  const SkeletonCard = () => (
    <div className="p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 animate-pulse space-y-3">
      <div className="flex justify-between">
        <div className="h-4 bg-slate-200 dark:bg-slate-700 rounded w-1/4"></div>
        <div className="h-4 bg-slate-200 dark:bg-slate-700 rounded w-16"></div>
      </div>
      <div className="h-5 bg-slate-200 dark:bg-slate-700 rounded w-3/4"></div>
      <div className="h-3 bg-slate-200 dark:bg-slate-700 rounded w-1/2"></div>
    </div>
  );

  return (
    <div className="space-y-6">
      {/* SECCIÓN 1: Formulario */}
      <div className="glass-card rounded-2xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
        <div className="flex items-center gap-3 border-b border-slate-100 dark:border-slate-700 pb-4">
          <div className="w-10 h-10 rounded-xl bg-udg-light dark:bg-slate-700 text-udg-navy dark:text-blue-300 flex items-center justify-center font-bold">
            <i data-lucide="life-buoy" className="w-5 h-5"></i>
          </div>
          <div>
            <h3 className="text-lg font-bold text-slate-900 dark:text-white font-display">Mesa de Ayuda INCO</h3>
            <p className="text-xs text-slate-500 dark:text-slate-400">Levanta un ticket para reportar incidencias o solicitar apoyo.</p>
          </div>
        </div>

        <form onSubmit={handleCreateTicket} className="space-y-3 text-xs">
          <div>
            <label className="block font-semibold mb-1">Asunto de la Solicitud *</label>
            <input 
              type="text" 
              placeholder="Ej: Empalme de materias, Error en SIIAU..." 
              value={subject} 
              onChange={(e) => setSubject(e.target.value)} 
              disabled={isLoading}
              className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-3 rounded-xl focus:ring-2 focus:ring-udg-blue outline-none disabled:opacity-50" 
            />
          </div>
          <div>
            <label className="block font-semibold mb-1">Descripción Detallada *</label>
            <textarea 
              rows="3" 
              placeholder="Describe el problema incluyendo NRCs, nombres de profesores, etc." 
              value={details} 
              onChange={(e) => setDetails(e.target.value)} 
              disabled={isLoading}
              className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-3 rounded-xl focus:ring-2 focus:ring-udg-blue outline-none disabled:opacity-50"
            ></textarea>
          </div>
          <div className="flex justify-end pt-1">
            <button type="submit" disabled={isLoading} className="bg-udg-navy hover:bg-udg-blue text-white font-bold px-6 py-2.5 rounded-xl flex items-center gap-2 shadow-md transition-all disabled:opacity-50">
              {isLoading ? <i data-lucide="loader-2" className="w-4 h-4 animate-spin"></i> : <i data-lucide="send" className="w-4 h-4"></i>}
              <span>Enviar Ticket de Atención</span>
            </button>
          </div>
        </form>
      </div>

      {/* SECCIÓN 2: Historial y Búsqueda */}
      <div className="glass-card rounded-2xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
        <div className="flex flex-col md:flex-row md:items-center justify-between gap-3 border-b border-slate-100 dark:border-slate-700 pb-3">
          <h4 className="text-sm font-bold flex items-center gap-2 font-display">
            <i data-lucide="history" className="w-4 h-4 text-udg-gold"></i>
            Mis Tickets Solicitados
          </h4>
          
          <div className="flex flex-col sm:flex-row gap-2">
            <div className="relative">
              <i data-lucide="search" className="absolute left-2.5 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-slate-400"></i>
              <input 
                type="text" 
                placeholder="Buscar ticket..." 
                value={search}
                onChange={(e) => { setSearch(e.target.value); setCurrentPage(1); }}
                className="pl-8 pr-3 py-1.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-xs outline-none focus:ring-1 focus:ring-udg-blue"
              />
            </div>
            <div className="flex bg-slate-100 dark:bg-slate-800 p-1 rounded-lg text-xs font-semibold">
              {['Todos', 'Pendiente', 'Atendido'].map(f => (
                <button 
                  key={f}
                  onClick={() => { setFilter(f); setCurrentPage(1); }}
                  className={`px-3 py-1 rounded-md transition-colors ${filter === f ? 'bg-white dark:bg-slate-700 shadow-sm text-udg-navy dark:text-white' : 'text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'}`}
                >
                  {f}
                </button>
              ))}
            </div>
          </div>
        </div>

        <div className="space-y-3 text-xs min-h-[300px]">
          {isLoading ? (
            <>
              <SkeletonCard />
              <SkeletonCard />
              <SkeletonCard />
            </>
          ) : filteredTickets.length === 0 ? (
            <div className="py-12 text-center text-slate-400 space-y-2">
              <i data-lucide="inbox" className="w-8 h-8 mx-auto opacity-50"></i>
              <p>No se encontraron tickets {filter !== 'Todos' ? `con estado "${filter}"` : ''}.</p>
            </div>
          ) : (
            currentTickets.map(t => (
              <div key={t.id_ticket} className="p-4 rounded-xl bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-700 space-y-2 hover:border-udg-blue/30 transition-colors">
                <div className="flex justify-between items-start">
                  <div className="flex items-center gap-2">
                    <span className="font-mono font-bold text-udg-navy dark:text-blue-400 text-sm">#{t.id_ticket}</span>
                    <span className="text-slate-400">•</span>
                    <span className="text-slate-500 font-medium">{t.fecha_creacion}</span>
                  </div>
                  <span className={`px-2.5 py-0.5 rounded-full text-[10px] font-bold ${
                    t.estatus === 'Atendido' 
                      ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300' 
                      : 'bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300'
                  }`}>
                    {t.estatus}
                  </span>
                </div>

                <h5 className="font-bold text-slate-900 dark:text-white text-sm">{t.asunto}</h5>
                <p className="text-slate-600 dark:text-slate-400 line-clamp-2">{t.detalles}</p>

                {t.respuesta_coordinacion ? (
                  <div className="bg-emerald-50 dark:bg-emerald-900/20 p-3 rounded-xl border border-emerald-200 dark:border-emerald-800 mt-2">
                    <div className="flex items-center gap-1.5 text-emerald-700 dark:text-emerald-400 font-bold text-[11px] mb-1">
                      <i data-lucide="check-circle" className="w-3.5 h-3.5"></i>
                      <span>Respuesta Oficial de Coordinación:</span>
                    </div>
                    <p className="text-xs text-slate-700 dark:text-slate-300 leading-relaxed whitespace-pre-wrap">{t.respuesta_coordinacion}</p>
                  </div>
                ) : (
                  <div className="flex items-center gap-1.5 text-amber-600 dark:text-amber-400 text-[10px] font-semibold mt-2">
                    <i data-lucide="clock" className="w-3.5 h-3.5"></i>
                    <span>En fila de revisión por Coordinación...</span>
                  </div>
                )}
              </div>
            ))
          )}
        </div>

        {/* Controles Paginación Alumno */}
        {!isLoading && totalPages > 1 && (
          <div className="flex justify-between items-center pt-2 border-t border-slate-100 dark:border-slate-700">
            <span className="text-[10px] text-slate-400 font-semibold">Página {currentPage} de {totalPages}</span>
            <div className="flex gap-1.5">
              <button 
                onClick={() => setCurrentPage(prev => Math.max(prev - 1, 1))} 
                disabled={currentPage === 1}
                className="p-1.5 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700 disabled:opacity-30"
              >
                <i data-lucide="chevron-left" className="w-4 h-4"></i>
              </button>
              <button 
                onClick={() => setCurrentPage(prev => Math.min(prev + 1, totalPages))} 
                disabled={currentPage === totalPages}
                className="p-1.5 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700 disabled:opacity-30"
              >
                <i data-lucide="chevron-right" className="w-4 h-4"></i>
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// VISTA DEL COORDINADOR: AdminPanelTickets
// -------------------------------------------------------------
function AdminPanelTickets({ showToast, addNotification }) {
  const [tickets, setTickets] = useState([]);
  const [isLoading, setIsLoading] = useState(true);
  const [filter, setFilter] = useState('Pendiente'); // Por defecto ver lo que falta
  const [search, setSearch] = useState('');
  const [replyTexts, setReplyTexts] = useState({});
  const [replyingId, setReplyingId] = useState(null); // Estado de carga por ticket
  
  // Paginación Admin
  const [currentPage, setCurrentPage] = useState(1);
  const ticketsPerPage = 10;

  // Cargar TODO el universo de tickets
  const fetchTickets = () => {
    setIsLoading(true);
    if (typeof google !== 'undefined' && google.script) {
      google.script.run
        .withSuccessHandler((data) => {
          setTickets(data);
          setIsLoading(false);
        })
        .withFailureHandler(() => {
          showToast("Error al cargar lista global de tickets", "error");
          setIsLoading(false);
        })
        .getAllTickets();
    } else {
      setTimeout(() => setIsLoading(false), 1000);
    }
  };

  useEffect(() => { fetchTickets(); }, []);

  const handleReply = (ticketId, studentEmail, studentName) => {
    const text = replyTexts[ticketId];
    if (!text || !text.trim()) {
      showToast("La respuesta no puede estar vacía", "error");
      return;
    }

    setReplyingId(ticketId);

    if (typeof google !== 'undefined' && google.script) {
      google.script.run
        .withSuccessHandler((res) => {
          setReplyingId(null);
          if (res.success) {
            // Actualizar estado local
            setTickets(tickets.map(t => 
              t.id_ticket === ticketId ? { ...t, estatus: 'Atendido', respuesta_coordinacion: text } : t
            ));
            
            const newReplyTexts = {...replyTexts};
            delete newReplyTexts[ticketId];
            setReplyTexts(newReplyTexts);
            
            showToast(`Ticket #${ticketId} cerrado y notificado al alumno.`);
          } else {
            showToast(res.message, "error");
          }
        })
        .withFailureHandler(() => {
          setReplyingId(null);
          showToast("Error de conexión al enviar respuesta.", "error");
        })
        .replyToTicket(ticketId, text, studentEmail, studentName);
    } else {
      setTimeout(() => setReplyingId(null), 1000);
    }
  };

  const filteredTickets = (tickets || []).filter(t => {
    const matchFilter = filter === 'Todos' || t.estatus === filter;
    const searchString = `${t.asunto} ${t.detalles} ${t.nombre_estudiante} ${t.codigo_estudiante} ${t.id_ticket}`.toLowerCase();
    const matchSearch = searchString.includes(search.toLowerCase());
    return matchFilter && matchSearch;
  });

  const indexOfLast = currentPage * ticketsPerPage;
  const indexOfFirst = indexOfLast - ticketsPerPage;
  const currentTickets = filteredTickets.slice(indexOfFirst, indexOfLast);
  const totalPages = Math.ceil(filteredTickets.length / ticketsPerPage);

  // Skeleton Admin
  const SkeletonAdminCard = () => (
    <div className="p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/40 animate-pulse space-y-3">
      <div className="flex justify-between"><div className="h-4 bg-slate-200 dark:bg-slate-700 rounded w-1/3"></div><div className="h-4 bg-slate-200 dark:bg-slate-700 rounded w-16"></div></div>
      <div className="h-3 bg-slate-200 dark:bg-slate-700 rounded w-1/4"></div>
      <div className="h-10 bg-slate-200 dark:bg-slate-700 rounded w-full mt-2"></div>
    </div>
  );

  return (
    <div className="glass-card rounded-2xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm space-y-5 text-xs">
      
      <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-100 dark:border-slate-700 pb-4">
        <div className="flex items-center gap-3">
          <div className="w-10 h-10 rounded-xl bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-400 flex items-center justify-center font-bold">
            <i data-lucide="shield-check" className="w-5 h-5"></i>
          </div>
          <div>
            <h3 className="text-lg font-bold text-slate-900 dark:text-white font-display">Administración Global de Tickets</h3>
            <p className="text-slate-500">Buzón central de incidencias estudiantiles.</p>
          </div>
        </div>

        <div className="flex flex-col sm:flex-row gap-2">
          <div className="relative">
            <i data-lucide="search" className="absolute left-2.5 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-slate-400"></i>
            <input 
              type="text" 
              placeholder="Buscar folio, código o texto..." 
              value={search}
              onChange={(e) => { setSearch(e.target.value); setCurrentPage(1); }}
              className="pl-8 pr-3 py-1.5 w-full sm:w-48 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-xs outline-none focus:ring-1 focus:ring-udg-blue"
            />
          </div>
          <div className="flex bg-slate-100 dark:bg-slate-800 p-1 rounded-lg font-semibold shrink-0">
            {['Pendiente', 'Atendido', 'Todos'].map(f => (
              <button 
                key={f} onClick={() => { setFilter(f); setCurrentPage(1); }}
                className={`px-3 py-1 rounded-md transition-colors ${filter === f ? 'bg-white dark:bg-slate-700 shadow-sm text-udg-navy dark:text-white' : 'text-slate-500 hover:text-slate-700'}`}
              >
                {f}
              </button>
            ))}
          </div>
          <button onClick={fetchTickets} disabled={isLoading} className="bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 p-1.5 rounded-lg border border-slate-200 dark:border-slate-600 transition-colors">
            <i data-lucide="refresh-cw" className={`w-4 h-4 text-slate-600 dark:text-slate-300 ${isLoading ? 'animate-spin' : ''}`}></i>
          </button>
        </div>
      </div>

      <div className="space-y-4 min-h-[400px]">
        {isLoading ? (
          <><SkeletonAdminCard /><SkeletonAdminCard /><SkeletonAdminCard /></>
        ) : currentTickets.length === 0 ? (
           <div className="py-12 text-center text-slate-400"><i data-lucide="check-circle" className="w-10 h-10 mx-auto mb-2 opacity-50 text-emerald-500"></i><p>Bandeja limpia. No hay tickets en esta categoría.</p></div>
        ) : (
          currentTickets.map(t => (
            <div key={t.id_ticket} className="p-4 rounded-xl bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-700 space-y-3">
              <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-2 border-b border-slate-200 dark:border-slate-700/50 pb-2">
                <div>
                  <div className="flex items-center gap-2 mb-0.5">
                    <span className="font-mono font-bold text-udg-navy dark:text-blue-400 text-sm">#{t.id_ticket}</span>
                    <span className={`px-2 py-0.5 rounded text-[9px] font-black uppercase ${
                      t.estatus === 'Atendido' ? 'bg-emerald-200 text-emerald-900' : 'bg-red-200 text-red-900 animate-pulse'
                    }`}>
                      {t.estatus}
                    </span>
                  </div>
                  <h4 className="font-bold text-slate-900 dark:text-white text-sm">{t.asunto}</h4>
                </div>
                <div className="text-right">
                  <p className="font-bold text-slate-700 dark:text-slate-200">{t.nombre_estudiante}</p>
                  <p className="text-[10px] text-slate-500 font-mono">Cód: {t.codigo_estudiante} • {t.fecha_creacion}</p>
                </div>
              </div>

              <div className="bg-white dark:bg-slate-800 p-3 rounded-lg border border-slate-100 dark:border-slate-700 text-slate-600 dark:text-slate-300">
                <span className="font-bold text-slate-400 block mb-1">Descripción reportada:</span>
                {t.detalles}
              </div>

              {t.estatus === 'Atendido' ? (
                <div className="p-3 bg-emerald-50 dark:bg-emerald-950/30 rounded-lg border border-emerald-200 dark:border-emerald-800">
                  <p className="font-bold text-emerald-800 dark:text-emerald-400 flex items-center gap-1 mb-1">
                    <i data-lucide="check-check" className="w-3.5 h-3.5"></i> Respuesta enviada:
                  </p>
                  <p className="text-slate-700 dark:text-slate-200 whitespace-pre-wrap">{t.respuesta_coordinacion}</p>
                </div>
              ) : (
                <div className="space-y-2 pt-1">
                  <textarea 
                    rows="3"
                    placeholder="Redacta la respuesta oficial para notificar al alumno..."
                    value={replyTexts[t.id_ticket] || ''}
                    onChange={(e) => setReplyTexts({ ...replyTexts, [t.id_ticket]: e.target.value })}
                    disabled={replyingId === t.id_ticket}
                    className="w-full bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-xl p-3 text-xs focus:ring-2 focus:ring-udg-blue outline-none disabled:opacity-50"
                  ></textarea>
                  <div className="flex justify-end">
                    <button 
                      onClick={() => handleReply(t.id_ticket, t.correo_estudiante || '', t.nombre_estudiante)}
                      disabled={replyingId === t.id_ticket}
                      className="bg-udg-navy hover:bg-udg-blue text-white font-bold px-5 py-2 rounded-xl flex items-center gap-2 shadow-md transition-all disabled:opacity-50"
                    >
                      {replyingId === t.id_ticket ? <i data-lucide="loader-2" className="w-3.5 h-3.5 animate-spin"></i> : <i data-lucide="send-checked" className="w-3.5 h-3.5"></i>}
                      <span>Dictaminar y Cerrar Ticket</span>
                    </button>
                  </div>
                </div>
              )}
            </div>
          ))
        )}
      </div>

      {/* Controles Paginación Admin */}
      {!isLoading && totalPages > 1 && (
        <div className="flex justify-between items-center pt-2 border-t border-slate-100 dark:border-slate-700">
          <span className="text-[10px] text-slate-400 font-semibold">Mostrando {indexOfFirst + 1} - {Math.min(indexOfLast, filteredTickets.length)} de {filteredTickets.length} tickets (Pág {currentPage}/{totalPages})</span>
          <div className="flex gap-1.5">
            <button onClick={() => setCurrentPage(prev => Math.max(prev - 1, 1))} disabled={currentPage === 1} className="p-1.5 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 disabled:opacity-30">
              <i data-lucide="chevron-left" className="w-4 h-4"></i>
            </button>
            <button onClick={() => setCurrentPage(prev => Math.min(prev + 1, totalPages))} disabled={currentPage === totalPages} className="p-1.5 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 disabled:opacity-30">
              <i data-lucide="chevron-right" className="w-4 h-4"></i>
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

// ============================================================================
// VISTA DEL COORDINADOR: AdminJustificantesModule
// ============================================================================
function AdminJustificantesModule({ user, showToast, addNotification }) {
  const [items, setItems] = useState([]);
  const [isLoading, setIsLoading] = useState(true);
  
  // Estados para el Overlay de Carga del Admin
  const [actionLoadingId, setActionLoadingId] = useState(null);
  const [actionLoadingMsg, setActionLoadingMsg] = useState('');

  const [filter, setFilter] = useState('Pendiente');
  const [search, setSearch] = useState('');
  const [currentPage, setCurrentPage] = useState(1);
  const [itemsPerPage, setItemsPerPage] = useState(10);
  const [selectedModalIndex, setSelectedModalIndex] = useState(null);

  // Garantizar renderizado de íconos en cada actualización de estado
  useEffect(() => {
    if (window.lucide) {
      window.lucide.createIcons();
    }
  });

  const fetchAllJustificantes = () => {
    setIsLoading(true);
    if (typeof google !== 'undefined' && google.script) {
      google.script.run
        .withSuccessHandler((data) => {
          setItems(Array.isArray(data) ? data : []);
          setIsLoading(false);
        })
        .withFailureHandler(() => {
          if (typeof showToast === 'function') showToast("Error al cargar las solicitudes", "error");
          setItems([]);
          setIsLoading(false);
        })
        .getAllJustificantes();
    } else {
      setTimeout(() => {
        setItems([]);
        setIsLoading(false);
      }, 1000);
    }
  };

  useEffect(() => {
    fetchAllJustificantes();
  }, []);

  const safeItems = Array.isArray(items) ? items : [];

  const countPendientes = safeItems.filter(i => i.estatus === 'Pendiente').length;
  const countEnProceso = safeItems.filter(i => i.estatus === 'En Proceso').length;
  const countFinalizadas = safeItems.filter(i => i.estatus === 'Finalizada').length;

  const filteredItems = safeItems.filter(item => {
    const matchFilter = filter === 'Todos' || item.estatus === filter;
    const query = search.toLowerCase();
    const textTarget = `${item.nombre_estudiante || ''} ${item.codigo_estudiante || ''} ${item.id_justificante || ''} ${item.motivo || ''}`.toLowerCase();
    return matchFilter && textTarget.includes(query);
  });

  const totalPages = Math.max(1, Math.ceil(filteredItems.length / itemsPerPage));
  const indexOfLast = currentPage * itemsPerPage;
  const indexOfFirst = indexOfLast - itemsPerPage;
  const currentItems = filteredItems.slice(indexOfFirst, indexOfLast);

  // Generar PDF Oficial y abrir en nueva pestaña automáticamente
  const handleGeneratePDF = (idJustificante) => {
    setActionLoadingId(idJustificante);
    setActionLoadingMsg('Generando dictamen oficial en PDF. Esto puede tomar unos segundos...');
    const adminCode = user?.code || user?.codigo || 'COORD_INCO';

    if (typeof google !== 'undefined' && google.script) {
      google.script.run
        .withSuccessHandler((res) => {
          setActionLoadingId(null);
          if (res && res.success) {
            setItems(prev => prev.map(item =>
              item.id_justificante === idJustificante
                ? { ...item, estatus: 'En Proceso', pdf_oficial_url: res.pdfUrl, fecha_revision: res.fechaRevision }
                : item
            ));
            if (typeof showToast === 'function') showToast(`Dictamen PDF generado para #${idJustificante}`);
            
            // ABRIR EL PDF AUTOMÁTICAMENTE
            window.open(res.pdfUrl, '_blank');
          } else {
            if (typeof showToast === 'function') showToast(res ? res.message : "Error al generar PDF", "error");
          }
        })
        .withFailureHandler(() => {
          setActionLoadingId(null);
          if (typeof showToast === 'function') showToast("Error de conexión al generar el PDF", "error");
        })
        .generateJustificantePDF(idJustificante, adminCode);
    } else {
      setTimeout(() => {
        setActionLoadingId(null);
        showToast("Simulación: PDF generado");
      }, 1200);
    }
  };

  const handleFinalizeAndNotify = (idJustificante) => {
    setActionLoadingId(idJustificante);
    setActionLoadingMsg('Enviando notificación por correo al alumno...');
    const adminCode = user?.code || user?.codigo || 'COORD_INCO';

    if (typeof google !== 'undefined' && google.script) {
      google.script.run
        .withSuccessHandler((res) => {
          setActionLoadingId(null);
          if (res && res.success) {
            setItems(prev => prev.map(item =>
              item.id_justificante === idJustificante
                ? { ...item, estatus: 'Finalizada', fecha_revision: res.fechaRevision }
                : item
            ));
            if (typeof showToast === 'function') showToast(`Alumno notificado por correo.`);
          } else {
            if (typeof showToast === 'function') showToast(res ? res.message : "Error al notificar", "error");
          }
        })
        .withFailureHandler(() => {
          setActionLoadingId(null);
          if (typeof showToast === 'function') showToast("Error de conexión al notificar", "error");
        })
        .finalizeJustificante(idJustificante, adminCode);
    } else {
      setTimeout(() => {
        setActionLoadingId(null);
        showToast("Simulación: Alumno notificado");
      }, 1000);
    }
  };

  const getBadgeStyle = (status) => {
    if (status === 'Finalizada') return 'bg-emerald-100 text-emerald-800 border-emerald-300';
    if (status === 'En Proceso') return 'bg-blue-100 text-blue-800 border-blue-300';
    return 'bg-amber-50 text-amber-700 border-amber-300';
  };

  const activeModalItem = selectedModalIndex !== null ? filteredItems[selectedModalIndex] : null;

  return (
    <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm space-y-5 text-xs relative">
      
      {/* OVERLAY DE BLOQUEO PARA EL ADMIN */}
      {actionLoadingId && (
        <div className="fixed inset-0 z-[100] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 max-w-sm w-full shadow-2xl border border-slate-200 dark:border-slate-700 text-center space-y-3">
            <i data-lucide="loader-2" className="w-8 h-8 text-udg-blue animate-spin mx-auto shrink-0"></i>
            <h4 className="font-bold text-sm text-slate-900 dark:text-white font-display">Procesando solicitud...</h4>
            <p className="text-xs text-slate-500">{actionLoadingMsg}</p>
          </div>
        </div>
      )}

      {/* Encabezado */}
      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-100 dark:border-slate-700 pb-4">
        <div>
          <h3 className="text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2 font-display">
            <i data-lucide="shield-check" className="w-5 h-5 text-udg-gold shrink-0"></i>
            Procesamiento de Justificantes
          </h3>
          <p className="text-slate-500 text-xs mt-0.5">Revisa, autoriza, genera los PDFs oficiales y notifica a los alumnos.</p>
        </div>
        
        {/* BOTÓN ACTUALIZAR CON SPINNER BLINDADO */}
        <button type="button" onClick={fetchAllJustificantes} disabled={isLoading} className="self-start sm:self-auto px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-slate-700 dark:text-slate-200 font-semibold flex items-center gap-1.5 disabled:opacity-50">
          <span className={`flex items-center justify-center ${isLoading ? 'animate-spin' : ''}`}>
            <i data-lucide="refresh-cw" className="w-3.5 h-3.5 shrink-0"></i>
          </span>
          <span>Actualizar</span>
        </button>
      </div>

      {/* Filtros */}
      <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-3">
        <div className="relative flex-1 max-w-md">
          <i data-lucide="search" className="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 shrink-0"></i>
          <input type="text" placeholder="Buscar alumno por nombre o código..." value={search} onChange={(e) => { setSearch(e.target.value); setCurrentPage(1); setSelectedModalIndex(null); }} className="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-xs focus:ring-2 focus:ring-udg-blue outline-none" />
        </div>
        <div className="flex flex-wrap items-center gap-1.5 bg-slate-100 dark:bg-slate-900 p-1.5 rounded-xl">
          <button type="button" onClick={() => { setFilter('Pendiente'); setCurrentPage(1); setSelectedModalIndex(null); }} className={`px-3 py-1.5 rounded-lg font-bold flex items-center gap-1.5 transition-all ${ filter === 'Pendiente' ? 'bg-udg-gold text-white shadow-sm' : 'text-slate-600 hover:bg-white/60' }`}>
            <span>Recibidos</span><span className="px-1.5 py-0.2 rounded-full text-[10px] bg-black/15">{countPendientes}</span>
          </button>
          <button type="button" onClick={() => { setFilter('En Proceso'); setCurrentPage(1); setSelectedModalIndex(null); }} className={`px-3 py-1.5 rounded-lg font-bold flex items-center gap-1.5 transition-all ${ filter === 'En Proceso' ? 'bg-udg-navy text-white shadow-sm' : 'text-slate-600 hover:bg-white/60' }`}>
            <span>PDF Generado</span><span className="px-1.5 py-0.2 rounded-full text-[10px] bg-black/10">{countEnProceso}</span>
          </button>
          <button type="button" onClick={() => { setFilter('Finalizada'); setCurrentPage(1); setSelectedModalIndex(null); }} className={`px-3 py-1.5 rounded-lg font-bold flex items-center gap-1.5 transition-all ${ filter === 'Finalizada' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-600 hover:bg-white/60' }`}>
            <span>Completados</span><span className="px-1.5 py-0.2 rounded-full text-[10px] bg-black/10">{countFinalizadas}</span>
          </button>
          <button type="button" onClick={() => { setFilter('Todos'); setCurrentPage(1); setSelectedModalIndex(null); }} className={`px-3 py-1.5 rounded-lg font-bold transition-all ${ filter === 'Todos' ? 'bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm' : 'text-slate-600 hover:bg-white/60' }`}>
            Todos
          </button>
        </div>
      </div>

      {/* Tarjetas */}
      <div className="space-y-3 min-h-[260px]">
        {isLoading ? (
          <div className="space-y-3">
            {[1, 2, 3].map(n => (
              <div key={n} className="p-5 rounded-2xl bg-white dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 shadow-sm space-y-4 animate-pulse">
                <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-2 border-b border-slate-200 dark:border-slate-700/50 pb-2">
                  <div className="space-y-2 w-full md:w-auto">
                    <div className="h-4 bg-slate-200 dark:bg-slate-700 rounded w-48"></div>
                    <div className="h-3 bg-slate-200 dark:bg-slate-700 rounded w-24"></div>
                  </div>
                  <div className="h-5 bg-slate-200 dark:bg-slate-700 rounded-full w-20"></div>
                </div>
                
                <div className="flex flex-wrap items-center justify-between gap-2 pt-1">
                  <div className="h-8 bg-slate-200 dark:bg-slate-700 rounded-xl w-32"></div>
                  <div className="flex items-center gap-2">
                    <div className="h-8 bg-slate-200 dark:bg-slate-700 rounded-xl w-36"></div>
                    <div className="h-8 bg-slate-200 dark:bg-slate-700 rounded-xl w-36 hidden sm:block"></div>
                  </div>
                </div>
              </div>
            ))}
          </div>
        ) : currentItems.length === 0 ? (
          <div className="py-12 text-center text-slate-400 space-y-2"><i data-lucide="inbox" className="w-8 h-8 mx-auto opacity-50 shrink-0"></i><p>No hay solicitudes.</p></div>
        ) : (
          currentItems.map((item, idx) => {
            const globalFilteredIdx = indexOfFirst + idx;
            return (
              <div key={item.id_justificante} className="p-5 rounded-2xl bg-white dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
                <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-2 border-b border-slate-200 dark:border-slate-700/50 pb-2">
                  <div>
                    <h4 className="font-bold text-slate-900 dark:text-white text-sm">{item.nombre_estudiante} <span className="text-udg-blue dark:text-blue-400 font-mono">({item.codigo_estudiante})</span></h4>
                    <span className="text-[11px] font-mono text-slate-400">#{item.id_justificante}</span>
                  </div>
                  <span className={`px-3 py-0.5 rounded-full text-[10px] font-extrabold border uppercase ${getBadgeStyle(item.estatus)}`}>{item.estatus}</span>
                </div>
                
                <div className="flex flex-wrap items-center justify-between gap-2 pt-1">

function JustificantesModule({ user, showToast, addNotification, isLoggedIn, setActiveModal }) {
  if (!user) return null;

  // Garantizar renderizado de íconos en cada actualización de estado
  useEffect(() => {
    if (window.lucide) {
      window.lucide.createIcons();
    }
  });

  // Estados del Formulario
  const [phone, setPhone] = useState(user.phone || user.telefono || '');
  const [reason, setReason] = useState('Enfermedad');
  const [customReason, setCustomReason] = useState('');
  const [startDate, setStartDate] = useState('');
  const [endDate, setEndDate] = useState('');
  
  // Buscador de Materias y NRCs (6 dígitos exactos)
  const [subjectQuery, setSubjectQuery] = useState('');
  const [showSuggestions, setShowSuggestions] = useState(false);
  const [selectedSubjects, setSelectedSubjects] = useState([]);

  // Archivo de Evidencia (Base64)
  const [evidenceFile, setEvidenceFile] = useState(null);

  // Estados de Historial y Carga
  const [justificantes, setJustificantes] = useState([]);
  const [isLoading, setIsLoading] = useState(true);
  const [isSubmitting, setIsSubmitting] = useState(false);

  // Modal de Detalles del Estudiante
  const [detailIndex, setDetailIndex] = useState(null);

  const studentCode = String(user.code || user.codigo || '');
  const studentName = String(user.name || user.nombre || '');
  const studentEmail = String(user.email || user.correo || '');

  const fetchMyJustificantes = () => {
    setIsLoading(true);
    if (typeof google !== 'undefined' && google.script) {
      google.script.run
        .withSuccessHandler((data) => {
          setJustificantes(Array.isArray(data) ? data : []);
          setIsLoading(false);
        })
        .withFailureHandler(() => {
          if (typeof showToast === 'function') showToast("Error al cargar tu historial", "error");
          setJustificantes([]);
          setIsLoading(false);
        })
        .getStudentJustificantes(studentCode);
    } else {
      setTimeout(() => {
        setJustificantes([]);
        setIsLoading(false);
      }, 1000);
    }
  };

  useEffect(() => {
    fetchMyJustificantes();
  }, [studentCode]);

  const filteredCatalog = CATALOGO_MATERIAS_INCO.filter(mat => 
    mat.toLowerCase().includes(subjectQuery.toLowerCase()) &&
    !selectedSubjects.some(s => s.name === mat)
  );

  const handleAddSubject = (subjectName) => {
    setSelectedSubjects(prev => [...prev, { name: subjectName, nrc: '' }]);
    setSubjectQuery('');
    setShowSuggestions(false);
  };

  const handleRemoveSubject = (subjectName) => {
    setSelectedSubjects(prev => prev.filter(s => s.name !== subjectName));
  };

  const handleNrcChange = (subjectName, value) => {
    const numericVal = value.replace(/\D/g, '').slice(0, 6);
    setSelectedSubjects(prev => prev.map(s => s.name === subjectName ? { ...s, nrc: numericVal } : s));
  };

  const handleFileChange = (e) => {
    const file = e.target.files[0];
    if (!file) {
      setEvidenceFile(null);
      return;
    }
    if (file.size > 8 * 1024 * 1024) {
      showToast("El archivo no debe superar los 8 MB", "error");
      e.target.value = '';
      return;
    }
    const reader = new FileReader();
    reader.onloadend = () => {
      const base64String = reader.result.split(',')[1];
      setEvidenceFile({
        name: file.name,
        mimeType: file.type || 'application/pdf',
        base64: base64String
      });
    };
    reader.readAsDataURL(file);
  };

  const formatDateDisplay = (isoDate) => {
    if (!isoDate) return '';
    const parts = isoDate.split('-');
    if (parts.length !== 3) return isoDate;
    return `${parts[2]}/${parts[1]}/${parts[0]}`;
  };

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!isLoggedIn) {
      setActiveModal('login');
      return;
    }

    if (!phone.trim()) { showToast("Ingresa tu teléfono", "error"); return; }
    const finalReason = reason === 'Otro' ? customReason.trim() : reason;
    if (!finalReason) { showToast("Especifica el motivo", "error"); return; }
    if (!startDate || !endDate) { showToast("Selecciona las fechas", "error"); return; }
    if (new Date(startDate) > new Date(endDate)) { showToast("Fechas inválidas", "error"); return; }
    if (selectedSubjects.length === 0) { showToast("Agrega una asignatura", "error"); return; }
    
    const invalidNrc = selectedSubjects.find(s => !/^\d{6}$/.test(s.nrc));
    if (invalidNrc) { showToast(`NRC inválido en ${invalidNrc.name}`, "error"); return; }
    if (!evidenceFile) { showToast("Adjunta evidencia digital", "error"); return; }

    setIsSubmitting(true);

    const formattedSubjects = selectedSubjects.map(s => `${s.name} (NRC: ${s.nrc})`).join(', ');
    const periodoFormatted = `Del ${formatDateDisplay(startDate)} al ${formatDateDisplay(endDate)}`;

    const payload = {
      codigo: studentCode,
      nombre: studentName,
      correo: studentEmail,
      telefono: phone.trim(),
      motivo: finalReason,
      materias: formattedSubjects,
      fecha_incapacidad: periodoFormatted,
      fileData: evidenceFile
    };

    if (typeof google !== 'undefined' && google.script) {
      google.script.run
        .withSuccessHandler((res) => {
          setIsSubmitting(false);
          if (res && res.success) {
            const currentList = Array.isArray(justificantes) ? justificantes : [];
            setJustificantes([res.justificante, ...currentList]);
            setStartDate(''); setEndDate(''); setCustomReason(''); setReason('Enfermedad');
            setSelectedSubjects([]); setEvidenceFile(null);
            showToast(`Solicitud #${res.justificante.id_justificante} enviada con éxito`);
          } else {
            showToast(res ? res.message : "Error al procesar", "error");
          }
        })
        .withFailureHandler(() => {
          setIsSubmitting(false);
          showToast("Error de conexión", "error");
        })
        .createJustificante(payload);
    } else {
      setTimeout(() => { setIsSubmitting(false); showToast("Simulación: Enviado"); }, 1200);
    }
  };

  const getBadgeStyle = (status) => {
    const s = String(status || '').toUpperCase();
    if (s === 'FINALIZADA' || s === 'APROBADO') return 'bg-emerald-100 text-emerald-800 border-emerald-300';
    if (s === 'EN PROCESO' || s === 'PDF GENERADO') return 'bg-blue-100 text-blue-800 border-blue-300';
    return 'bg-amber-50 text-amber-700 border-amber-300';
  };

  const getStatusLabel = (status) => {
    const s = String(status || '').toUpperCase();
    if (s === 'PENDIENTE') return 'ENTREGADO';
    return s;

        .withFailureHandler(() => {
          if (typeof showToast === 'function') showToast("Error al cargar el historial de constancias", "error");
          setSolicitudes([]);

      setTimeout(() => {
        setSolicitudes([

          { id_constancia: 'CON-k0zn4e', fecha_solicitud: '13/10/2026', estatus: 'Pendiente', requiere_desglose: true }

      return;
    }

    setIsSubmitting(true);

    const payload = {
      codigo: studentCode,
      nombre: studentName,
      correo: studentEmail,
      carrera: String(user.career || user.carrera || 'Ingeniería en Computación'),
      ciclo: String(user.cycle || user.ciclo || '2026-B'),
      creditos_avance: Number(user.credits || user.creditos_avance || 0),
      promedio: Number(user.gpa || user.promedio || 0),
      requiere_desglose: Boolean(requiereDesglose)
    };

    if (typeof google !== 'undefined' && google.script) {
      google.script.run
        .withSuccessHandler((res) => {
          setIsSubmitting(false);
          if (res && res.success) {
            const safeList = Array.isArray(solicitudes) ? solicitudes : [];
            setSolicitudes([res.constancia, ...safeList]);
            setRequiereDesglose(false);
            if (typeof showToast === 'function') {
              showToast(`Solicitud #${res.constancia.id_constancia} registrada exitosamente`);
            }
            if (typeof addNotification === 'function') {
              addNotification("Solicitud de Constancia", `Se registró tu solicitud con folio #${res.constancia.id_constancia}.`, "info");
            }
          } else {
            if (typeof showToast === 'function') showToast(res ? res.message : "Error al enviar la solicitud", "error");
          }
        })
        .withFailureHandler(() => {
          setIsSubmitting(false);
          if (typeof showToast === 'function') showToast("Error de conexión al registrar la constancia", "error");
        })
        .createConstanciaRequest(payload);
    } else {
      setTimeout(() => {
        setIsSubmitting(false);
        if (typeof showToast === 'function') showToast("Simulación: Solicitud de constancia enviada");
      }, 1000);
    }
  };

  const getStudentBadgeStyle = (status) => {
    const s = String(status || '').toUpperCase();
    if (s === 'TERMINADA') {
      return 'bg-emerald-100 text-emerald-800 border-emerald-300 dark:bg-emerald-950/60 dark:text-emerald-300 dark:border-emerald-800';
    }
    if (s === 'EN PROCESO') {
      return 'bg-blue-100 text-blue-800 border-blue-300 dark:bg-blue-950/60 dark:text-blue-300 dark:border-blue-800';
    }
    return 'bg-amber-50 text-amber-700 border-amber-300 dark:bg-amber-950/60 dark:text-amber-300 dark:border-amber-800';
  };

  const getStudentStatusText = (status) => {
    const s = String(status || '').toUpperCase();
    if (s === 'PENDIENTE') return 'EN REVISIÓN';
    return s;
  };

  const safeSolicitudes = Array.isArray(solicitudes) ? solicitudes : [];

  return (
    <div className="space-y-6 relative">
      {/* Overlay de bloqueo al enviar */}
      {isSubmitting && (
        <div className="fixed inset-0 z-[100] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 max-w-sm w-full shadow-2xl border border-slate-200 dark:border-slate-700 text-center space-y-3">
            <span className="flex items-center justify-center animate-spin">
              <i data-lucide="loader-2" className="w-8 h-8 text-udg-blue shrink-0"></i>
            </span>
            <h4 className="font-bold text-sm text-slate-900 dark:text-white font-display">Registrando Solicitud...</h4>
            <p className="text-xs text-slate-500">Generando folio oficial de constancia y enviando acuse a tu correo institucional.</p>
          </div>
        </div>
      )}

      {/* SECCIÓN 1: Formulario de Trámite de Constancias Oficiales */}
      <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 sm:p-8 border border-slate-200 dark:border-slate-700 shadow-sm space-y-6">
        <div className="border-b border-slate-100 dark:border-slate-700 pb-4 space-y-1.5">
          <h3 className="text-lg font-extrabold text-slate-900 dark:text-white flex items-center gap-2 font-display">
            <i data-lucide="file-text" className="w-5 h-5 text-udg-navy dark:text-blue-400 shrink-0"></i>
            <span>Trámite de Constancias Oficiales</span>
          </h3>
          <p className="text-xs text-slate-500 dark:text-slate-400 leading-relaxed">
            Una constancia es un documento oficial emitido por la Coordinación que certifica tu estatus como alumno activo en la carrera. Sirve como comprobante institucional para trámites de becas, servicio social, seguro médico o validación de créditos ante otras dependencias.
          </p>
        </div>

        <form onSubmit={handleSubmit} className="space-y-4 text-xs">
          {/* Dos recuadros Read-Only (Nombre y Código) */}
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div className="bg-slate-50/80 dark:bg-slate-900/70 p-4 rounded-xl border border-slate-200 dark:border-slate-700">
              <span className="block text-[10px] font-extrabold uppercase tracking-wider text-slate-400 mb-1">
                NOMBRE COMPLETO DEL SOLICITANTE
              </span>
              <p className="font-bold text-slate-900 dark:text-white text-sm">{studentName}</p>
            </div>

            <div className="bg-slate-50/80 dark:bg-slate-900/70 p-4 rounded-xl border border-slate-200 dark:border-slate-700">
              <span className="block text-[10px] font-extrabold uppercase tracking-wider text-slate-400 mb-1">
                CÓDIGO DE ESTUDIANTE
              </span>
              <p className="font-mono font-bold text-slate-900 dark:text-white text-sm">{studentCode}</p>
            </div>
          </div>

          {/* Checkbox Prominente */}
          <label className="flex items-center gap-3 p-4 rounded-xl bg-slate-50/60 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 cursor-pointer hover:border-udg-blue transition-colors select-none">
            <input
              type="checkbox"
              checked={requiereDesglose}
              onChange={(e) => setRequiereDesglose(e.target.checked)}
              disabled={isSubmitting}
              className="w-4 h-4 rounded border-slate-300 text-udg-navy focus:ring-udg-blue cursor-pointer"
            />
            <span className="font-bold text-slate-700 dark:text-slate-200 text-xs">
              El solicitante requiere desglose de periodo, promedio y créditos.
            </span>
          </label>

          {/* Botón Enviar Solicitud */}
          <div className="flex justify-end pt-2">
            <button
              type="submit"
              disabled={isSubmitting}
              className="bg-udg-navy hover:bg-udg-blue text-white font-bold px-6 py-3 rounded-xl flex items-center gap-2 shadow-md transition-all disabled:opacity-50"
            >
              <i data-lucide="send" className="w-4 h-4 shrink-0"></i>
              <span>Enviar Solicitud de Constancia</span>
            </button>
          </div>
        </form>
      </div>

      {/* SECCIÓN 2: Historial de Solicitudes del Alumno */}
      <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
        <h4 className="text-sm font-bold text-slate-900 dark:text-white flex items-center gap-2 font-display">
          <i data-lucide="history" className="w-4 h-4 text-udg-gold shrink-0"></i>
          <span>Historial de Solicitudes ({safeSolicitudes.length})</span>
        </h4>

        {isLoading ? (
          <div className="space-y-3">
            {[1, 2, 3].map(n => (
              <div key={n} className="p-5 rounded-2xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900/40 animate-pulse flex justify-between items-center">
                <div className="space-y-2">
                  <div className="h-4 bg-slate-200 dark:bg-slate-700 rounded w-40"></div>
                  <div className="h-3 bg-slate-200 dark:bg-slate-700 rounded w-48"></div>
                </div>
                <div className="h-6 bg-slate-200 dark:bg-slate-700 rounded-full w-24"></div>
              </div>
            ))}
          </div>
        ) : safeSolicitudes.length === 0 ? (
          <div className="py-10 text-center text-slate-400 text-xs">
            No has solicitado constancias oficiales hasta el momento.
          </div>
        ) : (
          <div className="space-y-3">
            {safeSolicitudes.map((item, idx) => (
              <div
                key={item.id_constancia || idx}
                className="p-4 sm:p-5 rounded-2xl bg-white dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 flex flex-col sm:flex-row sm:items-center justify-between gap-3 shadow-sm"
              >
                <div className="space-y-0.5">
                  <h5 className="font-bold text-slate-900 dark:text-white text-sm font-display">
                    Constancia de Estudios
                  </h5>
                  <p className="text-[11px] text-slate-500">
                    <span className="font-mono font-bold text-slate-700 dark:text-slate-300">#{item.id_constancia}</span>
                    {' • '}Solicitada: {item.fecha_solicitud}
                  </p>
                </div>

                <span className={`self-start sm:self-auto px-3 py-1 rounded-full text-[10px] font-extrabold border uppercase ${getStudentBadgeStyle(item.estatus)}`}>
                  {getStudentStatusText(item.estatus)}
                </span>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

// ============================================================================
// VISTA DEL COORDINADOR: AdminConstanciasModule (Emisión de Constancias)
// ============================================================================
function AdminConstanciasModule({ user, showToast, addNotification }) {
  const [items, setItems] = useState([]);
  const [isLoading, setIsLoading] = useState(true);

  // Estados de carga de acciones (Generar PDF / Entregar Físicamente)
  const [actionLoading, setActionLoading] = useState(false);
  const [actionLoadingText, setActionLoadingText] = useState('');

  // Búsqueda y Filtros ('Pendiente' seleccionado por defecto)
  const [filter, setFilter] = useState('Pendiente');
  const [search, setSearch] = useState('');

  // Paginación
  const [currentPage, setCurrentPage] = useState(1);
  const itemsPerPage = 10;

  // Índice del Modal Navegable
  const [modalIndex, setModalIndex] = useState(null);

  // Estados del Formulario de Llenado en el Modal
  const [folioVariable, setFolioVariable] = useState('');
  const [cicloEscolar, setCicloEscolar] = useState('2026-B');
  const [semestreLetras, setSemestreLetras] = useState('');
  const [carreraInput, setCarreraInput] = useState('Ingeniería en Computación');
  const [fechaInicioCiclo, setFechaInicioCiclo] = useState('');
  const [fechaFinCiclo, setFechaFinCiclo] = useState('');
  const [creditosTotales, setCreditosTotales] = useState(430);
  const [creditosConseguidos, setCreditosConseguidos] = useState('');
  const [promedioGeneral, setPromedioGeneral] = useState('');
  const [promedioAnterior, setPromedioAnterior] = useState('');

  useEffect(() => {
    if (window.lucide) {
      window.lucide.createIcons();
    }
  });

  const fetchAllConstancias = () => {
    setIsLoading(true);
    if (typeof google !== 'undefined' && google.script) {
      google.script.run
        .withSuccessHandler((data) => {
          setItems(Array.isArray(data) ? data : []);
          setIsLoading(false);
        })
        .withFailureHandler(() => {
          if (typeof showToast === 'function') showToast("Error al cargar el listado de constancias", "error");
          setItems([]);
          setIsLoading(false);
        })
        .getAllConstancias();
    } else {
      setTimeout(() => {
        setItems([
          {
            id_constancia: 'CON-nrjt8d',
            codigo_estudiante: '220470399',
            nombre_estudiante: 'Kevin Vazquez Delgado',
            correo_estudiante: 'kevin.vazquez7039@alumnos.udg.mx',
            carrera_estudiante: 'Ingeniería en Computación',
            ciclo_estudiante: '2026-B',
            promedio_estudiante: 90.5,
            creditos_estudiante: 200,
            requiere_desglose: true,
            estatus: 'Pendiente',
            fecha_solicitud: '13/10/2026',
            archivo_pdf_url: ''
          }
        ]);
        setIsLoading(false);
      }, 900);
    }
  };

  useEffect(() => {
    fetchAllConstancias();
  }, []);

  const safeItems = Array.isArray(items) ? items : [];

  const filteredItems = safeItems.filter(item => {
    const matchFilter = filter === 'Todos' || item.estatus === filter;
    const q = search.toLowerCase();
    const target = `${item.nombre_estudiante || ''} ${item.codigo_estudiante || ''} ${item.id_constancia || ''}`.toLowerCase();
    return matchFilter && target.includes(q);
  });

  const totalPages = Math.max(1, Math.ceil(filteredItems.length / itemsPerPage));
  const indexOfLast = currentPage * itemsPerPage;
  const indexOfFirst = indexOfLast - itemsPerPage;
  const currentItems = filteredItems.slice(indexOfFirst, indexOfLast);

  const activeModalItem = modalIndex !== null ? filteredItems[modalIndex] : null;

  // Sincronizar campos del formulario cada vez que el coordinador abre o navega a otra solicitud en el modal
  useEffect(() => {
    if (activeModalItem) {
      const saved = activeModalItem.datos_desglose || {};
      setFolioVariable(saved.folioVariable || '');
      setCicloEscolar(saved.cicloEscolar || activeModalItem.ciclo_estudiante || '2026-B');
      setSemestreLetras(saved.semestreLetras || '');
      setCarreraInput(saved.carrera || activeModalItem.carrera_estudiante || 'Ingeniería en Computación');
      setFechaInicioCiclo(saved.fechaInicio || '');
      setFechaFinCiclo(saved.fechaFin || '');
      setCreditosTotales(saved.creditosTotales !== undefined ? saved.creditosTotales : 430);
      setCreditosConseguidos(
        saved.creditosConseguidos !== undefined
          ? saved.creditosConseguidos
          : (activeModalItem.creditos_estudiante || '')
      );
      setPromedioGeneral(
        saved.promedioGeneral !== undefined
          ? saved.promedioGeneral
          : (activeModalItem.promedio_estudiante || '')
      );
      setPromedioAnterior(saved.promedioAnterior || '');
    }
  }, [modalIndex, filter]);

  // Cálculo automático en tiempo real de Créditos Restantes (Totales - Conseguidos)
  const numericTotales = Number(creditosTotales) || 0;
  const numericConseguidos = Number(creditosConseguidos) || 0;
  const creditosRestantes = Math.max(0, numericTotales - numericConseguidos);

  // Acción 1: Generar Constancia PDF ('Pendiente' -> 'En Proceso')
  const handleGenerateConstancia = () => {
    if (!activeModalItem) return;

    if (!folioVariable.trim() || !semestreLetras.trim() || !fechaInicioCiclo || !fechaFinCiclo) {
      showToast("Completa el Folio Variable, Semestre en Letras y las Fechas del Ciclo", "error");
      return;
    }

    if (activeModalItem.requiere_desglose) {
      if (creditosConseguidos === '' || promedioGeneral === '' || promedioAnterior === '') {
        showToast("Completa los campos de Créditos y Promedios requeridos para el desglose", "error");
        return;
      }
    }

    setActionLoading(true);
    setActionLoadingText('Generando Constancia Oficial en PDF y guardando en carpeta "Constancias" de Drive...');

    const formDetails = {
      folioVariable: folioVariable.trim(),
      cicloEscolar: cicloEscolar.trim(),
      semestreLetras: semestreLetras.trim(),
      carrera: carreraInput.trim(),
      fechaInicio: fechaInicioCiclo,
      fechaFin: fechaFinCiclo,
      creditosTotales: numericTotales,
      creditosConseguidos: numericConseguidos,
      creditosRestantes: creditosRestantes,
      promedioGeneral: String(promedioGeneral).trim(),
      promedioAnterior: String(promedioAnterior).trim()
    };

    const adminCode = user?.code || user?.codigo || 'COORD_INCO';

    if (typeof google !== 'undefined' && google.script) {
      google.script.run
        .withSuccessHandler((res) => {
          setActionLoading(false);
          if (res && res.success) {
            const targetId = activeModalItem.id_constancia;
            setItems(prev => prev.map(it =>
              it.id_constancia === targetId
                ? {
                    ...it,
                    estatus: 'En Proceso',
                    archivo_pdf_url: res.pdfUrl,
                    datos_desglose: formDetails,
                    fecha_emision: res.fechaEmision
                  }
                : it
            ));
            showToast(`Constancia #${targetId} generada correctamente`);
            if (res.pdfUrl) {
              window.open(res.pdfUrl, '_blank');
            }
          } else {
            showToast(res ? res.message : "Error al generar la constancia", "error");
          }
        })
        .withFailureHandler(() => {
          setActionLoading(false);
          showToast("Error de conexión con el servidor al crear el PDF", "error");
        })
        .generateConstanciaPDF(activeModalItem.id_constancia, formDetails, adminCode);
    } else {
      setTimeout(() => {
        setActionLoading(false);
        const targetId = activeModalItem.id_constancia;
        setItems(prev => prev.map(it =>
          it.id_constancia === targetId
            ? { ...it, estatus: 'En Proceso', archivo_pdf_url: '#pdf-constancia', datos_desglose: formDetails }
            : it
        ));
        showToast("Simulación: Constancia PDF generada");
      }, 1100);
    }
  };

  // Acción 2: Entregar Físicamente / Notificar al Alumno ('En Proceso' -> 'Terminada')
  const handleDeliverConstancia = () => {
    if (!activeModalItem) return;

    setActionLoading(true);
    setActionLoadingText('Marcando constancia como Terminada y enviando aviso de recolección al alumno...');
    const adminCode = user?.code || user?.codigo || 'COORD_INCO';

    if (typeof google !== 'undefined' && google.script) {
      google.script.run
        .withSuccessHandler((res) => {
          setActionLoading(false);
          if (res && res.success) {
            const targetId = activeModalItem.id_constancia;
            setItems(prev => prev.map(it =>
              it.id_constancia === targetId
                ? { ...it, estatus: 'Terminada', fecha_emision: res.fechaEmision }
                : it
            ));
            showToast(`Constancia #${targetId} marcada como Terminada y alumno notificado.`);
            if (typeof addNotification === 'function') {
              addNotification("Constancia Lista", `Se notificó al estudiante del folio #${targetId} para entrega física.`, "success");
            }
          } else {
            showToast(res ? res.message : "Error al actualizar estado", "error");
          }
        })
        .withFailureHandler(() => {
          setActionLoading(false);
          showToast("Error de conexión al notificar al estudiante", "error");
        })
        .finalizeConstanciaDelivery(activeModalItem.id_constancia, adminCode);
    } else {
      setTimeout(() => {
        setActionLoading(false);
        const targetId = activeModalItem.id_constancia;
        setItems(prev => prev.map(it =>
          it.id_constancia === targetId ? { ...it, estatus: 'Terminada' } : it
        ));
        showToast("Simulación: Constancia marcada como Terminada");
      }, 900);
    }
  };

  const getAdminBadgeStyle = (status) => {
    if (status === 'Terminada') return 'bg-emerald-100 text-emerald-800 border-emerald-300';
    if (status === 'En Proceso') return 'bg-blue-100 text-blue-800 border-blue-300';
    return 'bg-amber-100 text-amber-800 border-amber-300';
  };

  return (
    <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm space-y-5 text-xs relative">
      
      {/* Overlay de bloqueo para acciones pesadas del Coordinador */}
      {actionLoading && (
        <div className="fixed inset-0 z-[100] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 max-w-sm w-full shadow-2xl border border-slate-200 dark:border-slate-700 text-center space-y-3">
            <span className="flex items-center justify-center animate-spin">
              <i data-lucide="loader-2" className="w-8 h-8 text-udg-blue shrink-0"></i>
            </span>
            <h4 className="font-bold text-sm text-slate-900 dark:text-white font-display">Procesando Constancia...</h4>
            <p className="text-xs text-slate-500">{actionLoadingText}</p>
          </div>
        </div>
      )}

      {/* Encabezado */}
      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-100 dark:border-slate-700 pb-4">
        <div className="flex items-center gap-2.5">
          <i data-lucide="file-text" className="w-5 h-5 text-udg-gold shrink-0"></i>
          <h3 className="text-lg font-extrabold text-slate-900 dark:text-white font-display">
            Emisión de Constancias
          </h3>
        </div>

        <button
          type="button"
          onClick={fetchAllConstancias}
          disabled={isLoading}
          className="self-start sm:self-auto px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-slate-700 dark:text-slate-200 font-semibold flex items-center gap-1.5 disabled:opacity-50"
        >
          <span className={`flex items-center justify-center ${isLoading ? 'animate-spin' : ''}`}>
            <i data-lucide="refresh-cw" className="w-3.5 h-3.5 shrink-0"></i>
          </span>
          <span>Actualizar</span>
        </button>
      </div>

      {/* Buscador y Filtros */}
      <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-3">
        <div className="relative flex-1 max-w-sm">
          <i data-lucide="search" className="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 shrink-0"></i>
          <input
            type="text"
            placeholder="Buscar por nombre o código..."
            value={search}
            onChange={(e) => {
              setSearch(e.target.value);
              setCurrentPage(1);
              setModalIndex(null);
            }}
            className="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-xs focus:ring-2 focus:ring-udg-blue outline-none"
          />
        </div>

        <div className="flex flex-wrap items-center gap-1 bg-slate-100 dark:bg-slate-900 p-1 rounded-xl">
          {['Pendiente', 'En Proceso', 'Terminada', 'Todos'].map(tab => (
            <button
              key={tab}
              type="button"
              onClick={() => {
                setFilter(tab);
                setCurrentPage(1);
                setModalIndex(null);
              }}
              className={`px-3.5 py-1.5 rounded-lg font-bold transition-all ${
                filter === tab
                  ? 'bg-udg-navy text-white shadow-sm'
                  : 'text-slate-600 dark:text-slate-300 hover:bg-white/60'
              }`}
            >
              {tab}
            </button>
          ))}
        </div>
      </div>

      {/* Listado de Tarjetas con Skeleton Screen */}
      <div className="space-y-3 min-h-[300px]">
        {isLoading ? (
          <div className="space-y-3">
            {[1, 2, 3, 4].map(n => (
              <div
                key={n}
                className="p-5 rounded-2xl bg-white dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-4 animate-pulse"
              >
                <div className="space-y-2">
                  <div className="h-3.5 bg-slate-200 dark:bg-slate-700 rounded w-24"></div>
                  <div className="h-4 bg-slate-200 dark:bg-slate-700 rounded w-52"></div>
                  <div className="h-3 bg-slate-200 dark:bg-slate-700 rounded w-44"></div>
                </div>
                <div className="flex items-center gap-3">
                  <div className="h-6 bg-slate-200 dark:bg-slate-700 rounded-full w-20"></div>
                  <div className="h-9 bg-slate-200 dark:bg-slate-700 rounded-xl w-36"></div>
                </div>
              </div>
            ))}
          </div>
        ) : currentItems.length === 0 ? (
          <div className="py-12 text-center text-slate-400 space-y-2">
            <i data-lucide="inbox" className="w-8 h-8 mx-auto opacity-50 shrink-0"></i>
            <p>No se encontraron solicitudes de constancias en el filtro "{filter}".</p>

          {errorMsg && (
            <div className="p-3 rounded-xl bg-red-50 border border-red-200 text-red-700 font-semibold flex items-center gap-2 animate-in slide-in-from-top-2">
              <i data-lucide="alert-circle" className="w-4 h-4 shrink-0"></i>
              <span>{errorMsg}</span>
            </div>
          )}

          <form onSubmit={handleAuth} className="space-y-4">
            <div>
              <label className="block font-semibold text-slate-700 dark:text-slate-300 mb-1">Código UdG</label>
              <input
                type="text"
                placeholder="Ej: 219845123"
                value={code}
                onChange={(e) => setCode(e.target.value)}
                disabled={loading}
                className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-2.5 rounded-xl font-mono text-xs focus:ring-2 focus:ring-udg-blue outline-none disabled:opacity-50"
              />
            </div>

            <div>
              <label className="block font-semibold text-slate-700 dark:text-slate-300 mb-1">NIP SIIAU</label>
              <input
                type="password"
                placeholder="••••••••"
                value={nip}
                onChange={(e) => setNip(e.target.value)}
                disabled={loading}
                className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-2.5 rounded-xl font-mono text-xs focus:ring-2 focus:ring-udg-blue outline-none disabled:opacity-50"
              />
            </div>

            <button
              type="submit"
              disabled={loading}
              className="w-full bg-udg-navy hover:bg-udg-blue text-white font-bold py-3 rounded-xl transition-all shadow-md flex items-center justify-center gap-2 font-display disabled:opacity-70 mt-2"
            >
              {loading ? (
                <>
                  <i data-lucide="loader-2" className="w-4 h-4 animate-spin"></i>
                  <span>Autenticando...</span>
                </>
              ) : (
                <>
                  <i data-lucide="log-in" className="w-4 h-4 text-udg-gold"></i>
                  <span>Acceder al Portal</span>
                </>
              )}
            </button>
          </form>

          <div className="text-center pt-3 border-t border-slate-100 dark:border-slate-700 space-y-2">
            <p className="text-slate-500">¿Nuevo alumno o profesor en la coordinación?</p>
            <button
              type="button"
              onClick={onOpenRegister}
              disabled={loading}
              className="bg-udg-gold hover:bg-udg-goldHover text-white font-bold px-4 py-2.5 rounded-xl text-xs w-full transition-all font-display disabled:opacity-50"
            >
              Crear Nuevo Registro Seguro
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
