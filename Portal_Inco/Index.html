// VISTA DEL ALUMNO: TicketsModule

function TicketsModule({ user, showToast, addNotification }) {
  if (!user) return null;

  const [subject, setSubject] = useState('');
  const [details, setDetails] = useState('');
  const [tickets, setTickets] = useState([]);
  const [isLoading, setIsLoading] = useState(true);
  const [filter, setFilter] = useState('Todos');
  const [search, setSearch] = useState('');
  
  // Paginación
  const [currentPage, setCurrentPage] = useState(1);
  const ticketsPerPage = 5;
  
  // Carga inicial de tickets desde Google Sheets (solo los del usuario)
  useEffect(() => {
    setIsLoading(true);
    const studentId = String(user.codigo || user.code || user.id || '');
    
    if (typeof google !== 'undefined' && google.script) {
      google.script.run
        .withSuccessHandler((data) => {
          setTickets(Array.isArray(data) ? data : []);
          setIsLoading(false);
        })
        .withFailureHandler((err) => {
          showToast("Error al cargar el historial de tickets", "error");
          setIsLoading(false);
        })
        .getStudentTickets(studentId);
    } else {
      // Mock de carga para pruebas locales
      setTimeout(() => {
        setTickets([
          { id_ticket: 'INC-892', asunto: 'Duda con pre-dictamen', detalles: '...', estatus: 'Atendido', fecha_creacion: '24 Sep 2026', respuesta_coordinacion: 'Revisado.' }
        ]);
        setIsLoading(false);
      }, 1000);
    }
  }, [user]);

 const handleCreateTicket = (e) => {
    e.preventDefault();
    if (!subject.trim() || !details.trim()) {
      if (typeof showToast === 'function') showToast("Ingresa el asunto y los detalles del ticket", "error");
      return;
    }

    setIsLoading(true);
    
    // BLINDAJE: Mapeo seguro de las propiedades del usuario para evitar el fallo silencioso
    const safeCodigo = user.codigo || user.code || '';
    const safeNombre = user.nombre || user.name || 'Alumno';
    const safeEmail = user.correo || user.email || '';

    const ticketData = {
      codigo: safeCodigo,
      nombre: safeNombre,
      asunto: subject,
      detalles: details
    };

    if (typeof google !== 'undefined' && google.script) {
      google.script.run
        .withSuccessHandler((res) => {
          setIsLoading(false); // Apagamos el spinner garantizado
          
          if (res && res.success) {
            const safeTickets = Array.isArray(tickets) ? tickets : [];
            setTickets([res.ticket, ...safeTickets]);
            setSubject('');
            setDetails('');
            if (typeof showToast === 'function') showToast(`Ticket #${res.ticket.id_ticket} registrado correctamente.`);
            if (typeof addNotification === 'function') addNotification("Ticket Registrado", "Se envió confirmación a tu correo.", "ticket");
          } else {
            if (typeof showToast === 'function') showToast(res ? res.message : "Error del servidor", "error");
          }
        })
        .withFailureHandler((err) => {
          setIsLoading(false); // Apagamos el spinner si falla Google
          if (typeof showToast === 'function') showToast("Error de conexión al enviar el ticket.", "error");
          console.error("Error en GAS:", err);
        })
        .createTicket(ticketData, safeEmail); // Enviamos variables seguras
    } else {
      setTimeout(() => setIsLoading(false), 1000);
    }
  };

  // Filtrado, Búsqueda y Paginación
  const filteredTickets = (tickets || []).filter(t => {
    const matchFilter = filter === 'Todos' || t.estatus === filter;
    const matchSearch = t.asunto?.toLowerCase().includes(search.toLowerCase()) || 
                        t.detalles?.toLowerCase().includes(search.toLowerCase());
    return matchFilter && matchSearch;
  });

  const indexOfLast = currentPage * ticketsPerPage;
  const indexOfFirst = indexOfLast - ticketsPerPage;
  const currentTickets = filteredTickets.slice(indexOfFirst, indexOfLast);
  const totalPages = Math.ceil(filteredTickets.length / ticketsPerPage);

  // Componente Skeleton Interno
  const SkeletonCard = () => (
    <div className="p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 animate-pulse space-y-3">
      <div className="flex justify-between">
        <div className="h-4 bg-slate-200 dark:bg-slate-700 rounded w-1/4"></div>
        <div className="h-4 bg-slate-200 dark:bg-slate-700 rounded w-16"></div>
      </div>
      <div className="h-5 bg-slate-200 dark:bg-slate-700 rounded w-3/4"></div>
      <div className="h-3 bg-slate-200 dark:bg-slate-700 rounded w-1/2"></div>
    </div>
  );

  return (
    <div className="space-y-6">
      {/* SECCIÓN 1: Formulario */}
      <div className="glass-card rounded-2xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
        <div className="flex items-center gap-3 border-b border-slate-100 dark:border-slate-700 pb-4">
          <div className="w-10 h-10 rounded-xl bg-udg-light dark:bg-slate-700 text-udg-navy dark:text-blue-300 flex items-center justify-center font-bold">
            <i data-lucide="life-buoy" className="w-5 h-5"></i>
          </div>
          <div>
            <h3 className="text-lg font-bold text-slate-900 dark:text-white font-display">Mesa de Ayuda INCO</h3>
            <p className="text-xs text-slate-500 dark:text-slate-400">Levanta un ticket para reportar incidencias o solicitar apoyo.</p>
          </div>
        </div>

        <form onSubmit={handleCreateTicket} className="space-y-3 text-xs">
          <div>
            <label className="block font-semibold mb-1">Asunto de la Solicitud *</label>
            <input 
              type="text" 
              placeholder="Ej: Empalme de materias, Error en SIIAU..." 
              value={subject} 
              onChange={(e) => setSubject(e.target.value)} 
              disabled={isLoading}
              className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-3 rounded-xl focus:ring-2 focus:ring-udg-blue outline-none disabled:opacity-50" 
            />
          </div>
          <div>
            <label className="block font-semibold mb-1">Descripción Detallada *</label>
            <textarea 
              rows="3" 
              placeholder="Describe el problema incluyendo NRCs, nombres de profesores, etc." 
              value={details} 
              onChange={(e) => setDetails(e.target.value)} 
              disabled={isLoading}
              className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-3 rounded-xl focus:ring-2 focus:ring-udg-blue outline-none disabled:opacity-50"
            ></textarea>
          </div>
          <div className="flex justify-end pt-1">
            <button type="submit" disabled={isLoading} className="bg-udg-navy hover:bg-udg-blue text-white font-bold px-6 py-2.5 rounded-xl flex items-center gap-2 shadow-md transition-all disabled:opacity-50">
              {isLoading ? <i data-lucide="loader-2" className="w-4 h-4 animate-spin"></i> : <i data-lucide="send" className="w-4 h-4"></i>}
              <span>Enviar Ticket de Atención</span>
            </button>
          </div>
        </form>
      </div>

      {/* SECCIÓN 2: Historial y Búsqueda */}
      <div className="glass-card rounded-2xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
        <div className="flex flex-col md:flex-row md:items-center justify-between gap-3 border-b border-slate-100 dark:border-slate-700 pb-3">
          <h4 className="text-sm font-bold flex items-center gap-2 font-display">
            <i data-lucide="history" className="w-4 h-4 text-udg-gold"></i>
            Mis Tickets Solicitados
          </h4>
          
          <div className="flex flex-col sm:flex-row gap-2">
            <div className="relative">
              <i data-lucide="search" className="absolute left-2.5 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-slate-400"></i>
              <input 
                type="text" 
                placeholder="Buscar ticket..." 
                value={search}
                onChange={(e) => { setSearch(e.target.value); setCurrentPage(1); }}
                className="pl-8 pr-3 py-1.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-xs outline-none focus:ring-1 focus:ring-udg-blue"
              />
            </div>

function AdminPanelTickets({ showToast, addNotification }) {
  const [tickets, setTickets] = useState([]);
  const [isLoading, setIsLoading] = useState(true);
  const [filter, setFilter] = useState('Pendiente'); // Por defecto ver lo que falta
  const [search, setSearch] = useState('');
  const [replyTexts, setReplyTexts] = useState({});
  const [replyingId, setReplyingId] = useState(null); // Estado de carga por ticket
  
  // Paginación Admin
  const [currentPage, setCurrentPage] = useState(1);
  const ticketsPerPage = 10;

  // Cargar TODO el universo de tickets
  const fetchTickets = () => {
    setIsLoading(true);
    if (typeof google !== 'undefined' && google.script) {
      google.script.run
        .withSuccessHandler((data) => {
          setTickets(data);
          setIsLoading(false);
        })
        .withFailureHandler(() => {
          showToast("Error al cargar lista global de tickets", "error");
          setIsLoading(false);
        })
        .getAllTickets();
    } else {
      setTimeout(() => setIsLoading(false), 1000);
    }
  };

  useEffect(() => { fetchTickets(); }, []);

  const handleReply = (ticketId, studentEmail, studentName) => {
    const text = replyTexts[ticketId];
    if (!text || !text.trim()) {
      showToast("La respuesta no puede estar vacía", "error");
      return;
    }

    setReplyingId(ticketId);

    if (typeof google !== 'undefined' && google.script) {
      google.script.run
        .withSuccessHandler((res) => {
          setReplyingId(null);
          if (res.success) {
            // Actualizar estado local
            setTickets(tickets.map(t => 
              t.id_ticket === ticketId ? { ...t, estatus: 'Atendido', respuesta_coordinacion: text } : t
            ));
            
            const newReplyTexts = {...replyTexts};
            delete newReplyTexts[ticketId];
            setReplyTexts(newReplyTexts);
            
            showToast(`Ticket #${ticketId} cerrado y notificado al alumno.`);
          } else {
            showToast(res.message, "error");
          }
        })
        .withFailureHandler(() => {
          setReplyingId(null);
          showToast("Error de conexión al enviar respuesta.", "error");
        })
        .replyToTicket(ticketId, text, studentEmail, studentName);
    } else {
      setTimeout(() => setReplyingId(null), 1000);
    }
  };

  const filteredTickets = (tickets || []).filter(t => {
    const matchFilter = filter === 'Todos' || t.estatus === filter;
    const searchString = `${t.asunto} ${t.detalles} ${t.nombre_estudiante} ${t.codigo_estudiante} ${t.id_ticket}`.toLowerCase();
    const matchSearch = searchString.includes(search.toLowerCase());
    return matchFilter && matchSearch;
  });

  const indexOfLast = currentPage * ticketsPerPage;
  const indexOfFirst = indexOfLast - ticketsPerPage;
  const currentTickets = filteredTickets.slice(indexOfFirst, indexOfLast);
  const totalPages = Math.ceil(filteredTickets.length / ticketsPerPage);

  // Skeleton Admin
  const SkeletonAdminCard = () => (
    <div className="p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/40 animate-pulse space-y-3">
      <div className="flex justify-between"><div className="h-4 bg-slate-200 dark:bg-slate-700 rounded w-1/3"></div><div className="h-4 bg-slate-200 dark:bg-slate-700 rounded w-16"></div></div>
      <div className="h-3 bg-slate-200 dark:bg-slate-700 rounded w-1/4"></div>
      <div className="h-10 bg-slate-200 dark:bg-slate-700 rounded w-full mt-2"></div>
    </div>
  );

  return (
    <div className="glass-card rounded-2xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm space-y-5 text-xs">
      
      <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-100 dark:border-slate-700 pb-4">
        <div className="flex items-center gap-3">
          <div className="w-10 h-10 rounded-xl bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-400 flex items-center justify-center font-bold">
            <i data-lucide="shield-check" className="w-5 h-5"></i>
          </div>
          <div>
            <h3 className="text-lg font-bold text-slate-900 dark:text-white font-display">Administración Global de Tickets</h3>
            <p className="text-slate-500">Buzón central de incidencias estudiantiles.</p>
          </div>
        </div>

        <div className="flex flex-col sm:flex-row gap-2">
          <div className="relative">
            <i data-lucide="search" className="absolute left-2.5 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-slate-400"></i>
            <input 
              type="text" 
              placeholder="Buscar folio, código o texto..." 
              value={search}
              onChange={(e) => { setSearch(e.target.value); setCurrentPage(1); }}
              className="pl-8 pr-3 py-1.5 w-full sm:w-48 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-xs outline-none focus:ring-1 focus:ring-udg-blue"
            />
          </div>
          <div className="flex bg-slate-100 dark:bg-slate-800 p-1 rounded-lg font-semibold shrink-0">
            {['Pendiente', 'Atendido', 'Todos'].map(f => (
              <button 
                key={f} onClick={() => { setFilter(f); setCurrentPage(1); }}
                className={`px-3 py-1 rounded-md transition-colors ${filter === f ? 'bg-white dark:bg-slate-700 shadow-sm text-udg-navy dark:text-white' : 'text-slate-500 hover:text-slate-700'}`}
              >
                {f}
              </button>
            ))}
          </div>
          <button onClick={fetchTickets} disabled={isLoading} className="bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 p-1.5 rounded-lg border border-slate-200 dark:border-slate-600 transition-colors">
            <i data-lucide="refresh-cw" className={`w-4 h-4 text-slate-600 dark:text-slate-300 ${isLoading ? 'animate-spin' : ''}`}></i>
          </button>
        </div>
      </div>

      <div className="space-y-4 min-h-[400px]">
        {isLoading ? (
          <><SkeletonAdminCard /><SkeletonAdminCard /><SkeletonAdminCard /></>
        ) : currentTickets.length === 0 ? (
           <div className="py-12 text-center text-slate-400"><i data-lucide="check-circle" className="w-10 h-10 mx-auto mb-2 opacity-50 text-emerald-500"></i><p>Bandeja limpia. No hay tickets en esta categoría.</p></div>
        ) : (
          currentTickets.map(t => (
            <div key={t.id_ticket} className="p-4 rounded-xl bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-700 space-y-3">
              <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-2 border-b border-slate-200 dark:border-slate-700/50 pb-2">
                <div>
                  <div className="flex items-center gap-2 mb-0.5">
                    <span className="font-mono font-bold text-udg-navy dark:text-blue-400 text-sm">#{t.id_ticket}</span>
                    <span className={`px-2 py-0.5 rounded text-[9px] font-black uppercase ${
                      t.estatus === 'Atendido' ? 'bg-emerald-200 text-emerald-900' : 'bg-red-200 text-red-900 animate-pulse'
                    }`}>
                      {t.estatus}
                    </span>
                  </div>
                  <h4 className="font-bold text-slate-900 dark:text-white text-sm">{t.asunto}</h4>
                </div>
                <div className="text-right">
                  <p className="font-bold text-slate-700 dark:text-slate-200">{t.nombre_estudiante}</p>
                  <p className="text-[10px] text-slate-500 font-mono">Cód: {t.codigo_estudiante} • {t.fecha_creacion}</p>
                </div>
              </div>

              <div className="bg-white dark:bg-slate-800 p-3 rounded-lg border border-slate-100 dark:border-slate-700 text-slate-600 dark:text-slate-300">
                <span className="font-bold text-slate-400 block mb-1">Descripción reportada:</span>
                {t.detalles}
              </div>

              {t.estatus === 'Atendido' ? (
                <div className="p-3 bg-emerald-50 dark:bg-emerald-950/30 rounded-lg border border-emerald-200 dark:border-emerald-800">
                  <p className="font-bold text-emerald-800 dark:text-emerald-400 flex items-center gap-1 mb-1">
                    <i data-lucide="check-check" className="w-3.5 h-3.5"></i> Respuesta enviada:
                  </p>
                  <p className="text-slate-700 dark:text-slate-200 whitespace-pre-wrap">{t.respuesta_coordinacion}</p>
                </div>
              ) : (
                <div className="space-y-2 pt-1">
                  <textarea 
                    rows="3"
                    placeholder="Redacta la respuesta oficial para notificar al alumno..."
                    value={replyTexts[t.id_ticket] || ''}
                    onChange={(e) => setReplyTexts({ ...replyTexts, [t.id_ticket]: e.target.value })}
                    disabled={replyingId === t.id_ticket}
                    className="w-full bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-xl p-3 text-xs focus:ring-2 focus:ring-udg-blue outline-none disabled:opacity-50"
                  ></textarea>
                  <div className="flex justify-end">
                    <button 
                      onClick={() => handleReply(t.id_ticket, t.correo_estudiante || '', t.nombre_estudiante)}
                      disabled={replyingId === t.id_ticket}
                      className="bg-udg-navy hover:bg-udg-blue text-white font-bold px-5 py-2 rounded-xl flex items-center gap-2 shadow-md transition-all disabled:opacity-50"
                    >
                      {replyingId === t.id_ticket ? <i data-lucide="loader-2" className="w-3.5 h-3.5 animate-spin"></i> : <i data-lucide="send-checked" className="w-3.5 h-3.5"></i>}
                      <span>Dictaminar y Cerrar Ticket</span>
                    </button>
                  </div>
                </div>
              )}
            </div>
          ))
        )}
      </div>

      {/* Controles Paginación Admin */}
      {!isLoading && totalPages > 1 && (
        <div className="flex justify-between items-center pt-2 border-t border-slate-100 dark:border-slate-700">
          <span className="text-[10px] text-slate-400 font-semibold">Mostrando {indexOfFirst + 1} - {Math.min(indexOfLast, filteredTickets.length)} de {filteredTickets.length} tickets (Pág {currentPage}/{totalPages})</span>
          <div className="flex gap-1.5">
            <button onClick={() => setCurrentPage(prev => Math.max(prev - 1, 1))} disabled={currentPage === 1} className="p-1.5 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 disabled:opacity-30">
              <i data-lucide="chevron-left" className="w-4 h-4"></i>
            </button>
            <button onClick={() => setCurrentPage(prev => Math.min(prev + 1, totalPages))} disabled={currentPage === totalPages} className="p-1.5 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 disabled:opacity-30">
              <i data-lucide="chevron-right" className="w-4 h-4"></i>
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

function AdminJustificantesModule({ user, showToast, addNotification }) {
  const [items, setItems] = useState([]);
  const [isLoading, setIsLoading] = useState(true);
  
  // Estados para el Overlay de Carga del Admin
  const [actionLoadingId, setActionLoadingId] = useState(null);
  const [actionLoadingMsg, setActionLoadingMsg] = useState('');

  const [filter, setFilter] = useState('Pendiente');
  const [search, setSearch] = useState('');
  const [currentPage, setCurrentPage] = useState(1);
  const [itemsPerPage, setItemsPerPage] = useState(10);
  const [selectedModalIndex, setSelectedModalIndex] = useState(null);

  // Garantizar renderizado de íconos en cada actualización de estado
  useEffect(() => {
    if (window.lucide) {
      window.lucide.createIcons();
    }
  });

  const fetchAllJustificantes = () => {
    setIsLoading(true);
    if (typeof google !== 'undefined' && google.script) {
      google.script.run
        .withSuccessHandler((data) => {
          setItems(Array.isArray(data) ? data : []);
          setIsLoading(false);
        })
        .withFailureHandler(() => {
          if (typeof showToast === 'function') showToast("Error al cargar las solicitudes", "error");
          setItems([]);
          setIsLoading(false);
        })
        .getAllJustificantes();
    } else {
      setTimeout(() => {
        setItems([]);
        setIsLoading(false);
      }, 1000);
    }
  };

  useEffect(() => {
    fetchAllJustificantes();
  }, []);

  const safeItems = Array.isArray(items) ? items : [];

  const countPendientes = safeItems.filter(i => i.estatus === 'Pendiente').length;
  const countEnProceso = safeItems.filter(i => i.estatus === 'En Proceso').length;
  const countFinalizadas = safeItems.filter(i => i.estatus === 'Finalizada').length;

  const filteredItems = safeItems.filter(item => {
    const matchFilter = filter === 'Todos' || item.estatus === filter;
    const query = search.toLowerCase();
    const textTarget = `${item.nombre_estudiante || ''} ${item.codigo_estudiante || ''} ${item.id_justificante || ''} ${item.motivo || ''}`.toLowerCase();
    return matchFilter && textTarget.includes(query);
  });

  const totalPages = Math.max(1, Math.ceil(filteredItems.length / itemsPerPage));
  const indexOfLast = currentPage * itemsPerPage;
  const indexOfFirst = indexOfLast - itemsPerPage;
  const currentItems = filteredItems.slice(indexOfFirst, indexOfLast);

  // Generar PDF Oficial y abrir en nueva pestaña automáticamente
  const handleGeneratePDF = (idJustificante) => {
    setActionLoadingId(idJustificante);
    setActionLoadingMsg('Generando dictamen oficial en PDF. Esto puede tomar unos segundos...');
    const adminCode = user?.code || user?.codigo || 'COORD_INCO';

    if (typeof google !== 'undefined' && google.script) {
      google.script.run
        .withSuccessHandler((res) => {
          setActionLoadingId(null);
          if (res && res.success) {
            setItems(prev => prev.map(item =>
              item.id_justificante === idJustificante
                ? { ...item, estatus: 'En Proceso', pdf_oficial_url: res.pdfUrl, fecha_revision: res.fechaRevision }
                : item
            ));
            if (typeof showToast === 'function') showToast(`Dictamen PDF generado para #${idJustificante}`);
            
            // ABRIR EL PDF AUTOMÁTICAMENTE
            window.open(res.pdfUrl, '_blank');
          } else {
            if (typeof showToast === 'function') showToast(res ? res.message : "Error al generar PDF", "error");
          }
        })
        .withFailureHandler(() => {
          setActionLoadingId(null);
          if (typeof showToast === 'function') showToast("Error de conexión al generar el PDF", "error");
        })
        .generateJustificantePDF(idJustificante, adminCode);
    } else {
      setTimeout(() => {
        setActionLoadingId(null);
        showToast("Simulación: PDF generado");
      }, 1200);
    }
  };

  const handleFinalizeAndNotify = (idJustificante) => {
    setActionLoadingId(idJustificante);
    setActionLoadingMsg('Enviando notificación por correo al alumno...');
    const adminCode = user?.code || user?.codigo || 'COORD_INCO';

    if (typeof google !== 'undefined' && google.script) {
      google.script.run
        .withSuccessHandler((res) => {
          setActionLoadingId(null);
          if (res && res.success) {
            setItems(prev => prev.map(item =>
              item.id_justificante === idJustificante
                ? { ...item, estatus: 'Finalizada', fecha_revision: res.fechaRevision }
                : item
            ));
            if (typeof showToast === 'function') showToast(`Alumno notificado por correo.`);
          } else {
            if (typeof showToast === 'function') showToast(res ? res.message : "Error al notificar", "error");
          }
        })
        .withFailureHandler(() => {
          setActionLoadingId(null);
          if (typeof showToast === 'function') showToast("Error de conexión al notificar", "error");
        })
        .finalizeJustificante(idJustificante, adminCode);
    } else {
      setTimeout(() => {
        setActionLoadingId(null);
        showToast("Simulación: Alumno notificado");
      }, 1000);
    }
  };

  const getBadgeStyle = (status) => {
    if (status === 'Finalizada') return 'bg-emerald-100 text-emerald-800 border-emerald-300';
    if (status === 'En Proceso') return 'bg-blue-100 text-blue-800 border-blue-300';
    return 'bg-amber-50 text-amber-700 border-amber-300';
  };

  const activeModalItem = selectedModalIndex !== null ? filteredItems[selectedModalIndex] : null;

  return (
    <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm space-y-5 text-xs relative">
      
      {/* OVERLAY DE BLOQUEO PARA EL ADMIN */}
      {actionLoadingId && (
        <div className="fixed inset-0 z-[100] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 max-w-sm w-full shadow-2xl border border-slate-200 dark:border-slate-700 text-center space-y-3">
            <i data-lucide="loader-2" className="w-8 h-8 text-udg-blue animate-spin mx-auto shrink-0"></i>
            <h4 className="font-bold text-sm text-slate-900 dark:text-white font-display">Procesando solicitud...</h4>
            <p className="text-xs text-slate-500">{actionLoadingMsg}</p>
          </div>
        </div>
      )}

      {/* Encabezado */}
      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-100 dark:border-slate-700 pb-4">
        <div>
          <h3 className="text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2 font-display">
            <i data-lucide="shield-check" className="w-5 h-5 text-udg-gold shrink-0"></i>
            Procesamiento de Justificantes
          </h3>
          <p className="text-slate-500 text-xs mt-0.5">Revisa, autoriza, genera los PDFs oficiales y notifica a los alumnos.</p>
        </div>
        
        {/* BOTÓN ACTUALIZAR CON SPINNER BLINDADO */}
        <button type="button" onClick={fetchAllJustificantes} disabled={isLoading} className="self-start sm:self-auto px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-slate-700 dark:text-slate-200 font-semibold flex items-center gap-1.5 disabled:opacity-50">
          <span className={`flex items-center justify-center ${isLoading ? 'animate-spin' : ''}`}>
            <i data-lucide="refresh-cw" className="w-3.5 h-3.5 shrink-0"></i>
          </span>
          <span>Actualizar</span>
        </button>
      </div>

      {/* Filtros */}
      <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-3">
        <div className="relative flex-1 max-w-md">
          <i data-lucide="search" className="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 shrink-0"></i>
          <input type="text" placeholder="Buscar alumno por nombre o código..." value={search} onChange={(e) => { setSearch(e.target.value); setCurrentPage(1); setSelectedModalIndex(null); }} className="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-xs focus:ring-2 focus:ring-udg-blue outline-none" />

    } else {
      setTimeout(() => {
        setJustificantes([]);
        setIsLoading(false);
      }, 1000);
    }
  };

  useEffect(() => {
    fetchMyJustificantes();
  }, [studentCode]);

  const filteredCatalog = CATALOGO_MATERIAS_INCO.filter(mat => 
    mat.toLowerCase().includes(subjectQuery.toLowerCase()) &&
    !selectedSubjects.some(s => s.name === mat)
  );

  const handleAddSubject = (subjectName) => {
    setSelectedSubjects(prev => [...prev, { name: subjectName, nrc: '' }]);
    setSubjectQuery('');
    setShowSuggestions(false);
  };

  const handleRemoveSubject = (subjectName) => {
    setSelectedSubjects(prev => prev.filter(s => s.name !== subjectName));
  };

  const handleNrcChange = (subjectName, value) => {
    const numericVal = value.replace(/\D/g, '').slice(0, 6);
    setSelectedSubjects(prev => prev.map(s => s.name === subjectName ? { ...s, nrc: numericVal } : s));
  };

  const handleFileChange = (e) => {
    const file = e.target.files[0];
    if (!file) {
      setEvidenceFile(null);
      return;
    }
    if (file.size > 8 * 1024 * 1024) {
      showToast("El archivo no debe superar los 8 MB", "error");
      e.target.value = '';
      return;
    }
    const reader = new FileReader();
    reader.onloadend = () => {
      const base64String = reader.result.split(',')[1];
      setEvidenceFile({
        name: file.name,
        mimeType: file.type || 'application/pdf',
        base64: base64String
      });
    };
    reader.readAsDataURL(file);
  };

  const formatDateDisplay = (isoDate) => {
    if (!isoDate) return '';
    const parts = isoDate.split('-');
    if (parts.length !== 3) return isoDate;
    return `${parts[2]}/${parts[1]}/${parts[0]}`;
  };

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!isLoggedIn) {
      setActiveModal('login');
      return;
    }

    if (!phone.trim()) { showToast("Ingresa tu teléfono", "error"); return; }
    const finalReason = reason === 'Otro' ? customReason.trim() : reason;
    if (!finalReason) { showToast("Especifica el motivo", "error"); return; }
    if (!startDate || !endDate) { showToast("Selecciona las fechas", "error"); return; }
    if (new Date(startDate) > new Date(endDate)) { showToast("Fechas inválidas", "error"); return; }
    if (selectedSubjects.length === 0) { showToast("Agrega una asignatura", "error"); return; }
    
    const invalidNrc = selectedSubjects.find(s => !/^\d{6}$/.test(s.nrc));
    if (invalidNrc) { showToast(`NRC inválido en ${invalidNrc.name}`, "error"); return; }
    if (!evidenceFile) { showToast("Adjunta evidencia digital", "error"); return; }

    setIsSubmitting(true);

    const formattedSubjects = selectedSubjects.map(s => `${s.name} (NRC: ${s.nrc})`).join(', ');
    const periodoFormatted = `Del ${formatDateDisplay(startDate)} al ${formatDateDisplay(endDate)}`;

    const payload = {
      codigo: studentCode,
      nombre: studentName,
      correo: studentEmail,
      telefono: phone.trim(),
      motivo: finalReason,
      materias: formattedSubjects,
      fecha_incapacidad: periodoFormatted,
      fileData: evidenceFile
    };

    if (typeof google !== 'undefined' && google.script) {
      google.script.run
        .withSuccessHandler((res) => {
          setIsSubmitting(false);
          if (res && res.success) {
            const currentList = Array.isArray(justificantes) ? justificantes : [];
            setJustificantes([res.justificante, ...currentList]);
            setStartDate(''); setEndDate(''); setCustomReason(''); setReason('Enfermedad');
            setSelectedSubjects([]); setEvidenceFile(null);
            showToast(`Solicitud #${res.justificante.id_justificante} enviada con éxito`);
          } else {
            showToast(res ? res.message : "Error al procesar", "error");
          }
        })
        .withFailureHandler(() => {
          setIsSubmitting(false);
          showToast("Error de conexión", "error");
        })
        .createJustificante(payload);
    } else {
      setTimeout(() => { setIsSubmitting(false); showToast("Simulación: Enviado"); }, 1200);
    }
  };

  const getBadgeStyle = (status) => {
    const s = String(status || '').toUpperCase();
    if (s === 'FINALIZADA' || s === 'APROBADO') return 'bg-emerald-100 text-emerald-800 border-emerald-300';
    if (s === 'EN PROCESO' || s === 'PDF GENERADO') return 'bg-blue-100 text-blue-800 border-blue-300';
    return 'bg-amber-50 text-amber-700 border-amber-300';
  };

  const getStatusLabel = (status) => {
    const s = String(status || '').toUpperCase();
    if (s === 'PENDIENTE') return 'ENTREGADO';
    return s;
  };

  const safeJustificantes = Array.isArray(justificantes) ? justificantes : [];
  const activeDetailItem = detailIndex !== null ? safeJustificantes[detailIndex] : null;

  return (
    <div className="space-y-6 relative">
      {/* OVERLAY DE CARGA PARA ALUMNOS */}
      {isSubmitting && (
        <div className="fixed inset-0 z-[100] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 max-w-sm w-full shadow-2xl border border-slate-200 dark:border-slate-700 text-center space-y-3">
            <i data-lucide="loader-2" className="w-8 h-8 text-udg-blue animate-spin mx-auto shrink-0"></i>
            <h4 className="font-bold text-sm text-slate-900 dark:text-white font-display">Protegiendo y subiendo evidencia...</h4>
            <p className="text-xs text-slate-500">Almacenando documento confidencial en Google Drive y registrando folio institucional.</p>
          </div>
        </div>
      )}

      {/* Formulario y Reglas */}
      <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 sm:p-8 border border-slate-200 dark:border-slate-700 shadow-sm space-y-6">
        <div className="text-center border-b border-slate-100 dark:border-slate-700 pb-5 space-y-2">
          <h3 className="text-lg sm:text-xl font-extrabold text-udg-navy dark:text-white font-display">Solicitud de Justificante</h3>
          <p className="text-[10px] font-extrabold uppercase tracking-widest text-slate-400">COORDINACIÓN DE INGENIERÍA EN COMPUTACIÓN</p>
          <p className="text-[11px] font-extrabold text-udg-gold pt-2">IMPORTANTE LEER LO ESTABLECIDO PARA LLENAR CORRECTAMENTE EL FORMULARIO.</p>
          <div className="text-[11px] text-slate-600 dark:text-slate-300 text-justify leading-relaxed space-y-2 pt-2 bg-slate-50/70 dark:bg-slate-900/50 p-4 rounded-xl border border-slate-200/70 dark:border-slate-700">
            <p><strong className="text-slate-900 dark:text-white">Artículo 53.</strong> Los alumnos podrán justificar su falta de asistencia a clases por alguna de las siguientes causas: I. Por enfermedad; II. Por el cumplimiento de una comisión conferida por autoridad universitaria... III. Por causa de fuerza mayor justificada que impida al alumno asistir.</p>
            <p><strong className="text-slate-900 dark:text-white">Artículo 54.</strong> El alumno deberá justificar las faltas de asistencia con el documento idóneo, al Coordinador de Carrera... dentro de los cinco días hábiles siguientes a la fecha en que haya podido reanudar sus estudios.</p>
          </div>
        </div>

        <form onSubmit={handleSubmit} className="space-y-5 text-xs">
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4 items-center">
            <div className="bg-slate-50 dark:bg-slate-900/70 p-4 rounded-xl border border-slate-200 dark:border-slate-700">
              <span className="block text-[10px] font-extrabold uppercase text-slate-400 mb-1">DATOS DEL ALUMNO (AUTO-LLENADO)</span>
              <p className="font-bold text-slate-900 dark:text-white text-sm">{studentName} <span className="text-udg-blue dark:text-blue-400 font-mono">({studentCode})</span></p>
              <p className="text-slate-500 text-[11px] mt-0.5">{studentEmail}</p>
            </div>
            <div>
              <label className="block font-bold text-slate-700 dark:text-slate-300 mb-1.5">Teléfono Móvil *</label>
              <input type="tel" placeholder="Ej: 33 1425 8990" value={phone} onChange={(e) => setPhone(e.target.value)} disabled={isSubmitting} className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-3 rounded-xl font-mono text-xs focus:ring-2 focus:ring-udg-blue outline-none" />
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
              <label className="block font-bold text-slate-700 dark:text-slate-300 mb-1.5">Motivo del Justificante *</label>
              <select value={reason} onChange={(e) => setReason(e.target.value)} disabled={isSubmitting} className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-3 rounded-xl text-xs focus:ring-2 focus:ring-udg-blue outline-none">
                <option value="Enfermedad">Enfermedad (Requiere receta o IMSS)</option>
                <option value="Comisión Institucional">Comisión Institucional UDG / CUCEI</option>
                <option value="Fuerza Mayor">Causa de Fuerza Mayor / Asunto Legal</option>
                <option value="Otro">Otro (Especificar motivo)</option>
              </select>
            </div>
            <div>
              <label className="block font-bold text-slate-700 dark:text-slate-300 mb-1.5">Fecha Inicio *</label>
              <input type="date" value={startDate} onChange={(e) => setStartDate(e.target.value)} disabled={isSubmitting} className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-3 rounded-xl text-xs focus:ring-2 focus:ring-udg-blue outline-none" />
            </div>
            <div>
              <label className="block font-bold text-slate-700 dark:text-slate-300 mb-1.5">Fecha Fin *</label>
              <input type="date" value={endDate} onChange={(e) => setEndDate(e.target.value)} disabled={isSubmitting} className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-3 rounded-xl text-xs focus:ring-2 focus:ring-udg-blue outline-none" />
            </div>
          </div>

          {reason === 'Otro' && (
            <div className="animate-in fade-in">
              <label className="block font-bold text-slate-700 dark:text-slate-300 mb-1.5">Especifica el Motivo *</label>
              <input type="text" placeholder="Describe brevemente la causa de fuerza mayor..." value={customReason} onChange={(e) => setCustomReason(e.target.value)} disabled={isSubmitting} className="w-full bg-amber-50/40 dark:bg-slate-900 border border-amber-300 dark:border-slate-700 p-3 rounded-xl text-xs focus:ring-2 focus:ring-udg-gold outline-none" />
            </div>
          )}

          <div className="bg-slate-50/70 dark:bg-slate-900/50 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 space-y-3">
            <label className="block font-bold text-slate-800 dark:text-slate-200">Asignaturas Afectadas (NRC Obligatorio) *</label>
            <div className="relative">
              <input type="text" placeholder="Escribe para buscar tu materia..." value={subjectQuery} onFocus={() => setShowSuggestions(true)} onChange={(e) => { setSubjectQuery(e.target.value); setShowSuggestions(true); }} disabled={isSubmitting} className="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-3 rounded-xl text-xs focus:ring-2 focus:ring-udg-blue outline-none" />
              {showSuggestions && subjectQuery.trim().length > 0 && (
                <div className="absolute z-30 left-0 right-0 mt-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-xl max-h-48 overflow-y-auto divide-y divide-slate-100 dark:divide-slate-700">
                  {filteredCatalog.length === 0 ? (
                    <div className="p-3 text-slate-400 flex justify-between items-center">
                      <span>No encontrada en catálogo.</span>
                      <button type="button" onClick={() => handleAddSubject(subjectQuery.trim())} className="text-udg-blue dark:text-blue-400 font-bold hover:underline">+ Añadir "{subjectQuery.trim()}"</button>
                    </div>
                  ) : (
                    filteredCatalog.map((mat, idx) => (
                      <button type="button" key={idx} onClick={() => handleAddSubject(mat)} className="w-full text-left px-4 py-2.5 hover:bg-blue-50 dark:hover:bg-slate-700/60 font-medium text-slate-700 dark:text-slate-200 flex justify-between items-center">
                        <span>{mat}</span><span className="text-[10px] font-bold text-udg-blue dark:text-blue-400">+ Seleccionar</span>
                      </button>
                    ))
                  )}
                </div>
              )}
            </div>

            {selectedSubjects.length > 0 && (
              <div className="space-y-2 pt-2">
                {selectedSubjects.map((item) => {
                  const isValidNrc = /^\d{6}$/.test(item.nrc);
                  return (
                    <div key={item.name} className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 bg-white dark:bg-slate-800 p-3 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm">
                      <div className="flex items-center gap-2">
                        <span className="w-2 h-2 rounded-full bg-udg-blue shrink-0"></span>
                        <span className="font-bold text-slate-800 dark:text-slate-100">{item.name}</span>
                      </div>
                      <div className="flex items-center gap-2">
                        <input type="text" maxLength={6} placeholder="NRC (6 dígitos)" value={item.nrc} onChange={(e) => handleNrcChange(item.name, e.target.value)} className={`w-36 px-3 py-1.5 rounded-lg border font-mono text-xs outline-none ${ isValidNrc ? 'border-emerald-300 bg-emerald-50/40 dark:bg-emerald-950/30 text-emerald-800' : 'border-slate-300 bg-slate-50' }`} />
                        <button type="button" onClick={() => handleRemoveSubject(item.name)} className="p-1.5 text-red-500 hover:bg-red-50 rounded-lg transition-colors"><i data-lucide="trash-2" className="w-4 h-4 shrink-0"></i></button>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>

          <div>
            <label className="block font-bold text-slate-700 dark:text-slate-300 mb-1.5">Anexo Digital de Evidencia (PDF, JPG, PNG) *</label>
            <input type="file" accept=".pdf,image/*" onChange={handleFileChange} disabled={isSubmitting} className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl p-2 text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-udg-navy file:text-white hover:file:bg-udg-blue cursor-pointer" />
          </div>

          <div className="flex justify-end pt-2">
            <button type="submit" disabled={isSubmitting} className="bg-udg-navy hover:bg-udg-blue text-white font-bold px-6 py-3 rounded-xl flex items-center gap-2 shadow-md transition-all disabled:opacity-50">
              <i data-lucide="upload" className="w-4 h-4 shrink-0"></i><span>Enviar Solicitud</span>
            </button>
          </div>
        </form>
      </div>

      {/* Historial */}
      <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
        <h4 className="text-sm font-bold text-slate-900 dark:text-white flex items-center gap-2 font-display">
          <i data-lucide="history" className="w-4 h-4 text-udg-gold shrink-0"></i> Mi Historial de Justificantes ({safeJustificantes.length})
        </h4>

        {isLoading ? (
          <div className="space-y-4">
            {[1, 2].map(n => (
              <div key={n} className="p-5 rounded-2xl bg-white dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 shadow-sm space-y-4 animate-pulse">
                <div className="flex justify-between items-start">
                  <div className="space-y-2">
                    <div className="h-4 bg-slate-200 dark:bg-slate-700 rounded w-24"></div>
                    <div className="h-3 bg-slate-200 dark:bg-slate-700 rounded w-32"></div>
                  </div>
                  <div className="h-5 bg-slate-200 dark:bg-slate-700 rounded-full w-20"></div>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                  <div className="h-12 bg-slate-100 dark:bg-slate-800/80 rounded-xl"></div>
                  <div className="h-12 bg-slate-100 dark:bg-slate-800/80 rounded-xl"></div>
                  <div className="h-12 bg-slate-100 dark:bg-slate-800/80 rounded-xl"></div>
                </div>
                <div>
                  <div className="h-8 bg-slate-200 dark:bg-slate-700 rounded-xl w-40"></div>
                </div>
              </div>
            ))}
          </div>
        ) : safeJustificantes.length === 0 ? (
          <div className="py-10 text-center text-slate-400 text-xs">Aún no has registrado solicitudes de justificantes.</div>
        ) : (
          <div className="space-y-4">
            {safeJustificantes.map((item, idx) => (
              <div key={item.id_justificante || idx} className="p-5 rounded-2xl bg-white dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 space-y-4 shadow-sm">
                <div className="flex justify-between items-start">
                  <div>
                    <h5 className="font-bold text-slate-900 dark:text-white text-sm font-display">Folio #{item.id_justificante}</h5>
                    <span className="text-[11px] text-slate-400">Enviado: {item.fecha_solicitud}</span>
                  </div>
                  <span className={`px-3 py-1 rounded-full text-[10px] font-extrabold border uppercase ${getBadgeStyle(item.estatus)}`}>
                    {getStatusLabel(item.estatus)}
                  </span>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-3 text-xs">
                  <div className="bg-slate-50 dark:bg-slate-800/80 p-3 rounded-xl border border-slate-100 dark:border-slate-700">
                    <span className="block text-[9px] font-extrabold uppercase text-slate-400">MOTIVO</span>
                    <span className="font-bold text-slate-800 dark:text-slate-100 mt-0.5 block">{item.motivo}</span>
                  </div>
                  <div className="bg-slate-50 dark:bg-slate-800/80 p-3 rounded-xl border border-slate-100 dark:border-slate-700">
                    <span className="block text-[9px] font-extrabold uppercase text-slate-400">PERÍODO</span>
                    <span className="font-bold text-slate-800 dark:text-slate-100 mt-0.5 block">{item.fecha_incapacidad}</span>
                  </div>
                  <div className="bg-slate-50 dark:bg-slate-800/80 p-3 rounded-xl border border-slate-100 dark:border-slate-700">
                    <span className="block text-[9px] font-extrabold uppercase text-slate-400">MATERIAS</span>
                    <span className="font-bold text-slate-800 dark:text-slate-100 mt-0.5 block truncate">{item.materias_afectadas}</span>
                  </div>
                </div>
                <div>
                  <button type="button" onClick={() => setDetailIndex(idx)} className="bg-udg-navy hover:bg-udg-blue text-white text-[11px] font-bold px-4 py-2 rounded-xl inline-flex items-center gap-1.5 transition-all">
                    <i data-lucide="maximize-2" className="w-3.5 h-3.5 shrink-0"></i><span>Ver Detalles Completos</span>
                  </button>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      {/* Modal Alumno */}
      {activeDetailItem && (
        <div className="fixed inset-0 z-50 bg-slate-900/75 backdrop-blur-sm flex items-center justify-center p-4 animate-in fade-in">
          <div className="bg-white dark:bg-slate-800 rounded-3xl max-w-xl w-full border border-slate-200 dark:border-slate-700 shadow-2xl overflow-hidden text-xs">
            <div className="px-6 py-4 border-b border-slate-100 dark:border-slate-700 flex items-center justify-between">
              <div className="flex items-center gap-2">
                <button type="button" onClick={() => setDetailIndex(prev => Math.max(0, prev - 1))} disabled={detailIndex === 0} className="w-8 h-8 rounded-lg border border-slate-200 flex items-center justify-center hover:bg-slate-100 disabled:opacity-30">
                  <i data-lucide="chevron-left" className="w-4 h-4 shrink-0"></i>
                </button>
                <span className="font-mono text-[11px] font-bold text-slate-500">{detailIndex + 1} de {safeJustificantes.length}</span>
                <button type="button" onClick={() => setDetailIndex(prev => Math.min(safeJustificantes.length - 1, prev + 1))} disabled={detailIndex === safeJustificantes.length - 1} className="w-8 h-8 rounded-lg border border-slate-200 flex items-center justify-center hover:bg-slate-100 disabled:opacity-30">
                  <i data-lucide="chevron-right" className="w-4 h-4 shrink-0"></i>
                </button>
              </div>
              <h4 className="font-bold text-slate-800 dark:text-white text-sm font-display">Detalle del Justificante</h4>
              <button type="button" onClick={() => setDetailIndex(null)} className="w-8 h-8 rounded-lg border border-slate-200 flex items-center justify-center text-slate-400 hover:text-slate-700">
                <i data-lucide="x" className="w-4 h-4 shrink-0"></i>
              </button>
            </div>

            <div className="p-6 space-y-5">
              <div className="flex justify-between items-start">
                <div className="space-y-1">
                  <span className="inline-block px-3 py-1 rounded-full bg-blue-50 text-udg-blue font-mono font-bold text-[10px] border border-blue-200">FOLIO: #{String(activeDetailItem.id_justificante || '').toUpperCase()}</span>
                  <h3 className="text-xl font-black text-slate-900 font-display pt-1">{studentName}</h3>
                  <p className="font-mono text-xs text-slate-500">Código UdG: {studentCode}</p>
                </div>
                <span className={`px-3.5 py-1 rounded-full text-[10px] font-extrabold border uppercase ${getBadgeStyle(activeDetailItem.estatus)}`}>
                  {getStatusLabel(activeDetailItem.estatus)}
                </span>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div className="p-4 rounded-2xl bg-slate-50 border border-slate-200/80 space-y-1">
                  <span className="text-[10px] font-bold uppercase text-slate-400 block">MOTIVO Y SOLICITUD</span>
                  <p className="font-bold text-slate-900 text-sm flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-udg-gold shrink-0"></span>{activeDetailItem.motivo}</p>
                </div>
                <div className="p-4 rounded-2xl bg-slate-50 border border-slate-200/80 space-y-1">
                  <span className="text-[10px] font-bold uppercase text-slate-400 block">FECHAS DE INCAPACIDAD</span>
                  <p className="font-bold text-slate-900 text-xs leading-relaxed">{activeDetailItem.fecha_incapacidad}</p>
                </div>
              </div>

              <div className="p-4 rounded-2xl bg-slate-50 border border-slate-200/80 space-y-2">
                <span className="text-[10px] font-bold uppercase text-slate-400 block">MATERIAS AFECTADAS (NRC)</span>
                <div className="space-y-1 font-bold text-slate-800">
                  {String(activeDetailItem.materias_afectadas || '').split(',').map((m, i) => (<p key={i}>{m.trim()}</p>))}
                </div>
              </div>

              <div className="p-4 rounded-2xl bg-blue-50/50 border border-blue-200/70 flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-white flex items-center justify-center text-udg-blue border border-slate-200">
                    <i data-lucide="paperclip" className="w-5 h-5 shrink-0"></i>
                  </div>
                  <div>
                    <h5 className="font-bold text-slate-900">Evidencia del Estudiante</h5>
                  </div>
                </div>
                {activeDetailItem.evidencia_url && (
                  <a href={activeDetailItem.evidencia_url} target="_blank" rel="noopener noreferrer" className="bg-udg-navy hover:bg-udg-blue text-white font-bold px-4 py-2.5 rounded-xl inline-flex items-center gap-1.5 shadow-sm">
                    <i data-lucide="external-link" className="w-3.5 h-3.5 shrink-0"></i><span>Ver Archivo</span>
                  </a>
                )}
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ============================================================================
// MÓDULO DE OPCIONES DE TITULACIÓN (Modo Lectura Alumno / Modo Edición Admin)
// ============================================================================
function TitulacionModule({ user, showToast, addNotification }) {
  const [data, setData] = useState(DEFAULT_TITULACION_DATA);
  const [draftData, setDraftData] = useState(null);
  const [isLoading, setIsLoading] = useState(true);
  const [isSaving, setIsSaving] = useState(false);
  const [isEditing, setIsEditing] = useState(false);

  const activeRole = String(user?.role || user?.rol || 'Estudiante');
  const isCoordinator = activeRole === 'Coordinacion';
  const userCode = String(user?.code || user?.codigo || '');

  // Garantizar hidratación de íconos Lucide tras cada cambio de estado o modo
  useEffect(() => {
    if (window.lucide) {
      window.lucide.createIcons();
    }
  });

  // Cargar datos dinámicos desde Google Apps Script al montar el componente
  const fetchTitulacionInfo = () => {
    setIsLoading(true);
    if (typeof google !== 'undefined' && google.script) {
      google.script.run
        .withSuccessHandler((res) => {
          if (res && Array.isArray(res.categorias)) {
            setData(res);
          } else {
            setData(DEFAULT_TITULACION_DATA);
          }
          setIsLoading(false);
        })
        .withFailureHandler(() => {
          if (typeof showToast === 'function') {
            showToast("Error al obtener las modalidades del servidor, mostrando catálogo base.", "error");
          }
          setData(DEFAULT_TITULACION_DATA);
          setIsLoading(false);
        })
        .getTitulacionData();
    } else {
      setTimeout(() => {
        setData(DEFAULT_TITULACION_DATA);
        setIsLoading(false);
      }, 800);
    }
  };

  useEffect(() => {
    fetchTitulacionInfo();
  }, []);

  // Paleta de temas visuales e íconos por tarjeta (fiel a las capturas del portal)
  const getCategoryVisualTheme = (index, title = '') => {
    const upper = title.toUpperCase();
    if (upper.includes('DESEMPEÑO') || index % 5 === 0) {
      return {
        headerBg: 'bg-amber-50/70 dark:bg-amber-950/30 border-b border-amber-100 dark:border-slate-700',
        iconColor: 'text-amber-600 dark:text-amber-400',
        dotColor: 'bg-amber-500',
        icon: 'award'
      };
    }
    if (upper.includes('EXÁMENES') || upper.includes('EXAMEN') || index % 5 === 1) {
      return {
        headerBg: 'bg-blue-50/70 dark:bg-blue-950/30 border-b border-blue-100 dark:border-slate-700',
        iconColor: 'text-blue-600 dark:text-blue-400',
        dotColor: 'bg-blue-600',
        icon: 'file-check-2'
      };
    }
    if (upper.includes('MATERIALES') || upper.includes('PRODUCCIÓN') || index % 5 === 2) {
      return {
        headerBg: 'bg-emerald-50/70 dark:bg-emerald-950/30 border-b border-emerald-100 dark:border-slate-700',
        iconColor: 'text-emerald-600 dark:text-emerald-400',
        dotColor: 'bg-emerald-500',
        icon: 'book-open'
      };
    }
    if (upper.includes('INVESTIGACIÓN') || upper.includes('POSGRADO') || index % 5 === 3) {
      return {
        headerBg: 'bg-purple-50/70 dark:bg-purple-950/30 border-b border-purple-100 dark:border-slate-700',
        iconColor: 'text-purple-600 dark:text-purple-400',
        dotColor: 'bg-purple-600',
        icon: 'flask-conical'
      };
    }
    return {
      headerBg: 'bg-indigo-50/70 dark:bg-indigo-950/30 border-b border-indigo-100 dark:border-slate-700',
      iconColor: 'text-indigo-600 dark:text-indigo-400',
      dotColor: 'bg-indigo-600',
      icon: 'library'
    };
  };

  // --- Funciones de Edición Dinámica (Exclusivo Coordinación) ---
  const handleStartEditing = () => {
    // Clonación profunda para permitir cancelar sin alterar el estado de lectura
    setDraftData(JSON.parse(JSON.stringify(data)));
    setIsEditing(true);
  };

  const handleCancelEditing = () => {
    setDraftData(null);
    setIsEditing(false);
  };

  const handleCategoryTitleChange = (catIdx, newTitle) => {
    setDraftData((prev) => {
      const copy = JSON.parse(JSON.stringify(prev));
      copy.categorias[catIdx].titulo = newTitle;
      return copy;
    });
  };

  const handleDeleteCategory = (catIdx) => {
    setDraftData((prev) => {
      const copy = JSON.parse(JSON.stringify(prev));
      copy.categorias.splice(catIdx, 1);
      return copy;
    });
  };

  const handleAddCategory = () => {
    setDraftData((prev) => {
      const copy = JSON.parse(JSON.stringify(prev));
      copy.categorias.push({
        titulo: "NUEVA CATEGORÍA DE TITULACIÓN",
        modalidades: [
          { nombre: "Nueva Modalidad", descripcion: "Escribe aquí los requisitos y criterios de esta modalidad." }
        ]
      });
      return copy;
    });
  };

  const handleModalidadChange = (catIdx, modIdx, field, value) => {
    setDraftData((prev) => {
      const copy = JSON.parse(JSON.stringify(prev));
      copy.categorias[catIdx].modalidades[modIdx][field] = value;
      return copy;
    });
  };

  const handleDeleteModalidad = (catIdx, modIdx) => {
    setDraftData((prev) => {
      const copy = JSON.parse(JSON.stringify(prev));
      copy.categorias[catIdx].modalidades.splice(modIdx, 1);
      return copy;
    });
  };

  const handleAddModalidad = (catIdx) => {
    setDraftData((prev) => {
      const copy = JSON.parse(JSON.stringify(prev));
      copy.categorias[catIdx].modalidades.push({
        nombre: "",
        descripcion: ""
      });
      return copy;
    });
  };

  // Guardar el JSON actualizado en el Backend
  const handleSaveChanges = () => {
    if (!draftData) return;

    if (!draftData.urlOficial?.trim() || !draftData.documentacionBase?.trim()) {
      if (typeof showToast === 'function') {
        showToast("La URL oficial y la documentación base no pueden estar vacías.", "error");
      }
      return;
    }

    // Validar que todas las categorías y modalidades tengan contenido válido
    for (let i = 0; i < draftData.categorias.length; i++) {
      const cat = draftData.categorias[i];
      if (!cat.titulo.trim()) {
        if (typeof showToast === 'function') showToast(`La categoría #${i + 1} requiere un título.`, "error");
        return;
      }
      for (let j = 0; j < cat.modalidades.length; j++) {
        const mod = cat.modalidades[j];
        if (!mod.nombre.trim() || !mod.descripcion.trim()) {
          if (typeof showToast === 'function') {
            showToast(`Completa el nombre y descripción de todas las modalidades en "${cat.titulo}".`, "error");
          }
          return;
        }
      }
    }

    setIsSaving(true);

    if (typeof google !== 'undefined' && google.script) {
      google.script.run
        .withSuccessHandler((res) => {
          setIsSaving(false);
          if (res && res.success) {
            setData(res.data || draftData);
            setIsEditing(false);
            setDraftData(null);
            if (typeof showToast === 'function') {
              showToast("Catálogo de Opciones de Titulación actualizado correctamente");
            }
            if (typeof addNotification === 'function') {
              addNotification(
                "Titulación Actualizada",
                "Se guardaron los cambios en el módulo de Opciones de Titulación.",
                "success"
              );
            }
          } else {
            if (typeof showToast === 'function') {
              showToast(res ? res.message : "Error al guardar los cambios", "error");
            }
          }
        })
        .withFailureHandler(() => {
          setIsSaving(false);
          if (typeof showToast === 'function') {
            showToast("Error de conexión con el servidor al actualizar Titulación", "error");
          }
        })
        .updateTitulacionData(draftData, userCode);
    } else {
      setTimeout(() => {
        setIsSaving(false);
        setData(draftData);
        setIsEditing(false);
        setDraftData(null);
        if (typeof showToast === 'function') showToast("Simulación: Cambios guardados con éxito");
      }, 900);
    }
  };

  // Renderizado del Skeleton Screen durante la carga inicial
  if (isLoading) {
    return (
      <div className="space-y-5 animate-pulse">
        {/* Skeleton Cabecera */}
        <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200 dark:border-slate-700 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
          <div className="flex items-center gap-3">
            <div className="w-11 h-11 rounded-2xl bg-slate-200 dark:bg-slate-700"></div>
            <div className="space-y-2">
              <div className="h-5 bg-slate-200 dark:bg-slate-700 rounded w-48"></div>
              <div className="h-3.5 bg-slate-100 dark:bg-slate-700/60 rounded w-72"></div>
            </div>
          </div>
          <div className="h-10 bg-slate-200 dark:bg-slate-700 rounded-xl w-48"></div>
        </div>

        {/* Skeleton Banner Documentación Base */}
        <div className="h-20 bg-amber-50/60 dark:bg-slate-800 rounded-2xl border border-amber-200/60 dark:border-slate-700 p-5"></div>

        {/* Skeleton Grid de 2 Columnas */}
        <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
          {[1, 2, 3, 4].map((n) => (
            <div key={n} className="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 overflow-hidden">
              <div className="h-12 bg-slate-100 dark:bg-slate-700/50 px-5"></div>
              <div className="p-5 space-y-4">
                <div className="space-y-2">
                  <div className="h-4 bg-slate-200 dark:bg-slate-700 rounded w-1/2"></div>
                  <div className="h-3 bg-slate-100 dark:bg-slate-700/60 rounded w-full"></div>
                </div>
                <div className="space-y-2">
                  <div className="h-4 bg-slate-200 dark:bg-slate-700 rounded w-2/5"></div>
                  <div className="h-3 bg-slate-100 dark:bg-slate-700/60 rounded w-5/6"></div>
                </div>
              </div>
            </div>
          ))}
        </div>
      </div>
    );
  }

  const activeSource = isEditing && draftData ? draftData : data;
  const safeCategorias = Array.isArray(activeSource?.categorias) ? activeSource.categorias : [];

  return (
    <div className="space-y-5 relative text-xs">
      {/* Overlay de bloqueo mientras se guarda en el Backend */}
      {isSaving && (
        <div className="fixed inset-0 z-[100] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 max-w-sm w-full shadow-2xl border border-slate-200 dark:border-slate-700 text-center space-y-3">
            <span className="flex items-center justify-center animate-spin">
              <i data-lucide="loader-2" className="w-8 h-8 text-udg-gold shrink-0"></i>
            </span>
            <h4 className="font-bold text-sm text-slate-900 dark:text-white font-display">
              Guardando Opciones de Titulación...
            </h4>
            <p className="text-xs text-slate-500">
              Sincronizando cambios en el servidor, actualizando memoria caché y registrando auditoría.
            </p>
          </div>
        </div>
      )}

      {/* =====================================================================
          1. ENCABEZADO Y BOTÓN DE PORTAL OFICIAL / CONTROLES DE EDICIÓN
         ===================================================================== */}
      <div className="bg-white dark:bg-slate-800 rounded-2xl p-5 sm:p-6 border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col lg:flex-row lg:items-center justify-between gap-4">
        <div className="flex items-center gap-3.5">
          <div className="w-11 h-11 rounded-2xl bg-slate-50 dark:bg-slate-700 text-udg-navy dark:text-blue-300 flex items-center justify-center font-bold border border-slate-200/80 dark:border-slate-600 shrink-0">
            <i data-lucide="graduation-cap" className="w-5 h-5 shrink-0"></i>
          </div>
          <div>
            <h3 className="text-lg font-extrabold text-slate-900 dark:text-white font-display">
              Opciones de Titulación
            </h3>
            <p className="text-xs text-slate-500 dark:text-slate-400">
              Conoce las modalidades disponibles para obtener tu título como Ingeniero(a) en Computación.
            </p>
          </div>
        </div>

        <div className="flex flex-wrap items-center gap-2.5">
          {/* Botón exclusivo para Coordinación: Habilitar / Salir Modo Edición */}
          {isCoordinator && !isEditing && (
            <button
              type="button"
              onClick={handleStartEditing}
              className="bg-amber-50 hover:bg-amber-100 text-amber-900 dark:bg-slate-700 dark:text-amber-300 border border-amber-300 dark:border-slate-600 font-bold px-4 py-2.5 rounded-xl inline-flex items-center gap-2 transition-all"
            >
              <i data-lucide="edit-3" className="w-4 h-4 text-udg-gold shrink-0"></i>
              <span>Habilitar Modo Edición</span>
            </button>
          )}

          {isEditing ? (
            <div className="flex flex-wrap items-center gap-2 w-full sm:w-auto">
              <button
                type="button"
                onClick={handleCancelEditing}
                disabled={isSaving}
                className="px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-slate-700 dark:text-slate-200 font-bold transition-all"
              >
                Cancelar
              </button>
              <button
                type="button"
                onClick={handleSaveChanges}
                disabled={isSaving}
                className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-5 py-2.5 rounded-xl inline-flex items-center gap-2 shadow-md transition-all"
              >
                <i data-lucide="save" className="w-4 h-4 shrink-0"></i>
                <span>Guardar Cambios</span>
              </button>
            </div>
          ) : (
            <a
              href={activeSource.urlOficial}
              target="_blank"
              rel="noopener noreferrer"
              className="bg-udg-navy hover:bg-udg-blue text-white font-bold px-5 py-2.5 rounded-xl inline-flex items-center gap-2 shadow-md transition-all"
            >
              <i data-lucide="external-link" className="w-4 h-4 shrink-0"></i>
              <span>Portal Oficial de Titulación</span>
            </a>
          )}
        </div>
      </div>

      {/* Input para editar la URL Oficial cuando el Modo Edición está activo */}
      {isEditing && (
        <div className="bg-white dark:bg-slate-800 rounded-2xl p-5 border-2 border-udg-blue/40 shadow-sm space-y-2 animate-in fade-in">
          <label className="block font-extrabold text-udg-navy dark:text-blue-400 uppercase text-[10px] tracking-wider">
            URL del Portal Oficial de Titulación (Botón Superior Derecho) *
          </label>
          <div className="flex items-center gap-2">
            <i data-lucide="link" className="w-4 h-4 text-slate-400 shrink-0"></i>
            <input
              type="url"
              value={draftData.urlOficial}
              onChange={(e) => setDraftData({ ...draftData, urlOficial: e.target.value })}
              placeholder="https://www.cucei.udg.mx/carreras/computacion/es/contenido/titulacion-0"
              className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-2.5 rounded-xl font-mono text-xs focus:ring-2 focus:ring-udg-blue outline-none"
            />
          </div>
        </div>
      )}

      {/* =====================================================================
          2. PANEL DE DOCUMENTACIÓN BASE OBLIGATORIA
         ===================================================================== */}
      <div className="bg-amber-50/90 dark:bg-amber-950/30 rounded-2xl p-5 border border-amber-200 dark:border-amber-800/70 shadow-sm">
        <div className="flex items-start gap-3">
          <i data-lucide="info" className="w-5 h-5 text-udg-gold shrink-0 mt-0.5"></i>
          <div className="flex-1 space-y-1.5">
            <h4 className="font-extrabold text-amber-900 dark:text-amber-300 text-xs font-display">
              Documentación Base Obligatoria
            </h4>
            {isEditing ? (
              <textarea
                rows="3"
                value={draftData.documentacionBase}
                onChange={(e) => setDraftData({ ...draftData, documentacionBase: e.target.value })}
                className="w-full bg-white dark:bg-slate-900 border border-amber-300 dark:border-slate-700 rounded-xl p-3 text-xs text-slate-800 dark:text-slate-100 focus:ring-2 focus:ring-udg-gold outline-none leading-relaxed"
              ></textarea>
            ) : (
              <p className="text-amber-900/90 dark:text-amber-200/90 text-xs leading-relaxed">
                {activeSource.documentacionBase}
              </p>
            )}
          </div>
        </div>
      </div>

      {/* =====================================================================
          3. CUADRÍCULA DE CATEGORÍAS Y MODALIDADES (2 Columnas en Desktop)
         ===================================================================== */}
      <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
        {safeCategorias.map((cat, catIdx) => {
          const theme = getCategoryVisualTheme(catIdx, cat.titulo);
          const modalidadesList = Array.isArray(cat.modalidades) ? cat.modalidades : [];

          return (
            <div
              key={catIdx}
              className="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden flex flex-col justify-between"
            >
              <div>
                {/* Cabecera de la Categoría */}
                <div className={`px-5 py-3.5 flex items-center justify-between gap-2 ${theme.headerBg}`}>
                  <div className="flex items-center gap-2.5 flex-1">
                    <i data-lucide={theme.icon} className={`w-4 h-4 shrink-0 ${theme.iconColor}`}></i>
                    {isEditing ? (
                      <input
                        type="text"
                        value={cat.titulo}
                        onChange={(e) => handleCategoryTitleChange(catIdx, e.target.value)}
                        placeholder="TÍTULO DE LA CATEGORÍA"
                        className="w-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-600 px-2.5 py-1 rounded-lg font-extrabold text-xs uppercase tracking-wider text-slate-800 dark:text-white focus:ring-2 focus:ring-udg-blue outline-none"
                      />
                    ) : (
                      <h4 className="font-extrabold text-slate-800 dark:text-white text-xs uppercase tracking-wider font-display">
                        {cat.titulo}
                      </h4>
                    )}
                  </div>

                  {isEditing && (
                    <button
                      type="button"
                      onClick={() => handleDeleteCategory(catIdx)}
                      className="p-1.5 rounded-lg bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 transition-colors"
                      title="Eliminar Categoría Completa"
                    >
                      <i data-lucide="trash-2" className="w-3.5 h-3.5 shrink-0"></i>
                    </button>
                  )}
                </div>

                {/* Lista de Modalidades dentro de la Categoría */}
                <div className="p-5 space-y-4">
                  {modalidadesList.length === 0 ? (
                    <p className="text-slate-400 italic text-[11px]">
                      Sin modalidades registradas en esta categoría.
                    </p>
                  ) : (
                    modalidadesList.map((mod, modIdx) => (
                      <div key={modIdx} className="space-y-1">
                        {isEditing ? (
                          <div className="p-3 rounded-xl bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-700 space-y-2">
                            <div className="flex items-center justify-between gap-2">
                              <input
                                type="text"
                                value={mod.nombre}
                                onChange={(e) => handleModalidadChange(catIdx, modIdx, 'nombre', e.target.value)}
                                placeholder="Nombre de la modalidad (ej. Tesis)"
                                className="flex-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-2.5 py-1.5 rounded-lg font-bold text-slate-900 dark:text-white text-xs outline-none focus:ring-1 focus:ring-udg-blue"
                              />
                              <button
                                type="button"
                                onClick={() => handleDeleteModalidad(catIdx, modIdx)}
                                className="p-1.5 text-red-500 hover:bg-red-50 dark:hover:bg-red-950/40 rounded-lg"
                                title="Eliminar esta modalidad"
                              >
                                <i data-lucide="x" className="w-3.5 h-3.5 shrink-0"></i>
                              </button>
                            </div>
                            <textarea
                              rows="2"
                              value={mod.descripcion}
                              onChange={(e) => handleModalidadChange(catIdx, modIdx, 'descripcion', e.target.value)}
                              placeholder="Descripción o requisitos principales..."
                              className="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-2 rounded-lg text-[11px] text-slate-600 dark:text-slate-300 outline-none focus:ring-1 focus:ring-udg-blue"
                            ></textarea>
                          </div>
                        ) : (
                          <div className="flex items-start gap-2.5">
                            <span className={`w-2 h-2 rounded-full mt-1.5 shrink-0 ${theme.dotColor}`}></span>
                            <div className="space-y-0.5">
                              <h5 className="font-bold text-slate-900 dark:text-white text-xs">
                                {mod.nombre}
                              </h5>
                              <p className="text-[11px] text-slate-500 dark:text-slate-400 leading-relaxed">
                                {mod.descripcion}
                              </p>
                            </div>
                          </div>
                        )}
                      </div>
                    ))
                  )}
                </div>
              </div>

              {/* Pie de Tarjeta en Modo Edición: Agregar Nueva Modalidad */}
              {isEditing && (
                <div className="px-5 py-3 bg-slate-50/80 dark:bg-slate-900/40 border-t border-slate-100 dark:border-slate-700">
                  <button
                    type="button"
                    onClick={() => handleAddModalidad(catIdx)}
                    className="w-full py-2 rounded-xl border border-dashed border-slate-300 dark:border-slate-600 hover:border-udg-blue text-udg-navy dark:text-blue-400 font-bold text-[11px] flex items-center justify-center gap-1.5 transition-colors"
                  >
                    <i data-lucide="plus-circle" className="w-3.5 h-3.5 shrink-0"></i>
                    <span>Agregar Modalidad a esta Categoría</span>
                  </button>
                </div>
              )}
            </div>
          );
        })}
      </div>

      {/* Botón Final en Modo Edición: Agregar Nueva Categoría y Guardar */}
      {isEditing && (
        <div className="flex flex-col sm:flex-row items-center justify-between gap-4 p-5 rounded-2xl bg-white dark:bg-slate-800 border-2 border-dashed border-slate-300 dark:border-slate-700">
          <button
            type="button"
            onClick={handleAddCategory}
            className="w-full sm:w-auto px-5 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 text-udg-navy dark:text-white font-bold inline-flex items-center justify-center gap-2 transition-all"
          >
            <i data-lucide="folder-plus" className="w-4 h-4 text-udg-gold shrink-0"></i>
            <span>Agregar Nueva Categoría</span>
          </button>

          <div className="flex items-center gap-2 w-full sm:w-auto justify-end">
            <button
              type="button"
              onClick={handleCancelEditing}
              disabled={isSaving}
              className="px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 font-bold"
            >
              Descartar Cambios
            </button>
            <button
              type="button"
              onClick={handleSaveChanges}
              disabled={isSaving}
              className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-2.5 rounded-xl inline-flex items-center gap-2 shadow-md"
            >
              <i data-lucide="check-circle-2" className="w-4 h-4 shrink-0"></i>
              <span>Guardar Cambios Oficiales</span>
            </button>
          </div>
        </div>
      )}
    </div>
  );
}
