// VISTA DEL ALUMNO: ConstanciasModule (Trámite de Constancias Oficiales)
// ============================================================================
function ConstanciasModule({ user, showToast, addNotification, isLoggedIn, setActiveModal }) {
  if (!user) return null;

  // Garantizar hidratación de íconos Lucide tras cada renderizado
  useEffect(() => {
    if (window.lucide) {
      window.lucide.createIcons();
    }
  });

  const [requiereDesglose, setRequiereDesglose] = useState(false);
  const [solicitudes, setSolicitudes] = useState([]);
  const [isLoading, setIsLoading] = useState(true);
  const [isSubmitting, setIsSubmitting] = useState(false);

  const studentCode = String(user.code || user.codigo || '');
  const studentName = String(user.name || user.nombre || '');
  const studentEmail = String(user.email || user.correo || '');

  const fetchMyConstancias = () => {
    setIsLoading(true);
    if (typeof google !== 'undefined' && google.script) {
      google.script.run
        .withSuccessHandler((data) => {
          setSolicitudes(Array.isArray(data) ? data : []);
          setIsLoading(false);
        })
        .withFailureHandler(() => {
          if (typeof showToast === 'function') showToast("Error al cargar el historial de constancias", "error");
          setSolicitudes([]);
          setIsLoading(false);
        })
        .getStudentConstancias(studentCode);
    } else {
      setTimeout(() => {
        setSolicitudes([
          { id_constancia: 'CON-nrjt8d', fecha_solicitud: '13/10/2026', estatus: 'Pendiente', requiere_desglose: true },
          { id_constancia: 'CON-k0zn4e', fecha_solicitud: '13/10/2026', estatus: 'Pendiente', requiere_desglose: true }
        ]);
        setIsLoading(false);
      }, 900);
    }
  };

  useEffect(() => {
    fetchMyConstancias();
  }, [studentCode]);

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!isLoggedIn) {
      if (typeof setActiveModal === 'function') setActiveModal('login');
      return;
    }

    setIsSubmitting(true);

    const payload = {
      codigo: studentCode,
      nombre: studentName,
      correo: studentEmail,
      carrera: String(user.career || user.carrera || 'Ingeniería en Computación'),
      ciclo: String(user.cycle || user.ciclo || '2026-B'),
      creditos_avance: Number(user.credits || user.creditos_avance || 0),
      promedio: Number(user.gpa || user.promedio || 0),
      requiere_desglose: Boolean(requiereDesglose)
    };

    if (typeof google !== 'undefined' && google.script) {
      google.script.run
        .withSuccessHandler((res) => {
          setIsSubmitting(false);
          if (res && res.success) {
            const safeList = Array.isArray(solicitudes) ? solicitudes : [];
            setSolicitudes([res.constancia, ...safeList]);
            setRequiereDesglose(false);
            if (typeof showToast === 'function') {
              showToast(`Solicitud #${res.constancia.id_constancia} registrada exitosamente`);
            }
            if (typeof addNotification === 'function') {
              addNotification("Solicitud de Constancia", `Se registró tu solicitud con folio #${res.constancia.id_constancia}.`, "info");
            }
          } else {
            if (typeof showToast === 'function') showToast(res ? res.message : "Error al enviar la solicitud", "error");
          }
        })
        .withFailureHandler(() => {
          setIsSubmitting(false);
          if (typeof showToast === 'function') showToast("Error de conexión al registrar la constancia", "error");
        })
        .createConstanciaRequest(payload);
    } else {
      setTimeout(() => {
        setIsSubmitting(false);
        if (typeof showToast === 'function') showToast("Simulación: Solicitud de constancia enviada");
      }, 1000);
    }
  };

  const getStudentBadgeStyle = (status) => {
    const s = String(status || '').toUpperCase();
    if (s === 'TERMINADA') {
      return 'bg-emerald-100 text-emerald-800 border-emerald-300 dark:bg-emerald-950/60 dark:text-emerald-300 dark:border-emerald-800';
    }
    if (s === 'EN PROCESO') {
      return 'bg-blue-100 text-blue-800 border-blue-300 dark:bg-blue-950/60 dark:text-blue-300 dark:border-blue-800';
    }
    return 'bg-amber-50 text-amber-700 border-amber-300 dark:bg-amber-950/60 dark:text-amber-300 dark:border-amber-800';
  };

  const getStudentStatusText = (status) => {
    const s = String(status || '').toUpperCase();
    if (s === 'PENDIENTE') return 'EN REVISIÓN';
    return s;
  };

  const safeSolicitudes = Array.isArray(solicitudes) ? solicitudes : [];

  return (
    <div className="space-y-6 relative">
      {/* Overlay de bloqueo al enviar */}
      {isSubmitting && (
        <div className="fixed inset-0 z-[100] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 max-w-sm w-full shadow-2xl border border-slate-200 dark:border-slate-700 text-center space-y-3">
            <span className="flex items-center justify-center animate-spin">
              <i data-lucide="loader-2" className="w-8 h-8 text-udg-blue shrink-0"></i>
            </span>
            <h4 className="font-bold text-sm text-slate-900 dark:text-white font-display">Registrando Solicitud...</h4>
            <p className="text-xs text-slate-500">Generando folio oficial de constancia y enviando acuse a tu correo institucional.</p>
          </div>
        </div>
      )}

      {/* SECCIÓN 1: Formulario de Trámite de Constancias Oficiales */}
      <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 sm:p-8 border border-slate-200 dark:border-slate-700 shadow-sm space-y-6">
        <div className="border-b border-slate-100 dark:border-slate-700 pb-4 space-y-1.5">
          <h3 className="text-lg font-extrabold text-slate-900 dark:text-white flex items-center gap-2 font-display">
            <i data-lucide="file-text" className="w-5 h-5 text-udg-navy dark:text-blue-400 shrink-0"></i>
            <span>Trámite de Constancias Oficiales</span>
          </h3>
          <p className="text-xs text-slate-500 dark:text-slate-400 leading-relaxed">
            Una constancia es un documento oficial emitido por la Coordinación que certifica tu estatus como alumno activo en la carrera. Sirve como comprobante institucional para trámites de becas, servicio social, seguro médico o validación de créditos ante otras dependencias.
          </p>
        </div>

        <form onSubmit={handleSubmit} className="space-y-4 text-xs">
          {/* Dos recuadros Read-Only (Nombre y Código) */}
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div className="bg-slate-50/80 dark:bg-slate-900/70 p-4 rounded-xl border border-slate-200 dark:border-slate-700">
              <span className="block text-[10px] font-extrabold uppercase tracking-wider text-slate-400 mb-1">
                NOMBRE COMPLETO DEL SOLICITANTE
              </span>
              <p className="font-bold text-slate-900 dark:text-white text-sm">{studentName}</p>
            </div>

            <div className="bg-slate-50/80 dark:bg-slate-900/70 p-4 rounded-xl border border-slate-200 dark:border-slate-700">
              <span className="block text-[10px] font-extrabold uppercase tracking-wider text-slate-400 mb-1">
                CÓDIGO DE ESTUDIANTE
              </span>
              <p className="font-mono font-bold text-slate-900 dark:text-white text-sm">{studentCode}</p>
            </div>
          </div>

          {/* Checkbox Prominente */}
          <label className="flex items-center gap-3 p-4 rounded-xl bg-slate-50/60 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 cursor-pointer hover:border-udg-blue transition-colors select-none">
            <input
              type="checkbox"
              checked={requiereDesglose}
              onChange={(e) => setRequiereDesglose(e.target.checked)}
              disabled={isSubmitting}
              className="w-4 h-4 rounded border-slate-300 text-udg-navy focus:ring-udg-blue cursor-pointer"
            />
            <span className="font-bold text-slate-700 dark:text-slate-200 text-xs">
              El solicitante requiere desglose de periodo, promedio y créditos.
            </span>
          </label>

          {/* Botón Enviar Solicitud */}
          <div className="flex justify-end pt-2">
            <button
              type="submit"
              disabled={isSubmitting}
              className="bg-udg-navy hover:bg-udg-blue text-white font-bold px-6 py-3 rounded-xl flex items-center gap-2 shadow-md transition-all disabled:opacity-50"
            >
              <i data-lucide="send" className="w-4 h-4 shrink-0"></i>
              <span>Enviar Solicitud de Constancia</span>
            </button>
          </div>
        </form>
      </div>

      {/* SECCIÓN 2: Historial de Solicitudes del Alumno */}
      <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
        <h4 className="text-sm font-bold text-slate-900 dark:text-white flex items-center gap-2 font-display">
          <i data-lucide="history" className="w-4 h-4 text-udg-gold shrink-0"></i>
          <span>Historial de Solicitudes ({safeSolicitudes.length})</span>
        </h4>

        {isLoading ? (
          <div className="space-y-3">
            {[1, 2, 3].map(n => (
              <div key={n} className="p-5 rounded-2xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900/40 animate-pulse flex justify-between items-center">
                <div className="space-y-2">
                  <div className="h-4 bg-slate-200 dark:bg-slate-700 rounded w-40"></div>
                  <div className="h-3 bg-slate-200 dark:bg-slate-700 rounded w-48"></div>
                </div>
                <div className="h-6 bg-slate-200 dark:bg-slate-700 rounded-full w-24"></div>
              </div>
            ))}
          </div>
        ) : safeSolicitudes.length === 0 ? (
          <div className="py-10 text-center text-slate-400 text-xs">
            No has solicitado constancias oficiales hasta el momento.
          </div>
        ) : (
          <div className="space-y-3">
            {safeSolicitudes.map((item, idx) => (
              <div
                key={item.id_constancia || idx}
                className="p-4 sm:p-5 rounded-2xl bg-white dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 flex flex-col sm:flex-row sm:items-center justify-between gap-3 shadow-sm"
              >
                <div className="space-y-0.5">
                  <h5 className="font-bold text-slate-900 dark:text-white text-sm font-display">
                    Constancia de Estudios
                  </h5>
                  <p className="text-[11px] text-slate-500">
                    <span className="font-mono font-bold text-slate-700 dark:text-slate-300">#{item.id_constancia}</span>
                    {' • '}Solicitada: {item.fecha_solicitud}
                  </p>
                </div>

                <span className={`self-start sm:self-auto px-3 py-1 rounded-full text-[10px] font-extrabold border uppercase ${getStudentBadgeStyle(item.estatus)}`}>
                  {getStudentStatusText(item.estatus)}
                </span>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

// ============================================================================
// VISTA DEL COORDINADOR: AdminConstanciasModule (Emisión de Constancias)
// ============================================================================
function AdminConstanciasModule({ user, showToast, addNotification }) {
  const [items, setItems] = useState([]);
  const [isLoading, setIsLoading] = useState(true);

  // Estados de carga de acciones (Generar PDF / Entregar Físicamente)
  const [actionLoading, setActionLoading] = useState(false);
  const [actionLoadingText, setActionLoadingText] = useState('');

  // Búsqueda y Filtros ('Pendiente' seleccionado por defecto)
  const [filter, setFilter] = useState('Pendiente');
  const [search, setSearch] = useState('');

  // Paginación
  const [currentPage, setCurrentPage] = useState(1);
  const itemsPerPage = 10;

  // Índice del Modal Navegable
  const [modalIndex, setModalIndex] = useState(null);

  // Estados del Formulario de Llenado en el Modal
  const [folioVariable, setFolioVariable] = useState('');
  const [cicloEscolar, setCicloEscolar] = useState('2026-B');
  const [semestreLetras, setSemestreLetras] = useState('');
  const [carreraInput, setCarreraInput] = useState('Ingeniería en Computación');
  const [fechaInicioCiclo, setFechaInicioCiclo] = useState('');
  const [fechaFinCiclo, setFechaFinCiclo] = useState('');
  const [creditosTotales, setCreditosTotales] = useState(430);
  const [creditosConseguidos, setCreditosConseguidos] = useState('');
  const [promedioGeneral, setPromedioGeneral] = useState('');
  const [promedioAnterior, setPromedioAnterior] = useState('');

  useEffect(() => {
    if (window.lucide) {
      window.lucide.createIcons();
    }
  });

  const fetchAllConstancias = () => {
    setIsLoading(true);
    if (typeof google !== 'undefined' && google.script) {
      google.script.run
        .withSuccessHandler((data) => {
          setItems(Array.isArray(data) ? data : []);
          setIsLoading(false);
        })
        .withFailureHandler(() => {
          if (typeof showToast === 'function') showToast("Error al cargar el listado de constancias", "error");
          setItems([]);
          setIsLoading(false);
        })
        .getAllConstancias();
    } else {
      setTimeout(() => {
        setItems([
          {
            id_constancia: 'CON-nrjt8d',
            codigo_estudiante: '220470399',
            nombre_estudiante: 'Kevin Vazquez Delgado',
            correo_estudiante: 'kevin.vazquez7039@alumnos.udg.mx',
            carrera_estudiante: 'Ingeniería en Computación',
            ciclo_estudiante: '2026-B',
            promedio_estudiante: 90.5,
            creditos_estudiante: 200,
            requiere_desglose: true,
            estatus: 'Pendiente',
            fecha_solicitud: '13/10/2026',
            archivo_pdf_url: ''
          }
        ]);
        setIsLoading(false);
      }, 900);
    }
  };

  useEffect(() => {
    fetchAllConstancias();
  }, []);

  const safeItems = Array.isArray(items) ? items : [];

  const filteredItems = safeItems.filter(item => {
    const matchFilter = filter === 'Todos' || item.estatus === filter;
    const q = search.toLowerCase();
    const target = `${item.nombre_estudiante || ''} ${item.codigo_estudiante || ''} ${item.id_constancia || ''}`.toLowerCase();
    return matchFilter && target.includes(q);
  });

  const totalPages = Math.max(1, Math.ceil(filteredItems.length / itemsPerPage));
  const indexOfLast = currentPage * itemsPerPage;
  const indexOfFirst = indexOfLast - itemsPerPage;
  const currentItems = filteredItems.slice(indexOfFirst, indexOfLast);

  const activeModalItem = modalIndex !== null ? filteredItems[modalIndex] : null;

  // Sincronizar campos del formulario cada vez que el coordinador abre o navega a otra solicitud en el modal
  useEffect(() => {
    if (activeModalItem) {
      const saved = activeModalItem.datos_desglose || {};
      setFolioVariable(saved.folioVariable || '');
      setCicloEscolar(saved.cicloEscolar || activeModalItem.ciclo_estudiante || '2026-B');
      setSemestreLetras(saved.semestreLetras || '');
      setCarreraInput(saved.carrera || activeModalItem.carrera_estudiante || 'Ingeniería en Computación');
      setFechaInicioCiclo(saved.fechaInicio || '');
      setFechaFinCiclo(saved.fechaFin || '');
      setCreditosTotales(saved.creditosTotales !== undefined ? saved.creditosTotales : 430);
      setCreditosConseguidos(
        saved.creditosConseguidos !== undefined
          ? saved.creditosConseguidos
          : (activeModalItem.creditos_estudiante || '')
      );
      setPromedioGeneral(
        saved.promedioGeneral !== undefined
          ? saved.promedioGeneral
          : (activeModalItem.promedio_estudiante || '')
      );
      setPromedioAnterior(saved.promedioAnterior || '');
    }
  }, [modalIndex, filter]);

  // Cálculo automático en tiempo real de Créditos Restantes (Totales - Conseguidos)
  const numericTotales = Number(creditosTotales) || 0;
  const numericConseguidos = Number(creditosConseguidos) || 0;
  const creditosRestantes = Math.max(0, numericTotales - numericConseguidos);

  // Acción 1: Generar Constancia PDF ('Pendiente' -> 'En Proceso')
  const handleGenerateConstancia = () => {
    if (!activeModalItem) return;

    if (!folioVariable.trim() || !semestreLetras.trim() || !fechaInicioCiclo || !fechaFinCiclo) {
      showToast("Completa el Folio Variable, Semestre en Letras y las Fechas del Ciclo", "error");
      return;
    }

    if (activeModalItem.requiere_desglose) {
      if (creditosConseguidos === '' || promedioGeneral === '' || promedioAnterior === '') {
        showToast("Completa los campos de Créditos y Promedios requeridos para el desglose", "error");
        return;
      }
    }

    setActionLoading(true);
    setActionLoadingText('Generando Constancia Oficial en PDF y guardando en carpeta "Constancias" de Drive...');

    const formDetails = {
      folioVariable: folioVariable.trim(),
      cicloEscolar: cicloEscolar.trim(),
      semestreLetras: semestreLetras.trim(),
      carrera: carreraInput.trim(),
      fechaInicio: fechaInicioCiclo,
      fechaFin: fechaFinCiclo,
      creditosTotales: numericTotales,
      creditosConseguidos: numericConseguidos,
      creditosRestantes: creditosRestantes,
      promedioGeneral: String(promedioGeneral).trim(),
      promedioAnterior: String(promedioAnterior).trim()
    };

    const adminCode = user?.code || user?.codigo || 'COORD_INCO';

    if (typeof google !== 'undefined' && google.script) {
      google.script.run
        .withSuccessHandler((res) => {
          setActionLoading(false);
          if (res && res.success) {
            const targetId = activeModalItem.id_constancia;
            setItems(prev => prev.map(it =>
              it.id_constancia === targetId
                ? {
                    ...it,
                    estatus: 'En Proceso',
                    archivo_pdf_url: res.pdfUrl,
                    datos_desglose: formDetails,
                    fecha_emision: res.fechaEmision
                  }
                : it
            ));
            showToast(`Constancia #${targetId} generada correctamente`);
            if (res.pdfUrl) {
              window.open(res.pdfUrl, '_blank');
            }
          } else {
            showToast(res ? res.message : "Error al generar la constancia", "error");
          }
        })
        .withFailureHandler(() => {
          setActionLoading(false);
          showToast("Error de conexión con el servidor al crear el PDF", "error");
        })
        .generateConstanciaPDF(activeModalItem.id_constancia, formDetails, adminCode);
    } else {
      setTimeout(() => {
        setActionLoading(false);
        const targetId = activeModalItem.id_constancia;
        setItems(prev => prev.map(it =>
          it.id_constancia === targetId
            ? { ...it, estatus: 'En Proceso', archivo_pdf_url: '#pdf-constancia', datos_desglose: formDetails }
            : it
        ));
        showToast("Simulación: Constancia PDF generada");
      }, 1100);
    }
  };

  // Acción 2: Entregar Físicamente / Notificar al Alumno ('En Proceso' -> 'Terminada')
  const handleDeliverConstancia = () => {
    if (!activeModalItem) return;

    setActionLoading(true);
    setActionLoadingText('Marcando constancia como Terminada y enviando aviso de recolección al alumno...');
    const adminCode = user?.code || user?.codigo || 'COORD_INCO';

    if (typeof google !== 'undefined' && google.script) {
      google.script.run
        .withSuccessHandler((res) => {
          setActionLoading(false);
          if (res && res.success) {
            const targetId = activeModalItem.id_constancia;
            setItems(prev => prev.map(it =>
              it.id_constancia === targetId
                ? { ...it, estatus: 'Terminada', fecha_emision: res.fechaEmision }
                : it
            ));
            showToast(`Constancia #${targetId} marcada como Terminada y alumno notificado.`);
            if (typeof addNotification === 'function') {
              addNotification("Constancia Lista", `Se notificó al estudiante del folio #${targetId} para entrega física.`, "success");
            }
          } else {
            showToast(res ? res.message : "Error al actualizar estado", "error");
          }
        })
        .withFailureHandler(() => {
          setActionLoading(false);
          showToast("Error de conexión al notificar al estudiante", "error");
        })
        .finalizeConstanciaDelivery(activeModalItem.id_constancia, adminCode);
    } else {
      setTimeout(() => {
        setActionLoading(false);
        const targetId = activeModalItem.id_constancia;
        setItems(prev => prev.map(it =>
          it.id_constancia === targetId ? { ...it, estatus: 'Terminada' } : it
        ));
        showToast("Simulación: Constancia marcada como Terminada");
      }, 900);
    }
  };

  const getAdminBadgeStyle = (status) => {
    if (status === 'Terminada') return 'bg-emerald-100 text-emerald-800 border-emerald-300';
    if (status === 'En Proceso') return 'bg-blue-100 text-blue-800 border-blue-300';
    return 'bg-amber-100 text-amber-800 border-amber-300';
  };

  return (
    <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm space-y-5 text-xs relative">
      
      {/* Overlay de bloqueo para acciones pesadas del Coordinador */}
      {actionLoading && (
        <div className="fixed inset-0 z-[100] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 max-w-sm w-full shadow-2xl border border-slate-200 dark:border-slate-700 text-center space-y-3">
            <span className="flex items-center justify-center animate-spin">
              <i data-lucide="loader-2" className="w-8 h-8 text-udg-blue shrink-0"></i>
            </span>
            <h4 className="font-bold text-sm text-slate-900 dark:text-white font-display">Procesando Constancia...</h4>
            <p className="text-xs text-slate-500">{actionLoadingText}</p>
          </div>
        </div>
      )}

      {/* Encabezado */}
      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-100 dark:border-slate-700 pb-4">
        <div className="flex items-center gap-2.5">
          <i data-lucide="file-text" className="w-5 h-5 text-udg-gold shrink-0"></i>
          <h3 className="text-lg font-extrabold text-slate-900 dark:text-white font-display">
            Emisión de Constancias
          </h3>
        </div>

        <button
          type="button"
          onClick={fetchAllConstancias}
          disabled={isLoading}
          className="self-start sm:self-auto px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-slate-700 dark:text-slate-200 font-semibold flex items-center gap-1.5 disabled:opacity-50"
        >
          <span className={`flex items-center justify-center ${isLoading ? 'animate-spin' : ''}`}>
            <i data-lucide="refresh-cw" className="w-3.5 h-3.5 shrink-0"></i>
          </span>
          <span>Actualizar</span>
        </button>
      </div>

      {/* Buscador y Filtros */}
      <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-3">
        <div className="relative flex-1 max-w-sm">
          <i data-lucide="search" className="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 shrink-0"></i>
          <input
            type="text"
            placeholder="Buscar por nombre o código..."
            value={search}
            onChange={(e) => {
              setSearch(e.target.value);
              setCurrentPage(1);
              setModalIndex(null);
            }}
            className="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-xs focus:ring-2 focus:ring-udg-blue outline-none"
          />
        </div>

        <div className="flex flex-wrap items-center gap-1 bg-slate-100 dark:bg-slate-900 p-1 rounded-xl">
          {['Pendiente', 'En Proceso', 'Terminada', 'Todos'].map(tab => (
            <button
              key={tab}
              type="button"
              onClick={() => {
                setFilter(tab);
                setCurrentPage(1);
                setModalIndex(null);
              }}
              className={`px-3.5 py-1.5 rounded-lg font-bold transition-all ${
                filter === tab
                  ? 'bg-udg-navy text-white shadow-sm'
                  : 'text-slate-600 dark:text-slate-300 hover:bg-white/60'
              }`}
            >
              {tab}
            </button>
          ))}
        </div>
      </div>

      {/* Listado de Tarjetas con Skeleton Screen */}
      <div className="space-y-3 min-h-[300px]">
        {isLoading ? (
          <div className="space-y-3">
            {[1, 2, 3, 4].map(n => (
              <div
                key={n}
                className="p-5 rounded-2xl bg-white dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-4 animate-pulse"
              >
                <div className="space-y-2">
                  <div className="h-3.5 bg-slate-200 dark:bg-slate-700 rounded w-24"></div>
                  <div className="h-4 bg-slate-200 dark:bg-slate-700 rounded w-52"></div>
                  <div className="h-3 bg-slate-200 dark:bg-slate-700 rounded w-44"></div>
                </div>
                <div className="flex items-center gap-3">
                  <div className="h-6 bg-slate-200 dark:bg-slate-700 rounded-full w-20"></div>
                  <div className="h-9 bg-slate-200 dark:bg-slate-700 rounded-xl w-36"></div>
                </div>
              </div>
            ))}
          </div>
        ) : currentItems.length === 0 ? (
          <div className="py-12 text-center text-slate-400 space-y-2">
            <i data-lucide="inbox" className="w-8 h-8 mx-auto opacity-50 shrink-0"></i>
            <p>No se encontraron solicitudes de constancias en el filtro "{filter}".</p>
          </div>
        ) : (
          currentItems.map((item, idx) => {
            const globalIdx = indexOfFirst + idx;
            return (
              <div
                key={item.id_constancia}
                className="p-5 rounded-2xl bg-white dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-4 hover:border-slate-300 transition-all"
              >
                <div className="space-y-1">
                  <span className="font-mono font-extrabold text-udg-navy dark:text-blue-400 text-xs block">
                    #{item.id_constancia}
                  </span>
                  <h4 className="font-bold text-slate-900 dark:text-white text-sm">
                    {item.nombre_estudiante}
                  </h4>
                  <p className="text-[11px] text-slate-500">
                    Código: <strong className="text-slate-700 dark:text-slate-300">{item.codigo_estudiante}</strong>
                    {' • '}Solicitud: {item.fecha_solicitud}
                  </p>
                  {item.requiere_desglose && (
                    <p className="text-[10px] font-bold text-udg-blue dark:text-blue-400 flex items-center gap-1 pt-0.5">
                      <i data-lucide="alert-circle" className="w-3 h-3 shrink-0"></i>
                      <span>Requiere Promedio y Créditos</span>
                    </p>
                  )}
                </div>

                <div className="flex items-center gap-2.5 self-start sm:self-center">
                  <span className={`px-3 py-1 rounded-md text-[10px] font-extrabold uppercase border ${getAdminBadgeStyle(item.estatus)}`}>
                    {item.estatus}
                  </span>

                  <button
                    type="button"
                    onClick={() => setModalIndex(globalIdx)}
                    className="bg-udg-navy hover:bg-udg-blue text-white font-bold px-4 py-2.5 rounded-xl inline-flex items-center gap-1.5 shadow-sm transition-all"
                  >
                    <i data-lucide="maximize-2" className="w-3.5 h-3.5 text-udg-gold shrink-0"></i>
                    <span>{item.estatus === 'Pendiente' ? 'Procesar Solicitud' : 'Ver Detalles'}</span>
                  </button>
                </div>
              </div>
            );
          })
        )}
      </div>

      {/* Controles de Paginación */}
      {!isLoading && filteredItems.length > 0 && (
        <div className="flex items-center justify-between pt-3 border-t border-slate-100 dark:border-slate-700 text-[11px] text-slate-500">
          <span>
            Mostrando {indexOfFirst + 1} - {Math.min(indexOfLast, filteredItems.length)} de {filteredItems.length}
          </span>
          <div className="flex items-center gap-2">
            <button
              type="button"
              onClick={() => setCurrentPage(prev => Math.max(1, prev - 1))}
              disabled={currentPage === 1}
              className="w-7 h-7 rounded-lg border border-slate-200 dark:border-slate-700 flex items-center justify-center hover:bg-slate-100 disabled:opacity-30"
            >
              <i data-lucide="chevron-left" className="w-3.5 h-3.5 shrink-0"></i>
            </button>
            <span className="font-bold text-slate-700 dark:text-slate-300">
              Página {currentPage} de {totalPages}
            </span>
            <button
              type="button"
              onClick={() => setCurrentPage(prev => Math.min(totalPages, prev + 1))}
              disabled={currentPage === totalPages}
              className="w-7 h-7 rounded-lg border border-slate-200 dark:border-slate-700 flex items-center justify-center hover:bg-slate-100 disabled:opacity-30"
            >
              <i data-lucide="chevron-right" className="w-3.5 h-3.5 shrink-0"></i>
            </button>
          </div>
        </div>
      )}

      {/* MODAL AVANZADO DE PROCESAMIENTO DE CONSTANCIA (Navegable con Flechas) */}
      {activeModalItem && (
        <div className="fixed inset-0 z-50 bg-slate-900/75 backdrop-blur-sm flex items-center justify-center p-4 animate-in fade-in">
          <div className="bg-white dark:bg-slate-800 rounded-3xl max-w-2xl w-full border border-slate-200 dark:border-slate-700 shadow-2xl overflow-hidden text-xs max-h-[92vh] flex flex-col">
            
            {/* Cabecera del Modal con Flechas Izquierda / Derecha */}
            <div className="px-6 py-4 border-b border-slate-100 dark:border-slate-700 flex items-center justify-between shrink-0">
              <div className="flex items-center gap-2">
                <button
                  type="button"
                  onClick={() => setModalIndex(prev => Math.max(0, prev - 1))}
                  disabled={modalIndex === 0}
                  className="w-8 h-8 rounded-lg border border-slate-200 dark:border-slate-700 flex items-center justify-center hover:bg-slate-100 dark:hover:bg-slate-700 disabled:opacity-30"
                >
                  <i data-lucide="chevron-left" className="w-4 h-4 shrink-0"></i>
                </button>
                <span className="font-mono text-[11px] font-bold text-slate-500">
                  {modalIndex + 1} de {filteredItems.length}
                </span>
                <button
                  type="button"
                  onClick={() => setModalIndex(prev => Math.min(filteredItems.length - 1, prev + 1))}
                  disabled={modalIndex === filteredItems.length - 1}
                  className="w-8 h-8 rounded-lg border border-slate-200 dark:border-slate-700 flex items-center justify-center hover:bg-slate-100 dark:hover:bg-slate-700 disabled:opacity-30"
                >
                  <i data-lucide="chevron-right" className="w-4 h-4 shrink-0"></i>
                </button>
              </div>

              <h4 className="font-extrabold text-slate-900 dark:text-white text-sm font-display">
                Constancia #{activeModalItem.id_constancia}
              </h4>

              <button
                type="button"
                onClick={() => setModalIndex(null)}
                className="w-8 h-8 rounded-lg border border-slate-200 dark:border-slate-700 flex items-center justify-center text-slate-400 hover:text-slate-700"
              >
                <i data-lucide="x" className="w-4 h-4 shrink-0"></i>
              </button>
            </div>

            {/* Cuerpo scrollable del Modal */}
            <div className="p-6 overflow-y-auto custom-scrollbar space-y-5">
              
              {/* Tarjeta Superior de Información del Estudiante */}
              <div className="p-4 rounded-2xl bg-blue-50/60 dark:bg-slate-900/70 border border-blue-200/70 dark:border-slate-700 flex items-center justify-between gap-3">
                <div className="space-y-1.5">
                  <p className="font-bold text-slate-900 dark:text-white text-xs sm:text-sm">
                    Estudiante: {activeModalItem.nombre_estudiante}{' '}
                    <span className="text-udg-blue dark:text-blue-400 font-mono">({activeModalItem.codigo_estudiante})</span>
                  </p>
                  {activeModalItem.requiere_desglose ? (
                    <span className="inline-block bg-udg-blue text-white text-[10px] font-extrabold uppercase px-2.5 py-1 rounded-md tracking-wide">
                      REQUIERE DESGLOSE (PERIODO-PROMEDIO-CRÉDITOS)
                    </span>
                  ) : (
                    <span className="inline-block bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 text-[10px] font-bold uppercase px-2.5 py-1 rounded-md">
                      CONSTANCIA SIMPLE DE ESTUDIOS
                    </span>
                  )}
                </div>

                <span className={`px-3 py-1 rounded-full text-[10px] font-extrabold uppercase border shrink-0 ${getAdminBadgeStyle(activeModalItem.estatus)}`}>
                  {activeModalItem.estatus}
                </span>
              </div>

              {/* LÓGICA CONDICIONAL DEL MODAL SEGÚN ESTADO */}
              {activeModalItem.estatus === 'Pendiente' ? (
                <div className="space-y-4">
                  <h5 className="font-bold text-slate-800 dark:text-slate-200 text-xs border-b border-slate-100 dark:border-slate-700 pb-2">
                    Formulario de Llenado para Generar Constancia
                  </h5>

                  {/* Campos Generales de la Constancia */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className="block font-bold text-slate-700 dark:text-slate-300 mb-1">
                        Folio Variable (ej. 1024)
                      </label>
                      <input
                        type="text"
                        placeholder="Ej. 1024"
                        value={folioVariable}
                        onChange={(e) => setFolioVariable(e.target.value)}
                        className="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-2.5 rounded-xl text-xs focus:ring-2 focus:ring-udg-blue outline-none"
                      />
                    </div>

                    <div>
                      <label className="block font-bold text-slate-700 dark:text-slate-300 mb-1">
                        Ciclo Escolar (ej. 2026-B)
                      </label>
                      <input
                        type="text"
                        placeholder="2026-B"
                        value={cicloEscolar}
                        onChange={(e) => setCicloEscolar(e.target.value)}
                        className="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-2.5 rounded-xl text-xs focus:ring-2 focus:ring-udg-blue outline-none"
                      />
                    </div>

                    <div>
                      <label className="block font-bold text-slate-700 dark:text-slate-300 mb-1">
                        Semestre en Letras
                      </label>
                      <input
                        type="text"
                        placeholder="ej. Séptimo"
                        value={semestreLetras}
                        onChange={(e) => setSemestreLetras(e.target.value)}
                        className="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-2.5 rounded-xl text-xs focus:ring-2 focus:ring-udg-blue outline-none"
                      />
                    </div>

                    <div>
                      <label className="block font-bold text-slate-700 dark:text-slate-300 mb-1">
                        Carrera
                      </label>
                      <input
                        type="text"
                        value={carreraInput}
                        onChange={(e) => setCarreraInput(e.target.value)}
                        className="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-2.5 rounded-xl text-xs focus:ring-2 focus:ring-udg-blue outline-none"
                      />
                    </div>

                    <div>
                      <label className="block font-bold text-slate-700 dark:text-slate-300 mb-1">
                        Fecha Inicio Ciclo
                      </label>
                      <input
                        type="date"
                        value={fechaInicioCiclo}
                        onChange={(e) => setFechaInicioCiclo(e.target.value)}
                        className="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-2.5 rounded-xl text-xs focus:ring-2 focus:ring-udg-blue outline-none"
                      />
                    </div>

                    <div>
                      <label className="block font-bold text-slate-700 dark:text-slate-300 mb-1">
                        Fecha Conclusión Ciclo
                      </label>
                      <input
                        type="date"
                        value={fechaFinCiclo}
                        onChange={(e) => setFechaFinCiclo(e.target.value)}
                        className="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-2.5 rounded-xl text-xs focus:ring-2 focus:ring-udg-blue outline-none"
                      />
                    </div>
                  </div>

                  {/* RECUADRO AMARILLO CONDICIONAL: Solo si el estudiante marcó el checkbox */}
                  {activeModalItem.requiere_desglose && (
                    <div className="p-4 rounded-2xl bg-amber-50/70 dark:bg-amber-950/20 border border-amber-200 dark:border-amber-800/60 space-y-4">
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                          <label className="block font-bold text-amber-900 dark:text-amber-300 mb-1 text-[11px]">
                            Créditos Totales de la Carrera
                          </label>
                          <input
                            type="number"
                            value={creditosTotales}
                            onChange={(e) => setCreditosTotales(e.target.value)}
                            className="w-full bg-white dark:bg-slate-900 border border-amber-200 dark:border-slate-700 p-2.5 rounded-xl text-xs focus:ring-2 focus:ring-udg-gold outline-none"
                          />
                        </div>

                        <div>
                          <label className="block font-bold text-amber-900 dark:text-amber-300 mb-1 text-[11px]">
                            Créditos Conseguidos por el Alumno
                          </label>
                          <input
                            type="number"
                            placeholder="Ej. 320"
                            value={creditosConseguidos}
                            onChange={(e) => setCreditosConseguidos(e.target.value)}
                            className="w-full bg-white dark:bg-slate-900 border border-amber-200 dark:border-slate-700 p-2.5 rounded-xl text-xs focus:ring-2 focus:ring-udg-gold outline-none"
                          />
                        </div>

                        <div>
                          <label className="block font-bold text-amber-900 dark:text-amber-300 mb-1 text-[11px]">
                            Promedio General
                          </label>
                          <input
                            type="number"
                            step="0.01"
                            placeholder="Ej. 86.7"
                            value={promedioGeneral}
                            onChange={(e) => setPromedioGeneral(e.target.value)}
                            className="w-full bg-white dark:bg-slate-900 border border-amber-200 dark:border-slate-700 p-2.5 rounded-xl text-xs focus:ring-2 focus:ring-udg-gold outline-none"
                          />
                        </div>

                        <div>
                          <label className="block font-bold text-amber-900 dark:text-amber-300 mb-1 text-[11px]">
                            Promedio del Anterior Semestre
                          </label>
                          <input
                            type="number"
                            step="0.01"
                            placeholder="Ej. 98.9"
                            value={promedioAnterior}
                            onChange={(e) => setPromedioAnterior(e.target.value)}
                            className="w-full bg-white dark:bg-slate-900 border border-amber-200 dark:border-slate-700 p-2.5 rounded-xl text-xs focus:ring-2 focus:ring-udg-gold outline-none"
                          />
                        </div>
                      </div>

                      <p className="text-[11px] font-extrabold text-udg-gold">
                        Créditos Restantes (Cálculo Automático): {creditosRestantes}
                      </p>
                    </div>
                  )}

                  {/* Botón Generar Constancia */}
                  <div className="pt-2 border-t border-slate-100 dark:border-slate-700 flex justify-end">
                    <button
                      type="button"
                      onClick={handleGenerateConstancia}
                      disabled={actionLoading}
                      className="bg-udg-navy hover:bg-udg-blue text-white font-bold px-5 py-3 rounded-xl inline-flex items-center gap-2 shadow-md transition-all disabled:opacity-50"
                    >
                      <i data-lucide="file-text" className="w-4 h-4 shrink-0"></i>
                      <span>Generar Constancia</span>
                    </button>
                  </div>
                </div>
              ) : (
                /* VISTA DEL MODAL CUANDO ESTÁ "En Proceso" O "Terminada" */
                <div className="space-y-5">
                  <div className="p-8 rounded-2xl bg-slate-50/70 dark:bg-slate-900/50 border border-slate-200/80 dark:border-slate-700 text-center space-y-3">
                    <div className="w-12 h-12 rounded-full bg-emerald-100 dark:bg-emerald-950/60 text-emerald-600 dark:text-emerald-400 flex items-center justify-center mx-auto">
                      <i data-lucide="check-circle-2" className="w-7 h-7 shrink-0"></i>
                    </div>
                    <div className="space-y-1">
                      <h5 className="text-base font-extrabold text-slate-900 dark:text-white font-display">
                        Formulario Completado
                      </h5>
                      <p className="text-xs text-slate-500">
                        Esta constancia está en estado "{activeModalItem.estatus}".
                      </p>
                    </div>

                    {activeModalItem.archivo_pdf_url && (
                      <div className="pt-1">
                        <a
                          href={activeModalItem.archivo_pdf_url}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="bg-udg-navy hover:bg-udg-blue text-white font-bold px-5 py-2.5 rounded-xl inline-flex items-center gap-2 shadow-sm transition-all"
                        >
                          <i data-lucide="file-text" className="w-4 h-4 shrink-0"></i>
                          <span>Ver PDF Oficial en Drive</span>
                        </a>
                      </div>
                    )}
                  </div>

                  {/* Botón Entregar Físicamente */}
                  <div className="pt-2 border-t border-slate-100 dark:border-slate-700 flex justify-end">
                    {activeModalItem.estatus === 'En Proceso' ? (
                      <button
                        type="button"
                        onClick={handleDeliverConstancia}
                        disabled={actionLoading}
                        className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-5 py-2.5 rounded-xl inline-flex items-center gap-2 shadow-md transition-all disabled:opacity-50"
                      >
                        <i data-lucide="user-check" className="w-4 h-4 shrink-0"></i>
                        <span>Entregar Físicamente</span>
                      </button>
                    ) : (
                      <button
                        type="button"
                        onClick={handleDeliverConstancia}
                        disabled={actionLoading}
                        className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-5 py-2.5 rounded-xl inline-flex items-center gap-2 shadow-sm transition-all opacity-90"
                        title="Reenviar notificación de entrega física"
                      >
                        <i data-lucide="user-check" className="w-4 h-4 shrink-0"></i>
                        <span>Entregar Físicamente</span>
                      </button>
                    )}
                  </div>
                </div>
              )}

            </div>
          </div>
        </div>
      )}

    </div>
  );
}

};

// ============================================================================
// MÓDULO DE PROYECTOS MODULARES (Modo Lectura Alumno / Modo Edición Coordinador)
// ============================================================================
function ProyectosModularesModule({ showToast, addNotification, user }) {
  const [data, setData] = useState(DEFAULT_MODULARES_DATA);
  const [draftData, setDraftData] = useState(null);
  const [isLoading, setIsLoading] = useState(true);
  const [isSaving, setIsSaving] = useState(false);
  const [isEditing, setIsEditing] = useState(false);

  const activeRole = String(user?.role || user?.rol || 'Estudiante');
  const isCoordinator = activeRole === 'Coordinacion';
  const userCode = String(user?.code || user?.codigo || '');

  // Garantizar hidratación de íconos Lucide tras cada actualización del DOM
  useEffect(() => {
    if (window.lucide) {
      window.lucide.createIcons();
    }
  });

  // Obtener configuración de Proyectos Modulares desde el Backend (con CacheService)
  const fetchModularesInfo = () => {
    setIsLoading(true);
    if (typeof google !== 'undefined' && google.script) {
      google.script.run
        .withSuccessHandler((res) => {
          if (res && Array.isArray(res.fases)) {
            setData(res);
          } else {
            setData(DEFAULT_MODULARES_DATA);
          }
          setIsLoading(false);
        })
        .withFailureHandler(() => {
          if (typeof showToast === 'function') {
            showToast("Error al obtener datos del servidor, mostrando información base.", "error");
          }
          setData(DEFAULT_MODULARES_DATA);
          setIsLoading(false);
        })
        .getModularesData();
    } else {
      setTimeout(() => {
        setData(DEFAULT_MODULARES_DATA);
        setIsLoading(false);
      }, 800);
    }
  };

  useEffect(() => {
    fetchModularesInfo();
  }, []);

  // --- Handlers de Edición Dinámica (Exclusivos para Coordinación) ---
  const handleStartEditing = () => {
    setDraftData(JSON.parse(JSON.stringify(data)));
    setIsEditing(true);
  };

  const handleCancelEditing = () => {
    setDraftData(null);
    setIsEditing(false);
  };

  const handleFaseChange = (faseIdx, field, value) => {
    setDraftData((prev) => {
      const copy = JSON.parse(JSON.stringify(prev));
      copy.fases[faseIdx][field] = value;
      return copy;
    });
  };

  const handleDeleteFase = (faseIdx) => {
    setDraftData((prev) => {
      const copy = JSON.parse(JSON.stringify(prev));
      copy.fases.splice(faseIdx, 1);
      return copy;
    });
  };

  const handleAddFase = () => {
    setDraftData((prev) => {
      const copy = JSON.parse(JSON.stringify(prev));
      const nextNum = copy.fases.length + 1;
      copy.fases.push({
        titulo: `Nueva Fase / Etapa ${nextNum}`,
        descripcion: "Describe aquí los objetivos, entregables y criterios de evaluación de esta etapa."
      });
      return copy;
    });
  };

  // Guardar JSON en el Backend
  const handleSaveChanges = () => {
    if (!draftData) return;

    if (!draftData.urlOficial?.trim() || !draftData.descripcionGeneral?.trim()) {
      if (typeof showToast === 'function') {
        showToast("El enlace oficial y la descripción general son obligatorios.", "error");
      }
      return;
    }

    if (!Array.isArray(draftData.fases) || draftData.fases.length === 0) {
      if (typeof showToast === 'function') {
        showToast("Debe existir al menos una fase o etapa registrada.", "error");
      }
      return;
    }

    for (let i = 0; i < draftData.fases.length; i++) {
      const f = draftData.fases[i];
      if (!f.titulo.trim() || !f.descripcion.trim()) {
        if (typeof showToast === 'function') {
          showToast(`Completa el título y la descripción de la Fase #${i + 1}.`, "error");
        }
        return;
      }
    }

    setIsSaving(true);

    if (typeof google !== 'undefined' && google.script) {
      google.script.run
        .withSuccessHandler((res) => {
          setIsSaving(false);
          if (res && res.success) {
            setData(res.data || draftData);
            setIsEditing(false);
            setDraftData(null);
            if (typeof showToast === 'function') {
              showToast("Información de Proyectos Modulares actualizada exitosamente");
            }
            if (typeof addNotification === 'function') {
              addNotification(
                "Proyectos Modulares Actualizados",
                "Los cambios en las etapas y lineamientos de Proyectos Modulares fueron guardados.",
                "success"
              );
            }
          } else {
            if (typeof showToast === 'function') {
              showToast(res ? res.message : "No se pudieron guardar los cambios", "error");
            }
          }
        })
        .withFailureHandler(() => {
          setIsSaving(false);
          if (typeof showToast === 'function') {
            showToast("Error de conexión con el servidor al guardar Proyectos Modulares", "error");
          }
        })
        .updateModularesData(draftData, userCode);
    } else {
      setTimeout(() => {
        setIsSaving(false);
        setData(draftData);
        setIsEditing(false);
        setDraftData(null);
        if (typeof showToast === 'function') showToast("Simulación: Cambios guardados correctamente");
      }, 900);
    }
  };

  // Renderizado del Skeleton Screen mientras se obtienen los datos del servidor
  if (isLoading) {
    return (
      <div className="space-y-5 animate-pulse">
        {/* Skeleton Encabezado */}
        <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200 dark:border-slate-700 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
          <div className="flex items-center gap-3">
            <div className="w-11 h-11 rounded-2xl bg-slate-200 dark:bg-slate-700"></div>
            <div className="space-y-2">
              <div className="h-5 bg-slate-200 dark:bg-slate-700 rounded w-56"></div>
              <div className="h-3.5 bg-slate-100 dark:bg-slate-700/60 rounded w-72"></div>
            </div>
          </div>
          <div className="h-10 bg-slate-200 dark:bg-slate-700 rounded-xl w-48"></div>
        </div>

        {/* Skeleton Descripción General (Azul Claro) */}
        <div className="h-24 bg-blue-50/60 dark:bg-slate-800 rounded-2xl border border-blue-200/60 dark:border-slate-700 p-5"></div>

        {/* Skeleton Grid de 3 Columnas */}
        <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
          {[1, 2, 3].map((n) => (
            <div key={n} className="glass-card rounded-2xl p-5 border border-slate-200 dark:border-slate-700 space-y-3">
              <div className="h-5 bg-slate-200 dark:bg-slate-700 rounded w-24"></div>
              <div className="h-4 bg-slate-200 dark:bg-slate-700 rounded w-4/5"></div>
              <div className="space-y-2 pt-1">
                <div className="h-3 bg-slate-100 dark:bg-slate-700/60 rounded w-full"></div>
                <div className="h-3 bg-slate-100 dark:bg-slate-700/60 rounded w-5/6"></div>
                <div className="h-3 bg-slate-100 dark:bg-slate-700/60 rounded w-3/4"></div>
              </div>
            </div>
          ))}
        </div>
      </div>
    );
  }

  const activeSource = isEditing && draftData ? draftData : data;
  const safeFases = Array.isArray(activeSource?.fases) ? activeSource.fases : [];

  return (
    <div className="space-y-5 relative text-xs">
      {/* Overlay de bloqueo durante guardado en el Backend */}
      {isSaving && (
        <div className="fixed inset-0 z-[100] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 max-w-sm w-full shadow-2xl border border-slate-200 dark:border-slate-700 text-center space-y-3">
            <span className="flex items-center justify-center animate-spin">
              <i data-lucide="loader-2" className="w-8 h-8 text-udg-blue shrink-0"></i>
            </span>
            <h4 className="font-bold text-sm text-slate-900 dark:text-white font-display">
              Guardando Proyectos Modulares...
            </h4>
            <p className="text-xs text-slate-500">
              Actualizando lineamientos en el servidor, refrescando memoria caché y registrando auditoría.
            </p>
          </div>
        </div>
      )}

      {/* =====================================================================
          1. ENCABEZADO Y BOTÓN DE PORTAL OFICIAL / CONTROLES DE EDICIÓN
         ===================================================================== */}
      <div className="bg-white dark:bg-slate-800 rounded-2xl p-5 sm:p-6 border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col lg:flex-row lg:items-center justify-between gap-4">
        <div className="flex items-center gap-3.5">
          <div className="w-11 h-11 rounded-2xl bg-udg-light dark:bg-slate-700 text-udg-blue dark:text-blue-300 flex items-center justify-center font-bold border border-blue-200/60 dark:border-slate-600 shrink-0">
            <i data-lucide="layers" className="w-5 h-5 shrink-0"></i>
          </div>
          <div>
            <h3 className="text-lg font-extrabold text-slate-900 dark:text-white font-display">
              Proyectos Modulares (INCO)
            </h3>
            <p className="text-xs text-slate-500 dark:text-slate-400">
              Lineamientos oficiales, etapas curriculares y requisitos de evaluación modular.
            </p>
          </div>
        </div>

        <div className="flex flex-wrap items-center gap-2.5">
          {/* Botón exclusivo para Coordinación: Habilitar Modo Edición */}
          {isCoordinator && !isEditing && (
            <button
              type="button"
              onClick={handleStartEditing}
              className="bg-amber-50 hover:bg-amber-100 text-amber-900 dark:bg-slate-700 dark:text-amber-300 border border-amber-300 dark:border-slate-600 font-bold px-4 py-2.5 rounded-xl inline-flex items-center gap-2 transition-all"
            >
              <i data-lucide="edit-3" className="w-4 h-4 text-udg-gold shrink-0"></i>
              <span>Habilitar Modo Edición</span>
            </button>
          )}

          {isEditing ? (
            <div className="flex flex-wrap items-center gap-2 w-full sm:w-auto">
              <button
                type="button"
                onClick={handleCancelEditing}
                disabled={isSaving}
                className="px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-slate-700 dark:text-slate-200 font-bold transition-all"
              >
                Cancelar
              </button>
              <button
                type="button"
                onClick={handleSaveChanges}
                disabled={isSaving}
                className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-5 py-2.5 rounded-xl inline-flex items-center gap-2 shadow-md transition-all"
              >
                <i data-lucide="save" className="w-4 h-4 shrink-0"></i>
                <span>Guardar Cambios</span>
              </button>
            </div>
          ) : (
            <a
              href={activeSource.urlOficial}
              target="_blank"
              rel="noopener noreferrer"
              className="bg-udg-navy hover:bg-udg-blue text-white font-bold px-5 py-2.5 rounded-xl inline-flex items-center gap-2 shadow-md transition-all"
            >
              <i data-lucide="external-link" className="w-4 h-4 text-udg-gold shrink-0"></i>
              <span>Portal Oficial de Modulares</span>
            </a>
          )}
        </div>
      </div>

      {/* Input para editar urlOficial cuando el Modo Edición está activo */}
      {isEditing && (
        <div className="bg-white dark:bg-slate-800 rounded-2xl p-5 border-2 border-udg-blue/40 shadow-sm space-y-2 animate-in fade-in">
          <label className="block font-extrabold text-udg-navy dark:text-blue-400 uppercase text-[10px] tracking-wider">
            URL del Portal Oficial de Modulares (Botón Superior Derecho) *
          </label>
          <div className="flex items-center gap-2">
            <i data-lucide="link" className="w-4 h-4 text-slate-400 shrink-0"></i>
            <input
              type="url"
              value={draftData.urlOficial}
              onChange={(e) => setDraftData({ ...draftData, urlOficial: e.target.value })}
              placeholder="https://www.cucei.udg.mx"
              className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-2.5 rounded-xl font-mono text-xs focus:ring-2 focus:ring-udg-blue outline-none"
            />
          </div>
        </div>
      )}

      {/* =====================================================================
          2. RECUADRO DESTACADO DE DESCRIPCIÓN GENERAL (bg-blue-50 border-blue-200)
         ===================================================================== */}
      <div className="bg-blue-50 dark:bg-blue-950/30 rounded-2xl p-5 border border-blue-200 dark:border-blue-800/70 shadow-sm">
        <div className="flex items-start gap-3">
          <i data-lucide="cpu" className="w-5 h-5 text-udg-blue dark:text-blue-400 shrink-0 mt-0.5"></i>
          <div className="flex-1 space-y-1.5">
            <h4 className="font-extrabold text-udg-navy dark:text-blue-300 text-xs font-display uppercase tracking-wide">
              Objetivo y Lineamientos Generales
            </h4>
            {isEditing ? (
              <textarea
                rows="3"
                value={draftData.descripcionGeneral}
                onChange={(e) => setDraftData({ ...draftData, descripcionGeneral: e.target.value })}
                placeholder="Describe el propósito general de los Proyectos Modulares..."
                className="w-full bg-white dark:bg-slate-900 border border-blue-300 dark:border-slate-700 rounded-xl p-3 text-xs text-slate-800 dark:text-slate-100 focus:ring-2 focus:ring-udg-blue outline-none leading-relaxed"
              ></textarea>
            ) : (
              <p className="text-slate-700 dark:text-slate-200 text-xs leading-relaxed">
                {activeSource.descripcionGeneral}
              </p>
            )}
          </div>
        </div>
      </div>

      {/* =====================================================================
          3. GRID DE TARJETAS DE FASES / ETAPAS (grid-cols-1 md:grid-cols-3)
         ===================================================================== */}
      <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
        {safeFases.map((fase, faseIdx) => (
          <div
            key={faseIdx}
            className="glass-card bg-white/90 dark:bg-slate-800/90 rounded-2xl p-5 border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col justify-between space-y-4 hover:border-udg-blue/50 transition-all"
          >
            <div className="space-y-3">
              {/* Cabecera de la Tarjeta: Badge de Etapa + Botón Eliminar en Modo Edición */}
              <div className="flex items-center justify-between gap-2">
                <span className="inline-flex items-center gap-1.5 text-[10px] font-extrabold uppercase px-2.5 py-1 rounded-lg bg-udg-light text-udg-navy dark:bg-slate-700 dark:text-blue-300 border border-blue-200/60 dark:border-slate-600">
                  <i data-lucide="layers" className="w-3 h-3 text-udg-gold shrink-0"></i>
                  <span>Etapa {faseIdx + 1}</span>
                </span>

                {isEditing && (
                  <button
                    type="button"
                    onClick={() => handleDeleteFase(faseIdx)}
                    className="px-2.5 py-1 rounded-lg bg-red-50 hover:bg-red-100 text-red-600 dark:bg-red-950/50 dark:text-red-300 border border-red-200 dark:border-red-800 font-bold text-[10px] inline-flex items-center gap-1 transition-colors"
                    title="Eliminar esta Fase"
                  >
                    <i data-lucide="trash-2" className="w-3 h-3 shrink-0"></i>
                    <span>Eliminar Fase</span>
                  </button>
                )}
              </div>

              {/* Contenido de la Fase (Lectura vs Inputs de Edición) */}
              {isEditing ? (
                <div className="space-y-2.5 pt-1">
                  <div>
                    <label className="block text-[10px] font-bold uppercase text-slate-400 mb-1">
                      Título de la Fase *
                    </label>
                    <input
                      type="text"
                      value={fase.titulo}
                      onChange={(e) => handleFaseChange(faseIdx, 'titulo', e.target.value)}
                      placeholder="Ej: Módulo I (6to Semestre) - Estado del Arte..."
                      className="w-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-600 p-2.5 rounded-xl font-bold text-slate-900 dark:text-white text-xs focus:ring-2 focus:ring-udg-blue outline-none"
                    />
                  </div>
                  <div>
                    <label className="block text-[10px] font-bold uppercase text-slate-400 mb-1">
                      Descripción de la Fase *
                    </label>
                    <textarea
                      rows="4"
                      value={fase.descripcion}
                      onChange={(e) => handleFaseChange(faseIdx, 'descripcion', e.target.value)}
                      placeholder="Describe los requisitos y actividades de esta etapa..."
                      className="w-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-600 p-2.5 rounded-xl text-xs text-slate-600 dark:text-slate-300 focus:ring-2 focus:ring-udg-blue outline-none leading-relaxed"

                <div className="space-y-2 pt-1">

                    {fase.descripcion}

            {!isEditing && (
              <div className="pt-3 border-t border-slate-100 dark:border-slate-700/60 flex items-center justify-between text-[11px] text-slate-400">

                <i data-lucide="check-circle-2" className="w-4 h-4 text-emerald-500 shrink-0"></i>
              </div>
            )}
          </div>

      </div>

      {/* =====================================================================
          4. BARRA INFERIOR EN MODO EDICIÓN: AGREGAR NUEVA FASE Y GUARDAR
         ===================================================================== */}
      {isEditing && (
        <div className="flex flex-col sm:flex-row items-center justify-between gap-4 p-5 rounded-2xl bg-white dark:bg-slate-800 border-2 border-dashed border-slate-300 dark:border-slate-700 animate-in fade-in">
          <button
            type="button"
            onClick={handleAddFase}
            className="w-full sm:w-auto px-5 py-2.5 rounded-xl bg-blue-50 hover:bg-blue-100 dark:bg-slate-700 text-udg-navy dark:text-white border border-blue-200 dark:border-slate-600 font-bold inline-flex items-center justify-center gap-2 transition-all"
          >
            <i data-lucide="plus-circle" className="w-4 h-4 text-udg-blue dark:text-udg-gold shrink-0"></i>
            <span>Agregar Nueva Fase / Etapa</span>
          </button>

          <div className="flex items-center gap-2 w-full sm:w-auto justify-end">
            <button
              type="button"
              onClick={handleCancelEditing}
              disabled={isSaving}
              className="px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 font-bold"
            >
              Descartar Cambios
            </button>
            <button
              type="button"
              onClick={handleSaveChanges}
              disabled={isSaving}
              className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-2.5 rounded-xl inline-flex items-center gap-2 shadow-md"
            >
              <i data-lucide="save" className="w-4 h-4 shrink-0"></i>
              <span>Guardar Cambios</span>
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

function ArticulosReglamentoModule({ user, showToast, addNotification }) {

      google.script.run
        .withSuccessHandler((res) => {
          if (res && Array.isArray(res.articulos)) {
            setData(res);
          } else {
            setData(DEFAULT_REGLAMENTO_DATA);
          }
          setIsLoading(false);
        })
        .withFailureHandler(() => {
          if (typeof showToast === 'function') {
            showToast("Error al obtener la normatividad del servidor, mostrando textos base.", "error");
          }
          setData(DEFAULT_REGLAMENTO_DATA);
          setIsLoading(false);
        })
        .getArticulosData();
    } else {
      setTimeout(() => {
        setData(DEFAULT_REGLAMENTO_DATA);
        setIsLoading(false);
      }, 800);
    }
  };

  useEffect(() => {
    fetchArticulosInfo();
  }, []);

  // --- Funciones de Edición Dinámica (Exclusivas para Coordinación) ---
  const handleStartEditing = () => {
    setDraftData(JSON.parse(JSON.stringify(data)));
    setIsEditing(true);
  };

  const handleCancelEditing = () => {
    setDraftData(null);
    setIsEditing(false);
  };

  const handleArticuloChange = (artIdx, field, value) => {
    setDraftData((prev) => {
      const copy = JSON.parse(JSON.stringify(prev));
      copy.articulos[artIdx][field] = value;
      return copy;
    });

  const handleDeleteArticulo = (artIdx) => {
    setDraftData((prev) => {
      const copy = JSON.parse(JSON.stringify(prev));
      copy.articulos.splice(artIdx, 1);
      return copy;
    });

  const handleAddArticulo = () => {
    setDraftData((prev) => {
      const copy = JSON.parse(JSON.stringify(prev));
      copy.articulos.push({
        titulo: "Nuevo Artículo o Disposición Normativa",
        descripcion: "Redacta aquí el contenido oficial del artículo, lineamiento o criterio de la Comisión de Educación."

  // Guardar el JSON actualizado en Google Apps Script
  const handleSaveChanges = () => {

      if (typeof showToast === 'function') {
        showToast("La URL del formato y la descripción general son obligatorias.", "error");

      return;

    for (let i = 0; i < draftData.articulos.length; i++) {

          showToast(`Completa el título y la descripción del elemento #${i + 1}.`, "error");
        }
        return;
      }
    }

    setIsSaving(true);

    if (typeof google !== 'undefined' && google.script) {
      google.script.run
        .withSuccessHandler((res) => {
          setIsSaving(false);
          if (res && res.success) {
            setData(res.data || draftData);
            setIsEditing(false);
            setDraftData(null);
            if (typeof showToast === 'function') {
              showToast("Normatividad de Artículos 33, 34 y 35 actualizada correctamente");

            if (typeof addNotification === 'function') {

            if (typeof showToast === 'function') {
              showToast(res ? res.message : "No se pudieron guardar los cambios", "error");
            }
          }
        })
        .withFailureHandler(() => {
          setIsSaving(false);
          if (typeof showToast === 'function') {
            showToast("Error de conexión con el servidor al actualizar el reglamento", "error");
          }
        })
        .updateArticulosData(draftData, userCode);
    } else {
      setTimeout(() => {
        setIsSaving(false);
        setData(draftData);
        setIsEditing(false);
        setDraftData(null);

              ></textarea>

                    className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 p-3 rounded-xl text-xs text-slate-700 dark:text-slate-200 focus:ring-2 focus:ring-udg-blue outline-none leading-relaxed"

                    <i data-lucide="book-open-check" className="w-4 h-4 shrink-0"></i>

      {/* =====================================================================

 // ============================================================================
// VISTA DEL ALUMNO: HorasIntegralesModule (Acreditación de 64 Horas Integrales)
// ============================================================================
function HorasIntegralesModule({ user, showToast, addNotification }) {
  if (!user) return null;

  const REQUIRED_HOURS = 64;

  // Hidratación segura de iconos Lucide
  useEffect(() => {
    if (window.lucide) {
      window.lucide.createIcons();
    }
  });

  const [isLoading, setIsLoading] = useState(true);
  const [isSubmitting, setIsSubmitting] = useState(false);
  const [isDragging, setIsDragging] = useState(false);

  // Estado de la solicitud actual del alumno ('Ninguna' si no existe registro previo)
  const [solicitudActiva, setSolicitudActiva] = useState(null);

  // Lista dinámica de archivos por subir: [{ id, name, mimeType, base64, evento, horas }]
  const [archivosList, setArchivosList] = useState([]);

  const studentCode = String(user.code || user.codigo || '');
  const studentName = String(user.name || user.nombre || '');
  const studentEmail = String(user.email || user.correo || '');

  const fetchMyHorasStatus = () => {
    setIsLoading(true);
    if (typeof google !== 'undefined' && google.script) {
      google.script.run
        .withSuccessHandler((res) => {
          setSolicitudActiva(res && res.found ? res.solicitud : null);
          setIsLoading(false);
        })
        .withFailureHandler(() => {
          if (typeof showToast === 'function') showToast("Error al verificar tu expediente de horas integrales", "error");
          setSolicitudActiva(null);
          setIsLoading(false);
        })
        .getStudentHorasIntegrales(studentCode);
    } else {
      setTimeout(() => {
        setSolicitudActiva(null);
        setIsLoading(false);
      }, 900);
    }
  };

  useEffect(() => {
    fetchMyHorasStatus();
  }, [studentCode]);

  // Procesar múltiples archivos seleccionados o arrastrados (Drag & Drop)
  const processSelectedFiles = (fileListObj) => {
    const filesArray = Array.from(fileListObj || []);
    if (filesArray.length === 0) return;

    filesArray.forEach((file) => {
      if (file.size > 8 * 1024 * 1024) {
        if (typeof showToast === 'function') showToast(`El archivo "${file.name}" excede el límite de 8 MB`, "error");
        return;
      }
      const reader = new FileReader();
      reader.onloadend = () => {
        const base64String = reader.result.split(',')[1];
        setArchivosList((prev) => [
          ...prev,
          {
            id: `${Date.now()}-${Math.random().toString(36).substring(2, 7)}`,
            name: file.name,
            mimeType: file.type || 'application/pdf',
            base64: base64String,
            evento: '',
            horas: ''
          }
        ]);
      };
      reader.readAsDataURL(file);
    });
  };

  const handleFileInputChange = (e) => {
    processSelectedFiles(e.target.files);
    e.target.value = '';
  };

  const handleDragOver = (e) => {
    e.preventDefault();
    setIsDragging(true);
  };

  const handleDragLeave = (e) => {
    e.preventDefault();
    setIsDragging(false);
  };

  const handleDrop = (e) => {
    e.preventDefault();
    setIsDragging(false);
    if (e.dataTransfer && e.dataTransfer.files) {
      processSelectedFiles(e.dataTransfer.files);
    }
  };

  const handleUpdateFileField = (id, field, value) => {
    setArchivosList((prev) =>
      prev.map((item) => (item.id === id ? { ...item, [field]: value } : item))
    );
  };

  const handleRemoveFile = (id) => {
    setArchivosList((prev) => prev.filter((item) => item.id !== id));
  };

  // Cálculo dinámico del total de horas y validación estricta de campos
  const totalHorasCalculadas = archivosList.reduce((acc, item) => {
    const h = Number(item.horas);
    return acc + (isNaN(h) || h < 0 ? 0 : h);
  }, 0);

  const allFieldsComplete =
    archivosList.length > 0 &&
    archivosList.every(
      (item) => item.evento.trim().length > 0 && Number(item.horas) > 0
    );

  const canSubmit = totalHorasCalculadas >= REQUIRED_HOURS && allFieldsComplete && !isSubmitting;
  const progressPercent = Math.min(100, Math.round((totalHorasCalculadas / REQUIRED_HOURS) * 100));

  const handleSubmitExpediente = (e) => {
    e.preventDefault();
    if (!canSubmit) {
      if (typeof showToast === 'function') {
        showToast("Asegúrate de completar todos los eventos y sumar al menos 64 horas.", "error");
      }
      return;
    }

    setIsSubmitting(true);

    const payload = {
      codigo: studentCode,
      nombre: studentName,
      correo: studentEmail,
      total_horas: totalHorasCalculadas,
      archivos: archivosList.map((f) => ({
        name: f.name,
        mimeType: f.mimeType,
        base64: f.base64,
        evento: f.evento.trim(),
        horas: Number(f.horas)
      }))
    };

    if (typeof google !== 'undefined' && google.script) {
      google.script.run
        .withSuccessHandler((res) => {
          setIsSubmitting(false);
          if (res && res.success) {
            setSolicitudActiva(res.solicitud);
            setArchivosList([]);
            if (typeof showToast === 'function') {
              showToast(`Expediente #${res.solicitud.id_solicitud} enviado correctamente (${totalHorasCalculadas} hrs).`);
            }
            if (typeof addNotification === 'function') {
              addNotification(
                "Expediente de Horas Enviado",
                `Tu solicitud #${res.solicitud.id_solicitud} por ${totalHorasCalculadas} horas está en revisión.`,
                "info"
              );
            }
          } else {
            if (typeof showToast === 'function') {
              showToast(res ? res.message : "Error al enviar el expediente", "error");
            }
          }
        })
        .withFailureHandler(() => {
          setIsSubmitting(false);
          if (typeof showToast === 'function') {
            showToast("Error de conexión al subir los comprobantes a Google Drive", "error");
          }
        })
        .submitHorasIntegrales(payload);

                return (
                  <div
                    key={phase.step}
                    className={`p-5 rounded-2xl border transition-all flex flex-col justify-between ${
                      isCompleted
                        ? 'bg-emerald-50/60 dark:bg-emerald-950/20 border-emerald-300 dark:border-emerald-800'

                      </h5>
                      <p className="text-[11px] text-slate-500 dark:text-slate-400 leading-relaxed">

                      </p>
                    </div>
                  </div>

            </div>

            {/* Resumen de Comprobantes Registrados */}
            {Array.isArray(solicitudActiva.comprobantes) && solicitudActiva.comprobantes.length > 0 && (
              <div className="p-5 rounded-2xl bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 space-y-3">

                        {comp.horas} hrs

                    </div>
                  ))}
                </div>

            )}

        )}
      </div>
    </div>
  );
}

  useEffect(() => {
    if (window.lucide) {
      window.lucide.createIcons();
    }
  });

  const fetchAllExpedientes = () => {
    setIsLoading(true);
    if (typeof google !== 'undefined' && google.script) {
      google.script.run
        .withSuccessHandler((data) => {
          setItems(Array.isArray(data) ? data : []);

        })
        .withFailureHandler(() => {
          if (typeof showToast === 'function') showToast("Error al cargar los expedientes de horas integrales", "error");
          setItems([]);
          setIsLoading(false);
        })
        .getAllHorasIntegrales();
    } else {
      setTimeout(() => {
        setItems([
          {
            id_solicitud: 'HRS-98a2k1',
            codigo_estudiante: '220470399',
            nombre_estudiante: 'Kevin Vazquez Delgado',
            correo_estudiante: 'kevin.vazquez7039@alumnos.udg.mx',
            total_horas: 68,
            estatus: 'Pendiente',
            motivo_devolucion: '',
            fecha_solicitud: '16/10/2026',
            comprobantes: [
              { name: 'constancia_hackathon.pdf', evento: 'Hackathon CUCEI AI 2026', horas: 24, url: '#' },
              { name: 'conferencia_redes.pdf', evento: 'Ciclo de Conferencias IEEE', horas: 20, url: '#' },
              { name: 'taller_docker.pdf', evento: 'Taller Intensivo Docker y Linux', horas: 24, url: '#' }

          }
        ]);
        setIsLoading(false);

    setRejectReason('');
