<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coordinación de Ingeniería en Computación - CUCEI</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            udg: {
              navy: '#0f2744',
              blue: '#1e3a8a',
              royal: '#2563eb',
              light: '#eff6ff',
              gold: '#d97706',
              goldHover: '#b45309',
              amber: '#f59e0b',
              emerald: '#059669',
            }
          },
          fontFamily: {
            sans: ['"Inter"', 'system-ui', 'sans-serif'],
            display: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap');
    
    body { font-family: 'Inter', sans-serif; }
    h1, h2, h3, h4, .font-display { font-family: 'Plus Jakarta Sans', sans-serif; }

    .glass-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); }
    .dark .glass-card { background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(12px); }

    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; }
  </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // === SOLUCIÓN DEFINITIVA PARA LOS ÍCONOS DE LUCIDE ===
    // Este componente aisla las mutaciones del DOM para que React nunca arroje el error "removeChild"
    const LucideIcon = ({ name, className }) => {
      const iconRef = useRef(null);
      useEffect(() => {
        if (iconRef.current && window.lucide) {
          iconRef.current.innerHTML = ''; // Limpiamos para evitar duplicados
          const i = document.createElement('i');
          i.setAttribute('data-lucide', name);
          if (className) i.setAttribute('class', className);
          iconRef.current.appendChild(i);
          window.lucide.createIcons({ root: iconRef.current });
        }
      }, [name, className]);
      return <span ref={iconRef} style={{ display: 'contents' }}></span>;
    };

    const FAQ_LIST = [
      { q: "¿Cómo abro un ticket de atención con la Coordinación?", a: "Accede al módulo 'Mesa de Ayuda y Soporte' (primer elemento del menú) y redacta tu asunto. Recibirás respuesta directa en tu buzón de notificaciones." },
      { q: "¿Cuántos créditos requiero para iniciar Servicio Social?", a: "Debes cumplir con al menos el 60% de créditos del plan INCO (228 créditos acumulados)." },
      { q: "¿Cuáles son las opciones para Titulación Automática?", a: "Promedio general superior a 90 sin reprobadas o dictamen Sobresaliente en EGEL CENEVAL." },
      { q: "¿Cómo solicito un justificante por enfermedad?", a: "Sube tu comprobante médico (IMSS/SSA) en el módulo 'Justificantes' en un lapso no mayor a 5 días hábiles." },
      { q: "¿Qué trámite procede si caigo en Artículo 33?", a: "Genera la carta petición a la Comisión de Educación desde la sección 'Art. 33 y 35'." }
    ];

    // === PUENTE DE COMUNICACIÓN CON APPS SCRIPT ===
    const server = new Proxy({}, {
      get: (target, prop) => {
        return (...args) => {
          return new Promise((resolve, reject) => {
            if (typeof google === 'undefined') {
              console.warn(`Simulando llamada a backend: ${prop}`, args);
              reject(new Error("google.script.run no está disponible. Ejecuta esto dentro de Apps Script."));
              return;
            }
            google.script.run
              .withSuccessHandler(resolve)
              .withFailureHandler(reject)
              [prop](...args);
          });
        };
      }
    });

    const GUEST_USER = { name: "Visitante", role: "Invitado", code: "", gpa: 0, credits: 0, totalCredits: 380, integralHours: 0, requiredHours: 60, status: "Sin sesión", photo: null };

    function App() {
      const [user, setUser] = useState(GUEST_USER);
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [activeTab, setActiveTab] = useState('dudas'); 
      const [darkMode, setDarkMode] = useState(false);
      const [toast, setToast] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [activeModal, setActiveModal] = useState(null); 
      const [userDropdown, setUserDropdown] = useState(false);
      const [mobileNavOpen, setMobileNavOpen] = useState(false);
      
      const [notifOpen, setNotifOpen] = useState(false);
      const [notifications, setNotifications] = useState([]);
      const [globalTickets, setGlobalTickets] = useState([]);
      const [notices, setNotices] = useState([]); 
      const [globalJustificantes, setGlobalJustificantes] = useState([]);

      // Cargar datos reales al iniciar sesión
      useEffect(() => {
        if (isLoggedIn && user.role !== 'Invitado') {
          server.obtenerDatosPlataforma(user.code, user.role)
            .then(res => {
              if (res.exito) {
                setGlobalTickets(res.tickets);
                setNotices(res.avisos);
                setGlobalJustificantes(res.justificantes || []);
              }
            })
            .catch(err => console.error("Error de red cargando datos", err));
        } else {
          setGlobalTickets([]);
          setNotices([]);
          setNotifications([]);
          setGlobalJustificantes([]);
        }
      }, [isLoggedIn, user]);

      const [chatOpen, setChatOpen] = useState(false);
      const [chatMessages, setChatMessages] = useState([
        { sender: 'bot', text: '¡Hola! Bienvenido al portal de la Coordinación de Ingeniería en Computación (CUCEI). ¿En qué trámite o duda de la carrera puedo colaborarte hoy?' }
      ]);
      const [chatInput, setChatInput] = useState('');
      const [chatLoading, setChatLoading] = useState(false);

      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [darkMode]);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      const addNotification = (title, text, type = 'info') => {
        const newNotif = { id: Date.now(), title, text, date: 'Ahora mismo', unread: true, type };
        setNotifications(prev => [newNotif, ...prev]);
      };

      const markAllNotifsRead = () => {
        setNotifications(prev => prev.map(n => ({ ...n, unread: false })));
        showToast("Todas las notificaciones marcadas como leídas");
      };

      const handleUpdateUser = (updatedFields) => {
        setUser(prev => ({ ...prev, ...updatedFields }));
        showToast("Perfil de usuario actualizado correctamente");
        addNotification("Perfil Actualizado", "Tus datos de contacto y foto fueron actualizados.", "success");
      };

      const handleSendChatMessage = async (presetText = null) => {
        const textToSend = presetText || chatInput;
        if (!textToSend.trim()) return;

        const newMessages = [...chatMessages, { sender: 'user', text: textToSend }];
        setChatMessages(newMessages);
        if (!presetText) setChatInput('');
        setChatLoading(true);

        try {
          const systemInstruction = `Eres el Asistente Institucional de la Coordinación de Ingeniería en Computación del CUCEI (Universidad de Guadalajara). Atiendes con profesionalismo, claridad y tono institucional formal sobre trámites, materias, titulación y reglamentos.`;
          const apiKey = "";
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: textToSend }] }],
              systemInstruction: { parts: [{ text: systemInstruction }] }
            })
          });

          const result = await response.json();
          const botReply = result?.candidates?.[0]?.content?.parts?.[0]?.text || 
            "Para un seguimiento presencial o firma de documento, acude a la Coordinación en el Edificio M, Planta Alta (M202) de Lunes a Viernes de 09:00 a 18:00 hrs.";

          setChatMessages(prev => [...prev, { sender: 'bot', text: botReply }]);
        } catch (error) {
          setChatMessages(prev => [...prev, { 
            sender: 'bot', 
            text: '📌 Si requieres atención personalizada, abre un Ticket en la Mesa de Ayuda o acude al módulo M202 en CUCEI.' 
          }]);
        } finally {
          setChatLoading(false);
        }
      };

      const getNavSections = () => {
        if (!isLoggedIn || user.role === 'Invitado') {
          return [
            {
              group: "PORTAL PÚBLICO",
              items: [
                { id: 'dudas', label: 'Preguntas Frecuentes', icon: 'help-circle', badge: 'FAQ' }
              ]
            }
          ];
        }

        if (user.role === 'Coordinacion') {
          return [
            {
              group: "PANEL ADMINISTRATIVO COORDINACIÓN",
              items: [
                { id: 'admin_panel', label: 'Gestión de Tickets y Respuestas', icon: 'life-buoy', badge: `${globalTickets.filter(t => t.status === 'Pendiente').length} pendientes` },
                { id: 'admin_justificantes', label: 'Aprobar Justificantes (Art. 53)', icon: 'shield-check', badge: 'Revisión' },
                { id: 'avisos', label: 'Publicar Avisos Oficiales', icon: 'bell', badge: null },
                { id: 'dudas', label: 'Preguntas Frecuentes FAQ', icon: 'help-circle', badge: null },
              ]
            }
          ];
        }

        if (user.role === 'Docente') {
          return [
            {
              group: "MÓDULOS DOCENTES / PROFESORES",
              items: [
                { id: 'tickets', label: 'Mesa de Ayuda y Tickets', icon: 'life-buoy', badge: 'Atención Directa' },
                { id: 'dudas', label: 'Preguntas Frecuentes', icon: 'help-circle', badge: null },
                { id: 'constancias_docente', label: 'Solicitar Constancia Carga Horaria', icon: 'file-text', badge: 'Docente' },
                { id: 'modulares', label: 'Proyectos Modulares Asesorados', icon: 'layers', badge: null },
                { id: 'avisos', label: 'Avisos de Coordinación', icon: 'bell', badge: '4' },
              ]
            }
          ];
        }

        return [
          {
            group: "SOPORTE Y AYUDA PRIORITARIA",
            items: [
              { id: 'tickets', label: 'Mesa de Ayuda / Tickets', icon: 'life-buoy', badge: 'Soporte' },
              { id: 'dudas', label: 'Preguntas Frecuentes', icon: 'help-circle', badge: 'FAQ' },
              { id: 'inicio', label: 'Inicio Catálogo Dashboard', icon: 'layout-dashboard', badge: null },
              { id: 'avisos', label: 'Avisos Oficiales CUCEI', icon: 'bell', badge: null },
            ]
          },
          {
            group: "TRÁMITES Y SOLICITUDES ESTUDIANTILES",
            items: [
              { id: 'justificantes', label: 'Justificante Médico (Art. 53)', icon: 'shield-check', badge: 'Faltas' },
              { id: 'ajuste', label: 'Ajuste de Materias/Cupos', icon: 'sliders', badge: 'SIIAU' },
              { id: 'art33_35', label: 'Dictamen Art. 33 y 35', icon: 'scale', badge: 'Comisión' },
            ]
          },
          {
            group: "GESTIÓN ACADÉMICA INCO",
            items: [
              { id: 'constancias', label: 'Kardex y Constancias', icon: 'file-text', badge: 'Digital' },
              { id: 'titulacion', label: 'Opciones de Titulación', icon: 'graduation-cap', badge: 'EGEL' },
              { id: 'modulares', label: 'Proyectos Modulares I, II, III', icon: 'layers', badge: 'Protocolo' },
              { id: 'horas', label: 'Horas Integrales', icon: 'award', badge: `${user.integralHours || 52}/60h` },
              { id: 'malla', label: 'Malla Curricular INCO', icon: 'grid', badge: null },
            ]
          }
        ];
      };

      const unreadCount = notifications.filter(n => n.unread).length;

      return (
        <div className="min-h-screen flex flex-col bg-slate-100 dark:bg-slate-900 selection:bg-udg-blue selection:text-white">
          
          {toast && (
            <div className={`fixed top-5 right-5 z-50 flex items-center gap-3 px-4 py-3 rounded-2xl shadow-2xl border text-xs font-semibold animate-in fade-in slide-in-from-top-2 ${
              toast.type === 'error' 
                ? 'bg-red-50 border-red-200 text-red-700 dark:bg-red-950/90 dark:border-red-800 dark:text-red-200' 
                : 'bg-emerald-50 border-emerald-200 text-emerald-800 dark:bg-emerald-950/90 dark:border-emerald-800 dark:text-emerald-200'
            }`}>
              <LucideIcon name={toast.type === 'error' ? 'alert-circle' : 'check-circle-2'} className="w-5 h-5 shrink-0" />
              <span>{toast.message}</span>
            </div>
          )}

          <header className="bg-udg-navy text-white sticky top-0 z-40 border-b border-slate-800 shadow-lg backdrop-blur-md bg-opacity-95">
            <div className="bg-slate-950/80 px-4 py-1 text-[11px] font-medium text-slate-300 border-b border-slate-800">
              <div className="max-w-7xl mx-auto flex justify-between items-center">
                <div className="flex items-center gap-3">
                  <span className="font-bold text-udg-gold tracking-wide">Universidad de Guadalajara</span>
                  <span className="hidden sm:inline text-slate-600">•</span>
                  <span className="hidden sm:inline text-slate-300">Centro Universitario de Ciencias Exactas e Ingenierías</span>
                </div>
                <div className="flex items-center gap-3">
                  <span className="text-emerald-400 font-bold bg-emerald-950/60 px-2 py-0.5 rounded border border-emerald-800/60">Ciclo Lectivo: 2026B</span>
                  <span className="text-slate-600">|</span>
                  <a href="https://siiau.udg.mx" target="_blank" className="hover:text-udg-gold transition-colors">Portal SIIAU</a>
                </div>
              </div>
            </div>

            <div className="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-4">
              
              <div className="flex items-center gap-3">
                <button 
                  onClick={() => setMobileNavOpen(!mobileNavOpen)}
                  className="lg:hidden p-2 rounded-xl bg-slate-800 text-slate-200 hover:bg-slate-700"
                >
                  <LucideIcon name="menu" className="w-5 h-5" />
                </button>

                <div className="flex items-center gap-3 cursor-pointer group" onClick={() => setActiveTab(user.role === 'Coordinacion' ? 'admin_panel' : 'tickets')}>
                  <div className="w-10 h-10 rounded-2xl bg-white p-1 flex items-center justify-center shadow-lg border border-slate-200 shrink-0 transform group-hover:scale-105 transition-transform">
                    <div className="text-center leading-none">
                      <span className="block font-black text-xs text-udg-navy tracking-tight">UDG</span>
                      <span className="block font-extrabold text-[9px] text-udg-gold">CUCEI</span>
                    </div>
                  </div>

                  <div>
                    <h1 className="text-base sm:text-lg font-extrabold tracking-tight text-white group-hover:text-udg-gold transition-colors leading-tight font-display">
                      Ingeniería en Computación
                    </h1>
                    <p className="text-[11px] text-slate-300 flex items-center gap-1.5">
                      <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                      Módulo M202 • Portal Institucional
                    </p>
                  </div>
                </div>
              </div>

              <div className="flex items-center gap-2 sm:gap-3">
                
                <div className="relative">
                  <button 
                    onClick={() => setNotifOpen(!notifOpen)}
                    className="p-2 rounded-xl bg-slate-800/90 hover:bg-slate-700 text-slate-200 border border-slate-700 transition-all relative flex items-center justify-center"
                    title="Bandeja de Notificaciones"
                  >
                    <LucideIcon name="bell" className="w-4 h-4 text-udg-gold" />
                    {unreadCount > 0 && (
                      <span className="absolute -top-1 -right-1 bg-red-600 text-white font-bold text-[10px] w-4 h-4 rounded-full flex items-center justify-center shadow animate-bounce">
                        {unreadCount}
                      </span>
                    )}
                  </button>

                  {notifOpen && (
                    <div className="absolute right-0 mt-3 w-80 sm:w-96 bg-white dark:bg-slate-800 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-700 py-3 z-50 text-slate-800 dark:text-slate-100 text-xs animate-in fade-in slide-in-from-top-2">
                      <div className="px-4 pb-2 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center">
                        <div className="flex items-center gap-2">
                          <LucideIcon name="bell-ring" className="w-4 h-4 text-udg-gold" />
                          <h4 className="font-bold text-sm font-display">Notificaciones en Vivo</h4>
                        </div>
                        {unreadCount > 0 && (
                          <button onClick={markAllNotifsRead} className="text-[10px] text-udg-blue dark:text-blue-400 hover:underline font-semibold">
                            Marcar leídas
                          </button>
                        )}
                      </div>

                      <div className="max-h-72 overflow-y-auto custom-scrollbar divide-y divide-slate-100 dark:divide-slate-700/60">
                        {notifications.length === 0 ? (
                          <p className="p-4 text-center text-slate-400">No tienes notificaciones pendientes.</p>
                        ) : (
                          notifications.map(n => (
                            <div key={n.id} className={`p-3.5 transition-colors ${n.unread ? 'bg-blue-50/70 dark:bg-slate-700/50' : 'hover:bg-slate-50 dark:hover:bg-slate-700/30'}`}>
                              <div className="flex justify-between items-start gap-2">
                                <h5 className="font-bold text-slate-900 dark:text-white leading-tight flex items-center gap-1.5">
                                  {n.unread && <span className="w-2 h-2 rounded-full bg-udg-gold shrink-0"></span>}
                                  {n.title}
                                </h5>
                                <span className="text-[10px] text-slate-400 shrink-0">{n.date}</span>
                              </div>
                              <p className="text-slate-600 dark:text-slate-300 text-[11px] mt-1 leading-relaxed">{n.text}</p>
                            </div>
                          ))
                        )}
                      </div>

                      <div className="px-4 pt-2 border-t border-slate-100 dark:border-slate-700 text-center">
                        <span className="text-[10px] text-slate-400">Notificaciones automáticas del sistema INCO</span>
                      </div>
                    </div>
                  )}
                </div>

                <button 
                  onClick={() => setDarkMode(!darkMode)}
                  className="p-2 rounded-xl bg-slate-800/90 hover:bg-slate-700 text-slate-200 border border-slate-700 transition-all text-xs flex items-center gap-1.5"
                  title="Cambiar Contraste"
                >
                  <LucideIcon name={darkMode ? 'sun' : 'moon'} className="w-4 h-4 text-udg-gold" />
                  <span className="hidden md:inline text-[11px] font-medium">{darkMode ? 'Claro' : 'Oscuro'}</span>
                </button>

                {isLoggedIn && user.role !== 'Invitado' ? (
                  <div className="relative">
                    <button 
                      onClick={() => setUserDropdown(!userDropdown)}
                      className="flex items-center gap-2.5 bg-slate-800 hover:bg-slate-700/90 p-1.5 pr-3 rounded-2xl border border-slate-700 transition-all text-left"
                    >
                      <div className="w-9 h-9 rounded-xl overflow-hidden bg-udg-blue text-white flex items-center justify-center font-bold text-xs border border-blue-400/40 shrink-0">
                        {user.photo ? (
                          <img src={user.photo} alt={user.name} className="w-full h-full object-cover" />
                        ) : (
                          user.name ? user.name.charAt(0) : 'U'
                        )}
                      </div>
                      <div className="hidden sm:block">
                        <p className="text-xs font-bold text-white leading-tight">{user.name.split(' ')[0]} {user.name.split(' ')[2] || ''}</p>
                        <span className={`text-[9px] font-black uppercase px-1.5 py-0.2 rounded ${
                          user.role === 'Coordinacion' 
                            ? 'bg-amber-500 text-slate-950' 
                            : user.role === 'Docente' 
                              ? 'bg-emerald-500 text-white' 
                              : 'bg-blue-500 text-white'
                        }`}>
                          {user.role}
                        </span>
                      </div>
                      <LucideIcon name="chevron-down" className="w-4 h-4 text-slate-400" />
                    </button>

                    {userDropdown && (
                      <div className="absolute right-0 mt-3 w-80 bg-white dark:bg-slate-800 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-700 py-2 z-50 text-slate-800 dark:text-slate-100 text-xs">
                        <div className="px-4 py-3 border-b border-slate-100 dark:border-slate-700 flex items-center gap-3">
                          <div className="w-12 h-12 rounded-xl overflow-hidden bg-slate-100 dark:bg-slate-700 shrink-0 border border-slate-300 dark:border-slate-600 shadow-inner">
                            {user.photo ? (
                              <img src={user.photo} alt={user.name} className="w-full h-full object-cover" />
                            ) : (
                              <div className="w-full h-full flex items-center justify-center font-bold text-slate-600 dark:text-slate-200 text-base">{user.name ? user.name.charAt(0) : 'U'}</div>
                            )}
                          </div>
                          <div className="overflow-hidden">
                            <p className="font-bold text-slate-900 dark:text-white truncate font-display">{user.name}</p>
                            <p className="text-[10px] text-slate-500 dark:text-slate-400 truncate">{user.email}</p>
                            <p className="text-[10px] text-udg-gold font-mono font-semibold">Rol: {user.role}</p>
                          </div>
                        </div>

                        <button 
                          onClick={() => { setActiveModal('edit_profile'); setUserDropdown(false); }}
                          className="w-full text-left px-4 py-2.5 hover:bg-slate-50 dark:hover:bg-slate-700/60 flex items-center gap-2.5 text-udg-navy dark:text-blue-300 font-semibold"
                        >
                          <LucideIcon name="camera" className="w-4 h-4 text-udg-gold" />
                          <span>Cambiar Foto y Editar Datos</span>
                        </button>

                        <div className="border-t border-slate-100 dark:border-slate-700 my-1"></div>
                        <button 
                          onClick={() => { 
                            setIsLoggedIn(false); 
                            setUser(GUEST_USER);
                            setActiveTab('dudas');
                            setUserDropdown(false);
                            showToast("Sesión cerrada correctamente", "error"); 
                          }}
                          className="w-full text-left px-4 py-2.5 text-red-600 hover:bg-red-50 dark:hover:bg-red-950/40 flex items-center gap-2.5 font-semibold"
                        >
                          <LucideIcon name="log-out" className="w-4 h-4" />
                          <span>Cerrar Sesión</span>
                        </button>
                      </div>
                    )}
                  </div>
                ) : (
                  <div className="flex items-center gap-2">
                    <button 
                      onClick={() => setActiveModal('register')}
                      className="bg-udg-gold hover:bg-udg-goldHover text-white font-bold px-3.5 py-2 rounded-xl transition-all text-xs flex items-center gap-1.5 shadow-sm"
                    >

    function JustificanteDetailModal({ 
  isOpen, 
  list, 
  currentIndex, 
  setCurrentIndex, 
  onClose, 
  onDictamen, 
  loadingId, 
  userRole 
}) {
  // Ajuste automático si el arreglo se reduce (ej. al aprobar el último elemento)
  useEffect(() => {
    if (isOpen && list.length > 0 && currentIndex >= list.length) {
      setCurrentIndex(list.length - 1);
    } else if (isOpen && list.length === 0) {
      onClose();
    }
  }, [list.length, currentIndex, isOpen, onClose]);

  if (!isOpen || list.length === 0 || !list[currentIndex]) return null;

  const j = list[currentIndex];
  const isAdmin = userRole === 'Coordinacion';

  const formatFechaLimpia = (fechaStr) => {
    if (!fechaStr) return 'N/A';
    if (typeof fechaStr === 'string' && fechaStr.includes('GMT')) {
      const d = new Date(fechaStr);
      if (!isNaN(d.getTime())) return d.toLocaleDateString('es-MX', { day: '2-digit', month: '2-digit', year: 'numeric' });
    }
    return String(fechaStr).split('T')[0];

function JustificantesModule({ showToast, addNotification, isLoggedIn, setActiveModal, user, globalJustificantes = [], setGlobalJustificantes = () => {} }) {
  const [reason, setReason] = useState('Salud');
  const [startDate, setStartDate] = useState('');
  const [endDate, setEndDate] = useState('');
  const [teachers, setTeachers] = useState('');
  const [fileObj, setFileObj] = useState(null);
  const [loading, setLoading] = useState(false);

  // PAGINACIÓN Y ESTADOS MODAL
  const [currentPage, setCurrentPage] = useState(1);
  const [itemsPerPage, setItemsPerPage] = useState(5);
  const [modalData, setModalData] = useState({ isOpen: false, index: 0 });

  const listaJustificantes = Array.isArray(globalJustificantes) ? globalJustificantes : [];
  
  const totalItems = listaJustificantes.length;
  const totalPages = Math.ceil(totalItems / itemsPerPage) || 1;
  const indexOfLastItem = currentPage * itemsPerPage;
  const indexOfFirstItem = indexOfLastItem - itemsPerPage;
  const currentItems = listaJustificantes.slice(indexOfFirstItem, indexOfLastItem);

  const formatFechaLimpia = (fechaStr) => {
    if (!fechaStr) return 'N/A';
    if (typeof fechaStr === 'string' && fechaStr.includes('GMT')) {
      const d = new Date(fechaStr);
      if (!isNaN(d.getTime())) return d.toLocaleDateString('es-MX', { day: '2-digit', month: '2-digit', year: 'numeric' });
    }
    return String(fechaStr).split('T')[0];
  };

  const handleFileChange = (e) => {
    const file = e.target.files[0];
    if (file) {
      const allowedTypes = ['application/pdf', 'image/jpeg', 'image/png', 'image/webp'];
      if (!allowedTypes.includes(file.type)) return showToast("Formato no válido. JPG, PNG o PDF.", "error");
      if (file.size > 5 * 1024 * 1024) return showToast("Archivo demasiado grande. Máximo 5MB.", "error");
      const reader = new FileReader();
      reader.onloadend = () => setFileObj({ name: file.name, data: reader.result });
      reader.readAsDataURL(file);
    }
  };

  const handleSubmit = async (e) => {
    e.preventDefault();
    if (!isLoggedIn) return setActiveModal('login');
    if (!startDate || !endDate || !teachers) return showToast("Ingresa fechas y materias afectadas", "error");
    if (new Date(endDate) < new Date(startDate)) return showToast("La fecha de fin no puede ser anterior al inicio.", "error");
    if (!fileObj) return showToast("Debes adjuntar un comprobante.", "error");

    setLoading(true);
    const datos = { code: user.code, student: user.name, reason, teachers, startDate, endDate, fileName: fileObj.name, fileData: fileObj.data };
    try {
      const respuesta = await server.registrarJustificante(datos);
      if (respuesta.exito) {
        if (typeof setGlobalJustificantes === 'function') setGlobalJustificantes([respuesta.justificante, ...listaJustificantes]);
        showToast("Solicitud enviada a revisión.");
        addNotification("Justificante Registrado", "Tu justificante fue recibido.", "info");
        setStartDate(''); setEndDate(''); setTeachers(''); setFileObj(null);
        const fileInput = document.getElementById('file-upload');
        if (fileInput) fileInput.value = '';
      } else {
        showToast(respuesta.mensaje, "error");
      }
    } catch (error) {
      showToast("Error de conexión al subir el archivo.", "error");
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="space-y-6">
      
      {/* Modal Alumno (Pasa la lista no filtrada porque el alumno no filtra) */}
      <JustificanteDetailModal 
        isOpen={modalData.isOpen} 
        list={listaJustificantes} 
        currentIndex={modalData.index}
        setCurrentIndex={(newIndex) => setModalData({ ...modalData, index: newIndex })}
        onClose={() => setModalData({ isOpen: false, index: 0 })}
        onDictamen={() => {}} // El alumno no dictamina
        loadingId={null}
        userRole="Estudiante"
      />

      <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm space-y-5">
        <div className="flex items-center gap-3 border-b border-slate-100 dark:border-slate-700 pb-4">
          <div className="w-10 h-10 rounded-xl bg-udg-light dark:bg-slate-700 text-udg-navy dark:text-blue-300 flex items-center justify-center font-bold">
            <LucideIcon name="shield-check" className="w-5 h-5" />
          </div>
          <div>
            <h3 className="text-lg font-bold text-slate-900 dark:text-white font-display">Justificante de Faltas (Art. 53)</h3>
            <p className="text-xs text-slate-500 dark:text-slate-400">Plazo máximo de entrega: 5 días hábiles.</p>
          </div>
        </div>

        <form onSubmit={handleSubmit} className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
          <div className="md:col-span-2 bg-slate-50 dark:bg-slate-900/50 p-3 rounded-xl border border-slate-200 flex justify-between items-center">
            <span className="font-semibold text-slate-600">Solicitante:</span>
            <span className="font-bold text-slate-900 text-sm">{user.name} <span className="font-mono text-udg-blue">({user.code})</span></span>
          </div>
          <div>
            <label className="block font-semibold mb-1">Motivo</label>
            <select value={reason} onChange={(e) => setReason(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-udg-blue"><option value="Salud">Incapacidad Médica</option><option value="Comision">Comisión Institucional</option><option value="Personal">Fuerza Mayor</option></select>
          </div>
          <div>
            <label className="block font-semibold mb-1">Materias y Profesores</label>
            <input type="text" placeholder="Ej. Redes (Dr. Pérez)" value={teachers} onChange={(e) => setTeachers(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-udg-blue" />
          </div>
          <div>
            <label className="block font-semibold mb-1">Fecha de Inicio</label>
            <input type="date" value={startDate} onChange={(e) => setStartDate(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-udg-blue" />
          </div>
          <div>
            <label className="block font-semibold mb-1">Fecha de Fin</label>
            <input type="date" value={endDate} onChange={(e) => setEndDate(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-udg-blue" />
          </div>
          <div className="md:col-span-2">
            <label className="block font-semibold mb-1">Anexo Digital (PDF, JPG, PNG)</label>
            <input id="file-upload" type="file" accept=".pdf,image/jpeg,image/png,image/webp" onChange={handleFileChange} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 text-slate-500 file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-udg-navy file:text-white" />
          </div>
          <div className="md:col-span-2 pt-2 flex justify-end">
            <button type="submit" disabled={loading} className="bg-udg-navy hover:bg-udg-blue text-white font-bold px-6 py-2.5 rounded-xl flex items-center gap-2 shadow-md disabled:opacity-70">
              {loading ? <LucideIcon name="loader-2" className="w-4 h-4 animate-spin" /> : <LucideIcon name="upload-cloud" className="w-4 h-4" />}<span>Enviar Solicitud</span>
            </button>
          </div>
        </form>
      </div>

      {/* Historial de Tarjetas (Mismo diseño GRID) */}
      <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
        <h4 className="text-sm font-bold text-slate-900 dark:text-white flex items-center gap-2 font-display mb-4">
          <LucideIcon name="history" className="w-4 h-4 text-udg-gold" />
          Mi Historial de Justificantes ({totalItems})
        </h4>

        <div className="space-y-4 text-xs">
          {totalItems === 0 ? (
            <p className="text-slate-400 py-6 text-center border border-dashed border-slate-200 rounded-xl">No has enviado solicitudes.</p>
          ) : (
            currentItems.map((j, indexLocal) => {
              const indexGlobal = listaJustificantes.findIndex(obj => obj.id === j.id);
              return (
                <div key={j.id} className="p-5 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
                  <div className="flex justify-between items-center border-b border-slate-100 dark:border-slate-700/80 pb-3">
                    <div>
                      <h4 className="font-bold text-slate-900 dark:text-white font-display">Solicitud #{j.id}</h4>
                      <p className="text-[11px] text-slate-400 mt-1">Enviado el: {formatFechaLimpia(j.date)}</p>
                    </div>
                    <span className={`px-3 py-1 rounded-full text-[10px] font-extrabold uppercase tracking-wider ${j.status === 'Aprobado' ? 'bg-emerald-100 text-emerald-800 border-emerald-300' : j.status === 'Rechazado' ? 'bg-red-100 text-red-800 border-red-300' : 'bg-amber-100 text-amber-900 border-amber-300 animate-pulse'}`}>
                      {j.status}
                    </span>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <div className="bg-slate-50 dark:bg-slate-900/60 p-3 rounded-xl border border-slate-100"><span className="text-[10px] font-extrabold uppercase text-slate-400 block mb-1">Motivo</span><span className="font-bold">{j.reason}</span></div>
                    <div className="bg-slate-50 dark:bg-slate-900/60 p-3 rounded-xl border border-slate-100"><span className="text-[10px] font-extrabold uppercase text-slate-400 block mb-1">Período</span><span className="font-bold">Del {formatFechaLimpia(j.startDate)} al {formatFechaLimpia(j.endDate || j.startDate)}</span></div>
                    <div className="bg-slate-50 dark:bg-slate-900/60 p-3 rounded-xl border border-slate-100"><span className="text-[10px] font-extrabold uppercase text-slate-400 block mb-1">Materias</span><span className="font-bold truncate block">{j.teachers}</span></div>
                  </div>

                  <div className="pt-2 flex justify-start">
                    <button onClick={() => setModalData({ isOpen: true, index: indexGlobal })} className="bg-slate-900 dark:bg-slate-700 hover:bg-slate-800 text-white px-5 py-2.5 rounded-xl font-bold transition-all flex items-center gap-2 shadow-sm text-xs">
                      <LucideIcon name="maximize-2" className="w-4 h-4 text-udg-gold" /> Ver Detalles Completos
                    </button>
                  </div>
                </div>
              );
            })
          )}
        </div>

        {totalItems > 0 && (
          <div className="flex flex-col sm:flex-row justify-between items-center gap-3 pt-4 border-t border-slate-100 dark:border-slate-700 text-slate-500 font-medium text-xs">
            <div className="flex items-center gap-2">
              <span>Mostrar:</span>
              <select value={itemsPerPage} onChange={(e) => setItemsPerPage(Number(e.target.value))} className="bg-slate-100 dark:bg-slate-900 border rounded-lg px-2 py-1 outline-none font-bold text-slate-700">

      </div>
    </div>
  );

function AdminJustificantesModule({ showToast, addNotification, globalJustificantes = [], setGlobalJustificantes }) {

    if (!fechaStr) return 'N/A';

    }
    return String(fechaStr).split('T')[0];

        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/75 backdrop-blur-sm animate-in fade-in">
          <div className="bg-white dark:bg-slate-800 rounded-2xl max-w-md w-full border border-slate-200 dark:border-slate-700 shadow-2xl overflow-hidden relative text-slate-800 dark:text-slate-100">
            
            <div className="bg-udg-navy p-5 text-white flex justify-between items-center">
              <div className="flex items-center gap-2.5">
                <LucideIcon name="user-cog" className="w-5 h-5 text-udg-gold" />
                <h3 className="font-bold text-base font-display">Actualizar Datos de Perfil</h3>
              </div>
              <button onClick={onClose} className="text-slate-300 hover:text-white p-1">
                <LucideIcon name="x" className="w-5 h-5" />
              </button>
            </div>

            <form onSubmit={handleSave} className="p-6 space-y-4 text-xs">
              
              <div className="flex flex-col items-center justify-center p-3 bg-slate-50 dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-700">
                <div className="w-20 h-20 rounded-2xl overflow-hidden bg-slate-200 dark:bg-slate-800 border-2 border-white dark:border-slate-700 shadow-md mb-2">
                  {photoPreview ? (
                    <img src={photoPreview} alt="Foto Perfil" className="w-full h-full object-cover" />
                  ) : (
                    <div className="w-full h-full flex items-center justify-center font-bold text-xl text-slate-500">{user.name ? user.name.charAt(0) : 'U'}</div>
                  )}
                </div>
                <label className="cursor-pointer bg-slate-800 hover:bg-slate-700 text-white px-3 py-1.5 rounded-xl text-xs font-semibold transition-all flex items-center gap-1.5">
                  <LucideIcon name="upload" className="w-3.5 h-3.5 text-udg-gold" />
                  <span>Seleccionar Nueva Foto</span>
                  <input type="file" accept="image/*" onChange={handleImageChange} className="hidden" />
                </label>
              </div>

              <div>
                <label className="block font-semibold text-slate-700 dark:text-slate-300 mb-1">Nombre Registrado</label>
                <input type="text" disabled value={user.name} className="w-full bg-slate-100 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 p-2.5 rounded-xl text-slate-500 font-medium" />
              </div>

              <div>
                <label className="block font-semibold text-slate-700 dark:text-slate-300 mb-1">Teléfono Móvil de Contacto</label>
                <input
                  type="tel"
                  value={phone}
                  onChange={(e) => setPhone(e.target.value)}
                  className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-2.5 rounded-xl font-mono text-xs focus:ring-2 focus:ring-udg-blue outline-none"
                />
              </div>

              <div>
                <label className="block font-semibold text-slate-700 dark:text-slate-300 mb-1">Correo Electrónico</label>
                <input
                  type="email"
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-2.5 rounded-xl text-xs focus:ring-2 focus:ring-udg-blue outline-none"
                />
              </div>

              <div className="pt-2 flex gap-2">
                <button
                  type="button"
                  onClick={onClose}
                  className="flex-1 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 font-semibold py-2.5 rounded-xl"
                >
                  Cancelar
                </button>
                <button
                  type="submit"
                  className="flex-1 bg-udg-navy hover:bg-udg-blue text-white font-bold py-2.5 rounded-xl shadow-md font-display"
                >
                  Guardar Cambios
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }
    
function RegisterModal({ onClose, onRegister, onOpenLogin }) {
      const [step, setStep] = useState(1); // Controla en qué pantalla estamos (1: Datos, 2: Código)
      const [generatedCode, setGeneratedCode] = useState(''); // Guarda el código enviado
      const [inputCode, setInputCode] = useState(''); // Lo que el usuario teclea
      
      const [name, setName] = useState('');
      const [code, setCode] = useState('');
      const [email, setEmail] = useState('');
      const [phone, setPhone] = useState('');
      const [nip, setNip] = useState('');
      const [photoPreview, setPhotoPreview] = useState(null);
      
      const [errorMsg, setErrorMsg] = useState('');
      const [loading, setLoading] = useState(false);

      const handleImageChange = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => { setPhotoPreview(reader.result); };
          reader.readAsDataURL(file);
        }
      };

      // PASO 1: Validar datos y enviar el correo con el código
      const handleSendCode = async (e) => {
        e.preventDefault();
        setErrorMsg('');

        if (!name.trim() || !code.trim() || !email.trim() || !phone.trim() || !nip.trim()) {
          setErrorMsg('Por favor completa todos los campos requeridos.');
          return;
        }

        setLoading(true);
        try {
          const respuesta = await server.enviarCodigoVerificacion(email, name);
          if (respuesta.exito) {
            setGeneratedCode(respuesta.codigoGenerado);
            setStep(2); // Avanzamos a la pantalla de verificación
            setLoading(false);
          } else {
            setErrorMsg(respuesta.mensaje);
            setLoading(false);
          }
        } catch (error) {
          setErrorMsg("Error al intentar enviar el correo de verificación.");
          setLoading(false);
        }
      };

      // PASO 2: Verificar el código ingresado y guardar en base de datos
      const handleVerifyAndRegister = async () => {
        setErrorMsg('');
        if (inputCode !== generatedCode) {
          setErrorMsg('El código ingresado es incorrecto.');
          return;
        }

        const nuevoUsuario = {
          code: code, name: name, role: "Estudiante", email: email, nip: nip, photo: photoPreview || null
        };

        setLoading(true);
        try {
          const respuesta = await server.registrarUsuario(nuevoUsuario);
          if (respuesta.exito) {
            onRegister(respuesta.usuario);
          } else {
            setErrorMsg(respuesta.mensaje);
            // Si el error es por código UDG duplicado, lo regresamos al paso 1
            if(respuesta.mensaje.includes('registrado')) {
              setTimeout(() => setStep(1), 2000);
            }
            setLoading(false);
          }
        } catch (error) {
          setErrorMsg("Error al conectar con la base de datos.");
          setLoading(false);
        }
      };

      // RENDERIZADO DEL PASO 2 (Pantalla de Verificación de Correo)
      if (step === 2) {
        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/75 backdrop-blur-sm animate-in fade-in">
            <div className="bg-white dark:bg-slate-800 rounded-2xl max-w-sm w-full border border-slate-200 dark:border-slate-700 shadow-2xl relative text-slate-800 dark:text-slate-100 p-8 text-center flex flex-col items-center">
              
              <div className="w-16 h-16 bg-blue-50 dark:bg-slate-700 rounded-full flex items-center justify-center mb-4 border-4 border-blue-100 dark:border-slate-600">
                <LucideIcon name="mail" className="w-8 h-8 text-udg-blue dark:text-blue-400" />
              </div>
              
              <h3 className="font-bold text-xl font-display mb-2">Revisa tu correo</h3>
              <p className="text-xs text-slate-500 dark:text-slate-400 mb-6 leading-relaxed">
                Hemos enviado un código de seguridad de 6 dígitos a <br/><b className="text-slate-800 dark:text-slate-200">{email}</b>
              </p>
              
              <div className={`p-3 rounded-xl bg-red-50 border border-red-200 text-red-700 text-xs font-semibold w-full flex items-center justify-center gap-2 mb-4 ${errorMsg ? 'flex' : 'hidden'}`}>
                <LucideIcon name="alert-circle" className="w-4 h-4 shrink-0" />
                <span>{errorMsg}</span>
              </div>

              <input 
                type="text" 
                maxLength="6" 
                value={inputCode} 
                onChange={(e) => setInputCode(e.target.value)} 
                placeholder="000000" 
                className="w-full text-center text-3xl tracking-[0.5em] font-mono bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-4 rounded-xl mb-6 outline-none focus:ring-2 focus:ring-udg-blue" 
              />
              
              <button 
                onClick={handleVerifyAndRegister} 
                disabled={loading || inputCode.length !== 6} 
                className="w-full bg-udg-navy hover:bg-udg-blue text-white font-bold py-3.5 rounded-xl shadow-md disabled:opacity-50 transition-all mb-3 flex items-center justify-center gap-2"
              >
                {loading ? <LucideIcon name="loader-2" className="w-4 h-4 animate-spin" /> : <LucideIcon name="check-circle" className="w-4 h-4" />}
                <span>{loading ? 'Creando cuenta...' : 'Verificar y Registrar'}</span>
              </button>
              
              <button 
                onClick={() => { setStep(1); setInputCode(''); setErrorMsg(''); }} 
                disabled={loading} 
                className="text-xs text-slate-500 font-semibold hover:text-slate-800 dark:hover:text-slate-300"
              >
                Corregir correo o datos
              </button>
            </div>
          </div>
        );
      }

      // RENDERIZADO DEL PASO 1 (Formulario de Datos - Original)
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/75 backdrop-blur-sm animate-in fade-in">
          <div className="bg-white dark:bg-slate-800 rounded-2xl max-w-lg w-full border border-slate-200 dark:border-slate-700 shadow-2xl overflow-hidden relative text-slate-800 dark:text-slate-100 max-h-[90vh] flex flex-col">
            
            <div className="bg-udg-navy p-5 text-white flex justify-between items-center shrink-0">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-udg-gold text-white flex items-center justify-center font-black text-xs shadow-md">UDG</div>
                <div>
                  <h3 className="font-bold text-base font-display">Registro de Estudiante</h3>
                  <p className="text-[11px] text-slate-300">Paso 1 de 2: Datos Generales</p>
                </div>
              </div>
              <button onClick={onClose} className="text-slate-300 hover:text-white p-1"><LucideIcon name="x" className="w-5 h-5" /></button>
            </div>

            <form onSubmit={handleSendCode} className="p-6 overflow-y-auto space-y-4 text-xs custom-scrollbar">
              
              <div className={`p-3 rounded-xl bg-red-50 border border-red-200 text-red-700 font-semibold flex items-center gap-2 ${errorMsg ? 'flex' : 'hidden'}`}>
                <LucideIcon name="alert-circle" className="w-4 h-4 shrink-0" /><span>{errorMsg}</span>
              </div>

              <div className="flex flex-col items-center justify-center p-4 bg-slate-50 dark:bg-slate-900 rounded-2xl border-2 border-dashed border-slate-200 dark:border-slate-700">
                <div className="w-20 h-20 rounded-2xl overflow-hidden bg-slate-200 dark:bg-slate-800 border-2 border-white dark:border-slate-700 shadow-sm flex items-center justify-center text-slate-400 mb-2">
                  {photoPreview ? <img src={photoPreview} className="w-full h-full object-cover" /> : <LucideIcon name="user" className="w-8 h-8" />}
                </div>
                <label className="cursor-pointer bg-udg-navy hover:bg-udg-blue text-white px-3.5 py-1.5 rounded-xl text-xs font-semibold transition-all flex items-center gap-1.5">
                  <LucideIcon name="camera" className="w-4 h-4 text-udg-gold" /><span>{photoPreview ? 'Cambiar Foto' : 'Subir Foto'}</span>
                  <input type="file" accept="image/*" onChange={handleImageChange} className="hidden" />
                </label>
              </div>

              <div><label className="block font-semibold mb-1">Nombre Completo *</label><input type="text" value={name} onChange={(e) => setName(e.target.value)} className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-2.5 rounded-xl outline-none focus:ring-2 focus:ring-udg-blue" /></div>
              
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div><label className="block font-semibold mb-1">Código UdG *</label><input type="text" value={code} onChange={(e) => setCode(e.target.value)} className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-2.5 rounded-xl font-mono outline-none focus:ring-2 focus:ring-udg-blue" /></div>
                <div><label className="block font-semibold mb-1">Teléfono Móvil *</label><input type="tel" value={phone} onChange={(e) => setPhone(e.target.value)} className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-2.5 rounded-xl font-mono outline-none focus:ring-2 focus:ring-udg-blue" /></div>
              </div>
              
              <div><label className="block font-semibold mb-1">Correo Institucional / Personal *</label><input type="email" value={email} onChange={(e) => setEmail(e.target.value)} className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-2.5 rounded-xl outline-none focus:ring-2 focus:ring-udg-blue" /></div>
              <div><label className="block font-semibold mb-1">NIP SIIAU *</label><input type="password" value={nip} onChange={(e) => setNip(e.target.value)} className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-2.5 rounded-xl font-mono outline-none focus:ring-2 focus:ring-udg-blue" /></div>

              <button type="submit" disabled={loading} className="w-full bg-udg-gold hover:bg-udg-goldHover text-white font-bold py-3 rounded-xl transition-all shadow-md font-display disabled:opacity-70 mt-2 flex items-center justify-center gap-2">
                {loading ? <LucideIcon name="loader-2" className="w-4 h-4 animate-spin" /> : <LucideIcon name="send" className="w-4 h-4" />}
                <span>{loading ? 'Enviando código...' : 'Continuar al Paso 2'}</span>
              </button>

              <div className="text-center pt-2">
                <button type="button" onClick={onOpenLogin} className="text-udg-blue dark:text-blue-400 font-semibold hover:underline">¿Ya tienes cuenta? Inicia sesión aquí</button>
              </div>
            </form>
          </div>
        </div>
      );
    }
    function LoginModal({ onClose, onLogin, onOpenRegister }) {
      const [roleType, setRoleType] = useState('Estudiante');
      const [code, setCode] = useState('');
      const [nip, setNip] = useState('');
      const [loading, setLoading] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');

      const handleAuth = async (e) => {
        e.preventDefault();
        setErrorMsg('');
        
        if (!code || !nip) {
          setErrorMsg("Ingresa tu código y NIP.");
          return;
        }

        setLoading(true);
        try {
          const respuesta = await server.autenticarUsuario(code, nip);
          if (respuesta.exito) {
            onLogin(respuesta.usuario);
          } else {
            setErrorMsg(respuesta.mensaje);
            setLoading(false);
          }
        } catch (error) {
          setErrorMsg("Error de conexión con el servidor.");
          setLoading(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/75 backdrop-blur-sm animate-in fade-in">
          <div className="bg-white dark:bg-slate-800 rounded-2xl max-w-md w-full border border-slate-200 dark:border-slate-700 shadow-2xl overflow-hidden relative text-slate-800 dark:text-slate-100">
            
            <div className="bg-udg-navy p-5 text-white relative">
              <button onClick={onClose} className="absolute top-4 right-4 text-slate-300 hover:text-white">
                <LucideIcon name="x" className="w-5 h-5" />
              </button>
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-white text-udg-navy flex items-center justify-center font-black text-xs shadow-md">
                  UDG
                </div>
                <div>
                  <h3 className="font-bold text-base font-display">Inicio de Sesión Institucional</h3>
                  <p className="text-[11px] text-slate-300">Coordinación de Ingeniería en Computación</p>
                </div>
              </div>
            </div>

            <div className="p-6 space-y-4 text-xs">
              
              <div>
                <label className="block font-bold text-slate-700 dark:text-slate-300 mb-1.5 uppercase text-[10px] tracking-wider">Selecciona tu Rol de Acceso:</label>
                <div className="grid grid-cols-3 gap-1.5 bg-slate-100 dark:bg-slate-900 p-1 rounded-xl">
                  <button 
                    type="button" 
                    onClick={() => { setRoleType('Estudiante'); setCode(''); }}
                    className={`py-1.5 rounded-lg font-bold transition-all ${roleType === 'Estudiante' ? 'bg-udg-navy text-white shadow' : 'text-slate-600 dark:text-slate-400'}`}
                  >
                    Estudiante
                  </button>
                  <button 
                    type="button" 
                    onClick={() => { setRoleType('Docente'); setCode(''); }}
                    className={`py-1.5 rounded-lg font-bold transition-all ${roleType === 'Docente' ? 'bg-emerald-700 text-white shadow' : 'text-slate-600 dark:text-slate-400'}`}
                  >
                    Docente
                  </button>
                  <button 
                    type="button" 
                    onClick={() => { setRoleType('Coordinacion'); setCode(''); }}
                    className={`py-1.5 rounded-lg font-bold transition-all ${roleType === 'Coordinacion' ? 'bg-udg-gold text-white shadow' : 'text-slate-600 dark:text-slate-400'}`}
                  >
                    Admin
                  </button>
                </div>
              </div>

              <form onSubmit={handleAuth} className="space-y-4">
                
                <div className={`p-3 bg-red-50 border border-red-200 text-red-700 font-semibold rounded-xl flex items-center gap-2 mb-2 ${errorMsg ? 'flex' : 'hidden'}`}>
                  <LucideIcon name="alert-circle" className="w-4 h-4 shrink-0" />
                  <span>{errorMsg}</span>
                </div>
                
                <div>
                  <label className="block font-semibold text-slate-700 dark:text-slate-300 mb-1">Código UdG</label>
                  <input
                    type="text"
                    value={code}
                    onChange={(e) => setCode(e.target.value)}
                    className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-2.5 rounded-xl font-mono text-xs focus:ring-2 focus:ring-udg-blue outline-none"
                  />
                </div>

                <div>
                  <label className="block font-semibold text-slate-700 dark:text-slate-300 mb-1">NIP SIIAU</label>
                  <input
                    type="password"
                    value={nip}
                    onChange={(e) => setNip(e.target.value)}
                    className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-2.5 rounded-xl font-mono text-xs focus:ring-2 focus:ring-udg-blue outline-none"
                  />
                </div>

                <button
                  type="submit"
                  disabled={loading}
                  className="w-full bg-udg-navy hover:bg-udg-blue text-white font-bold py-2.5 rounded-xl transition-all shadow-md flex items-center justify-center gap-2 font-display disabled:opacity-70"
                >
                  {loading ? 'Autenticando...' : `Ingresar como ${roleType}`}
                </button>
              </form>

              {roleType === 'Estudiante' && (
                <div className="text-center pt-2 border-t border-slate-100 dark:border-slate-700 space-y-2">
                  <p className="text-slate-500">¿Nuevo alumno en la coordinación?</p>
                  <button
                    onClick={onOpenRegister}
                    className="bg-udg-gold hover:bg-udg-goldHover text-white font-bold px-4 py-2 rounded-xl text-xs w-full transition-all font-display"
                  >
                    Crear Nuevo Registro con Mis Datos
                  </button>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
