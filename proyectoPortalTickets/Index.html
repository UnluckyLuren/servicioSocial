function AdminJustificantesModule({ showToast, addNotification, globalJustificantes = [], setGlobalJustificantes }) {
  const [loadingId, setLoadingId] = useState(null);
  const [filterStatus, setFilterStatus] = useState('Pendiente'); 
  const [searchTerm, setSearchTerm] = useState('');
  
  // ESTADOS DE PAGINACIÓN ADMIN
  const [currentPage, setCurrentPage] = useState(1);
  const [itemsPerPage, setItemsPerPage] = useState(10);
  const [modalData, setModalData] = useState({ isOpen: false, index: 0 });

  // Resetea a la página 1 cuando cambia algún filtro o la cantidad por página
  useEffect(() => { 
    setCurrentPage(1); 
  }, [filterStatus, searchTerm, itemsPerPage]);

  const handleDictamen = async (id, accion, studentName) => {
    setLoadingId(id);
    try {
      const res = await server.avanzarJustificante(id, accion);
      if (res.exito) {
        if (typeof setGlobalJustificantes === 'function') {
           const updated = globalJustificantes.map(j => j.id === id ? { ...j, status: res.nuevoEstatus, adminPdfUrl: res.pdfUrl || j.adminPdfUrl } : j);
           setGlobalJustificantes(updated);
        }
        showToast(`Trámite actualizado a: ${res.nuevoEstatus}`);
        addNotification(`Justificante ${res.nuevoEstatus}`, `El documento de ${studentName} avanzó de estado.`, 'success');
        if (accion === 'Finalizar') setModalData({ isOpen: false, index: 0 }); // Cierra modal si termina
      } else showToast(res.mensaje, "error");
    } catch(e) { showToast("Error de conexión al procesar", "error"); } 
    finally { setLoadingId(null); }
  };

  const justificantesFiltrados = globalJustificantes.filter(j => {
    const coincideEstado = filterStatus === 'Todos' || j.status === filterStatus;
    const busqueda = searchTerm.toLowerCase().trim();
    const coincideBusqueda = (j.student && j.student.toLowerCase().includes(busqueda)) || (j.code && j.code.toString().includes(busqueda));
    return coincideEstado && coincideBusqueda;
  });

  // LÓGICA DE PAGINACIÓN ADMIN
  const totalItems = justificantesFiltrados.length;
  const totalPages = Math.ceil(totalItems / itemsPerPage) || 1;
  const indexOfLastItem = currentPage * itemsPerPage;
  const indexOfFirstItem = indexOfLastItem - itemsPerPage;
  const currentJustificantes = justificantesFiltrados.slice(indexOfFirstItem, indexOfLastItem);

  const conteo = {
    pendientes: globalJustificantes.filter(j => j.status === 'Pendiente').length,
    enProceso: globalJustificantes.filter(j => j.status === 'En Proceso').length,
    finalizados: globalJustificantes.filter(j => j.status === 'Finalizada').length
  };

  return (
    <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm space-y-5 text-xs relative">
      
      <JustificanteDetailModal 
        isOpen={modalData.isOpen} list={justificantesFiltrados} currentIndex={modalData.index}
        setCurrentIndex={(newIndex) => setModalData({ ...modalData, index: newIndex })}
        onClose={() => setModalData({ isOpen: false, index: 0 })}
        onDictamen={handleDictamen} loadingId={loadingId} userRole="Coordinacion"
      />

      <div className="flex flex-col sm:flex-row justify-between gap-3 border-b border-slate-100 dark:border-slate-700 pb-4">
        <div>
          <h3 className="text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2 font-display">
            <LucideIcon name="shield-check" className="w-5 h-5 text-udg-gold" /> Procesamiento de Justificantes
          </h3>
          <p className="text-slate-500 text-[11px] mt-0.5">Revisa, autoriza, genera los PDFs oficiales y notifica a los alumnos.</p>
        </div>
      </div>

      <div className="flex flex-col md:flex-row gap-3 justify-between items-center">
        <div className="relative w-full max-w-md">
          <LucideIcon name="search" className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" />
          <input type="text" placeholder="Buscar alumno por nombre o código..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 pl-9 pr-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-udg-blue outline-none" />
        </div>

        <div className="flex items-center gap-1 bg-slate-100 dark:bg-slate-900 p-1 rounded-xl shrink-0 overflow-x-auto custom-scrollbar">
          <button onClick={() => setFilterStatus('Pendiente')} className={`px-3 py-1.5 rounded-lg font-bold transition-all flex items-center gap-1.5 ${filterStatus === 'Pendiente' ? 'bg-amber-500 text-slate-950 shadow' : 'text-slate-600 dark:text-slate-400'}`}>
            <span>Recibidos</span><span className="bg-slate-950/20 px-1.5 rounded-md text-[10px]">{conteo.pendientes}</span>
          </button>
          <button onClick={() => setFilterStatus('En Proceso')} className={`px-3 py-1.5 rounded-lg font-bold transition-all flex items-center gap-1.5 ${filterStatus === 'En Proceso' ? 'bg-udg-blue text-white shadow' : 'text-slate-600 dark:text-slate-400'}`}>
            <span>PDF Generado</span><span className="bg-white/20 px-1.5 rounded-md text-[10px]">{conteo.enProceso}</span>
          </button>
          <button onClick={() => setFilterStatus('Finalizada')} className={`px-3 py-1.5 rounded-lg font-bold transition-all flex items-center gap-1.5 ${filterStatus === 'Finalizada' ? 'bg-emerald-600 text-white shadow' : 'text-slate-600 dark:text-slate-400'}`}>
            <span>Completados</span><span className="bg-white/20 px-1.5 rounded-md text-[10px]">{conteo.finalizados}</span>
          </button>
          <button onClick={() => setFilterStatus('Todos')} className={`px-3 py-1.5 rounded-lg font-bold transition-all ${filterStatus === 'Todos' ? 'bg-udg-navy text-white shadow' : 'text-slate-600 dark:text-slate-400'}`}>Todos</button>
        </div>
      </div>

      <div className="space-y-4">
        {currentJustificantes.length === 0 ? (
          <div className="text-center py-8 border border-dashed border-slate-200 dark:border-slate-700 rounded-xl bg-slate-50 dark:bg-slate-900/40"><p className="text-slate-500 font-medium">Vacío en este filtro.</p></div>
        ) : (
          currentJustificantes.map((j) => {
            const indexGlobal = justificantesFiltrados.findIndex(obj => obj.id === j.id);
            const statusColor = j.status === 'Finalizada' ? 'bg-emerald-100 text-emerald-800' : j.status === 'En Proceso' ? 'bg-blue-100 text-blue-800 animate-pulse' : 'bg-amber-100 text-amber-900';
            
            return (
              <div key={j.id} className="p-5 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm space-y-4 hover:shadow-md transition-shadow">
                <div className="flex flex-col sm:flex-row justify-between gap-2 border-b border-slate-100 dark:border-slate-700/80 pb-3">
                  <div>
                    <h4 className="font-bold text-slate-900 dark:text-white text-sm">{j.student} <span className="font-mono text-udg-blue dark:text-blue-400">({j.code})</span></h4>
                    <p className="text-[11px] text-slate-400 font-mono mt-0.5">#{j.id}</p>
                  </div>
                  <span className={`self-start sm:self-center px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-wider ${statusColor}`}>{j.status}</span>
                </div>

                <div className="pt-2 flex flex-col sm:flex-row justify-between items-center gap-3">
                  <button onClick={() => setModalData({ isOpen: true, index: indexGlobal })} className="w-full sm:w-auto bg-slate-900 dark:bg-slate-700 hover:bg-slate-800 text-white px-5 py-2.5 rounded-xl font-bold transition-all flex justify-center items-center gap-2 shadow-sm text-xs">
                    <LucideIcon name="maximize-2" className="w-4 h-4 text-udg-gold" /> Revisar y Accionar
                  </button>

                  {j.status === 'Pendiente' && (
                    <button onClick={() => handleDictamen(j.id, 'Generar', j.student)} disabled={loadingId === j.id} className="w-full sm:w-auto bg-udg-navy hover:bg-udg-blue text-white font-bold px-4 py-2.5 rounded-xl flex items-center justify-center gap-2 shadow transition-all disabled:opacity-50">
                      {loadingId === j.id ? <LucideIcon name="loader-2" className="animate-spin w-4 h-4"/> : <LucideIcon name="file-text" className="w-4 h-4"/>} Autorizar y Generar PDF
                    </button>
                  )}
                  {j.status === 'En Proceso' && (
                    <button onClick={() => handleDictamen(j.id, 'Finalizar', j.student)} disabled={loadingId === j.id} className="w-full sm:w-auto bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2.5 rounded-xl flex items-center justify-center gap-2 shadow transition-all disabled:opacity-50">
                      {loadingId === j.id ? <LucideIcon name="loader-2" className="animate-spin w-4 h-4"/> : <LucideIcon name="check-circle" className="w-4 h-4"/>} Marcar Finalizada
                    </button>
                  )}
                </div>
              </div>
            );
          })
        )}
      </div>

      {/* PAGINACIÓN ADMIN */}
      {totalItems > 0 && (
        <div className="flex flex-col sm:flex-row justify-between items-center gap-3 pt-4 border-t border-slate-100 dark:border-slate-700 text-slate-500 font-medium text-xs">
          <div className="flex items-center gap-2">
            <span>Mostrar:</span>
            <select value={itemsPerPage} onChange={(e) => { setItemsPerPage(Number(e.target.value)); setCurrentPage(1); }} className="bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-1 outline-none text-xs font-bold text-slate-700 dark:text-slate-200">
              <option value={5}>5</option>
              <option value={10}>10</option>
              <option value={20}>20</option>
              <option value={50}>50</option>
            </select>
            <span className="ml-2">Mostrando {totalItems === 0 ? 0 : indexOfFirstItem + 1} - {Math.min(indexOfLastItem, totalItems)} de {totalItems}</span>
          </div>
          <div className="flex items-center gap-1">
            <button onClick={() => setCurrentPage(prev => Math.max(prev - 1, 1))} disabled={currentPage === 1} className="p-2 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 disabled:opacity-40 transition-colors"><LucideIcon name="chevron-left" className="w-4 h-4" /></button>
            <span className="px-3 py-1.5 font-bold text-slate-800 dark:text-slate-200">Página {currentPage} de {totalPages}</span>
            <button onClick={() => setCurrentPage(prev => Math.min(prev + 1, totalPages))} disabled={currentPage === totalPages} className="p-2 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 disabled:opacity-40 transition-colors"><LucideIcon name="chevron-right" className="w-4 h-4" /></button>
          </div>
        </div>
      )}
    </div>
  );
}

function ConstanciasModule({ user, showToast, addNotification, globalConstancias = [], setGlobalConstancias = () => {} }) {
  const [requiresDetails, setRequiresDetails] = useState(false);
  const [loading, setLoading] = useState(false);

  // Paginación
  const [currentPage, setCurrentPage] = useState(1);
  const [itemsPerPage, setItemsPerPage] = useState(5);

  const listaConstancias = Array.isArray(globalConstancias) ? globalConstancias.filter(c => c.student === user.name) : [];
  
  const totalItems = listaConstancias.length;
  const totalPages = Math.ceil(totalItems / itemsPerPage) || 1;
  const indexOfLastItem = currentPage * itemsPerPage;
  const indexOfFirstItem = indexOfLastItem - itemsPerPage;
  const currentItems = listaConstancias.slice(indexOfFirstItem, indexOfLastItem);

  const handleSubmit = async (e) => {
    e.preventDefault();
    setLoading(true);
    const datos = { code: user.code, student: user.name, email: user.email, requiresDetails };

    try {
      const res = await server.registrarConstancia(datos);
      if (res.exito) {
        setGlobalConstancias([res.constancia, ...globalConstancias]);
        showToast("Solicitud de constancia enviada.");
        addNotification("Solicitud Recibida", "Tu constancia está en revisión.", "info");
        setRequiresDetails(false);
        setCurrentPage(1);
      } else showToast(res.mensaje, "error");
    } catch (err) { showToast("Error de conexión.", "error"); }
    setLoading(false);
  };

  return (
    <div className="space-y-6 text-xs">
      {/* DESCRIPCIÓN Y FORMULARIO */}
      <div className="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden">
        <div className="bg-slate-100 dark:bg-slate-900/80 p-5 border-b border-slate-200 dark:border-slate-700 space-y-2">
          <h3 className="text-base font-bold text-udg-navy dark:text-blue-400 font-display flex items-center gap-2">
            <LucideIcon name="file-badge" className="w-5 h-5" /> Trámite de Constancias Oficiales
          </h3>
          <p className="text-slate-600 dark:text-slate-400 leading-relaxed text-xs">
            Las constancias de estudio son documentos oficiales emitidos por la Coordinación que avalan tu situación académica actual. Son el documento idóneo para trámites de becas, servicio social, seguro médico facultativo o comprobación general de estudios.
          </p>
        </div>

        <form onSubmit={handleSubmit} className="p-6 grid grid-cols-1 md:grid-cols-2 gap-4">
          <div className="bg-slate-50 dark:bg-slate-900/50 p-3 rounded-xl border border-slate-200 dark:border-slate-700">
            <label className="block font-semibold mb-1 text-slate-500 text-[10px] uppercase">Nombre Completo del Solicitante</label>
            <span className="font-bold text-slate-900 dark:text-white text-sm">{user.name}</span>
          </div>
          
          <div className="bg-slate-50 dark:bg-slate-900/50 p-3 rounded-xl border border-slate-200 dark:border-slate-700">
            <label className="block font-semibold mb-1 text-slate-500 text-[10px] uppercase">Código de Estudiante (UdG)</label>
            <span className="font-bold text-slate-900 dark:text-white text-sm font-mono">{user.code}</span>
          </div>

          <div className="md:col-span-2 bg-blue-50/50 dark:bg-slate-900/30 p-4 rounded-xl border border-blue-100 dark:border-slate-700 mt-2 flex items-center gap-3">
            <input 
              type="checkbox" id="reqDetails" checked={requiresDetails} onChange={(e) => setRequiresDetails(e.target.checked)}
              className="w-5 h-5 text-udg-blue rounded border-slate-300 focus:ring-udg-blue cursor-pointer" 
            />
            <label htmlFor="reqDetails" className="font-semibold text-slate-700 dark:text-slate-300 cursor-pointer">
              Requiere desglose detallado <span className="text-slate-500 font-normal">(Incluir período actual, promedio general y créditos adquiridos)</span>
            </label>
          </div>
          
          <div className="md:col-span-2 pt-2 flex justify-end">
            <button type="submit" disabled={loading} className="bg-udg-navy hover:bg-udg-blue text-white font-bold px-8 py-3 rounded-xl flex items-center gap-2 shadow-md disabled:opacity-70 transition-all text-sm">
              {loading ? <LucideIcon name="loader-2" className="w-4 h-4 animate-spin" /> : <LucideIcon name="send" className="w-4 h-4" />}<span>Enviar Solicitud de Constancia</span>
            </button>
          </div>
        </form>
      </div>

      {/* HISTORIAL PAGINADO */}
      <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
        <h4 className="text-sm font-bold text-slate-900 dark:text-white flex items-center gap-2 font-display mb-4">
          <LucideIcon name="history" className="w-4 h-4 text-udg-gold" /> Historial de Solicitudes ({totalItems})

        <div className="space-y-3">

            <p className="text-slate-400 py-6 text-center border border-dashed border-slate-200 dark:border-slate-700 rounded-xl">No has solicitado ninguna constancia.</p>

            currentItems.map((c) => (

                  <h4 className="font-bold text-slate-900 dark:text-white text-sm">Constancia de Estudios</h4>

                <span className={`px-3 py-1.5 rounded-full text-[10px] font-black uppercase tracking-wider shrink-0 ${c.status === 'Terminada' ? 'bg-emerald-100 text-emerald-800' : c.status === 'En Proceso' ? 'bg-blue-100 text-blue-800' : 'bg-amber-100 text-amber-900'}`}>
                  {c.status}
                </span>
              </div>
            ))
          )}
        </div>

        {/* Controles de paginación idénticos */}
        {totalItems > 0 && (
          <div className="flex flex-col sm:flex-row justify-between items-center gap-3 pt-4 border-t border-slate-100 dark:border-slate-700 text-slate-500 font-medium text-xs">
            <div className="flex items-center gap-2">
              <span>Mostrar:</span>
              <select value={itemsPerPage} onChange={(e) => { setItemsPerPage(Number(e.target.value)); setCurrentPage(1); }} className="bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-1 outline-none text-xs font-bold text-slate-700 dark:text-slate-200">
                <option value={5}>5</option><option value={10}>10</option>
              </select>
              <span className="ml-2">Mostrando {indexOfFirstItem + 1} - {Math.min(indexOfLastItem, totalItems)} de {totalItems}</span>
            </div>
            <div className="flex items-center gap-1">
              <button onClick={() => setCurrentPage(prev => Math.max(prev - 1, 1))} disabled={currentPage === 1} className="p-2 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 disabled:opacity-40 transition-colors"><LucideIcon name="chevron-left" className="w-4 h-4" /></button>
              <span className="px-3 py-1.5 font-bold text-slate-800 dark:text-slate-200">Página {currentPage} de {totalPages}</span>
              <button onClick={() => setCurrentPage(prev => Math.min(prev + 1, totalPages))} disabled={currentPage === totalPages} className="p-2 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 disabled:opacity-40 transition-colors"><LucideIcon name="chevron-right" className="w-4 h-4" /></button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function AvisosModule({ notices, setNotices, user, showToast, addNotification }) {
  const [newTitle, setNewTitle] = useState('');
  const [newDesc, setNewDesc] = useState('');
  const [newCat, setNewCat] = useState('Académico');
  const [newUrgent, setNewUrgent] = useState(false);
  const [loading, setLoading] = useState(false);

  // ESTADOS PARA PAGINACIÓN
  const [currentPage, setCurrentPage] = useState(1);
  const itemsPerPage = 5; // Mostrar 5 avisos por página
  
  const totalPages = Math.ceil(notices.length / itemsPerPage) || 1;
  const currentNotices = notices.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);

  const handleAddNotice = async (e) => {
    e.preventDefault();
    if (!newTitle.trim() || !newDesc.trim()) return showToast("El título y la descripción son obligatorios", "error");

    setLoading(true);
    try {
      const res = await server.publicarNuevoAviso({ title: newTitle, desc: newDesc, cat: newCat, urgent: newUrgent });
      if (res.exito) {
        setNotices([res.aviso, ...notices]); // Agrega el nuevo aviso al inicio de la lista
        showToast("Aviso publicado correctamente");
        if(addNotification && newUrgent) addNotification("Aviso Urgente", newTitle, "error");
        
        // Limpiar formulario y resetear página
        setNewTitle(''); setNewDesc(''); setNewCat('Académico'); setNewUrgent(false);
        setCurrentPage(1); 
      } else {
        showToast(res.mensaje, "error");
      }
    } catch (err) {
      showToast("Error de conexión al publicar", "error");
    }
    setLoading(false);
  };

  return (
    <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm space-y-5 text-xs">
      <h3 className="text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2 font-display border-b border-slate-100 dark:border-slate-700 pb-3">

      </div>

      {/* PAGINACIÓN */}

          <div className="flex items-center gap-2">
            <button onClick={() => setCurrentPage(p => Math.max(p - 1, 1))} disabled={currentPage === 1} className="p-2 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 disabled:opacity-40 transition-colors"><LucideIcon name="chevron-left" className="w-4 h-4" /></button>

            <button onClick={() => setCurrentPage(p => Math.min(p + 1, totalPages))} disabled={currentPage === totalPages} className="p-2 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 disabled:opacity-40 transition-colors"><LucideIcon name="chevron-right" className="w-4 h-4" /></button>
          </div>
        </div>
      )}
    </div>
  );
}

function RegisterModal({ onClose, onRegister, onOpenLogin }) {
      const [step, setStep] = useState(1); // Controla en qué pantalla estamos (1: Datos, 2: Código)
      const [generatedCode, setGeneratedCode] = useState(''); // Guarda el código enviado
      const [inputCode, setInputCode] = useState(''); // Lo que el usuario teclea
      
      const [name, setName] = useState('');
      const [code, setCode] = useState('');
      const [email, setEmail] = useState('');
      const [phone, setPhone] = useState('');
      const [nip, setNip] = useState('');
      const [photoPreview, setPhotoPreview] = useState(null);
      
      const [errorMsg, setErrorMsg] = useState('');
      const [loading, setLoading] = useState(false);

      const handleImageChange = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => { setPhotoPreview(reader.result); };
          reader.readAsDataURL(file);
        }
      };

      // PASO 1: Validar datos y enviar el correo con el código
      const handleSendCode = async (e) => {
        e.preventDefault();
        setErrorMsg('');

        if (!name.trim() || !code.trim() || !email.trim() || !phone.trim() || !nip.trim()) {
          setErrorMsg('Por favor completa todos los campos requeridos.');
          return;
        }

        setLoading(true);
        try {
          const respuesta = await server.enviarCodigoVerificacion(email, name);
          if (respuesta.exito) {
            setGeneratedCode(respuesta.codigoGenerado);
            setStep(2); // Avanzamos a la pantalla de verificación
            setLoading(false);
          } else {
            setErrorMsg(respuesta.mensaje);
            setLoading(false);
          }
        } catch (error) {
          setErrorMsg("Error al intentar enviar el correo de verificación.");
          setLoading(false);
        }
      };

      // PASO 2: Verificar el código ingresado y guardar en base de datos
      const handleVerifyAndRegister = async () => {
        setErrorMsg('');
        if (inputCode !== generatedCode) {
          setErrorMsg('El código ingresado es incorrecto.');
          return;
        }

        const nuevoUsuario = {
          code: code, name: name, role: "Estudiante", email: email, nip: nip, photo: photoPreview || null
        };

        setLoading(true);
        try {
          const respuesta = await server.registrarUsuario(nuevoUsuario);
          if (respuesta.exito) {
            onRegister(respuesta.usuario);
          } else {
            setErrorMsg(respuesta.mensaje);
            // Si el error es por código UDG duplicado, lo regresamos al paso 1
            if(respuesta.mensaje.includes('registrado')) {
              setTimeout(() => setStep(1), 2000);
            }
            setLoading(false);
          }
        } catch (error) {
          setErrorMsg("Error al conectar con la base de datos.");
          setLoading(false);
        }
      };

      // RENDERIZADO DEL PASO 2 (Pantalla de Verificación de Correo)
      if (step === 2) {
        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/75 backdrop-blur-sm animate-in fade-in">
            <div className="bg-white dark:bg-slate-800 rounded-2xl max-w-sm w-full border border-slate-200 dark:border-slate-700 shadow-2xl relative text-slate-800 dark:text-slate-100 p-8 text-center flex flex-col items-center">
              
              <div className="w-16 h-16 bg-blue-50 dark:bg-slate-700 rounded-full flex items-center justify-center mb-4 border-4 border-blue-100 dark:border-slate-600">
                <LucideIcon name="mail" className="w-8 h-8 text-udg-blue dark:text-blue-400" />
              </div>
              
              <h3 className="font-bold text-xl font-display mb-2">Revisa tu correo</h3>
              <p className="text-xs text-slate-500 dark:text-slate-400 mb-6 leading-relaxed">
                Hemos enviado un código de seguridad de 6 dígitos a <br/><b className="text-slate-800 dark:text-slate-200">{email}</b>
              </p>
              
              <div className={`p-3 rounded-xl bg-red-50 border border-red-200 text-red-700 text-xs font-semibold w-full flex items-center justify-center gap-2 mb-4 ${errorMsg ? 'flex' : 'hidden'}`}>
                <LucideIcon name="alert-circle" className="w-4 h-4 shrink-0" />
                <span>{errorMsg}</span>
              </div>

              <input 
                type="text" 
                maxLength="6" 
                value={inputCode} 
                onChange={(e) => setInputCode(e.target.value)} 
                placeholder="000000" 
                className="w-full text-center text-3xl tracking-[0.5em] font-mono bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-4 rounded-xl mb-6 outline-none focus:ring-2 focus:ring-udg-blue" 
              />
              
              <button 
                onClick={handleVerifyAndRegister} 
                disabled={loading || inputCode.length !== 6} 
                className="w-full bg-udg-navy hover:bg-udg-blue text-white font-bold py-3.5 rounded-xl shadow-md disabled:opacity-50 transition-all mb-3 flex items-center justify-center gap-2"
              >
                {loading ? <LucideIcon name="loader-2" className="w-4 h-4 animate-spin" /> : <LucideIcon name="check-circle" className="w-4 h-4" />}
                <span>{loading ? 'Creando cuenta...' : 'Verificar y Registrar'}</span>
              </button>
              
              <button 
                onClick={() => { setStep(1); setInputCode(''); setErrorMsg(''); }} 
                disabled={loading} 
                className="text-xs text-slate-500 font-semibold hover:text-slate-800 dark:hover:text-slate-300"
              >
                Corregir correo o datos
              </button>
            </div>
          </div>
        );
      }

      // RENDERIZADO DEL PASO 1 (Formulario de Datos - Original)
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/75 backdrop-blur-sm animate-in fade-in">
          <div className="bg-white dark:bg-slate-800 rounded-2xl max-w-lg w-full border border-slate-200 dark:border-slate-700 shadow-2xl overflow-hidden relative text-slate-800 dark:text-slate-100 max-h-[90vh] flex flex-col">
            
            <div className="bg-udg-navy p-5 text-white flex justify-between items-center shrink-0">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-udg-gold text-white flex items-center justify-center font-black text-xs shadow-md">UDG</div>
                <div>
                  <h3 className="font-bold text-base font-display">Registro de Estudiante</h3>
                  <p className="text-[11px] text-slate-300">Paso 1 de 2: Datos Generales</p>
                </div>
              </div>
              <button onClick={onClose} className="text-slate-300 hover:text-white p-1"><LucideIcon name="x" className="w-5 h-5" /></button>
            </div>

            <form onSubmit={handleSendCode} className="p-6 overflow-y-auto space-y-4 text-xs custom-scrollbar">
              
              <div className={`p-3 rounded-xl bg-red-50 border border-red-200 text-red-700 font-semibold flex items-center gap-2 ${errorMsg ? 'flex' : 'hidden'}`}>
                <LucideIcon name="alert-circle" className="w-4 h-4 shrink-0" /><span>{errorMsg}</span>
              </div>

              <div className="flex flex-col items-center justify-center p-4 bg-slate-50 dark:bg-slate-900 rounded-2xl border-2 border-dashed border-slate-200 dark:border-slate-700">
                <div className="w-20 h-20 rounded-2xl overflow-hidden bg-slate-200 dark:bg-slate-800 border-2 border-white dark:border-slate-700 shadow-sm flex items-center justify-center text-slate-400 mb-2">
                  {photoPreview ? <img src={photoPreview} className="w-full h-full object-cover" /> : <LucideIcon name="user" className="w-8 h-8" />}
                </div>
                <label className="cursor-pointer bg-udg-navy hover:bg-udg-blue text-white px-3.5 py-1.5 rounded-xl text-xs font-semibold transition-all flex items-center gap-1.5">
                  <LucideIcon name="camera" className="w-4 h-4 text-udg-gold" /><span>{photoPreview ? 'Cambiar Foto' : 'Subir Foto'}</span>
                  <input type="file" accept="image/*" onChange={handleImageChange} className="hidden" />
                </label>
              </div>

              <div><label className="block font-semibold mb-1">Nombre Completo *</label><input type="text" value={name} onChange={(e) => setName(e.target.value)} className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-2.5 rounded-xl outline-none focus:ring-2 focus:ring-udg-blue" /></div>
              
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div><label className="block font-semibold mb-1">Código UdG *</label><input type="text" value={code} onChange={(e) => setCode(e.target.value)} className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-2.5 rounded-xl font-mono outline-none focus:ring-2 focus:ring-udg-blue" /></div>
                <div><label className="block font-semibold mb-1">Teléfono Móvil *</label><input type="tel" value={phone} onChange={(e) => setPhone(e.target.value)} className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-2.5 rounded-xl font-mono outline-none focus:ring-2 focus:ring-udg-blue" /></div>
              </div>
              
              <div><label className="block font-semibold mb-1">Correo Institucional / Personal *</label><input type="email" value={email} onChange={(e) => setEmail(e.target.value)} className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-2.5 rounded-xl outline-none focus:ring-2 focus:ring-udg-blue" /></div>

              <button type="submit" disabled={loading} className="w-full bg-udg-gold hover:bg-udg-goldHover text-white font-bold py-3 rounded-xl transition-all shadow-md font-display disabled:opacity-70 mt-2 flex items-center justify-center gap-2">

                    className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-2.5 rounded-xl font-mono text-xs focus:ring-2 focus:ring-udg-blue outline-none"
                  />
                </div>

                <button
                  type="submit"
                  disabled={loading}
                  className="w-full bg-udg-navy hover:bg-udg-blue text-white font-bold py-2.5 rounded-xl transition-all shadow-md flex items-center justify-center gap-2 font-display disabled:opacity-70"
                >
                  {loading ? 'Autenticando...' : `Ingresar como ${roleType}`}
                </button>
              </form>

              {roleType === 'Estudiante' && (
                <div className="text-center pt-2 border-t border-slate-100 dark:border-slate-700 space-y-2">
                  <p className="text-slate-500">¿Nuevo alumno en la coordinación?</p>
                  <button
                    onClick={onOpenRegister}
                    className="bg-udg-gold hover:bg-udg-goldHover text-white font-bold px-4 py-2 rounded-xl text-xs w-full transition-all font-display"
                  >
                    Crear Nuevo Registro con Mis Datos
                  </button>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

// MÓDULO ADMIN: EMISIÓN DE CONSTANCIAS
// ==========================================
function AdminConstanciasModule({ showToast, addNotification, globalConstancias, setGlobalConstancias }) {
  const [loadingId, setLoadingId] = useState(null);
  const [filterStatus, setFilterStatus] = useState('Pendiente'); 
  const [searchTerm, setSearchTerm] = useState('');
  
  const [currentPage, setCurrentPage] = useState(1);
  const [itemsPerPage, setItemsPerPage] = useState(10);
  const [modalData, setModalData] = useState({ isOpen: false, item: null });

  useEffect(() => { setCurrentPage(1); }, [filterStatus, searchTerm, itemsPerPage]);

  const listaSegura = Array.isArray(globalConstancias) ? globalConstancias : [];

  const constanciasFiltradas = listaSegura.filter(c => {
    if (!c) return false; 
    const coincideEstado = filterStatus === 'Todos' || c.status === filterStatus;
    const busqueda = searchTerm.toLowerCase().trim();
    const coincideBusqueda = (c.student && c.student.toLowerCase().includes(busqueda)) || (c.code && c.code.toString().includes(busqueda));
    return coincideEstado && coincideBusqueda;
  });

  const totalItems = constanciasFiltradas.length;
  const indexOfLastItem = currentPage * itemsPerPage;
  const indexOfFirstItem = indexOfLastItem - itemsPerPage;
  const currentItems = constanciasFiltradas.slice(indexOfFirstItem, indexOfLastItem);
  const totalPages = Math.ceil(totalItems / itemsPerPage) || 1;

  const handleAction = async (id, accion, adminData, studentName) => {
    setLoadingId(id);
    try {
      const res = await server.avanzarConstancia(id, accion, adminData);
      if (res.exito) {
        if (typeof setGlobalConstancias === 'function') {
           const updated = listaSegura.map(c => c.id === id ? { ...c, status: res.nuevoEstatus, adminData: adminData || c.adminData } : c);
           setGlobalConstancias(updated);
        }
        showToast(`Constancia actualizada a: ${res.nuevoEstatus}`);
        if(accion === 'Finalizar') addNotification(`Constancia Terminada`, `Notificación enviada a ${studentName}.`, 'success');
        setModalData({ isOpen: false, item: null });
      } else showToast(res.mensaje, "error");
    } catch(e) { showToast("Error al procesar", "error"); } 
    finally { setLoadingId(null); }
  };

  return (
    <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm space-y-5 text-xs">
      
      {modalData.isOpen && modalData.item && (
        <ConstanciaAdminModal 
          item={modalData.item} 
          onClose={() => setModalData({ isOpen: false, item: null })} 
          onAction={handleAction} 
          loadingId={loadingId} 
        />
      )}

      <div className="flex flex-col sm:flex-row justify-between gap-3 border-b border-slate-100 dark:border-slate-700 pb-4">
        <div>
          <h3 className="text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2 font-display">
            <LucideIcon name="file-badge" className="w-5 h-5 text-udg-gold" /> Emisión de Constancias
          </h3>
        </div>
      </div>

      <div className="flex flex-col md:flex-row gap-3 justify-between items-center">
        <div className="relative w-full max-w-md">
          <LucideIcon name="search" className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" />
          <input type="text" placeholder="Buscar por nombre o código..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full bg-slate-50 dark:bg-slate-900 pl-9 pr-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-udg-blue outline-none" />
        </div>
        <div className="flex items-center gap-1 bg-slate-100 dark:bg-slate-900 p-1 rounded-xl shrink-0">
          {['Pendiente', 'En Proceso', 'Terminada', 'Todos'].map(st => (
            <button key={st} onClick={() => setFilterStatus(st)} className={`px-3 py-1.5 rounded-lg font-bold transition-all ${filterStatus === st ? 'bg-udg-navy text-white shadow' : 'text-slate-600 dark:text-slate-400'}`}>{st}</button>
          ))}
        </div>
      </div>

      <div className="space-y-3">
        {currentItems.length === 0 ? (
          <div className="text-center py-8 border border-dashed border-slate-200 dark:border-slate-700 rounded-xl bg-slate-50 dark:bg-slate-900/40"><p className="text-slate-500 font-medium">No hay solicitudes en este estado.</p></div>
        ) : (
          currentItems.map((c) => (
            <div key={c.id} className="p-4 rounded-xl bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-700 flex flex-col sm:flex-row justify-between gap-4 transition-all hover:shadow-sm">
              <div>
                <span className="font-mono font-bold text-udg-navy dark:text-blue-400 text-sm">#{c.id}</span>
                <h4 className="font-bold text-slate-900 dark:text-white text-sm mt-0.5">{c.student}</h4>
                <p className="text-slate-500 text-[11px]">Código: <span className="font-semibold text-slate-700 dark:text-slate-300">{c.code}</span> • Solicitud: {c.date}</p>
                {c.requiresDetails === 'Sí' && <p className="text-udg-blue font-bold text-[10px] mt-1"><LucideIcon name="alert-circle" className="w-3 h-3 inline mr-1"/>Requiere Promedio y Créditos</p>}
              </div>
              <div className="flex flex-col sm:flex-row items-center gap-3 shrink-0">
                 <span className={`px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-wider ${c.status === 'Terminada' ? 'bg-emerald-100 text-emerald-800' : c.status === 'En Proceso' ? 'bg-blue-100 text-blue-800' : 'bg-amber-100 text-amber-900'}`}>{c.status}</span>
                 <button onClick={() => setModalData({ isOpen: true, item: c })} className="bg-slate-900 dark:bg-slate-700 hover:bg-slate-800 text-white px-4 py-2 rounded-xl font-bold flex items-center gap-2 shadow-sm text-xs"><LucideIcon name="maximize-2" className="w-4 h-4 text-udg-gold" /> {c.status === 'Pendiente' ? 'Procesar' : 'Ver / Imprimir'}</button>
              </div>
            </div>
          ))
        )}
      </div>

      {totalItems > 0 && (
        <div className="flex flex-col sm:flex-row justify-between items-center gap-3 pt-4 border-t border-slate-100 dark:border-slate-700 text-slate-500 font-medium text-xs">
          <span className="ml-2">Mostrando {indexOfFirstItem + 1} - {Math.min(indexOfLastItem, totalItems)} de {totalItems}</span>
          <div className="flex items-center gap-1">
            <button onClick={() => setCurrentPage(prev => Math.max(prev - 1, 1))} disabled={currentPage === 1} className="p-2 rounded-lg border border-slate-200 hover:bg-slate-100 disabled:opacity-40 transition-colors"><LucideIcon name="chevron-left" className="w-4 h-4" /></button>
            <span className="px-3 py-1.5 font-bold">Página {currentPage} de {totalPages}</span>
            <button onClick={() => setCurrentPage(prev => Math.min(prev + 1, totalPages))} disabled={currentPage === totalPages} className="p-2 rounded-lg border border-slate-200 hover:bg-slate-100 disabled:opacity-40 transition-colors"><LucideIcon name="chevron-right" className="w-4 h-4" /></button>
          </div>
        </div>
      )}
    </div>
  );
}

// Subcomponente: Modal de Llenado e Impresión
function ConstanciaAdminModal({ item, onClose, onAction, loadingId }) {
  const [formData, setFormData] = useState({
    folioVar: '', semestre: 'Primero', carrera: 'Ingeniería en Computación', ciclo: '2026-B',
    fechaInicio: '', fechaFin: '', creditosTotales: 430, creditosAlumno: 0, promedioGral: 0, promedioAnt: 0
  });

  const creditosRestantes = Math.max(0, formData.creditosTotales - formData.creditosAlumno);

  const handlePrintPreview = () => {
    const d = typeof item.adminData === 'string' ? JSON.parse(item.adminData) : (item.adminData || formData);
    const html = `
      <html><head><title>Constancia ${item.id}</title><style>body{font-family:Arial,sans-serif; padding:50px; line-height:1.6;} .h{text-align:center; color:#0f2744;} .b{font-weight:bold;} hr{border:1px solid #ddd; margin:20px 0;}</style></head>
      <body>
        <h2 class="h">UNIVERSIDAD DE GUADALAJARA</h2><h3 class="h">Centro Universitario de Ciencias Exactas e Ingenierías</h3>
        <hr/>
        <p style="text-align:right;"><strong>Folio:</strong> CUCEI/SAC/CDCOM/${d.folioVar || '---'}/2026<br/><strong>Asunto:</strong> Constancia de Estudios</p>
        <br/>
        <p>A QUIEN CORRESPONDA:</p>
        <p>Por este conducto se hace constar que el C. <span class="b">${item.student}</span>, con código de registro <span class="b">${item.code}</span>, es alumno(a) activo(a) de la carrera de <span class="b">${d.carrera}</span> de este Centro Universitario.</p>
        <p>Actualmente cursa el <span class="b">${d.semestre} semestre</span> correspondiente al ciclo escolar <span class="b">${d.ciclo}</span> (Del ${d.fechaInicio} al ${d.fechaFin}).</p>
        ${item.requiresDetails === 'Sí' ? `
          <div style="background:#f4f4f4; padding:15px; margin-top:20px;">
            <p><strong>Promedio General:</strong> ${d.promedioGral} \vert{} <strong>Promedio Semestre Anterior:</strong>${d.promedioAnt}</p>
            <p><strong>Créditos Cubiertos:</strong> ${d.creditosAlumno} de ${d.creditosTotales} (Restantes:${Math.max(0, d.creditosTotales - d.creditosAlumno)})</p>
          </div>
        ` : ''}
        <br/><br/><br/><p style="text-align:center;">A T E N T A M E N T E<br/>"PIENSA Y TRABAJA"</p>
        <script>window.print();<\/script>
      </body></html>
    `;
    const blob = new Blob([html], { type: 'text/html' });
    window.open(URL.createObjectURL(blob), '_blank');
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-sm animate-in fade-in">
      <div className="bg-white dark:bg-slate-800 rounded-3xl max-w-3xl w-full border border-slate-200 dark:border-slate-700 shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
        
        <div className="bg-slate-50 dark:bg-slate-900/80 p-4 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center">
          <h3 className="font-bold text-sm font-display text-slate-800 dark:text-slate-200">Procesamiento: Constancia #{item.id}</h3>
          <button onClick={onClose} className="p-2 text-slate-400 hover:text-red-500 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-600"><LucideIcon name="x" className="w-5 h-5" /></button>
        </div>

        <div className="p-6 overflow-y-auto custom-scrollbar space-y-6">
          <div className="bg-blue-50 dark:bg-slate-900/50 p-4 rounded-xl border border-blue-100 dark:border-slate-700 text-sm">
            <p className="font-bold text-slate-900 dark:text-white">Estudiante: {item.student} <span className="font-mono text-udg-blue">({item.code})</span></p>
            {item.requiresDetails === 'Sí' && <span className="mt-2 inline-block bg-udg-blue text-white px-2 py-1 rounded text-[10px] font-bold">SOLICITA DESGLOSE DE PROMEDIO Y CRÉDITOS</span>}
          </div>

          {item.status === 'Pendiente' ? (
            <div className="space-y-4">
              <h4 className="font-bold text-slate-700 dark:text-slate-300 border-b pb-2">Formulario de Llenado Oficial</h4>
              <div className="grid grid-cols-2 gap-4 text-xs">
                <div><label className="block mb-1 font-semibold">Folio Variable (ej. 1024)</label><input type="text" value={formData.folioVar} onChange={e=>setFormData({...formData, folioVar: e.target.value})} className="w-full border rounded-lg p-2 dark:bg-slate-900 dark:border-slate-600" /></div>
                <div><label className="block mb-1 font-semibold">Ciclo Escolar</label><input type="text" value={formData.ciclo} onChange={e=>setFormData({...formData, ciclo: e.target.value})} className="w-full border rounded-lg p-2 dark:bg-slate-900 dark:border-slate-600" /></div>
                <div><label className="block mb-1 font-semibold">Semestre en Letras</label><input type="text" value={formData.semestre} onChange={e=>setFormData({...formData, semestre: e.target.value})} className="w-full border rounded-lg p-2 dark:bg-slate-900 dark:border-slate-600" /></div>
                <div><label className="block mb-1 font-semibold">Carrera</label><input type="text" value={formData.carrera} onChange={e=>setFormData({...formData, carrera: e.target.value})} className="w-full border rounded-lg p-2 dark:bg-slate-900 dark:border-slate-600" /></div>
                <div><label className="block mb-1 font-semibold">Fecha Inicio Ciclo</label><input type="date" value={formData.fechaInicio} onChange={e=>setFormData({...formData, fechaInicio: e.target.value})} className="w-full border rounded-lg p-2 dark:bg-slate-900 dark:border-slate-600" /></div>
                <div><label className="block mb-1 font-semibold">Fecha Fin Ciclo</label><input type="date" value={formData.fechaFin} onChange={e=>setFormData({...formData, fechaFin: e.target.value})} className="w-full border rounded-lg p-2 dark:bg-slate-900 dark:border-slate-600" /></div>
                
                {item.requiresDetails === 'Sí' && (
                  <div className="col-span-2 grid grid-cols-2 gap-4 bg-amber-50 dark:bg-amber-900/20 p-3 rounded-lg border border-amber-200 dark:border-amber-800">
                    <div><label className="block mb-1 font-semibold text-amber-900 dark:text-amber-300">Créditos Totales Carrera</label><input type="number" value={formData.creditosTotales} onChange={e=>setFormData({...formData, creditosTotales: Number(e.target.value)})} className="w-full border rounded-lg p-2 dark:bg-slate-900" /></div>
                    <div><label className="block mb-1 font-semibold text-amber-900 dark:text-amber-300">Créditos Adquiridos Alumno</label><input type="number" value={formData.creditosAlumno} onChange={e=>setFormData({...formData, creditosAlumno: Number(e.target.value)})} className="w-full border rounded-lg p-2 dark:bg-slate-900" /></div>
                    <div><label className="block mb-1 font-semibold text-amber-900 dark:text-amber-300">Promedio General</label><input type="number" step="0.01" value={formData.promedioGral} onChange={e=>setFormData({...formData, promedioGral: e.target.value})} className="w-full border rounded-lg p-2 dark:bg-slate-900" /></div>
                    <div><label className="block mb-1 font-semibold text-amber-900 dark:text-amber-300">Promedio Ant. Semestre</label><input type="number" step="0.01" value={formData.promedioAnt} onChange={e=>setFormData({...formData, promedioAnt: e.target.value})} className="w-full border rounded-lg p-2 dark:bg-slate-900" /></div>
                    <div className="col-span-2 text-amber-700 font-bold">Créditos Restantes Automáticos: {creditosRestantes}</div>
                  </div>
                )}
              </div>
            </div>
          ) : (
            <div className="bg-slate-50 dark:bg-slate-900/50 p-6 rounded-2xl text-center border border-slate-200 dark:border-slate-700">
              <LucideIcon name="check-circle" className="w-12 h-12 text-emerald-500 mx-auto mb-3" />
              <h3 className="font-bold text-lg dark:text-white">Los datos ya fueron capturados</h3>
              <p className="text-slate-500 mb-4">La constancia está {item.status}. Puedes previsualizar e imprimir el PDF genérico.</p>
              <button onClick={handlePrintPreview} className="bg-slate-800 hover:bg-slate-900 text-white px-6 py-3 rounded-xl font-bold flex items-center gap-2 mx-auto"><LucideIcon name="printer" className="w-4 h-4"/> Imprimir PDF Generado</button>
            </div>
          )}
        </div>

        <div className="bg-slate-50 dark:bg-slate-900/80 p-5 border-t border-slate-200 dark:border-slate-700 flex justify-end gap-3 shrink-0">
          {item.status === 'Pendiente' && (
            <button onClick={() => { handleAction(item.id, 'Generar', formData, item.student); setTimeout(handlePrintPreview, 1000); }} disabled={loadingId === item.id} className="bg-udg-navy hover:bg-udg-blue text-white font-bold px-6 py-3 rounded-xl flex items-center gap-2 text-sm disabled:opacity-50">
              {loadingId === item.id ? <LucideIcon name="loader-2" className="w-4 h-4 animate-spin" /> : <LucideIcon name="file-text" className="w-4 h-4" />} Guardar y Generar Constancia
            </button>
          )}
          {item.status === 'En Proceso' && (
            <button onClick={() => onAction(item.id, 'Finalizar', null, item.student)} disabled={loadingId === item.id} className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-3 rounded-xl flex items-center gap-2 text-sm disabled:opacity-50">
              {loadingId === item.id ? <LucideIcon name="loader-2" className="w-4 h-4 animate-spin" /> : <LucideIcon name="mail" className="w-4 h-4" />} Marcar Terminada y Notificar Alumno
            </button>
          )}
        </div>
      </div>
    </div>
  );
}
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
