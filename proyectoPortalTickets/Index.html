<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coordinación de Ingeniería en Computación - CUCEI</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            udg: {
              navy: '#0f2744',
              blue: '#1e3a8a',
              royal: '#2563eb',
              light: '#eff6ff',
              gold: '#d97706',
              goldHover: '#b45309',
              amber: '#f59e0b',
              emerald: '#059669',
            }
          },
          fontFamily: {
            sans: ['"Inter"', 'system-ui', 'sans-serif'],
            display: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap');
    
    body { font-family: 'Inter', sans-serif; }
    h1, h2, h3, h4, .font-display { font-family: 'Plus Jakarta Sans', sans-serif; }

    .glass-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); }
    .dark .glass-card { background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(12px); }

    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; }
  </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // === SOLUCIÓN DEFINITIVA PARA LOS ÍCONOS DE LUCIDE ===
    // Este componente aisla las mutaciones del DOM para que React nunca arroje el error "removeChild"
    const LucideIcon = ({ name, className }) => {
      const iconRef = useRef(null);
      useEffect(() => {
        if (iconRef.current && window.lucide) {
          iconRef.current.innerHTML = ''; // Limpiamos para evitar duplicados
          const i = document.createElement('i');
          i.setAttribute('data-lucide', name);
          if (className) i.setAttribute('class', className);
          iconRef.current.appendChild(i);
          window.lucide.createIcons({ root: iconRef.current });
        }
      }, [name, className]);
      return <span ref={iconRef} style={{ display: 'contents' }}></span>;
    };

    const FAQ_LIST = [
      { q: "¿Cómo abro un ticket de atención con la Coordinación?", a: "Accede al módulo 'Mesa de Ayuda y Soporte' (primer elemento del menú) y redacta tu asunto. Recibirás respuesta directa en tu buzón de notificaciones." },
      { q: "¿Cuántos créditos requiero para iniciar Servicio Social?", a: "Debes cumplir con al menos el 60% de créditos del plan INCO (228 créditos acumulados)." },
      { q: "¿Cuáles son las opciones para Titulación Automática?", a: "Promedio general superior a 90 sin reprobadas o dictamen Sobresaliente en EGEL CENEVAL." },
      { q: "¿Cómo solicito un justificante por enfermedad?", a: "Sube tu comprobante médico (IMSS/SSA) en el módulo 'Justificantes' en un lapso no mayor a 5 días hábiles." },
      { q: "¿Qué trámite procede si caigo en Artículo 33?", a: "Genera la carta petición a la Comisión de Educación desde la sección 'Art. 33 y 35'." }
    ];

    // === PUENTE DE COMUNICACIÓN CON APPS SCRIPT ===
    const server = new Proxy({}, {
      get: (target, prop) => {
        return (...args) => {
          return new Promise((resolve, reject) => {
            if (typeof google === 'undefined') {
              console.warn(`Simulando llamada a backend: ${prop}`, args);
              reject(new Error("google.script.run no está disponible. Ejecuta esto dentro de Apps Script."));
              return;
            }
            google.script.run
              .withSuccessHandler(resolve)
              .withFailureHandler(reject)
              [prop](...args);
          });
        };
      }
    });

    const GUEST_USER = { name: "Visitante", role: "Invitado", code: "", gpa: 0, credits: 0, totalCredits: 380, integralHours: 0, requiredHours: 60, status: "Sin sesión", photo: null };

    function App() {
      const [user, setUser] = useState(GUEST_USER);
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [activeTab, setActiveTab] = useState('dudas'); 
      const [darkMode, setDarkMode] = useState(false);
      const [toast, setToast] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [activeModal, setActiveModal] = useState(null); 
      const [userDropdown, setUserDropdown] = useState(false);
      const [mobileNavOpen, setMobileNavOpen] = useState(false);
      
      const [notifOpen, setNotifOpen] = useState(false);
      const [notifications, setNotifications] = useState([]);
      const [globalTickets, setGlobalTickets] = useState([]);
      const [notices, setNotices] = useState([]); 
      const [globalJustificantes, setGlobalJustificantes] = useState([]);
      const [globalHoras, setGlobalHoras] = useState([]);
      const [globalConstancias, setGlobalConstancias] = useState([]);

      // Cargar datos reales al iniciar sesión
      useEffect(() => {
        if (isLoggedIn && user.role !== 'Invitado') {
          server.obtenerDatosPlataforma(user.code, user.role)
            .then(res => {
              if (res.exito) {
                setGlobalTickets(res.tickets);
                setNotices(res.avisos);
                setGlobalJustificantes(res.justificantes || []);
                setGlobalHoras(res.horas || []);
                setGlobalConstancias(res.constancias || []);
              }
            })
            .catch(err => console.error("Error de red cargando datos", err));
        } else {
          setGlobalTickets([]);
          setNotices([]);
          setNotifications([]);
          setGlobalJustificantes([]);
          setGlobalHoras([]);
          setGlobalConstancias([]);
        }
      }, [isLoggedIn, user]);

      const [chatOpen, setChatOpen] = useState(false);
      const [chatMessages, setChatMessages] = useState([
        { sender: 'bot', text: '¡Hola! Bienvenido al portal de la Coordinación de Ingeniería en Computación (CUCEI). ¿En qué trámite o duda de la carrera puedo colaborarte hoy?' }
      ]);
      const [chatInput, setChatInput] = useState('');
      const [chatLoading, setChatLoading] = useState(false);

      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [darkMode]);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      const addNotification = (title, text, type = 'info') => {
        const newNotif = { id: Date.now(), title, text, date: 'Ahora mismo', unread: true, type };
        setNotifications(prev => [newNotif, ...prev]);
      };

      const markAllNotifsRead = () => {
        setNotifications(prev => prev.map(n => ({ ...n, unread: false })));
        showToast("Todas las notificaciones marcadas como leídas");
      };

      const handleUpdateUser = (updatedFields) => {
        setUser(prev => ({ ...prev, ...updatedFields }));
        showToast("Perfil de usuario actualizado correctamente");
        addNotification("Perfil Actualizado", "Tus datos de contacto y foto fueron actualizados.", "success");
      };

      const handleSendChatMessage = async (presetText = null) => {
        const textToSend = presetText || chatInput;
        if (!textToSend.trim()) return;

        const newMessages = [...chatMessages, { sender: 'user', text: textToSend }];
        setChatMessages(newMessages);
        if (!presetText) setChatInput('');
        setChatLoading(true);

        try {
          const systemInstruction = `Eres el Asistente Institucional de la Coordinación de Ingeniería en Computación del CUCEI (Universidad de Guadalajara). Atiendes con profesionalismo, claridad y tono institucional formal sobre trámites, materias, titulación y reglamentos.`;
          const apiKey = "";
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: textToSend }] }],
              systemInstruction: { parts: [{ text: systemInstruction }] }
            })
          });

          const result = await response.json();
          const botReply = result?.candidates?.[0]?.content?.parts?.[0]?.text || 
            "Para un seguimiento presencial o firma de documento, acude a la Coordinación en el Edificio M, Planta Alta (M202) de Lunes a Viernes de 09:00 a 18:00 hrs.";

          setChatMessages(prev => [...prev, { sender: 'bot', text: botReply }]);
        } catch (error) {
          setChatMessages(prev => [...prev, { 
            sender: 'bot', 
            text: '📌 Si requieres atención personalizada, abre un Ticket en la Mesa de Ayuda o acude al módulo M202 en CUCEI.' 
          }]);
        } finally {
          setChatLoading(false);
        }
      };

      const getNavSections = () => {
        if (!isLoggedIn || user.role === 'Invitado') {
          return [
            {
              group: "PORTAL PÚBLICO",
              items: [
                { id: 'dudas', label: 'Preguntas Frecuentes', icon: 'help-circle', badge: 'FAQ' }
              ]
            }
          ];
        }

        if (user.role === 'Coordinacion') {
          return [
            {
              group: "PANEL ADMINISTRATIVO COORDINACIÓN",
              items: [
                { id: 'admin_panel', label: 'Gestión de Tickets y Respuestas', icon: 'life-buoy', badge: `${globalTickets.filter(t => t.status === 'Pendiente').length} pendientes` },
                { id: 'admin_justificantes', label: 'Aprobar Justificantes (Art. 53)', icon: 'shield-check', badge: 'Revisión' },
                { id: 'avisos', label: 'Publicar Avisos Oficiales', icon: 'bell', badge: null },
                { id: 'dudas', label: 'Preguntas Frecuentes FAQ', icon: 'help-circle', badge: null },
                { id: 'admin_horas', label: 'Revisión Horas Integrales', icon: 'award', badge: 'Revisión' },
                { id: 'admin_constancias', label: 'Emisión de Constancias', icon: 'file-badge', badge: `${globalConstancias.filter(c => c.status === 'Pendiente').length}` },
                
              ]
            }
          ];
        }

        if (user.role === 'Docente') {
          return [
            {
              group: "MÓDULOS DOCENTES / PROFESORES",
              items: [
                { id: 'tickets', label: 'Mesa de Ayuda y Tickets', icon: 'life-buoy', badge: 'Atención Directa' },
                { id: 'dudas', label: 'Preguntas Frecuentes', icon: 'help-circle', badge: null },
                { id: 'constancias_docente', label: 'Solicitar Constancia Carga Horaria', icon: 'file-text', badge: 'Docente' },
                { id: 'modulares', label: 'Proyectos Modulares Asesorados', icon: 'layers', badge: null },
                { id: 'avisos', label: 'Avisos de Coordinación', icon: 'bell', badge: '4' },
              ]
            }
          ];
        }

        return [
          {
            group: "SOPORTE Y AYUDA PRIORITARIA",
            items: [
              { id: 'tickets', label: 'Mesa de Ayuda / Tickets', icon: 'life-buoy', badge: 'Soporte' },
              { id: 'dudas', label: 'Preguntas Frecuentes', icon: 'help-circle', badge: 'FAQ' },
              { id: 'inicio', label: 'Inicio Catálogo Dashboard', icon: 'layout-dashboard', badge: null },
              { id: 'avisos', label: 'Avisos Oficiales CUCEI', icon: 'bell', badge: null },
            ]
          },
          {
            group: "TRÁMITES Y SOLICITUDES ESTUDIANTILES",
            items: [
              { id: 'justificantes', label: 'Justificante Médico (Art. 53)', icon: 'shield-check', badge: 'Faltas' },
              { id: 'ajuste', label: 'Ajuste de Materias/Cupos', icon: 'sliders', badge: 'SIIAU' },
              { id: 'art33_35', label: 'Dictamen Art. 33 y 35', icon: 'scale', badge: 'Comisión' },
            ]
          },
          {
            group: "GESTIÓN ACADÉMICA INCO",
            items: [
              { id: 'constancias', label: 'Kardex y Constancias', icon: 'file-text', badge: 'Digital' },
              { id: 'titulacion', label: 'Opciones de Titulación', icon: 'graduation-cap', badge: 'EGEL' },
              { id: 'modulares', label: 'Proyectos Modulares I, II, III', icon: 'layers', badge: 'Protocolo' },
              { id: 'horas', label: 'Horas Integrales', icon: 'award', badge: `${user.integralHours || 52}/60h` },
              { id: 'malla', label: 'Malla Curricular INCO', icon: 'grid', badge: null },
            ]
          }
        ];
      };

      const unreadCount = notifications.filter(n => n.unread).length;

      return (
        <div className="min-h-screen flex flex-col bg-slate-100 dark:bg-slate-900 selection:bg-udg-blue selection:text-white">
          
          {toast && (
            <div className={`fixed top-5 right-5 z-50 flex items-center gap-3 px-4 py-3 rounded-2xl shadow-2xl border text-xs font-semibold animate-in fade-in slide-in-from-top-2 ${
              toast.type === 'error' 
                ? 'bg-red-50 border-red-200 text-red-700 dark:bg-red-950/90 dark:border-red-800 dark:text-red-200' 
                : 'bg-emerald-50 border-emerald-200 text-emerald-800 dark:bg-emerald-950/90 dark:border-emerald-800 dark:text-emerald-200'
            }`}>
              <LucideIcon name={toast.type === 'error' ? 'alert-circle' : 'check-circle-2'} className="w-5 h-5 shrink-0" />
              <span>{toast.message}</span>
            </div>
          )}

          <header className="bg-udg-navy text-white sticky top-0 z-40 border-b border-slate-800 shadow-lg backdrop-blur-md bg-opacity-95">
            <div className="bg-slate-950/80 px-4 py-1 text-[11px] font-medium text-slate-300 border-b border-slate-800">
              <div className="max-w-7xl mx-auto flex justify-between items-center">
                <div className="flex items-center gap-3">
                  <span className="font-bold text-udg-gold tracking-wide">Universidad de Guadalajara</span>
                  <span className="hidden sm:inline text-slate-600">•</span>
                  <span className="hidden sm:inline text-slate-300">Centro Universitario de Ciencias Exactas e Ingenierías</span>
                </div>
                <div className="flex items-center gap-3">
                  <span className="text-emerald-400 font-bold bg-emerald-950/60 px-2 py-0.5 rounded border border-emerald-800/60">Ciclo Lectivo: 2026B</span>
                  <span className="text-slate-600">|</span>
                  <a href="https://siiau.udg.mx" target="_blank" className="hover:text-udg-gold transition-colors">Portal SIIAU</a>
                </div>
              </div>
            </div>

            <div className="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-4">
              
              <div className="flex items-center gap-3">
                <button 
                  onClick={() => setMobileNavOpen(!mobileNavOpen)}
                  className="lg:hidden p-2 rounded-xl bg-slate-800 text-slate-200 hover:bg-slate-700"
                >
                  <LucideIcon name="menu" className="w-5 h-5" />
                </button>

                <div className="flex items-center gap-3 cursor-pointer group" onClick={() => setActiveTab(user.role === 'Coordinacion' ? 'admin_panel' : 'tickets')}>
                  <div className="w-10 h-10 rounded-2xl bg-white p-1 flex items-center justify-center shadow-lg border border-slate-200 shrink-0 transform group-hover:scale-105 transition-transform">
                    <div className="text-center leading-none">
                      <span className="block font-black text-xs text-udg-navy tracking-tight">UDG</span>
                      <span className="block font-extrabold text-[9px] text-udg-gold">CUCEI</span>
                    </div>
                  </div>

                  <div>
                    <h1 className="text-base sm:text-lg font-extrabold tracking-tight text-white group-hover:text-udg-gold transition-colors leading-tight font-display">
                      Ingeniería en Computación
                    </h1>
                    <p className="text-[11px] text-slate-300 flex items-center gap-1.5">
                      <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                      Módulo M202 • Portal Institucional
                    </p>
                  </div>
                </div>
              </div>

              <div className="flex items-center gap-2 sm:gap-3">
                
                <div className="relative">
                  <button 
                    onClick={() => setNotifOpen(!notifOpen)}
                    className="p-2 rounded-xl bg-slate-800/90 hover:bg-slate-700 text-slate-200 border border-slate-700 transition-all relative flex items-center justify-center"
                    title="Bandeja de Notificaciones"
                  >
                    <LucideIcon name="bell" className="w-4 h-4 text-udg-gold" />
                    {unreadCount > 0 && (
                      <span className="absolute -top-1 -right-1 bg-red-600 text-white font-bold text-[10px] w-4 h-4 rounded-full flex items-center justify-center shadow animate-bounce">
                        {unreadCount}
                      </span>
                    )}
                  </button>

                  {notifOpen && (
                    <div className="absolute right-0 mt-3 w-80 sm:w-96 bg-white dark:bg-slate-800 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-700 py-3 z-50 text-slate-800 dark:text-slate-100 text-xs animate-in fade-in slide-in-from-top-2">
                      <div className="px-4 pb-2 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center">
                        <div className="flex items-center gap-2">
                          <LucideIcon name="bell-ring" className="w-4 h-4 text-udg-gold" />
                          <h4 className="font-bold text-sm font-display">Notificaciones en Vivo</h4>
                        </div>
                        {unreadCount > 0 && (
                          <button onClick={markAllNotifsRead} className="text-[10px] text-udg-blue dark:text-blue-400 hover:underline font-semibold">
                            Marcar leídas
                          </button>
                        )}
                      </div>

                      <div className="max-h-72 overflow-y-auto custom-scrollbar divide-y divide-slate-100 dark:divide-slate-700/60">
                        {notifications.length === 0 ? (
                          <p className="p-4 text-center text-slate-400">No tienes notificaciones pendientes.</p>
                        ) : (
                          notifications.map(n => (
                            <div key={n.id} className={`p-3.5 transition-colors ${n.unread ? 'bg-blue-50/70 dark:bg-slate-700/50' : 'hover:bg-slate-50 dark:hover:bg-slate-700/30'}`}>
                              <div className="flex justify-between items-start gap-2">
                                <h5 className="font-bold text-slate-900 dark:text-white leading-tight flex items-center gap-1.5">
                                  {n.unread && <span className="w-2 h-2 rounded-full bg-udg-gold shrink-0"></span>}
                                  {n.title}
                                </h5>
                                <span className="text-[10px] text-slate-400 shrink-0">{n.date}</span>
                              </div>
                              <p className="text-slate-600 dark:text-slate-300 text-[11px] mt-1 leading-relaxed">{n.text}</p>
                            </div>
                          ))
                        )}
                      </div>

                      <div className="px-4 pt-2 border-t border-slate-100 dark:border-slate-700 text-center">
                        <span className="text-[10px] text-slate-400">Notificaciones automáticas del sistema INCO</span>
                      </div>
                    </div>
                  )}
                </div>

                <button 
                  onClick={() => setDarkMode(!darkMode)}
                  className="p-2 rounded-xl bg-slate-800/90 hover:bg-slate-700 text-slate-200 border border-slate-700 transition-all text-xs flex items-center gap-1.5"
                  title="Cambiar Contraste"
                >
                  <LucideIcon name={darkMode ? 'sun' : 'moon'} className="w-4 h-4 text-udg-gold" />
                  <span className="hidden md:inline text-[11px] font-medium">{darkMode ? 'Claro' : 'Oscuro'}</span>
                </button>

                {isLoggedIn && user.role !== 'Invitado' ? (
                  <div className="relative">
                    <button 
                      onClick={() => setUserDropdown(!userDropdown)}
                      className="flex items-center gap-2.5 bg-slate-800 hover:bg-slate-700/90 p-1.5 pr-3 rounded-2xl border border-slate-700 transition-all text-left"
                    >
                      <div className="w-9 h-9 rounded-xl overflow-hidden bg-udg-blue text-white flex items-center justify-center font-bold text-xs border border-blue-400/40 shrink-0">
                        {user.photo ? (
                          <img src={user.photo} alt={user.name} className="w-full h-full object-cover" />
                        ) : (
                          user.name ? user.name.charAt(0) : 'U'
                        )}
                      </div>
                      <div className="hidden sm:block">
                        <p className="text-xs font-bold text-white leading-tight">{user.name.split(' ')[0]} {user.name.split(' ')[2] || ''}</p>
                        <span className={`text-[9px] font-black uppercase px-1.5 py-0.2 rounded ${
                          user.role === 'Coordinacion' 
                            ? 'bg-amber-500 text-slate-950' 
                            : user.role === 'Docente' 
                              ? 'bg-emerald-500 text-white' 
                              : 'bg-blue-500 text-white'
                        }`}>
                          {user.role}
                        </span>
                      </div>
                      <LucideIcon name="chevron-down" className="w-4 h-4 text-slate-400" />
                    </button>

                    {userDropdown && (
                      <div className="absolute right-0 mt-3 w-80 bg-white dark:bg-slate-800 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-700 py-2 z-50 text-slate-800 dark:text-slate-100 text-xs">
                        <div className="px-4 py-3 border-b border-slate-100 dark:border-slate-700 flex items-center gap-3">
                          <div className="w-12 h-12 rounded-xl overflow-hidden bg-slate-100 dark:bg-slate-700 shrink-0 border border-slate-300 dark:border-slate-600 shadow-inner">
                            {user.photo ? (
                              <img src={user.photo} alt={user.name} className="w-full h-full object-cover" />
                            ) : (
                              <div className="w-full h-full flex items-center justify-center font-bold text-slate-600 dark:text-slate-200 text-base">{user.name ? user.name.charAt(0) : 'U'}</div>
                            )}
                          </div>
                          <div className="overflow-hidden">
                            <p className="font-bold text-slate-900 dark:text-white truncate font-display">{user.name}</p>
                            <p className="text-[10px] text-slate-500 dark:text-slate-400 truncate">{user.email}</p>
                            <p className="text-[10px] text-udg-gold font-mono font-semibold">Rol: {user.role}</p>
                          </div>
                        </div>

                        <button 
                          onClick={() => { setActiveModal('edit_profile'); setUserDropdown(false); }}
                          className="w-full text-left px-4 py-2.5 hover:bg-slate-50 dark:hover:bg-slate-700/60 flex items-center gap-2.5 text-udg-navy dark:text-blue-300 font-semibold"
                        >
                          <LucideIcon name="camera" className="w-4 h-4 text-udg-gold" />
                          <span>Cambiar Foto y Editar Datos</span>
                        </button>

                        <div className="border-t border-slate-100 dark:border-slate-700 my-1"></div>
                        <button 
                          onClick={() => { 
                            setIsLoggedIn(false); 
                            setUser(GUEST_USER);
                            setActiveTab('dudas');
                            setUserDropdown(false);
                            showToast("Sesión cerrada correctamente", "error"); 
                          }}

function TicketsModule({ user, showToast, addNotification, globalTickets, setGlobalTickets }) {
  const [subject, setSubject] = useState('');
  const [details, setDetails] = useState('');
  const [loading, setLoading] = useState(false);
  
  const [filterStatus, setFilterStatus] = useState('Todos');
  const [searchTerm, setSearchTerm] = useState('');

  // NUEVO: Estados de Paginación
  const [currentPage, setCurrentPage] = useState(1);
  const [itemsPerPage, setItemsPerPage] = useState(5);

  // Resetea a la página 1 cuando el usuario busca o filtra
  useEffect(() => {
    setCurrentPage(1);
  }, [filterStatus, searchTerm, itemsPerPage]);
  
  const userTickets = globalTickets.filter(t => t.student === user.name || user.role !== 'Estudiante');

  const ticketsFiltrados = userTickets.filter(t => {
    const coincideEstado = filterStatus === 'Todos' || t.status === filterStatus;
    const busqueda = searchTerm.toLowerCase().trim();
    const coincideBusqueda = t.subject.toLowerCase().includes(busqueda) || t.details.toLowerCase().includes(busqueda);
    return coincideEstado && coincideBusqueda;
  });

  // NUEVO: Lógica de Paginación (Cálculo de índices)
  const totalItems = ticketsFiltrados.length;
  const totalPages = Math.ceil(totalItems / itemsPerPage) || 1;
  const indexOfLastItem = currentPage * itemsPerPage;
  const indexOfFirstItem = indexOfLastItem - itemsPerPage;
  const currentTickets = ticketsFiltrados.slice(indexOfFirstItem, indexOfLastItem);

  const handleCreateTicket = async (e) => {
    e.preventDefault();
    if (!subject.trim() || !details.trim()) return showToast("Ingresa el asunto y los detalles del ticket", "error");

    setLoading(true);
    const datosNuevoTicket = { student: user.name, code: user.code, email: user.email, subject: subject, details: details };

    try {
      const respuesta = await server.registrarNuevoTicket(datosNuevoTicket);
      if (respuesta.exito) {
        setGlobalTickets([respuesta.ticket, ...globalTickets]);
        setSubject(''); setDetails('');
        showToast(`Ticket #${respuesta.ticket.id} registrado correctamente.`);
        addNotification("Ticket Registrado", `Se generó tu ticket #${respuesta.ticket.id}. Recibirás respuesta pronto.`, "info");
        setFilterStatus('Todos');
        setCurrentPage(1); // Manda al alumno a la primera página para que vea su nuevo ticket
      } else {
        showToast(respuesta.mensaje, "error");
      }
    } catch (error) {
      showToast("Error de conexión al generar el ticket.", "error");
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="space-y-6">
      {/* FORMULARIO CREAR TICKET */}
      <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
        <div className="flex items-center gap-3 border-b border-slate-100 dark:border-slate-700 pb-4">
          <div className="w-10 h-10 rounded-xl bg-udg-light dark:bg-slate-700 text-udg-navy dark:text-blue-300 flex items-center justify-center font-bold">
            <LucideIcon name="life-buoy" className="w-5 h-5" />
          </div>
          <div>
            <h3 className="text-lg font-bold text-slate-900 dark:text-white font-display">Mesa de Ayuda y Tickets</h3>
            <p className="text-xs text-slate-500 dark:text-slate-400">Canal prioritario de comunicación con la Coordinación de Computación (Edificio M202).</p>
          </div>
        </div>

        <form onSubmit={handleCreateTicket} className="space-y-3 text-xs">
          <div>
            <label className="block font-semibold text-slate-700 dark:text-slate-300 mb-1">Asunto de la Solicitud o Aclaración *</label>
            <input 
              type="text" placeholder="Ej: Duda con Servicio Social" value={subject} onChange={(e) => setSubject(e.target.value)} 
              className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-3 rounded-xl focus:ring-2 focus:ring-udg-blue outline-none" 
            />
          </div>
          <div>
            <label className="block font-semibold text-slate-700 dark:text-slate-300 mb-1">Descripción Detallada *</label>
            <textarea 
              rows="3" placeholder="Escribe los detalles específicos..." value={details} onChange={(e) => setDetails(e.target.value)} 
              className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-3 rounded-xl focus:ring-2 focus:ring-udg-blue outline-none"
            ></textarea>
          </div>
          <div className="flex justify-end pt-1">
            <button type="submit" disabled={loading} className="bg-udg-navy hover:bg-udg-blue text-white font-bold px-6 py-2.5 rounded-xl flex items-center gap-2 shadow-md transition-all disabled:opacity-70">
              {loading ? <LucideIcon name="loader-2" className="w-4 h-4 animate-spin" /> : <LucideIcon name="send" className="w-4 h-4" />}
              <span>{loading ? 'Enviando...' : 'Aperturar Nuevo Ticket'}</span>
            </button>
          </div>
        </form>
      </div>

      {/* HISTORIAL DE TICKETS CON PAGINACIÓN */}
      <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm space-y-4 text-xs">
        <h4 className="text-sm font-bold text-slate-900 dark:text-white flex items-center gap-2 font-display">
          <LucideIcon name="history" className="w-4 h-4 text-udg-gold" />
          Mis Tickets de Atención ({totalItems})
        </h4>

        <div className="flex flex-col md:flex-row gap-3 justify-between items-stretch md:items-center">
          <div className="relative flex-1 max-w-md">
            <LucideIcon name="search" className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" />
            <input
              type="text" placeholder="Buscar en mis tickets..."
              value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)}

          <div className="flex items-center gap-1 bg-slate-100 dark:bg-slate-900 p-1 rounded-xl shrink-0 overflow-x-auto">

              <button

                }`}
              >
                {estado}
              </button>
            ))}
          </div>
        </div>

        <div className="space-y-3 pt-2">
          {currentTickets.length === 0 ? (

          ) : (

                  <div className="flex items-center gap-2">
                    <span className="font-mono font-bold text-udg-navy dark:text-blue-400">#{t.id}</span>
                    <span className="text-slate-400">•</span>
                    <span className="text-slate-500 font-medium">{t.date}</span>
                  </div>
                  <span className={`px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider ${t.status === 'Atendido' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}`}>
                    {t.status}
                  </span>
                </div>

                <h5 className="font-bold text-slate-900 dark:text-white text-sm">{t.subject}</h5>
                <p className="text-slate-600 dark:text-slate-300 leading-relaxed mb-2 whitespace-pre-wrap">{t.details}</p>

              <span className="px-3 py-1.5 font-bold text-slate-800 dark:text-slate-200">Página {currentPage} de {totalPages}</span>

function AdminPanelTickets({ globalTickets, setGlobalTickets, showToast, addNotification }) {
  const [replyTexts, setReplyTexts] = useState({});
  const [loadingId, setLoadingId] = useState(null);
  
  const [filterStatus, setFilterStatus] = useState('Pendiente');
  const [searchTerm, setSearchTerm] = useState('');

  // NUEVO: Estados de Paginación Admin
  const [currentPage, setCurrentPage] = useState(1);
  const [itemsPerPage, setItemsPerPage] = useState(10); // 10 por defecto para admin

  // Resetea a la página 1 cuando se usan filtros
  useEffect(() => {
    setCurrentPage(1);
  }, [filterStatus, searchTerm, itemsPerPage]);

  const handleReply = async (ticketId, studentName) => {
    const text = replyTexts[ticketId];
    if (!text || !text.trim()) return showToast("Escribe un mensaje de respuesta", "error");

    setLoadingId(ticketId);
    try {
      const respuesta = await server.responderTicketAdmin(ticketId, text);
      if(respuesta.exito) {
        const updated = globalTickets.map(t => t.id === ticketId ? { ...t, status: 'Atendido', reply: text } : t);
        setGlobalTickets(updated);
        setReplyTexts(prev => ({ ...prev, [ticketId]: '' }));
        showToast(`Respuesta enviada y guardada para el ticket #${ticketId}`);
        addNotification("Respuesta Enviada", `Se ha dictaminado el ticket #${ticketId} del alumno ${studentName}.`, "success");
      } else {
        showToast(respuesta.mensaje, "error");
      }
    } catch (error) {
      showToast("Error de conexión al responder el ticket.", "error");
    } finally {
      setLoadingId(null);
    }
  };

  const ticketsFiltrados = globalTickets.filter(t => {
    const coincideEstado = filterStatus === 'Todos' || t.status === filterStatus;
    const busqueda = searchTerm.toLowerCase().trim();
    const coincideBusqueda = t.student.toLowerCase().includes(busqueda) || t.code.includes(busqueda) || t.subject.toLowerCase().includes(busqueda);
    return coincideEstado && coincideBusqueda;
  });

  // NUEVO: Lógica de Paginación Admin
  const totalItems = ticketsFiltrados.length;
  const totalPages = Math.ceil(totalItems / itemsPerPage) || 1;
  const indexOfLastItem = currentPage * itemsPerPage;
  const indexOfFirstItem = indexOfLastItem - itemsPerPage;
  const currentTickets = ticketsFiltrados.slice(indexOfFirstItem, indexOfLastItem);

  return (
    <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm space-y-5 text-xs">
      
      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-100 dark:border-slate-700 pb-4">
        <div className="flex items-center gap-3">
          <div className="w-10 h-10 rounded-xl bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-200 flex items-center justify-center font-bold">
            <LucideIcon name="life-buoy" className="w-5 h-5" />
          </div>
          <div>
            <h3 className="text-lg font-bold text-slate-900 dark:text-white font-display">Panel de Administración de Tickets</h3>
            <p className="text-xs text-slate-500 dark:text-slate-400">Atiende y responde las solicitudes en tiempo real.</p>
          </div>
        </div>
      </div>

      <div className="flex flex-col md:flex-row gap-3 justify-between items-stretch md:items-center">
        <div className="relative flex-1 max-w-md">
          <LucideIcon name="search" className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" />
          <input
            type="text" placeholder="Buscar por alumno, código o asunto..."
            value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)}
            className="w-full bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 placeholder-slate-400 pl-9 pr-8 py-2 rounded-xl border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-udg-blue text-xs"
          />
        </div>

        <div className="flex items-center gap-1 bg-slate-100 dark:bg-slate-900 p-1 rounded-xl shrink-0 overflow-x-auto custom-scrollbar">
          {['Pendiente', 'Atendido', 'Todos'].map(estado => (
            <button
              key={estado}
              onClick={() => setFilterStatus(estado)}
              className={`px-4 py-1.5 rounded-lg font-bold transition-all ${
                filterStatus === estado ? 'bg-udg-navy text-white shadow dark:bg-udg-blue' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200'
              }`}
            >
              {estado}
            </button>
          ))}
        </div>
      </div>

      <div className="space-y-4 pt-2">
        {currentTickets.length === 0 ? (
          <p className="text-center text-slate-500 py-6 border border-dashed border-slate-200 dark:border-slate-700 rounded-xl bg-slate-50 dark:bg-slate-900/40">No se encontraron tickets con esos criterios.</p>
        ) : (
          currentTickets.map(t => (
            <div key={t.id} className="p-4 rounded-xl bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-700 space-y-3">
              <div className="flex justify-between items-start">
                <div>
                  <span className="font-mono font-bold text-udg-navy dark:text-blue-400 text-sm">#{t.id}</span>
                  <h4 className="font-bold text-slate-900 dark:text-white text-sm">{t.subject}</h4>
                  <p className="text-slate-500 text-[11px] mt-0.5">Solicitante: <span className="font-semibold text-slate-700 dark:text-slate-300">{t.student}</span> (Cód: {t.code} • Fecha: {t.date})</p>
                </div>
                <span className={`px-3 py-1 rounded-full text-[10px] font-extrabold uppercase tracking-wider ${t.status === 'Atendido' ? 'bg-emerald-100 text-emerald-800 border border-emerald-200 dark:border-emerald-800' : 'bg-amber-100 text-amber-800 border border-amber-200 dark:border-amber-800 animate-pulse'}`}>
                  {t.status}
                </span>
              </div>
              
              <div className="bg-white dark:bg-slate-800 p-3 rounded-xl border border-slate-200 dark:border-slate-600 text-slate-600 dark:text-slate-300 text-sm leading-relaxed whitespace-pre-wrap">
                {t.details}
              </div>

              {t.reply ? (
                <div className="p-4 bg-emerald-50 dark:bg-emerald-950/40 rounded-xl border border-emerald-200 dark:border-emerald-800 mt-2">
                  <p className="font-bold text-emerald-800 dark:text-emerald-300 flex items-center gap-1.5 mb-1"><LucideIcon name="check-circle" className="w-4 h-4" /> Dictamen de Coordinación:</p>
                  <p className="text-emerald-900 dark:text-emerald-200 whitespace-pre-wrap">{t.reply}</p>
                </div>
              ) : (
                <div className="space-y-2 pt-3 border-t border-slate-200 dark:border-slate-700">
                  <textarea 
                    rows="2" placeholder="Escribe la solución u orientación oficial..." 
                    value={replyTexts[t.id] || ''} onChange={(e) => setReplyTexts({ ...replyTexts, [t.id]: e.target.value })}
                    className="w-full bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-xl p-3 text-xs focus:ring-2 focus:ring-udg-blue outline-none"
                  ></textarea>
                  <button 
                    onClick={() => handleReply(t.id, t.student)}
                    disabled={loadingId === t.id}
                    className="bg-udg-navy hover:bg-udg-blue text-white font-bold px-5 py-2.5 rounded-xl text-xs flex items-center gap-2 shadow-md disabled:opacity-70 transition-all"
                  >
                    {loadingId === t.id ? <LucideIcon name="loader-2" className="w-4 h-4 animate-spin" /> : <LucideIcon name="send" className="w-4 h-4" />}
                    <span>{loadingId === t.id ? 'Guardando respuesta...' : 'Enviar y Cerrar Ticket'}</span>
                  </button>
                </div>
              )}
            </div>
          ))
        )}
      </div>

      {/* CONTROLES DE PAGINACIÓN ADMIN */}
      {totalItems > 0 && (
        <div className="flex flex-col sm:flex-row justify-between items-center gap-3 pt-4 border-t border-slate-100 dark:border-slate-700 text-slate-500 font-medium text-xs">
          <div className="flex items-center gap-2">
            <span>Mostrar:</span>
            <select value={itemsPerPage} onChange={(e) => setItemsPerPage(Number(e.target.value))} className="bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-1 outline-none text-xs font-bold text-slate-700 dark:text-slate-200">
              <option value={5}>5</option>
              <option value={10}>10</option>
              <option value={20}>20</option>
              <option value={50}>50</option>
            </select>
            <span className="ml-2">Mostrando {indexOfFirstItem + 1} - {Math.min(indexOfLastItem, totalItems)} de {totalItems}</span>
          </div>
          <div className="flex items-center gap-1">
            <button onClick={() => setCurrentPage(prev => Math.max(prev - 1, 1))} disabled={currentPage === 1} className="p-2 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 disabled:opacity-40 transition-colors"><LucideIcon name="chevron-left" className="w-4 h-4" /></button>
            <span className="px-3 py-1.5 font-bold text-slate-800 dark:text-slate-200">Página {currentPage} de {totalPages}</span>
            <button onClick={() => setCurrentPage(prev => Math.min(prev + 1, totalPages))} disabled={currentPage === totalPages} className="p-2 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 disabled:opacity-40 transition-colors"><LucideIcon name="chevron-right" className="w-4 h-4" /></button>
          </div>
        </div>
      )}
    </div>
  );
}

// ==========================================
// MÓDULO ALUMNO: HORAS INTEGRALES (PROGRESO DINÁMICO)
// ==========================================
function HorasIntegralesModule({ user, showToast, addNotification, globalHoras, setGlobalHoras }) {
  const [files, setFiles] = useState([]);
  const [keptFiles, setKeptFiles] = useState([]); 
  const [confirmed, setConfirmed] = useState(false);
  const [loading, setLoading] = useState(false);

  // Filtramos solicitudes y calculamos avance
  const myRequests = globalHoras.filter(h => h.code === user.code);
  const approvedRequests = myRequests.filter(h => h.status === 'Aprobado');
  const totalApprovedHours = approvedRequests.reduce((sum, h) => sum + (Number(h.horasAprobadas) || 0), 0);
  const progressPercentage = Math.min((totalApprovedHours / 64) * 100, 100);
  const isApproved = totalApprovedHours >= 64;

  const activeRequest = myRequests.find(h => h.status === 'Pendiente' || h.status === 'Devuelta');

  useEffect(() => {
    if (activeRequest && activeRequest.status === 'Devuelta') {
      setConfirmed(activeRequest.confirmo64 === true);
      const linksPrevios = activeRequest.files ? activeRequest.files.split(', ').filter(url => url) : [];
      setKeptFiles(linksPrevios);
    }
  }, [activeRequest]);

  const handleFileChange = (e) => {
    const selectedFiles = Array.from(e.target.files);
    setFiles(prevFiles => {
      const validFiles = selectedFiles.filter(f => {
        if(f.size > 3 * 1024 * 1024) { showToast(`El archivo ${f.name} supera los 3MB`, "error"); return false; }
        if(prevFiles.some(existing => existing.name === f.name)) { showToast(`El archivo ${f.name} ya está en la lista`, "error"); return false; }
        return true;
      });
      return [...prevFiles, ...validFiles];
    });
    e.target.value = null; 
  };

  const handleRemoveFile = (indexToRemove) => setFiles(prevFiles => prevFiles.filter((_, index) => index !== indexToRemove));
  const handleRemoveKeptFile = (indexToRemove) => setKeptFiles(prev => prev.filter((_, index) => index !== indexToRemove));

  const procesarArchivosB64 = async (archivosArray) => {
    return Promise.all(archivosArray.map(file => {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve({ name: file.name, data: reader.result });
        reader.readAsDataURL(file);
      });
    }));
  };

  const handleSubmitNuevo = async (e) => {
    e.preventDefault();
    if(files.length === 0) return showToast("Sube al menos una evidencia para enviar.", "error");
    
    setLoading(true);
    const archivosProcesados = await procesarArchivosB64(files);
    try {
      const res = await server.registrarSolicitudHoras({ code: user.code, student: user.name, confirma64: confirmed, archivos: archivosProcesados });
      if(res.exito) {
        setGlobalHoras([res.solicitud, ...globalHoras]);
        showToast("Archivos enviados a revisión correctamente.");
        addNotification("Horas Integrales", "Tu avance de horas fue recibido y está en revisión.", "info");
        setFiles([]); setConfirmed(false);
      } else { showToast(res.mensaje, "error"); }
    } catch(err) { showToast("Error de conexión", "error"); }
    setLoading(false);
  };

  const handleSubirCorrecion = async () => {
    const originalFilesCount = activeRequest.files ? activeRequest.files.split(', ').filter(u=>u).length : 0;
    if(files.length === 0 && confirmed === activeRequest.confirmo64 && keptFiles.length === originalFilesCount) {
      return showToast("No has realizado ningún cambio en tu solicitud devuelta.", "error");
    }
    if(files.length === 0 && keptFiles.length === 0) return showToast("La solicitud no puede ir vacía.", "error");

    setLoading(true);
    const archivosProcesados = await procesarArchivosB64(files);
    try {
      const urlsMantenidasStr = keptFiles.join(', ');
      const res = await server.agregarArchivosHoras(activeRequest.id, archivosProcesados, confirmed, urlsMantenidasStr);
      if(res.exito) {
        const updated = globalHoras.map(h => h.id === activeRequest.id ? { ...h, status: 'Pendiente', files: res.nuevasUrls, confirmo64: res.confirmo64 } : h);
        setGlobalHoras(updated);
        showToast("Solicitud actualizada y reenviada a revisión.");
        setFiles([]);
      } else { showToast(res.mensaje, "error"); }
    } catch(err) { showToast("Error de red", "error"); }
    setLoading(false);
  };

  return (
    <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm space-y-6">
      
      {/* 1. BARRA DE PROGRESO GLOBAL */}
      <div className="bg-slate-50 dark:bg-slate-900 rounded-2xl p-5 border border-slate-200 dark:border-slate-700 relative overflow-hidden">
        <div className="flex justify-between items-end mb-3 relative z-10">
          <div>
            <h3 className="text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2 font-display">
              <LucideIcon name="award" className="w-5 h-5 text-udg-gold" />
              Mi Avance de Horas Integrales
            </h3>
            <p className="text-[11px] text-slate-500 mt-1">Acumula constancias hasta completar tu requisito de titulación.</p>
          </div>
          <div className="text-right">
            <span className="text-2xl font-black text-udg-navy dark:text-blue-400">{totalApprovedHours}</span>
            <span className="text-sm font-bold text-slate-400"> / 64</span>
          </div>
        </div>
        
        <div className="w-full bg-slate-200 dark:bg-slate-700 rounded-full h-3 overflow-hidden relative z-10">
          <div className="bg-udg-gold h-3 rounded-full transition-all duration-1000 ease-out relative" style={{width: `${progressPercentage}%`}}>
            {progressPercentage >= 100 && <div className="absolute inset-0 bg-white/30 animate-[pulse_2s_ease-in-out_infinite]"></div>}
          </div>
        </div>
      </div>

      {/* HISTORIAL DE ARCHIVOS YA APROBADOS (Visible siempre que haya avance) */}
      {approvedRequests.length > 0 && (
        <div className="bg-emerald-50 dark:bg-emerald-900/10 p-4 rounded-xl border border-emerald-200 dark:border-emerald-800/40 space-y-3">
          <h4 className="font-bold text-emerald-800 dark:text-emerald-400 text-xs flex items-center gap-1.5">
            <LucideIcon name="check-circle" className="w-4 h-4" />
            Evidencias validadas y aprobadas (No volver a subir):
          </h4>
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2">
            {approvedRequests.map(req => (
              req.files.split(', ').map((url, i) => url && (
                <a key={`${req.id}-${i}`} href={url} target="_blank" rel="noreferrer" className="flex items-center gap-2 bg-white dark:bg-slate-800 p-2.5 rounded-lg border border-emerald-100 dark:border-emerald-800/50 shadow-sm hover:border-emerald-400 transition-colors">
                  <LucideIcon name="file-check" className="w-4 h-4 text-emerald-600 shrink-0" />
                  <div className="overflow-hidden">
                    <span className="truncate text-[10px] font-bold text-slate-700 dark:text-slate-300 block">Trámite #{req.id}</span>
                    <span className="truncate text-[9px] text-slate-500">Evidencia {i + 1}</span>
                  </div>
                  <LucideIcon name="external-link" className="w-3 h-3 text-slate-400 ml-auto shrink-0" />
                </a>
              ))
            ))}
          </div>
        </div>
      )}

      {/* 2. VISTAS CONDICIONALES */}
      {isApproved ? (
        <div className="bg-emerald-50 dark:bg-emerald-900/30 rounded-2xl p-8 border border-emerald-200 dark:border-emerald-800 text-center space-y-4">
          <div className="w-20 h-20 bg-emerald-500 rounded-full flex items-center justify-center mx-auto shadow-lg text-white">
            <LucideIcon name="check-circle" className="w-10 h-10" />
          </div>
          <h2 className="text-2xl font-black text-emerald-800 dark:text-emerald-400 font-display">¡Horas Integrales Completadas!</h2>
          <p className="text-emerald-700 dark:text-emerald-200 text-sm max-w-md mx-auto">
            La Coordinación ha validado satisfactoriamente tus evidencias. Has cumplido con el requisito total de 64 horas integrales.
          </p>
        </div>
      ) : activeRequest ? (
        <div className="border-t border-slate-100 dark:border-slate-700 pt-5 space-y-4">
          <div className="flex items-center justify-between">
            <h4 className="font-bold text-slate-900 dark:text-white flex items-center gap-2">Estado de Trámite en Curso</h4>
            <span className={`px-4 py-1 rounded-full text-[10px] font-black uppercase tracking-wider ${activeRequest.status === 'Devuelta' ? 'bg-red-100 text-red-700' : 'bg-amber-100 text-amber-700'}`}>
              {activeRequest.status}
            </span>
          </div>

          {activeRequest.status === 'Pendiente' ? (
             <div className="bg-blue-50 dark:bg-slate-900/60 p-5 rounded-2xl border border-blue-200 dark:border-slate-700 flex items-center gap-4">
               <LucideIcon name="clock" className="w-8 h-8 text-udg-blue shrink-0" />
               <div>
                 <h4 className="font-bold text-slate-900 dark:text-white">Archivos en Revisión</h4>
                 <p className="text-xs text-slate-600 dark:text-slate-300 mt-1">Tus últimas constancias están siendo evaluadas. Una vez dictaminadas, los créditos se sumarán a tu progreso.</p>
               </div>
             </div>
          ) : (
            <div className="space-y-4">
              <div className="bg-red-50 dark:bg-red-900/20 p-5 rounded-2xl border border-red-200 dark:border-red-800 text-sm">
                <h4 className="font-bold text-red-800 dark:text-red-400 flex items-center gap-2 mb-1"><LucideIcon name="alert-triangle" className="w-4 h-4"/> Solicitud Devuelta por Coordinación</h4>
                <p className="text-red-700 dark:text-red-200 text-xs">Revisa si hay constancias incorrectas y elimínalas, y/o sube los archivos que hagan falta para completar la solicitud.</p>
              </div>

              {/* ARCHIVOS PREVIOS CON BOTÓN DE ELIMINAR */}
              <div className="bg-slate-50 dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-700 space-y-3">
                <span className="font-bold text-slate-700 dark:text-slate-300 text-xs flex items-center gap-1.5">
                  <LucideIcon name="folder-clock" className="w-4 h-4 text-slate-500" />
                  Documentos enviados previamente:
                </span>
                
                {keptFiles.length === 0 ? (
                  <p className="text-[11px] text-red-500 font-medium">Has quitado todos tus archivos anteriores.</p>
                ) : (
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    {keptFiles.map((url, i) => (
                      <div key={i} className="flex items-center justify-between bg-white dark:bg-slate-800 p-2.5 rounded-lg border border-slate-200 dark:border-slate-600 shadow-sm">
                        <a href={url} target="_blank" rel="noreferrer" className="font-medium text-udg-blue dark:text-blue-400 hover:underline text-[11px] flex items-center gap-2 truncate" title="Ver documento original">
                          <LucideIcon name="external-link" className="w-3.5 h-3.5 shrink-0" />
                          <span className="truncate">Evidencia_Previa_{i + 1}</span>
                        </a>
                        <button type="button" onClick={() => handleRemoveKeptFile(i)} className="flex items-center gap-1.5 bg-red-50 dark:bg-red-900/40 hover:bg-red-100 dark:hover:bg-red-900/60 text-red-600 dark:text-red-400 px-2.5 py-1.5 rounded-md text-[10px] font-bold transition-colors shrink-0">
                          <LucideIcon name="trash-2" className="w-3.5 h-3.5" /> Quitar
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              <div className="bg-slate-50 dark:bg-slate-900/50 p-4 rounded-xl border border-slate-200 dark:border-slate-700">
                <label className="flex items-start gap-3 cursor-pointer">
                  <input type="checkbox" checked={confirmed} onChange={(e) => setConfirmed(e.target.checked)} className="mt-1 w-4 h-4 text-udg-blue rounded" />
                  <span className="font-semibold text-slate-700 dark:text-slate-300 text-xs">
                    (Opcional) Declaro que, sumando mis constancias conservadas y las nuevas, cubro el total de 64 horas restantes.
                  </span>
                </label>
              </div>
              
              <div className="p-4 border border-dashed border-slate-300 dark:border-slate-600 rounded-xl bg-slate-50 dark:bg-slate-900 space-y-3">
                <label className="block font-bold text-sm text-slate-700 dark:text-slate-300">Añadir nuevas constancias</label>
                <input type="file" multiple accept=".pdf,image/*" onChange={handleFileChange} className="w-full text-xs" />
                {files.length > 0 && (
                  <div className="mt-2 space-y-1.5">
                    {files.map((f, i) => (
                      <div key={i} className="flex justify-between items-center bg-white dark:bg-slate-800 p-2 rounded-lg border border-slate-200 dark:border-slate-700 text-[11px]">
                        <span className="truncate max-w-[85%] font-medium text-slate-700 dark:text-slate-300"><LucideIcon name="file" className="w-3 h-3 inline mr-1 text-udg-blue" />{f.name}</span>
                        <button type="button" onClick={() => handleRemoveFile(i)} className="text-red-500 hover:bg-red-50 p-1.5 rounded-md"><LucideIcon name="trash-2" className="w-3.5 h-3.5" /></button>
                      </div>
                    ))}
                  </div>
                )}
                
                <button onClick={handleSubirCorrecion} disabled={loading} className="w-full bg-udg-navy hover:bg-udg-blue text-white font-bold py-2.5 rounded-xl transition-all shadow-md flex items-center justify-center gap-2 text-xs disabled:opacity-50 mt-2">
                  {loading ? <LucideIcon name="loader-2" className="w-4 h-4 animate-spin" /> : <LucideIcon name="upload-cloud" className="w-4 h-4" />} Actualizar Solicitud
                </button>
              </div>
            </div>
          )}
        </div>
      ) : (
        <form onSubmit={handleSubmitNuevo} className="border-t border-slate-100 dark:border-slate-700 pt-5 space-y-4 text-xs">
          <div className="bg-slate-50 dark:bg-slate-900/50 p-4 rounded-xl border border-slate-200 dark:border-slate-700">
            <label className="flex items-start gap-3 cursor-pointer">
              <input type="checkbox" checked={confirmed} onChange={(e) => setConfirmed(e.target.checked)} className="mt-1 w-4 h-4 text-udg-blue rounded" />
              <span className="font-semibold text-slate-700 dark:text-slate-300">
                (Opcional) Declaro que las constancias que voy a adjuntar cubren el total de 64 horas restantes.
              </span>
            </label>
          </div>

          <div className="space-y-2">
            <label className="block font-bold text-slate-700 dark:text-slate-300">Evidencias Digitales (Puedes subir una por una)</label>
            <input type="file" multiple accept=".pdf,image/jpeg,image/png,image/webp" onChange={handleFileChange} className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl p-2 text-slate-500 file:mr-3 file:py-1.5 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-slate-200 file:text-slate-700" />
            
            {files.length > 0 && (
              <div className="mt-3 space-y-2 bg-slate-50 dark:bg-slate-900/50 p-3 rounded-xl border border-slate-200 dark:border-slate-700">
                <p className="text-emerald-600 dark:text-emerald-400 font-bold text-[11px] mb-2"><LucideIcon name="check" className="w-3 h-3 inline mr-1"/> {files.length} archivo(s) listo(s) para enviar:</p>
                <ul className="space-y-1.5">
                  {files.map((f, i) => (
                    <li key={i} className="flex justify-between items-center bg-white dark:bg-slate-800 p-2.5 rounded-lg border border-slate-200 dark:border-slate-700 text-[11px] shadow-sm">
                      <span className="truncate max-w-[80%] font-medium text-slate-700 dark:text-slate-300"><LucideIcon name="file" className="w-3.5 h-3.5 inline mr-1.5 text-udg-blue"/>{f.name}</span>
                      <button type="button" onClick={() => handleRemoveFile(i)} className="text-red-500 hover:bg-red-50 p-1.5 rounded-md"><LucideIcon name="trash-2" className="w-4 h-4" /></button>
                    </li>
                  ))}
                </ul>
              </div>
            )}
          </div>

          <div className="pt-2 flex justify-end">
            <button type="submit" disabled={loading || files.length === 0} className="bg-udg-navy hover:bg-udg-blue text-white font-bold px-8 py-3 rounded-xl flex items-center gap-2 shadow-md transition-all disabled:opacity-50 text-sm">
              {loading ? <LucideIcon name="loader-2" className="w-4 h-4 animate-spin" /> : <LucideIcon name="send" className="w-4 h-4" />} Enviar Evidencias

          </div>
        </form>
      )}
    </div>
  );
}

function AdminHorasModule({ globalHoras, setGlobalHoras, showToast, addNotification }) {
  const [loadingId, setLoadingId] = useState(null);
  const [filter, setFilter] = useState('Pendiente');
  const [horasAsignadas, setHorasAsignadas] = useState({});
  const [searchTerm, setSearchTerm] = useState('');

  const formatFechaLimpia = (fechaStr) => {
    if (!fechaStr) return 'Fecha desconocida';
    const d = new Date(fechaStr);
    if (!isNaN(d.getTime())) return d.toLocaleDateString('es-MX', { day: '2-digit', month: 'short', year: 'numeric' });
    return String(fechaStr).split('T')[0];
  };

  const handleAction = async (id, accionEstatus, studentName) => {
    let horas = 0;
    
    if (accionEstatus === 'Aprobado') {
      const valorInput = horasAsignadas[id];
      // Validamos estrictamente que esté entre 0 y 64
      if (valorInput === undefined || valorInput === '' || Number(valorInput) < 0 || Number(valorInput) > 64) {
        return showToast("Ingresa un valor válido entre 0 y 64 horas.", "error");
      }
      horas = Number(valorInput);
    }

    setLoadingId(id);
    try {
      const res = await server.dictaminarHoras(id, accionEstatus, horas);
      if(res.exito) {
        const updated = globalHoras.map(h => h.id === id ? { ...h, status: accionEstatus, horasAprobadas: horas } : h);
        setGlobalHoras(updated);
        showToast(`Trámite ${accionEstatus} correctamente (${horas} hrs)`);
        addNotification("Dictamen Realizado", `Se acreditaron ${horas} horas a ${studentName}`, "success");
      } else { showToast(res.mensaje, "error"); }
    } catch(e) { showToast("Error de red", "error"); }
    setLoadingId(null);
  };

  const listaFiltrada = globalHoras.filter(h => {
    const coincideEstado = h.status === filter;
    const busqueda = searchTerm.toLowerCase().trim();
    const coincideBusqueda = h.student.toLowerCase().includes(busqueda) || String(h.code).toLowerCase().includes(busqueda);
    return coincideEstado && coincideBusqueda;
  });

  const obtenerHorasPrevias = (codigoAlumno) => {
    return globalHoras
      .filter(h => h.code === codigoAlumno && h.status === 'Aprobado')
      .reduce((sum, h) => sum + (Number(h.horasAprobadas) || 0), 0);
  };

  return (
    <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm space-y-5 text-xs">
      
      {/* CABECERA Y CONTROLES DE BÚSQUEDA */}
      <div className="flex flex-col border-b border-slate-100 dark:border-slate-700 pb-4 space-y-4">
        
        <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-3">
          <div>
            <h3 className="text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2 font-display">
              <LucideIcon name="award" className="w-5 h-5 text-udg-gold" />
              Dictamen de Horas Integrales
            </h3>
            <p className="text-slate-500 text-[11px] mt-1">Asigna las horas correspondientes a las constancias subidas.</p>
          </div>
          <div className="flex bg-slate-100 dark:bg-slate-900 p-1 rounded-xl shrink-0 overflow-x-auto">
            {['Pendiente', 'Devuelta', 'Aprobado'].map(f => (
              <button key={f} onClick={() => setFilter(f)} className={`px-4 py-1.5 rounded-lg font-bold transition-all ${filter === f ? 'bg-udg-navy text-white shadow' : 'text-slate-600 dark:text-slate-400'}`}>
                {f}
              </button>
            ))}
          </div>
        </div>

        {/* BARRA DE BÚSQUEDA */}
        <div className="relative w-full">
          <LucideIcon name="search" className="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" />
          <input
            type="text"
            placeholder="Buscar por nombre del alumno o código UdG..."
            value={searchTerm}
            onChange={(e) => setSearchTerm(e.target.value)}
            className="w-full bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 placeholder-slate-400 pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-udg-blue text-xs shadow-sm"
          />
        </div>
      </div>

      {/* LISTADO DE SOLICITUDES */}
      <div className="space-y-4 pt-2">
        {listaFiltrada.length === 0 ? (
          <p className="text-center py-6 border border-dashed border-slate-200 dark:border-slate-700 rounded-xl text-slate-400 bg-slate-50 dark:bg-slate-900/40">
            No se encontraron solicitudes que coincidan con la búsqueda.
          </p>
        ) : (
          listaFiltrada.map(h => {
            const horasPrevias = obtenerHorasPrevias(h.code);
            
            return (
              <div key={h.id} className="p-5 rounded-2xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800/50 shadow-sm space-y-4">
                <div className="flex justify-between items-start">
                  <div>
                    <div className="flex items-center gap-2 mb-1">
                      <span className="font-mono text-udg-blue dark:text-blue-400 font-bold">#{h.id}</span>
                      <h4 className="font-bold text-sm text-slate-900 dark:text-white font-display">{h.student}</h4>
                      <span className="text-slate-500 font-mono">(Cód: {h.code})</span>
                    </div>
                    <p className="text-[11px] font-semibold flex items-center gap-2">
                      {h.confirmo64 ? <span className="bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded flex items-center gap-1"><LucideIcon name="check-square" className="w-3 h-3"/> Afirma tener 64hrs</span> : <span className="bg-slate-100 text-slate-600 px-2 py-0.5 rounded flex items-center gap-1"><LucideIcon name="square" className="w-3 h-3"/> Subida Parcial</span>}

                    </p>
                  </div>
                  
                  {/* CUADRO INFORMATIVO DE HORAS */}
                  <div className="text-right shrink-0">
                    {h.status === 'Aprobado' ? (
                      <span className="bg-emerald-100 text-emerald-800 font-black px-3 py-1.5 rounded-lg text-sm shadow-sm">
                        +{h.horasAprobadas} hrs
                      </span>
                    ) : (
                      <div className="bg-slate-50 dark:bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700">
                        <span className="block text-[9px] font-bold text-slate-400 uppercase tracking-wider mb-0.5">Avance Previo</span>

                      </div>
                    )}
                  </div>
                </div>

                <div className="bg-slate-50 dark:bg-slate-900 p-3.5 rounded-xl border border-slate-200 dark:border-slate-700 space-y-2">
                  <span className="font-bold text-slate-700 dark:text-slate-300 block mb-2">Archivos de Evidencia:</span>
                  <div className="flex flex-wrap gap-2">
                    {h.files.split(', ').map((url, i) => url && (
                      <a key={i} href={url} target="_blank" rel="noreferrer" className="inline-flex items-center gap-1.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 hover:border-udg-blue px-3 py-1.5 rounded-lg text-udg-navy dark:text-blue-400 font-semibold shadow-sm transition-all">
                        <LucideIcon name="external-link" className="w-3.5 h-3.5" /> Archivo {i + 1}
                      </a>
                    ))}
                  </div>
                </div>

                {(filter === 'Pendiente' || filter === 'Devuelta') && (
                  <div className="flex flex-col sm:flex-row items-center justify-between gap-3 pt-4 border-t border-slate-100 dark:border-slate-700 mt-2">
                    
                    {/* INPUT DE HORAS A ASIGNAR (Libre de 0 a 64) */}
                    <div className="flex items-center gap-2 w-full sm:w-auto bg-slate-50 dark:bg-slate-900 p-2 rounded-xl border border-slate-200 dark:border-slate-700">
                      <label className="text-[11px] font-bold text-slate-600 dark:text-slate-300">Horas a Validar:</label>
                      <input 
                        type="number" min="0" max="64"
                        value={horasAsignadas[h.id] !== undefined ? horasAsignadas[h.id] : (h.confirmo64 ? 64 : '')}
                        onChange={(e) => setHorasAsignadas({...horasAsignadas, [h.id]: e.target.value})}
                        placeholder="Ej: 64"
                        className="w-20 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-lg p-1.5 text-xs outline-none focus:ring-2 focus:ring-emerald-500 font-bold"
                      />
                    </div>

                    <div className="flex gap-2 w-full sm:w-auto">
                      <button onClick={() => handleAction(h.id, 'Devuelta', h.student)} disabled={loadingId === h.id} className="flex-1 sm:flex-auto bg-white dark:bg-slate-800 text-amber-700 dark:text-amber-500 border border-amber-200 dark:border-amber-800 hover:bg-amber-50 font-bold px-4 py-2.5 rounded-xl flex items-center justify-center gap-2 transition-all disabled:opacity-50">
                        <LucideIcon name="alert-triangle" className="w-4 h-4" /> Devolver
                      </button>
                      <button onClick={() => handleAction(h.id, 'Aprobado', h.student)} disabled={loadingId === h.id} className="flex-1 sm:flex-auto bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-2.5 rounded-xl flex items-center justify-center gap-2 shadow transition-all disabled:opacity-50">
                        {loadingId === h.id ? <LucideIcon name="loader-2" className="w-4 h-4 animate-spin"/> : <LucideIcon name="check-circle" className="w-4 h-4" />}
                        Aprobar
                      </button>
                    </div>
                  </div>
                )}
              </div>
            );
          })
        )}
      </div>
    </div>
  );
}
